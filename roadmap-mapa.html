<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapa Mental · Roadmap Torre</title>

<style>
:root{
  --finza-blue:#1A1AFF;--finza-blue-deep:#0F0F8C;--finza-dark:#0A0A2E;
  --bg:#EEF0F4;--surface:#FFFFFF;--text:#0A0A2E;--text-muted:#5C5C7A;--text-subtle:#9090A8;
  --border:#D8D8E5;--border-soft:#ECECF2;
  --p-urgente:#DC2626;--p-alta:#EA580C;--p-media:#0EA5E9;--p-baixa:#64748B;
  --font-sans:'Inter',system-ui,sans-serif;--font-mono:'JetBrains Mono',monospace;
  --topbar-h:54px;--panel-w:360px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font-sans);font-size:13.5px;color:var(--text);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:inherit}

.topbar{position:fixed;top:0;left:0;right:0;height:var(--topbar-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 20px;z-index:30}
.topbar .crumb a{color:var(--text-muted);text-decoration:none}
.topbar .crumb b{color:var(--text)}
.topbar .ttl{font-weight:700;font-size:14px;letter-spacing:.02em}
.topbar .spacer{flex:1}
.topbar .search{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:6px 11px;min-width:240px}
.topbar .search input{border:0;outline:0;background:none;width:100%}
.topbar .meta{font-family:var(--font-mono);font-size:10px;color:var(--text-subtle);letter-spacing:.04em}
.topbar .mark{font-size:11px;font-weight:700;color:var(--finza-blue);letter-spacing:.1em}

#viewport{position:fixed;top:var(--topbar-h);left:0;right:0;bottom:0;overflow:hidden;cursor:grab;background:
  radial-gradient(circle at 1px 1px,rgba(10,10,46,.05) 1px,transparent 0) 0 0/26px 26px}
#viewport.panning{cursor:grabbing}
#world{position:absolute;left:50%;top:46%;width:0;height:0;transform-origin:0 0}
#links{position:absolute;left:-5000px;top:-5000px;width:10000px;height:10000px;pointer-events:none;overflow:visible}

.node{position:absolute;transform:translate(-50%,-50%);user-select:none;cursor:pointer}
.node.dragging{z-index:50!important;cursor:grabbing}

.hub-node{width:188px;margin-left:-94px;margin-top:-44px;background:linear-gradient(135deg,#0A0A2E,#16164a);color:#fff;border:2px solid var(--finza-blue);border-radius:14px;padding:16px 18px;box-shadow:0 10px 30px rgba(10,10,46,.35);text-align:center}
.hub-node .ht{font-size:15px;font-weight:700;line-height:1.2}
.hub-node .hs{font-size:10px;color:rgba(255,255,255,.6);margin-top:5px;font-family:var(--font-mono);letter-spacing:.05em}

.frente-node{width:228px;margin-left:-114px;margin-top:-30px;background:var(--surface);border:1px solid var(--border);border-radius:11px;box-shadow:0 4px 14px rgba(10,10,46,.1);overflow:hidden}
.frente-node .band{height:5px}
.frente-node .fbody{display:flex;align-items:center;gap:10px;padding:11px 13px}
.frente-node .ficon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px;font-family:var(--font-mono);flex:none}
.frente-node .fname{font-size:13px;font-weight:700;line-height:1.15;flex:1;min-width:0}
.frente-node .fmeta{font-size:10px;color:var(--text-muted);margin-top:2px;font-weight:400}
.frente-node .chev{font-size:13px;color:var(--text-subtle);font-family:var(--font-mono)}

.bucket-node{width:172px;margin-left:-86px;margin-top:-22px;background:var(--surface);border:1px solid var(--border);border-radius:9px;box-shadow:0 3px 10px rgba(10,10,46,.09);display:flex;align-items:center;gap:8px;padding:8px 11px}
.bucket-node .pband{width:4px;align-self:stretch;border-radius:2px;flex:none}
.bucket-node .pl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;flex:1}
.bucket-node .pc{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);background:var(--bg);padding:0 6px;border-radius:99px}
.bucket-node .chev{font-size:12px;color:var(--text-subtle)}

.item-node{width:204px;margin-left:-102px;margin-top:-26px;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 2px 8px rgba(10,10,46,.08);padding:9px 11px 9px 13px;position:relative;overflow:hidden}
.item-node .ibar{position:absolute;left:0;top:0;bottom:0;width:4px}
.item-node .iid{font-family:var(--font-mono);font-size:9px;font-weight:700;color:var(--text-subtle)}
.item-node .itt{font-size:11.5px;font-weight:500;line-height:1.3;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item-node .idot{position:absolute;top:9px;right:9px;width:7px;height:7px;border-radius:50%}
.item-node.sel{border-color:var(--finza-blue);box-shadow:0 0 0 2px var(--finza-blue),0 6px 16px rgba(26,26,255,.25)}
.frente-node.sel,.bucket-node.sel{border-color:var(--finza-blue);box-shadow:0 0 0 2px var(--finza-blue)}
.node.dim{opacity:.18;filter:saturate(.4)}

.toolbar{position:fixed;left:18px;bottom:18px;display:flex;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:6px;box-shadow:0 4px 14px rgba(10,10,46,.12);z-index:25}
.toolbar button{width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:15px}
.toolbar button:hover{background:var(--bg);color:var(--text)}
.toolbar .zlvl{min-width:42px;text-align:center;font-family:var(--font-mono);font-size:11px;color:var(--text-muted);align-self:center}
.toolbar .sep{width:1px;background:var(--border);margin:4px 2px}

.hint{position:fixed;right:calc(var(--panel-w) + 18px);bottom:18px;background:rgba(255,255,255,.92);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:11px;color:var(--text-muted);z-index:25;line-height:1.5;max-width:230px}
.hint b{color:var(--text)}

.panel{position:fixed;top:var(--topbar-h);right:0;bottom:0;width:var(--panel-w);background:var(--surface);border-left:1px solid var(--border);overflow-y:auto;z-index:20;padding:22px 22px 60px}
.panel .empty{color:var(--text-subtle);font-style:italic;margin-top:40px;text-align:center;font-size:13px;line-height:1.6}
.panel .pid{font-family:var(--font-mono);font-size:11px;color:var(--text-subtle);font-weight:700}
.panel .ptitle{font-size:18px;font-weight:700;line-height:1.25;margin:4px 0 14px}
.panel .pbadges{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.03em}
.badge.urgente{background:#FEE2E2;color:#DC2626}.badge.alta{background:#FEF3C7;color:#B45309}
.badge.media{background:#DBEAFE;color:#2563EB}.badge.baixa{background:#F1F5F9;color:#64748B}
.badge.dep{background:#F3E8FF;color:#9333EA}
.badge.tipo-bug{background:#FFE4E9;color:#E11D48}.badge.tipo-melhoria{background:#E0F2FE;color:#0284C7}
.status-pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;color:#fff;text-transform:uppercase;letter-spacing:.03em}
.status-pill.entregue{background:#10B981}.status-pill.backlog{background:#64748B}
.status-pill.a-refinar{background:#fff;color:#9CA3AF;border:1px dashed #9CA3AF}
.status-pill.adiado{background:#94A3B8}.status-pill.cancelado{background:#EF4444}
.dev-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:1px 8px 1px 6px;border-radius:99px;background:var(--bg)}
.dev-chip .dt{width:8px;height:8px;border-radius:50%;background:var(--dc)}
.item-node .istat{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%}
.item-node.cancelado .itt,.item-node.adiado .itt{text-decoration:line-through;text-decoration-color:var(--text-subtle)}
.item-node.entregue,.item-node.cancelado,.item-node.adiado{opacity:.72}
.panel .pmeta{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;background:var(--bg);border-radius:10px;padding:14px;margin-bottom:18px}
.panel .pmeta .ml{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-subtle);font-weight:700;margin-bottom:2px}
.panel .pmeta .mv{font-size:12.5px;font-weight:500}
.panel .pdesc h4{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--text-muted);margin:0 0 7px}
.panel .pdesc p{font-size:13.5px;line-height:1.6;margin:0;border-left:3px solid var(--finza-blue);padding-left:13px}
.fpill{display:inline-flex;align-items:center;gap:6px}
.fpill .dt{width:8px;height:8px;border-radius:50%}
.panel .plist{margin-top:16px}
.panel .plist .pli{display:flex;gap:8px;align-items:center;padding:7px 9px;border:1px solid var(--border-soft);border-radius:7px;margin-bottom:6px;cursor:pointer;font-size:12px}
.panel .plist .pli:hover{border-color:var(--finza-blue);background:var(--bg)}
.panel .plist .pli .id{font-family:var(--font-mono);font-size:9px;color:var(--text-subtle);font-weight:700}
</style>
</head>

,"menu":"Fonte de Dados","title":"Padronizar a query de títulos pagos","desc":"Na query de títulos pagos há registros com payment_date preenchido e outros sem. Padronizar o tratamento: quando existe data de pagamento o status deve inferir 'Pago' (a ETL já corrige status='Disponível' com payment_date). Uniformizar o critério na fonte que alimenta a vw_titles_live para não haver dois entendimentos de 'pago'.","nota_negocio":null,"prioridade":"urgente","status":"backlog","dev":"Marcos","tipo":"bug","esforco":"Baixo","dep":false,"obs_refino":"precisa ser analisado todas as queires da fonte de dados, aproveite e melhore performance dessas queries","refino_tag":"tecnico","source":"roadmap","quimera_key":"4276","quimera_status":"fila_exec","executando":false,"and_status":"fila_exec"},{"id":"R03","frente":"dados-infra","menu":"Fonte de Dados","title":"IA Esperanza lendo da Torre (janela de 20 dias)","desc":"A Esperanza passou a ler da Torre (não mais do BigQuery). O dado diverge do BQ e, por enxergar só ~20 dias de vencimento futuro, a IA chega a dizer ao cliente que ele está quitando. Corrigir a fonte consultada e parametrizar/ampliar a janela de vencimentos considerada, mantendo a diretriz de não expor títulos futuros como quitação.","nota_negocio":"Definir a janela de vencimento futuro correta que a IA deve enxergar.","prioridade":"urgente","status":"backlog","dev":"Marcos","tipo":"bug","esforco":"Baixo","dep":false,"obs_refino":"estudar a sumarização das informações de contratos como parcelas restante, valor restante, valor de quitação e outras informações que hoje a esperanza não vê que deveria olhar, coloca tudo isso na tabela de contratos","refino_tag":"tecnico","source":"roadmap","quimera_key":"4277","quimera_status":"em_andamento","executando":true,"and_status":"em_andamento"},{"id":"R04","frente":"dashboard","menu":"Dashboard - Visão Executiva","title":"Revalidar o conceito de pago","desc":"Revalidar o que é considerado 'pago' (fonte: BigQuery MF), pois já houve gap nesse indicador e o risco é deixar de cobrar quem deve. Cancelado neste ciclo — coberto pela padronização da query de títulos pagos (R02) e pela sincronização Torre×MF (R01).","nota_negocio":null,"prioridade":"urgente","status":"cancelado","dev":null,"tipo":"bug","esforco":null,"dep":false,"obs_refino":"ja contemplado em outro card","refino_tag":"coberto","source":"roadmap","quimera_key":null,"quimera_status":null,"executando":false,"and_status":"cancelado"},{"id":"R05","frente":"dashboard","menu":"Dashboard - Visão Executiva","title":"Conciliar carteira Torre x Dash Inadimplência","desc":"Na carteira Ideal (multi-org Finza + Blips) a Torre mostra > R$ 2 mi, mas o dash de inadimplência, no mesmo status de título, mostra R$ 1.788.000. Reconciliar as duas fontes: mesmo recorte de status/cedente e mesma base (vw_titles_live) para eliminar a divergência de ~R$ 200 mil.","nota_negocio":null,"prioridade":"urgente","status":"entregue","dev":"Marcos","tipo":"bug","esforco":"Médio","dep":false,"obs_refino":"necessário analisar o dashboard com o J e consultar a query que monta o dash junto com o time de dados, determinar qual erro e normalizar os dois dash","refino_tag":"tecnico","source":"roadmap","quimera_key":"4285","quimera_status":"finalizado","executando":false,"and_status":"finalizado"},{"id":"R06","frente":"configuracoes","menu":"Configurações - Valores Padrão","title":"Monitoramento preventivo de novos valores padrão","desc":"Quando um novo valor padrão é criado sem avisar a Torre, gera-se um gap descoberto só de forma reativa. Criar monitoramento/tratamento preventivo que detecte valores padrão novos e sinalize antes de virar acionamento indevido.","nota_negocio":"Definir quais campos de 'valor padrão' devem ser monitorados e o canal do alerta.","prioridade":"urgente","status":"backlog","dev":"Marcos","tipo":"melhoria","esforco":"Médio","dep":false,"obs_refino":"necessário refinar melhor com o João Pedro qual impacto e qual resultado esperado.","refino_tag":"nego ,"nota_negocio":null,"source":"proposta","quimera_key":null,"quimera_status":null,"executando":false,"subproduto":"Bloqueio & Desbloqueio","estagio":"Descoberta","prioridade_txt":"Deveria fazer","mandatorio":false,"score":2.22,"crit":{"valor":4.0,"nps":3.0,"reducao":5.0,"risco_nf":1.0,"risco_exec":2.0,"custo":4.0},"persona":"Empreendedor / Interno","jornada":"Cobrança & Arrecadação","step":"Bloqueio — Faixa D+8","ciclo":"Q3","dependencias":"Garantia IoT","notas":"Não terá customização de regra de bloqueio na torre, porém a torre terá acesso data de expiração do bloqueio p/ customizar a comunicação","ok_adolfo":"Definir regra"},{"id":"F17","frente":"finza","menu":"IA & Automação","title":"Criar CRM Dedicado p/ Cobrança","desc":"Operação precisa ter CRM integrado com o Módulo Financeiro + Dados cadastrais com todas as informações necessárias pra realizar a negociação.","prioridade":"baixa","status":"a-refinar","and_status":"backlog","dev":null,"tipo":"melhoria","esforco":"Enorme","dep":false,"obs_refino":"","refino_tag":"semobs","nota_negocio":null,"source":"proposta","quimera_key":null,"quimera_status":null,"executando":false,"subproduto":"CRM - Visão 360º do Cliente","estagio":"Descoberta","prioridade_txt":"Deveria fazer","mandatorio":false,"score":1.85,"crit":{"valor":3.0,"nps":3.0,"reducao":5.0,"risco_nf":3.0,"risco_exec":5.0,"custo":3.0},"persona":"","jornada":"","step":"","ciclo":"","dependencias":"","notas":"","ok_adolfo":"Solicitar Especificação Completa"}],"observacoes":{"prioridades":[{"p":"urgente","label":"P0 · Crítico","nota":"Confiabilidade do dado e risco de deixar de cobrar (ou comunicar errado ao cliente). É a base de tudo: enquanto Torre e Módulo Financeiro não convergem, todo indicador fica sob suspeita. Já entregamos a sincronização Torre×MF e a capacidade da Torre; segue em aberto conciliar carteira×inadimplência, padronizar títulos pagos e a janela da Esperanza."},{"p":"alta","label":"P1 · Alta","nota":"Bugs que travam a operação e temas de compl r":"#0891B2","hint":"Caminho técnico claro do nosso lado (query, performance, integração) — executar/validar."},{"tag":"stia","label":"Absorvido pelo STIA na Torre","color":"#7C3AED","hint":"Já endereçado pela migração do STIA para dentro da Torre (em desenvolvimento ou na 2ª etapa)."},{"tag":"execucao","label":"Em execução (fatiado)","color":"#2563EB","hint":"Já em desenvolvimento, dividido em entregas."},{"tag":"posrefac","label":"Pós-refatoração da Torre","color":"#64748B","hint":"Esforço alto — fica para depois da refatoração da Torre."},{"tag":"coberto","label":"Coberto / decidido fora","color":"#94A3B8","hint":"Já contemplado em outro card, ou resolvido por decisão/fora do escopo de dev."},{"tag":"semobs","label":"Sem observação de refinamento","color":"#CBD5E1","hint":"Sem nota de refinamento — em geral já entregues ou ainda aguardando refino."}],"quimera_meta":[{"key":"backlog","label":"Backlog","color":"#94A3B8"},{"key":"fila_exec","label":"Fila de Execução","color":"#6366F1"},{"key":"em_andamento","label":"Execução","color":"#2563EB"},{"key":"bloqueado","label":"Bloqueado","color":"#EF4444"},{"key":"em_validacao","label":"Validação","color":"#A855F7"},{"key":"finalizado","label":"Entregue","color":"#10B981"},{"key":"cancelado","label":"Cancelado","color":"#9CA3AF"}],"finza_weights":[{"key":"valor","label":"Valor Negócio","weight":0.3},{"key":"custo","label":"Custo do Atraso","weight":0.2},{"key":"reducao","label":"Redução Ops","weight":0.15},{"key":"risco_nf","label":"Risco Não Fazer","weight":0.15},{"key":"nps","label":"NPS","weight":0.1},{"key":"risco_exec","label":"Risco Execução","weight":0.1},{"key":"esforco","label":"Esforço","weight":0.1,"penalidade":true}]}</script>
<script>
const DATA=JSON.parse(document.getElementById('map-data').textContent);
const FR=Object.fromEntries(DATA.frentes.map(f=>[f.key,f]));
const ITEMS=DATA.items;
const PRIO_ORDER=['urgente','alta','media','baixa'];
const PRIO_LABELS={urgente:'Urgente',alta:'Alta',media:'Média',baixa:'Baixa'};
const PRIO_PCODE={urgente:'P0',alta:'P1',media:'P2',baixa:'P3'};
const PRIO_COLOR={urgente:'#DC2626',alta:'#D97706',media:'#2563EB',baixa:'#64748B'};
const STATUS_LABELS={'backlog':'Backlog','a-refinar':'A refinar','entregue':'Entregue','adiado':'Adiado','cancelado':'Cancelado'};
const STATUS_COLOR={'backlog':'#64748B','a-refinar':'#9CA3AF','entregue':'#10B981','adiado':'#94A3B8','cancelado':'#EF4444'};
const STATUS_ICON={'entregue':'✓ ','cancelado':'✕ ','adiado':'⏸ ','a-refinar':'✎ ','backlog':''};
const DEV_COLOR={'Marcos':'#EAB308','Leandro':'#3B82F6','João Pedro':'#F97316'};
const TIPO_LABELS={bug:'Bug',melhoria:'Melhoria'};
function accentOf(it){return it.dev?DEV_COLOR[it.dev]:STATUS_COLOR[it.status];}
const STORAGE='mindmap.roadmap.v2';
const SVGNS='http://www.w3.org/2000/svg';

let pan={x:0,y:0},zoom=1;
let positions={};
let expandedFrentes=new Set(),expandedBuckets=new Set();
let selItem=null,selFrente=null,selBucket=null;
let searchQ='';

const world=document.getElementById('world');
const svg=document.getElementById('links');
const vp=document.getElementById('viewport');

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function load(){try{const s=JSON.parse(localStorage.getItem(STORAGE));if(s){positions=s.positions||{};pan=s.pan||pan;zoom=s.zoom||1;expandedFrentes=new Set(s.expandedFrentes||[]);expandedBuckets=new Set(s.expandedBuckets||[]);}}catch(e){}}
function save(){try{localStorage.setItem(STORAGE,JSON.stringify({positions,pan,zoom,expandedFrentes:[...expandedFrentes],expandedBuckets:[...expandedBuckets]}));}catch(e){}}

function bucketsForFrente(k){const out=[];PRIO_ORDER.forEach(p=>{const n=ITEMS.filter(i=>i.frente===k&&i.prioridade===p).length;if(n)out.push(p);});return out;}
function itemsOf(k,p){return ITEMS.filter(i=>i.frente===k&&i.prioridade===p).sort((a,b)=>a.id.localeCompare(b.id));}

/* ---- positions ---- */
function ensureFrentes(){
  const n=DATA.frentes.length, R=Math.max(440,n*26);
  DATA.frentes.forEach((f,i)=>{const k='frente:'+f.key;if(!positions[k]){const a=(-90+i*(360/n))*Math.PI/180;positions[k]={x:R*Math.cos(a),y:R*Math.sin(a)};}});
}
function ensureBuckets(fk){
  const fp=positions['frente:'+fk];const bs=bucketsForFrente(fk);
  const dir=Math.atan2(fp.y,fp.x);const n=bs.length;
  bs.forEach((p,i)=>{const key='bucket:'+fk+':'+p;if(positions[key])return;
    const spread=Math.PI*0.7;const a=dir+(n>1?(i/(n-1)-0.5)*spread:0);const r=235;
    positions[key]={x:fp.x+r*Math.cos(a),y:fp.y+r*Math.sin(a)};});
}
function layoutAround(center,outDir,n,baseR,step,spread){
  const out=[];let placed=0,ring=0;
  while(placed<n){const cap=Math.max(1,Math.floor(ring*2.4)+3);const cnt=Math.min(cap,n-placed);const r=baseR+ring*step;
    for(let i=0;i<cnt;i++){const a=outDir+(cnt>1?(i/(cnt-1)-0.5)*spread:0);out.push({x:center.x+r*Math.cos(a),y:center.y+r*Math.sin(a)});}
    placed+=cnt;ring++;}
  return out;
}
function ensureItems(fk,p){
  const bp=positions['bucket:'+fk+':'+p];const fp=positions['frente:'+fk];
  const outDir=Math.atan2(bp.y-fp.y,bp.x-fp.x);
  const list=itemsOf(fk,p);const need=list.filter(it=>!positions['item:'+it.id]);
  if(!need.length)return;
  const slots=layoutAround(bp,outDir,list.length,205,210,Math.PI*1.05);
  list.forEach((it,i)=>{const key='item:'+it.id;if(!positions[key])positions[key]=slots[i];});
}

/* ---- transform ---- */
function applyTransform(){world.style.transform=`translate(${pan.x}px,${pan.y}px) scale(${zoom})`;document.getElementById('zlvl').textContent=Math.round(zoom*100)+'%';}

/* ---- render ---- */
function mkNode(cls,x,y){const d=document.createElement('div');d.className='node '+cls;d.style.left=x+'px';d.style.top=y+'px';return d;}

function render(){
  [...world.querySelectorAll('.node')].forEach(n=>n.remove());
  ensureFrentes();

  // hub
  const hub=mkNode('hub-node',0,0);
  hub.innerHTML=`<div class="ht">${esc(DATA.squad.replace('Roadmap · ',''))}</div><div class="hs">${ITEMS.length} itens · ${DATA.frentes.length} frentes</div>`;
  world.appendChild(hub);

  DATA.frentes.forEach(f=>{
    const fp=positions['frente:'+f.key];
    const exp=expandedFrentes.has(f.key);
    const node=mkNode('frente-node'+(selFrente===f.key?' sel':''),fp.x,fp.y);
    node.dataset.fr=f.key;
    node.innerHTML=`<div class="band" style="background:${f.color}"></div><div class="fbody">
      <div class="ficon" style="background:${f.color}">${esc(f.code)}</div>
      <div class="fname">${esc(f.label)}<div class="fmeta">${f.count} itens</div></div>
      <div class="chev">${exp?'−':'+'}</div></div>`;
    node.onclickNode=()=>toggleFrente(f.key);
    world.appendChild(node);

    if(exp){
      ensureBuckets(f.key);
      bucketsForFrente(f.key).forEach(p=>{
        const bk='bucket:'+f.key+':'+p;const bp=positions[bk];
        const bexp=expandedBuckets.has(f.key+'|'+p);
        const cnt=itemsOf(f.key,p).length;
        const bn=mkNode('bucket-node'+(selBucket===(f.key+'|'+p)?' sel':''),bp.x,bp.y);
        bn.innerHTML=`<div class="pband" style="background:${PRIO_COLOR[p]}"></div><div class="pl" style="color:${PRIO_COLOR[p]}">${PRIO_PCODE[p]} ${PRIO_LABELS[p]}</div><span class="pc">${cnt}</span><span class="chev">${bexp?'−':'+'}</span>`;
        bn.onclickNode=()=>toggleBucket(f.key,p);
        world.appendChild(bn);
        if(bexp){
          ensureItems(f.key,p);
          itemsOf(f.key,p).forEach(it=>{
            const ip=positions['item:'+it.id];
            const inode=mkNode('item-node '+it.status+(selItem===it.id?' sel':''),ip.x,ip.y);
            inode.dataset.item=it.id;
            inode.innerHTML=`<div class="ibar" style="background:${accentOf(it)}"></div><div class="iid">${it.id}${it.dev?' · '+esc(it.dev):''}${it.dep?' · dep':''}</div><div class="itt">${esc(it.title)}</div><div class="istat" style="background:${STATUS_COLOR[it.status]}" title="${STATUS_LABELS[it.status]}"></div>`;
            inode.onclickNode=()=>selectItem(it.id);
            world.appendChild(inode);
          });
        }
      });
    }
  });
  renderLinks();
  applySearchVisual();
  attachInteractions();
  applyTransform();
}

function line(x1,y1,x2,y2,color,op,w,dash){
  const O=5000;const l=document.createElementNS(SVGNS,'line');
  l.setAttribute('x1',x1+O);l.setAttribute('y1',y1+O);l.setAttribute('x2',x2+O);l.setAttribute('y2',y2+O);
  l.setAttribute('stroke',color);l.setAttribute('stroke-opacity',op);l.setAttribute('stroke-width',w);
  if(dash)l.setAttribute('stroke-dasharray',dash);return l;
}
function renderLinks(){
  while(svg.firstChild)svg.removeChild(svg.firstChild);
  DATA.frentes.forEach(f=>{
    const fp=positions['frente:'+f.key];const exp=expandedFrentes.has(f.key);
    svg.appendChild(line(0,0,fp.x,fp.y,f.color,exp?0.8:0.4,exp?2.4:1.6));
    if(exp){
      bucketsForFrente(f.key).forEach(p=>{
        const bp=positions['bucket:'+f.key+':'+p];
        svg.appendChild(line(fp.x,fp.y,bp.x,bp.y,PRIO_COLOR[p],0.5,1.8));
        if(expandedBuckets.has(f.key+'|'+p)){
          itemsOf(f.key,p).forEach(it=>{const ip=positions['item:'+it.id];svg.appendChild(line(bp.x,bp.y,ip.x,ip.y,f.color,0.3,1));});
        }
      });
    }
  });
}

/* ---- interactions ---- */
function attachInteractions(){
  world.querySelectorAll('.node').forEach(node=>{
    if(node.classList.contains('hub-node'))return;
    node.onmousedown=e=>{
      e.stopPropagation();const sx=e.clientX,sy=e.clientY;let moved=false;
      const key=node.dataset.item?'item:'+node.dataset.item:node.dataset.fr?'frente:'+node.dataset.fr:null;
      const start=key?{...positions[key]}:null;
      const mm=ev=>{const dx=(ev.clientX-sx)/zoom,dy=(ev.clientY-sy)/zoom;
        if(Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy)>4){moved=true;node.classList.add('dragging');
          if(key){positions[key]={x:start.x+dx,y:start.y+dy};node.style.left=positions[key].x+'px';node.style.top=positions[key].y+'px';renderLinks();}}};
      const mu=()=>{document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu);
        node.classList.remove('dragging');
        if(!moved&&node.onclickNode)node.onclickNode();else if(moved)save();};
      document.addEventListener('mousemove',mm);document.addEventListener('mouseup',mu);
    };
  });
}
// pan
vp.onmousedown=e=>{if(e.target!==vp&&e.target!==world&&e.target!==svg)return;
  vp.classList.add('panning');const sx=e.clientX-pan.x,sy=e.clientY-pan.y;
  const mm=ev=>{pan.x=ev.clientX-sx;pan.y=ev.clientY-sy;applyTransform();};
  const mu=()=>{vp.classList.remove('panning');document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu);save();};
  document.addEventListener('mousemove',mm);document.addEventListener('mouseup',mu);};
// zoom
vp.onwheel=e=>{e.preventDefault();const r=vp.getBoundingClientRect();const mx=e.clientX-r.left,my=e.clientY-r.top;
  const f=e.deltaY<0?1.12:1/1.12;const nz=Math.max(0.2,Math.min(2.6,zoom*f));
  const ox=world.offsetLeft,oy=world.offsetTop;
  pan.x=mx-ox-(mx-ox-pan.x)*(nz/zoom);pan.y=my-oy-(my-oy-pan.y)*(nz/zoom);
  zoom=nz;applyTransform();save();};

function toggleFrente(k){expandedFrentes.has(k)?expandedFrentes.delete(k):expandedFrentes.add(k);selFrente=k;selItem=null;selBucket=null;render();renderPanel();save();}
function toggleBucket(fk,p){const id=fk+'|'+p;expandedBuckets.has(id)?expandedBuckets.delete(id):expandedBuckets.add(id);selBucket=id;selItem=null;render();renderPanel();save();}
function selectItem(id){const it=ITEMS.find(i=>i.id===id);if(!it)return;expandedFrentes.add(it.frente);expandedBuckets.add(it.frente+'|'+it.prioridade);selItem=id;selFrente=null;selBucket=null;render();renderPanel();panTo('item:'+id);save();}

function panTo(key){const p=positions[key];if(!p)return;const r=vp.getBoundingClientRect();
  pan.x=r.width/2-world.offsetLeft-p.x*zoom;pan.y=r.height/2-world.offsetTop-p.y*zoom;applyTransform();}

/* ---- panel ---- */
function renderPanel(){
  const el=document.getElementById('panel');
  if(!selItem){el.innerHTML=`<div class="empty">Clique numa frente para expandir suas prioridades, depois num item para ver a descrição.</div>`;return;}
  const it=ITEMS.find(i=>i.id===selItem);const f=FR[it.frente];
  const siblings=itemsOf(it.frente,it.prioridade).filter(s=>s.id!==it.id);
  el.innerHTML=`<div class="pid">${it.id}</div><div class="ptitle">${esc(it.title)}</div>
  <div class="pbadges"><span class="badge ${it.prioridade}">${PRIO_PCODE[it.prioridade]} · ${PRIO_LABELS[it.prioridade]}</span>
    <span class="status-pill ${it.status}">${STATUS_ICON[it.status]}${STATUS_LABELS[it.status]}</span>
    <span class="badge tipo-${it.tipo}">${TIPO_LABELS[it.tipo]}</span>${it.dep?'<span class="badge dep">Aguardando dependência</span>':''}</div>
  <div class="pmeta">
    <div><div class="ml">Frente</div><div class="mv"><span class="fpill"><span class="dt" style="background:${f.color}"></span>${esc(f.label)}</span></div></div>
    <div><div class="ml">Responsável</div><div class="mv">${it.dev?`<span class="dev-chip" style="--dc:${DEV_COLOR[it.dev]}"><span class="dt"></span>${esc(it.dev)}</span>`:'—'}</div></div>
    <div><div class="ml">Esforço</div><div class="mv">${it.esforco||'—'}</div></div>
    <div><div class="ml">Menu de origem</div><div class="mv">${esc(it.menu)}</div></div>
  </div>
  <div class="pdesc"><h4>Descrição refinada</h4><p>${esc(it.desc)}</p></div>`;
  if(it.obs_refino){el.innerHTML+=`<div style="margin-top:14px"><h4 style="font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--text-muted);margin:0 0 7px">Observação de refinamento</h4><p style="font-size:13px;line-height:1.55;margin:0;background:#F0F4FF;border-left:3px solid #6E6EFF;border-radius:0 8px 8px 0;padding:10px 13px">${esc(it.obs_refino)}</p></div>`;}
  if(it.nota_negocio){el.innerHTML+=`<div style="margin-top:14px;font-size:13px;line-height:1.55;color:#92400E;background:#FEF3C7;border-radius:8px;padding:12px 14px"><div style="font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:#B45309;margin-bottom:5px">Depende do negócio</div>${esc(it.nota_negocio)}</div>`;}
  if(siblings.length){el.innerHTML+=`<div class="plist"><h4 style="font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--text-muted);margin:0 0 8px">Mesma frente · ${PRIO_PCODE[it.prioridade]}</h4>`+
    siblings.map(s=>`<div class="pli" onclick="selectItem('${s.id}')"><span class="id">${s.id}</span>${esc(s.title)}</div>`).join('')+`</div>`;}
}

/* ---- search ---- */
function applySearchVisual(){
  if(!searchQ){world.querySelectorAll('.node').forEach(n=>n.classList.remove('dim'));return;}
  const q=searchQ.toLowerCase();
  world.querySelectorAll('.node').forEach(n=>{
    if(n.classList.contains('hub-node')){n.classList.remove('dim');return;}
    let txt='';if(n.dataset.item){const it=ITEMS.find(i=>i.id===n.dataset.item);txt=(it.title+' '+it.id+' '+it.desc).toLowerCase();}
    else if(n.dataset.fr){txt=FR[n.dataset.fr].label.toLowerCase();}
    n.classList.toggle('dim',txt&&!txt.includes(q));
  });
}
document.getElementById('search').oninput=e=>{searchQ=e.target.value.trim();
  if(searchQ){const q=searchQ.toLowerCase();ITEMS.forEach(it=>{if((it.title+' '+it.id+' '+it.desc).toLowerCase().includes(q)){expandedFrentes.add(it.frente);expandedBuckets.add(it.frente+'|'+it.prioridade);}});}
  render();};

/* ---- toolbar ---- */
function setZoom(nz){const r=vp.getBoundingClientRect();const mx=r.width/2,my=r.height/2;const ox=world.offsetLeft,oy=world.offsetTop;
  nz=Math.max(0.2,Math.min(2.6,nz));pan.x=mx-ox-(mx-ox-pan.x)*(nz/zoom);pan.y=my-oy-(my-oy-pan.y)*(nz/zoom);zoom=nz;applyTransform();save();}
document.getElementById('zoomin').onclick=()=>setZoom(zoom*1.15);
document.getElementById('zoomout').onclick=()=>setZoom(zoom/1.15);
document.getElementById('center').onclick=()=>{pan={x:0,y:0};zoom=1;applyTransform();save();};
document.getElementById('collapse').onclick=()=>{expandedFrentes.clear();expandedBuckets.clear();selItem=null;selFrente=null;selBucket=null;render();renderPanel();save();};
document.getElementById('reset').onclick=()=>{if(confirm('Resetar posições e layout do mapa?')){localStorage.removeItem(STORAGE);positions={};pan={x:0,y:0};zoom=1;expandedFrentes.clear();expandedBuckets.clear();selItem=null;render();renderPanel();}};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){selItem=null;selFrente=null;selBucket=null;searchQ='';document.getElementById('search').value='';render();renderPanel();}});

document.getElementById('meta').textContent=ITEMS.length+' itens · '+DATA.frentes.length+' frentes';
load();render();renderPanel();
</script>
</body>
</html>
