<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roadmap · Torre de Controle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --finza-blue:#1A1AFF;--finza-dark:#0A0A2E;
  --bg:#F4F5F7;--surface:#FFFFFF;--ghost:#C8C8D4;
  --text:#0F1226;--text-muted:#5C5C7A;--text-subtle:#9498AD;
  --border:#E4E6EE;--border-soft:#EEF0F5;
  /* status */
  --st-entregue:#10B981;--st-backlog:#64748B;--st-a-refinar:#9CA3AF;--st-adiado:#94A3B8;--st-cancelado:#EF4444;--st-executando:#2563EB;--st-bloqueado:#DC2626;
  /* dev */
  --dev-marcos:#EAB308;--dev-leandro:#3B82F6;--dev-joao:#F97316;
  /* prioridade */
  --p-urgente:#DC2626;--p-alta:#D97706;--p-media:#2563EB;--p-baixa:#64748B;
  /* tipo */
  --t-bug:#E11D48;--t-melhoria:#0EA5E9;
  --font-sans:'Inter',system-ui,sans-serif;--font-mono:'JetBrains Mono',monospace;
  --sidebar-w:250px;--topbar-h:52px;--radius:10px;
  --shadow-sm:0 1px 2px rgba(15,18,38,.05);--shadow-md:0 4px 16px rgba(15,18,38,.08);--shadow-lg:0 24px 48px rgba(15,18,38,.18);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font-sans);font-size:13.5px;line-height:1.55;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--finza-blue);outline-offset:2px;border-radius:4px}

.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;background:var(--finza-dark);color:#fff;display:flex;flex-direction:column;padding:18px 12px;overflow-y:auto;z-index:10}
.sidebar::-webkit-scrollbar{width:6px}.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:99px}
.brand{display:flex;align-items:baseline;gap:8px;padding:6px 10px 16px}
.brand .mark{color:#6E6EFF;font-size:14px;font-weight:700}
.brand .name{font-size:14px;font-weight:700;letter-spacing:.04em}
.brand .tag{margin-left:auto;font-family:var(--font-mono);font-size:9px;color:rgba(255,255,255,.4);letter-spacing:.08em;text-transform:uppercase}
.side-section{font-size:10px;letter-spacing:.14em;color:rgba(255,255,255,.4);text-transform:uppercase;padding:14px 12px 6px;font-weight:700}
.side-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:7px;color:rgba(255,255,255,.72);font-size:13px;width:100%;text-align:left;transition:background .12s,color .12s;margin-bottom:1px}
.side-item:hover{background:rgba(255,255,255,.06);color:#fff}
.side-item.active{background:var(--finza-blue);color:#fff;font-weight:500}
.side-item .ico{font-size:11px;width:14px;text-align:center}
.side-item .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-item .count{font-family:var(--font-mono);font-size:10px;background:rgba(255,255,255,.1);padding:1px 6px;border-radius:99px;color:rgba(255,255,255,.7);min-width:22px;text-align:center}
.side-item.active .count{background:rgba(255,255,255,.22);color:#fff}
.side-item .dot-frente{width:8px;height:8px;border-radius:50%;flex:none}
.sidebar-footer{margin-top:auto;padding:14px 10px 4px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:rgba(255,255,255,.5)}
.sidebar-footer .who strong{color:#fff;font-weight:500;display:block;font-size:12px;margin-bottom:2px}
.sidebar-footer .src{font-family:var(--font-mono);font-size:9px;color:rgba(255,255,255,.32);margin-top:6px;line-height:1.5}

.main{min-width:0;display:flex;flex-direction:column;position:relative}
.topbar{position:sticky;top:0;height:var(--topbar-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 26px;z-index:20}
.crumb{display:flex;align-items:center;gap:8px;font-size:13px}
.crumb .seg{color:var(--text-muted)}.crumb .seg.cur{color:var(--text);font-weight:500}
.crumb .sep{color:var(--text-subtle);font-size:10px}
.topbar-spacer{flex:1}
.iaf-mark{font-size:11px;font-weight:700;color:var(--finza-blue);letter-spacing:.1em}
.view{padding:28px 34px 90px;width:100%;max-width:1680px;margin:0 auto}
.ghost{font-weight:300;color:var(--ghost);font-size:32px;line-height:1.1;letter-spacing:-.015em;margin:0 0 6px}
.ghost .accent{font-weight:700;color:var(--finza-blue)}
.sub{color:var(--text-muted);font-size:13.5px;margin:0 0 22px;max-width:860px}
.section-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--text-muted);margin:24px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border-soft);display:flex;align-items:center;justify-content:space-between}
.section-title .extra{font-size:11px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--text-subtle)}

/* hero slim */
.hero{background:var(--finza-dark);color:#fff;padding:20px 26px;border-radius:14px;margin-bottom:20px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;top:-40%;right:-6%;width:320px;height:320px;background:radial-gradient(circle,rgba(46,46,255,.3) 0%,transparent 70%);pointer-events:none}
.hero .label{font-size:10px;letter-spacing:.18em;color:rgba(255,255,255,.5);text-transform:uppercase;font-weight:700;margin-bottom:6px}
.hero .title{font-size:20px;font-weight:300;line-height:1.3;margin:0;max-width:760px}
.hero .title b{font-weight:700;color:#B9B9FF}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:8px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px 15px;position:relative}
.kpi::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:2px;background:var(--kc,var(--finza-blue))}
.kpi .lab{font-size:10px;letter-spacing:.1em;color:var(--text-muted);text-transform:uppercase;font-weight:700;margin-bottom:5px}
.kpi .num{font-size:26px;font-weight:700;line-height:1;font-family:var(--font-mono);color:var(--text)}
.kpi.k-total{--kc:var(--finza-blue)}.kpi.k-entregue{--kc:var(--st-entregue)}.kpi.k-backlog{--kc:var(--st-backlog)}
.kpi.k-arefinar{--kc:var(--st-a-refinar)}.kpi.k-adiado{--kc:var(--st-adiado)}.kpi.k-cancelado{--kc:var(--st-cancelado)}
.kpi.k-executando{--kc:var(--st-executando)}.kpi.k-bloqueado{--kc:var(--st-bloqueado)}

.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}
@media (max-width:1200px){.grid3{grid-template-columns:1fr 1fr}.kpis{grid-template-columns:repeat(3,1fr)}}
@media (max-width:820px){.grid3{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px}
.panel h3{margin:0 0 14px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted)}
.donut-wrap{display:flex;align-items:center;gap:16px}
.legend{display:flex;flex-direction:column;gap:6px;font-size:12px;flex:1;min-width:0}
.legend .row{display:flex;align-items:center;gap:8px}
.legend .sw{width:10px;height:10px;border-radius:3px;flex:none}
.legend .ll{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend .lv{font-family:var(--font-mono);font-weight:700;color:var(--text-muted)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:120px 1fr 30px;gap:10px;align-items:center;font-size:12px}
.bar-row.wide{grid-template-columns:150px 1fr 30px}
.bar-row .bl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{height:8px;background:var(--border-soft);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px}
.bar-row .bv{font-family:var(--font-mono);font-weight:700;text-align:right;color:var(--text-muted)}

/* legend chips (colors reference) */
.legendbar{display:flex;flex-wrap:wrap;gap:14px;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:18px;font-size:11.5px;color:var(--text-muted)}
.legendbar .grp{display:flex;align-items:center;gap:8px}
.legendbar .grp .t{font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:9.5px;color:var(--text-subtle)}
.legendbar .lg{display:inline-flex;align-items:center;gap:5px}
.legendbar .lg .d{width:9px;height:9px;border-radius:50%}

/* board */
.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:14px}
.search{flex:1;min-width:210px;max-width:340px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 12px}
.search input{border:0;outline:0;width:100%;background:none}
.search .mag{color:var(--text-subtle)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{padding:5px 11px;border-radius:99px;border:1px solid var(--border);background:var(--surface);font-size:12px;color:var(--text-muted);display:inline-flex;align-items:center;gap:6px;transition:all .12s}
.chip:hover{border-color:var(--text-subtle);color:var(--text)}
.chip.on{background:var(--finza-dark);color:#fff;border-color:var(--finza-dark)}
.chip .d{width:8px;height:8px;border-radius:50%}
.chip-clear{font-size:12px;color:var(--text-subtle);text-decoration:underline}
.filter-lab{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text-subtle);margin:8px 0 5px}

.kanban{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:13px}
@media (max-width:1100px){.kanban:not(.kstatus){grid-template-columns:repeat(2,1fr)}}
.kanban.kstatus{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.kanban.kstatus .kcol{flex:0 0 clamp(192px,13.5vw,240px)}
.kcol{background:#EBECF1;border-radius:11px;padding:9px;min-height:100px}
.kcol-head{display:flex;align-items:center;gap:8px;padding:5px 6px 10px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.kcol-head .kc-dot{width:9px;height:9px;border-radius:50%}
.kcol-head .kc-count{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--text-muted);background:var(--surface);padding:1px 7px;border-radius:99px}
.kcol-body{display:flex;flex-direction:column;gap:8px}
.kcol-empty{font-size:11px;color:var(--text-subtle);text-align:center;padding:14px 0;font-style:italic}

.ci{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--ci-accent,var(--st-backlog));border-radius:8px;padding:10px 12px;cursor:pointer;transition:box-shadow .12s,transform .12s}
.ci:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.ci.done{opacity:.72}.ci.dropped{opacity:.6}
.ci-top{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.ci-id{font-family:var(--font-mono);font-size:10px;font-weight:700;color:var(--text-subtle)}
.ci-esf{margin-left:auto;font-size:10px;color:var(--text-subtle);font-family:var(--font-mono)}
.ci-title{font-size:12.8px;font-weight:500;line-height:1.35;margin-bottom:9px;color:var(--text)}
.ci.dropped .ci-title{text-decoration:line-through;text-decoration-color:var(--text-subtle)}
.ci-bot{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pill{font-size:10px;font-weight:700;padding:1px 7px;border-radius:99px;letter-spacing:.02em;display:inline-flex;align-items:center;gap:4px}
.pbadge{font-family:var(--font-mono);font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:4px;color:#fff}
.pbadge.urgente{background:var(--p-urgente)}.pbadge.alta{background:var(--p-alta)}.pbadge.media{background:var(--p-media)}.pbadge.baixa{background:var(--p-baixa)}
.tipo{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:1px 6px;border-radius:4px}
.tipo.bug{background:#FFE4E9;color:var(--t-bug)}.tipo.melhoria{background:#E0F2FE;color:#0284C7}
.frente-pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--text-muted);background:var(--bg);padding:2px 8px;border-radius:99px;max-width:100%}
.frente-pill .d{width:7px;height:7px;border-radius:50%;flex:none}
.frente-pill .fl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status-pill{color:#fff}
.exec-pill{font-family:var(--font-mono);font-size:9.5px;color:#fff;background:#2563EB}
.reab-pill{font-family:var(--font-mono);font-size:9.5px;font-weight:700;color:#fff;background:#B45309;padding:2px 8px;border-radius:99px;white-space:nowrap;letter-spacing:.02em}
.status-pill.entregue{background:var(--st-entregue)}.status-pill.backlog{background:var(--st-backlog)}
.status-pill.a-refinar{background:#fff;color:var(--st-a-refinar);border:1px dashed var(--st-a-refinar)}
.status-pill.executando{background:var(--st-executando)}
.status-pill.bloqueado{background:var(--st-bloqueado)}
.status-pill.adiado{background:var(--st-adiado)}.status-pill.cancelado{background:var(--st-cancelado)}
.dev-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--text);padding:1px 8px 1px 6px;border-radius:99px;background:var(--bg)}
.dev-chip .d{width:8px;height:8px;border-radius:50%;background:var(--dc)}
.dep-tag{font-size:9.5px;font-weight:700;text-transform:uppercase;color:#9333EA;background:#F3E8FF;padding:1px 6px;border-radius:4px}
.ci-obs{margin-top:8px;padding-top:7px;border-top:1px dashed var(--border);font-size:10.5px;line-height:1.4;color:var(--text-muted);font-style:italic;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ci-obs .oic{font-style:normal;color:var(--text-subtle);margin-right:4px}
.refino-pill{font-size:9.5px;font-weight:700;padding:1px 8px;border-radius:99px;color:#fff}
.exec-pill{font-size:9.5px;font-weight:700;color:#fff;background:#10B981;padding:1px 7px;border-radius:99px;letter-spacing:.02em}
.qkey{font-family:var(--font-mono);font-size:9.5px;color:var(--text-subtle);background:var(--bg);padding:1px 6px;border-radius:4px}
.src-q{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#6366F1;background:#EEF2FF;padding:1px 6px;border-radius:4px}
.fora-q{font-size:9.5px;font-weight:700;color:#71717A;background:#F1F1F5;border:1px dashed #C4C4D0;padding:1px 7px;border-radius:99px;letter-spacing:.02em}

/* segmented toggle */
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:2px}
.seg button{padding:5px 13px;border-radius:6px;font-size:12px;font-weight:600;color:var(--text-muted);white-space:nowrap}
.seg button.on{background:var(--finza-dark);color:#fff}

/* filter bar — uma linha */
.fbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.fbar .search{flex:0 1 260px;min-width:180px}
.fdrop{position:relative}
.fdrop-btn{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border:1px solid var(--border);border-radius:8px;background:var(--surface);font-size:12px;color:var(--text-muted)}
.fdrop-btn:hover{border-color:var(--text-subtle);color:var(--text)}
.fdrop-btn .cnt{font-family:var(--font-mono);font-size:10px;background:var(--finza-blue);color:#fff;border-radius:99px;padding:0 5px;min-width:15px;text-align:center}
.fdrop-btn .car{font-size:8px;color:var(--text-subtle)}
.fdrop-menu{position:absolute;top:calc(100% + 4px);left:0;z-index:30;background:var(--surface);border:1px solid var(--border);border-radius:9px;box-shadow:var(--shadow-md);padding:6px;min-width:200px;max-height:300px;overflow:auto;display:none}
.fdrop.open .fdrop-menu{display:block}
.fopt{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;font-size:12px;cursor:pointer;white-space:nowrap}
.fopt:hover{background:var(--bg)}
.fopt input{margin:0;accent-color:var(--finza-blue)}
.fopt .d{width:9px;height:9px;border-radius:50%;flex:none}
.fchip-exec{padding:6px 11px;border:1px solid var(--border);border-radius:8px;font-size:12px;color:var(--st-entregue);font-weight:600;display:inline-flex;align-items:center;gap:6px;background:var(--surface)}
.fchip-exec.on{background:var(--st-entregue);color:#fff;border-color:var(--st-entregue)}
.fchip-fora{padding:6px 11px;border:1px solid var(--border);border-radius:8px;font-size:12px;color:var(--text-muted);font-weight:600;display:inline-flex;align-items:center;gap:6px;background:var(--surface)}
.fchip-fora.on{background:#6B7280;color:#fff;border-color:#6B7280}
.fbar .clr{font-size:12px;color:var(--text-subtle);text-decoration:underline;margin-left:2px}

/* frente dashboard */
.fdash{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:12px}
@media(max-width:1000px){.fdash{grid-template-columns:repeat(3,1fr)}}
.fdash .fd{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:10px 13px;position:relative}
.fdash .fd::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--kc,var(--border))}
.fdash .fd .l{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);font-weight:700;margin-bottom:4px}
.fdash .fd .n{font-size:21px;font-weight:700;font-family:var(--font-mono);line-height:1;color:var(--kc,var(--text))}
.progress-wrap{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:12px 16px;margin-bottom:16px}
.progress-wrap .pl{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--text-muted);margin-bottom:7px}
.progress-wrap .pl .pct{font-family:var(--font-mono);font-weight:700;font-size:16px;color:var(--st-entregue)}
.progress-track{height:10px;background:var(--border-soft);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#10B981,#34D399);border-radius:99px;transition:width .3s}
/* conclusão do backlog (overview) — hoje vs previsto c/ pipeline do Quimera */
.compl-nums{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.compl-b{min-width:118px}
.compl-l{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);font-weight:700;margin-bottom:4px}
.compl-n{font-family:var(--font-mono);font-size:34px;font-weight:700;line-height:1}
.compl-s{font-size:11.5px;color:var(--text-subtle);margin-top:4px}
.compl-arrow{font-size:24px;color:var(--text-subtle);align-self:center;font-weight:700}
.compl-track{position:relative;height:16px;background:var(--border-soft);border-radius:99px;overflow:hidden}
.compl-proj{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(45deg,rgba(37,99,235,.55) 0 6px,rgba(37,99,235,.30) 6px 12px)}
.compl-done{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#10B981,#34D399)}
.compl-leg{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--text-muted)}
.compl-leg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:middle}
.compl-leg i.hatch{background:repeating-linear-gradient(45deg,rgba(37,99,235,.55) 0 4px,rgba(37,99,235,.30) 4px 8px)}

/* Finza — matriz de pesos */
.wmatrix{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 22px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;margin-bottom:6px}
@media(max-width:820px){.wmatrix{grid-template-columns:1fr}}
.wm{display:grid;grid-template-columns:150px 1fr 42px;gap:10px;align-items:center;font-size:12px}
.wm-l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.wm-l .pen-t{font-size:9px;color:#EF4444;font-weight:700;text-transform:uppercase}
.wm-bar{height:8px;background:var(--border-soft);border-radius:99px;overflow:hidden}
.wm-fill{height:100%;border-radius:99px}
.wm-w{font-family:var(--font-mono);font-weight:700;text-align:right;color:var(--text-muted)}
/* Finza — ranking */
.rank{display:flex;flex-direction:column;gap:8px}
.rk{display:flex;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 15px;cursor:pointer;transition:box-shadow .12s,transform .12s}
.rk:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.rk-main{flex:1;min-width:0}
.rk-sub{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--finza-blue)}
.rk-t{font-size:13.5px;font-weight:600;color:var(--text);margin:2px 0 7px;line-height:1.3}
.rk-t .mand{font-size:10px;font-weight:700;color:#DC2626;background:#FEE2E2;padding:1px 7px;border-radius:99px}
.rk-chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.crit{font-family:var(--font-mono);font-size:9.5px;font-weight:700;color:#fff;padding:1px 6px;border-radius:4px;white-space:nowrap}
.rk-meta{font-size:10.5px;color:var(--text-subtle);margin-left:4px}
.rk-score{width:110px;flex:none;text-align:right}
.rk-num{font-family:var(--font-mono);font-size:19px;font-weight:700;color:var(--finza-blue);line-height:1}
.rk-bar{height:6px;background:var(--border-soft);border-radius:99px;overflow:hidden;margin-top:6px}
.rk-fill{height:100%;background:linear-gradient(90deg,#1A1AFF,#6E6EFF);border-radius:99px}
/* Finza — matriz no drawer */
.cmatrix{display:flex;flex-direction:column;gap:8px}
.cmx{display:grid;grid-template-columns:120px 1fr 22px;gap:10px;align-items:center;font-size:12px}
.cmx-l{color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmx-bar{height:8px;background:var(--border-soft);border-radius:99px;overflow:hidden}
.cmx-fill{height:100%;border-radius:99px}
.cmx-v{font-family:var(--font-mono);font-weight:700;text-align:right;color:var(--text)}

/* lançamento — demandas selecionadas p/ o board da diretoria */
.launch-intro{font-size:12.5px;color:var(--text-muted);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;margin-bottom:6px}
.launch-list{display:flex;flex-direction:column;gap:12px}
.lc{display:flex;gap:14px;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--finza-blue);border-radius:var(--radius);padding:15px 17px}
.lc-num{flex:none;width:26px;height:26px;border-radius:7px;background:var(--finza-dark);color:#fff;font-family:var(--font-mono);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.lc-main{flex:1;min-width:0}
.lc-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:7px}
.lc-id{font-family:var(--font-mono);font-size:10px;font-weight:700;color:var(--finza-blue);letter-spacing:.02em}
.lc-meta{margin-left:auto;display:flex;gap:5px;flex-wrap:wrap}
.lc-chip{font-family:var(--font-mono);font-size:9.5px;font-weight:700;color:var(--text-muted);background:var(--bg);border:1px solid var(--border);padding:1px 7px;border-radius:99px}
.lc-title{font-size:15px;font-weight:700;line-height:1.3;color:var(--text);margin-bottom:6px}
.lc-desc{font-size:12.5px;color:var(--text-muted);line-height:1.5;margin-bottom:10px}
.lc-why{background:#EEF0FF;border:1px solid #D6D9FF;border-radius:8px;padding:9px 12px;font-size:12px;color:#26268A;line-height:1.5}
.lc-why-lab{display:block;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--finza-blue);margin-bottom:3px}
.lc-copy{margin-top:11px;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--finza-blue);background:var(--surface);border:1px solid var(--finza-blue);border-radius:8px;padding:6px 12px;transition:background .12s,color .12s,border-color .12s}
.lc-copy:hover{background:var(--finza-blue);color:#fff}
.lc-copy.ok{background:var(--st-entregue);border-color:var(--st-entregue);color:#fff}
@media(max-width:820px){.lc-meta{margin-left:0}}

/* frente header */
.frente-head{display:flex;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:16px;padding:16px 20px;background:var(--surface);border:1px solid var(--border);border-radius:13px}
.frente-head .fh-icon{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;font-family:var(--font-mono);flex:none}
.frente-head .fh-label{font-size:20px;font-weight:700;line-height:1.1}
.fh-kpis{margin-left:auto;display:flex;gap:20px;flex-wrap:wrap}
.fh-kpis .k{text-align:center;min-width:44px}
.fh-kpis .k .n{font-family:var(--font-mono);font-weight:700;font-size:20px;line-height:1;color:var(--kc,var(--text))}
.fh-kpis .k .l{font-size:8.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);font-weight:700;margin-top:4px;white-space:nowrap}

/* analise */
.obs-prio{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:8px}
@media (max-width:900px){.obs-prio{grid-template-columns:1fr}}
.obs-card{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--oc);border-radius:var(--radius);padding:14px 16px}
.obs-card .oh{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;margin-bottom:6px}
.obs-card .oh .cnt{margin-left:auto;font-family:var(--font-mono);font-size:12px;color:var(--text-muted)}
.obs-card p{margin:0;font-size:12.5px;color:var(--text-muted);line-height:1.55}
.top10{display:flex;flex-direction:column;gap:7px}
.top-row{display:grid;grid-template-columns:26px 1fr auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--finza-blue);border-radius:8px;padding:11px 13px}
.top-row .tn{font-family:var(--font-mono);font-size:17px;font-weight:700;color:var(--finza-blue);line-height:1.1}
.top-row .ti{font-weight:600;margin-bottom:3px}
.top-row .tw{font-size:12px;color:var(--text-muted);line-height:1.45}
.top-row .tags{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.gerais{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.gerais li{position:relative;padding-left:18px;font-size:13px;color:var(--text);line-height:1.5}
.gerais li::before{content:'▸';position:absolute;left:0;color:var(--finza-blue);font-weight:700}
.refino-summary{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.refino-summary .rs{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:5px 12px;font-size:12px}
.refino-summary .rs .rn{font-family:var(--font-mono);font-weight:700}
.refino-summary .rs .rd{width:9px;height:9px;border-radius:50%}
.refino-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
@media (max-width:900px){.refino-grid{grid-template-columns:1fr}}
.refino-card{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--rc);border-radius:var(--radius);padding:14px 16px}
.refino-card .rh{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;margin-bottom:3px}
.refino-card .rh .rcount{margin-left:auto;font-family:var(--font-mono);font-size:13px;color:var(--rc)}
.refino-card .rhint{font-size:11.5px;color:var(--text-muted);line-height:1.45;margin-bottom:10px}
.refino-list{display:flex;flex-direction:column;gap:3px}
.refino-list .rli{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:baseline;padding:5px 6px;border-radius:6px;cursor:pointer;font-size:12px}
.refino-list .rli:hover{background:var(--bg)}
.refino-list .rli .rid{font-family:var(--font-mono);font-size:9.5px;font-weight:700;color:var(--text-subtle)}
.refino-list .rli .rtt{color:var(--text)}
.refino-list .rli .robs{display:block;font-size:10.5px;color:var(--text-muted);font-style:italic;margin-top:1px;line-height:1.35}

/* drawer */
.overlay{position:fixed;inset:0;background:rgba(15,18,38,.42);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(560px,94vw);background:var(--surface);box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform .24s cubic-bezier(.4,0,.2,1);z-index:50;display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.drawer-head{padding:22px 26px 16px;border-bottom:1px solid var(--border-soft);display:flex;align-items:flex-start;gap:12px}
.drawer-head .dh-id{font-family:var(--font-mono);font-size:11px;color:var(--text-subtle);font-weight:700}
.drawer-head .dh-title{font-size:18px;font-weight:700;line-height:1.28;margin-top:4px}
.drawer-close{margin-left:auto;font-size:22px;color:var(--text-subtle);line-height:1;flex:none}
.drawer-close:hover{color:var(--text)}
.drawer-body{padding:18px 26px 60px;overflow-y:auto;flex:1}
.d-badges{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.d-meta{display:grid;grid-template-columns:1fr 1fr;gap:13px 18px;margin:0 0 20px;padding:15px 16px;background:var(--bg);border-radius:var(--radius)}
.d-meta .mlab{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-subtle);font-weight:700;margin-bottom:3px}
.d-meta .mval{font-size:13px;font-weight:500}
.d-block{margin-bottom:18px}
.d-block h4{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--text-muted);font-weight:700;margin:0 0 8px}
.d-desc{font-size:14px;line-height:1.62;color:var(--text);border-left:3px solid var(--finza-blue);padding-left:14px}
.d-obs{font-size:13.5px;line-height:1.6;color:var(--text);background:#F0F4FF;border-left:3px solid #6E6EFF;border-radius:0 8px 8px 0;padding:11px 14px}
.d-nota{font-size:13px;line-height:1.55;color:#92400E;background:#FEF3C7;border-radius:8px;padding:12px 14px}
.d-nota .nl{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:#B45309;margin-bottom:5px}
.empty{color:var(--text-subtle);font-style:italic;padding:26px 0;text-align:center}

/* timeline */
.tl{display:flex;flex-direction:column;gap:16px}
.tl-month{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);overflow:hidden;box-shadow:var(--shadow-sm)}
.tl-mhead{display:flex;align-items:center;gap:10px;padding:10px 16px;font-family:var(--font-mono);font-weight:700;font-size:13px;border-left:4px solid #10B981;background:linear-gradient(90deg,rgba(16,185,129,.09),transparent)}
.tl-mhead.plan{border-left-color:#64748B;background:linear-gradient(90deg,rgba(100,116,139,.10),transparent)}
.tl-mlabel{text-transform:uppercase;letter-spacing:.05em}
.tl-mcount{margin-left:auto;font-size:11px;font-weight:600;color:var(--text-subtle)}
.tl-row{display:flex;align-items:center;gap:10px;padding:9px 16px;border-top:1px solid var(--border);cursor:pointer;font-size:12.5px;transition:background .12s}
.tl-row:hover{background:var(--bg)}
.tl-date{font-family:var(--font-mono);font-weight:700;color:var(--finza-blue);min-width:46px;font-size:12px}
.tl-id{font-family:var(--font-mono);font-size:10.5px;color:var(--text-subtle);min-width:38px}
.tl-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-note{margin-top:12px;font-size:12px;color:var(--text-subtle);padding:9px 13px;border:1px dashed var(--border);border-radius:8px;line-height:1.5}
.ci-date{font-family:var(--font-mono);font-size:10px;font-weight:700;color:#10B981}
/* timeline — atraso + grupos sem data */
.tl-mhead.atraso{border-left-color:#EF4444;background:linear-gradient(90deg,rgba(239,68,68,.12),transparent);color:#B91C1C}
.tl-mhead.nodate{border-left-color:#CBD5E1;background:linear-gradient(90deg,rgba(148,163,184,.10),transparent)}
.tl-mhead.drop{border-left-color:#EF4444;background:linear-gradient(90deg,rgba(239,68,68,.06),transparent)}
.tl-mhead.refine{border-left-color:#9CA3AF;background:linear-gradient(90deg,rgba(156,163,175,.12),transparent)}
.tl-row.atrasado{background:rgba(239,68,68,.045);box-shadow:inset 3px 0 0 #EF4444}
.tl-row.atrasado:hover{background:rgba(239,68,68,.09)}
.tl-badge-atraso{font-family:var(--font-mono);font-size:9.5px;font-weight:700;color:#fff;background:#DC2626;padding:1px 7px;border-radius:99px;letter-spacing:.02em;white-space:nowrap}
.tl-badge-exec{font-family:var(--font-mono);font-size:9.5px;font-weight:700;color:#fff;background:#2563EB;padding:1px 7px;border-radius:99px;letter-spacing:.02em;white-space:nowrap}
.tl-row.exec-atraso{background:linear-gradient(90deg,rgba(239,68,68,.05),rgba(37,99,235,.06));box-shadow:inset 3px 0 0 #EF4444,inset -3px 0 0 #2563EB}
.tl-row.exec-atraso:hover{background:linear-gradient(90deg,rgba(239,68,68,.09),rgba(37,99,235,.10))}
.tl-row.em-quimera{background:rgba(37,99,235,.045);box-shadow:inset 3px 0 0 #2563EB}
.tl-row.em-quimera:hover{background:rgba(37,99,235,.09)}
.tl-mhead.exec{border-left-color:#2563EB;background:linear-gradient(90deg,rgba(37,99,235,.11),transparent);color:#1D4ED8}
.section-title.tl-exec-sec{color:#1D4ED8;border-bottom-color:rgba(37,99,235,.35)}
.section-title.tl-exec-sec .extra{color:#2563EB}
.tl-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.tl-toolbar .spacer{flex:1}
.section-title.tl-atraso-sec{color:#B91C1C;border-bottom-color:rgba(239,68,68,.35)}
.section-title.tl-atraso-sec .extra{color:#DC2626}
.fchip-atraso{padding:6px 11px;border:1px solid var(--border);border-radius:8px;font-size:12px;color:#DC2626;font-weight:600;display:inline-flex;align-items:center;gap:6px;background:var(--surface)}
.fchip-atraso.on{background:#DC2626;color:#fff;border-color:#DC2626}
.tl-datefilter{font-size:12px;color:var(--text-muted);display:inline-flex;align-items:center;gap:6px}
.tl-datefilter select{font-family:var(--font-sans);font-size:12px;padding:5px 7px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text)}
/* gantt */
.gantt{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow-sm);overflow:hidden}
.gantt-axis{display:grid;position:relative;border-bottom:1px solid var(--border);background:var(--bg);font-family:var(--font-mono);font-size:10.5px;font-weight:700;color:var(--text-subtle)}
.gantt-axis .gax-lbl{padding:7px 0 7px 12px;border-right:1px solid var(--border-soft)}
.gantt-axis .gax-month{padding:7px 8px;text-align:left;border-right:1px solid var(--border-soft);text-transform:uppercase;letter-spacing:.05em}
.gantt-scroll{overflow-x:auto}
.gantt-inner{min-width:640px}
.gantt-row{display:grid;align-items:center;border-top:1px solid var(--border-soft);min-height:34px;transition:background .12s}
.gantt-row:hover{background:var(--bg)}
.gantt-label{display:flex;align-items:center;gap:7px;padding:5px 10px 5px 12px;min-width:0;cursor:pointer;border-right:1px solid var(--border-soft)}
.gantt-label .gl-id{font-family:var(--font-mono);font-size:10px;color:var(--text-subtle);flex:none}
.gantt-label .gl-title{font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.gantt-label .gl-dot{width:8px;height:8px;border-radius:50%;flex:none}
.gantt-track{position:relative;height:100%;min-height:34px;cursor:pointer}
.gantt-track .gt-grid{position:absolute;top:0;bottom:0;width:1px;background:var(--border-soft)}
.gantt-bar{position:absolute;top:9px;height:16px;border-radius:5px;min-width:5px;display:flex;align-items:center;box-shadow:var(--shadow-sm)}
.gantt-bar.plan{opacity:.92;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.28) 0 5px,transparent 5px 10px)}
.gantt-bar.atraso{outline:2px solid #EF4444;outline-offset:1px}
.gantt-bar.exec{outline:2px solid #2563EB;outline-offset:1px}
.gantt-bar.atraso.exec{outline:2px solid #2563EB;outline-offset:1px}
.gantt-label .gl-exec{color:#2563EB;font-size:10px;font-weight:700;flex:none}
.gantt-bar.done::after{content:"✓";position:absolute;right:4px;color:#fff;font-size:9px;font-weight:700}
.gantt-ms{position:absolute;top:8px;width:14px;height:14px;transform:rotate(45deg);border-radius:3px;box-shadow:var(--shadow-sm)}
.gantt-nodate{position:absolute;top:11px;left:6px;font-size:10px;color:var(--text-subtle);font-style:italic}
.gantt-today{position:absolute;top:0;bottom:0;width:2px;background:#EF4444;z-index:4;pointer-events:none}
.gantt-today::after{content:attr(data-today);position:absolute;top:-1px;left:3px;font-family:var(--font-mono);font-size:8.5px;font-weight:700;color:#EF4444;background:var(--bg);padding:0 3px;border-radius:3px;white-space:nowrap}
.gantt-empty{padding:34px 20px;text-align:center;color:var(--text-subtle);font-style:italic;font-size:13px;line-height:1.6}

/* ===== Cronograma (Gantt por dia) =====
   Scroll é SEMPRE interno ao componente (.cg-scroll). A página nunca rola de lado.
   Coluna Tarefa fica presa à esquerda, Entrega à direita, cabeçalho preso no topo. */
/* barra unica: controles do Gantt + filtros, todos em linha, acima do calendario */
.fbar-gantt{gap:7px;row-gap:9px;margin-bottom:12px}
.cg-ctl{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.fbar-sep{width:1px;align-self:stretch;min-height:26px;background:var(--border);margin:0 4px;flex:none}
.cg-nav{display:flex;align-items:center;gap:6px}
.cg-arrow,.cg-tool{border:1px solid var(--border);background:var(--surface);color:var(--text-muted);border-radius:8px;cursor:pointer;font-family:inherit;transition:background .12s,color .12s,border-color .12s}
.cg-arrow{width:30px;height:30px;font-size:17px;line-height:1}
.cg-tool{height:30px;min-width:30px;padding:0 8px;font-size:13px;font-weight:700;line-height:1}
.cg-tool.wide{font-size:11.5px;padding:0 11px;letter-spacing:.02em}
.cg-tool.on{background:var(--finza-blue);color:#fff;border-color:var(--finza-blue)}
.cg-tool.on:hover{background:var(--finza-blue);color:#fff}
.cg-arrow:hover,.cg-tool:hover{background:var(--bg);color:var(--text);border-color:var(--text-subtle)}
.cg-arrow:focus-visible,.cg-tool:focus-visible,.cg-mes:focus-visible,.cg-row:focus-visible{outline:2px solid var(--finza-blue);outline-offset:2px}
.cg-mes{min-width:150px;padding:6px 14px;border:1px solid var(--border);background:var(--surface);border-radius:8px;font-family:inherit;font-size:13.5px;font-weight:700;color:var(--text);cursor:pointer;text-transform:capitalize;text-align:center}
.cg-mes:hover{background:var(--bg)}
.cg-mes-lock{cursor:default;border-style:dashed;color:var(--text-muted)}
.cg-mes-lock:hover{background:var(--surface)}
.cg-tools{display:flex;gap:5px}
.cg-periodo{display:inline-flex;align-items:center;gap:6px;font-size:12px;flex-wrap:wrap}
.cg-pval{font-family:var(--font-mono);font-size:11.5px;font-weight:700;color:var(--text);background:var(--surface);border:1px solid var(--border);padding:4px 8px;border-radius:7px;font-variant-numeric:tabular-nums}
.cg-pto{color:var(--text-subtle)}
.cg-ndays{font-family:var(--font-mono);font-size:10.5px;color:var(--text-subtle)}
.cg-legend{display:inline-flex;gap:13px;flex-wrap:wrap;font-size:11.5px;color:var(--text-muted);margin-left:auto;flex:none}
.cg-legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.cg-legend i{width:11px;height:11px;border-radius:3px;flex:none}

.cg-wrap{background:var(--surface);border:1px solid var(--border);border-radius:11px;overflow:hidden}
.cg-scroll{overflow:auto;max-height:clamp(300px,64vh,720px);overscroll-behavior:contain}
.cg-grid{display:block;width:max-content;min-width:100%}
.cg-hrow,.cg-row{display:grid;grid-template-columns:250px minmax(var(--tw),1fr) 86px;align-items:stretch}
.cg-cell{background:var(--surface)}

/* cabeçalho preso no topo */
.cg-hrow{position:sticky;top:0;z-index:6;border-bottom:1px solid var(--border)}
.cg-hrow .cg-cell{background:var(--bg)}
.cg-hlbl,.cg-hent{display:flex;align-items:center;padding:0 13px;font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-subtle)}
.cg-hent{justify-content:flex-end}
/* colunas presas nas laterais */
.cg-hlbl,.cg-lbl{position:sticky;left:0;z-index:5}
.cg-hent,.cg-ent{position:sticky;right:0;z-index:5}
.cg-hlbl,.cg-hent{z-index:7}
.cg-lbl{box-shadow:1px 0 0 var(--border-soft)}
.cg-ent{box-shadow:-1px 0 0 var(--border-soft)}
.cg-hlbl{box-shadow:1px 0 0 var(--border)}
.cg-hent{box-shadow:-1px 0 0 var(--border)}

.cg-hdays{display:flex;flex-direction:column;width:var(--tw)}
.cg-mrow{display:flex;height:19px;border-bottom:1px solid var(--border-soft)}
.cg-mband{display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);border-left:1px solid var(--border);white-space:nowrap;overflow:hidden}
.cg-drow{display:flex}
.cg-d{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:5px 0;border-left:1px solid var(--border-soft);min-width:0}
.cg-d.we{background:color-mix(in srgb, var(--text-subtle) 10%, transparent)}
.cg-d.today{background:color-mix(in srgb, #EF4444 14%, transparent)}
.cg-wd{font-family:var(--font-mono);font-size:7.5px;font-weight:700;color:var(--text-subtle);line-height:1}
.cg-d.today .cg-wd,.cg-d.today .cg-dn{color:#EF4444}
.cg-dn{font-family:var(--font-mono);font-size:10.5px;font-weight:700;color:var(--text-muted);font-variant-numeric:tabular-nums;line-height:1}

/* corpo + overlay de fundo (uma vez, atrás de tudo) */
.cg-body{position:relative}
.cg-overlay{position:absolute;top:0;bottom:0;left:250px;z-index:0;pointer-events:none;
  background-image:linear-gradient(to right,var(--border-soft) 0 1px,transparent 1px 100%);background-repeat:repeat-x}
.cg-we-band{position:absolute;top:0;bottom:0;background:color-mix(in srgb, var(--text-subtle) 7%, transparent)}
.cg-now{position:absolute;top:0;bottom:0;width:2px;background:#EF4444;opacity:.65}

.cg-row{border-bottom:1px solid var(--border-soft);cursor:pointer;position:relative;z-index:1}
.cg-row:last-child{border-bottom:none}
.cg-row:hover .cg-track{background:color-mix(in srgb, var(--finza-blue) 5%, transparent)}
.cg-row:hover .cg-cell{background:var(--bg)}
.cg-lbl{display:flex;align-items:center;gap:9px;padding:8px 13px;min-width:0}
.cg-av{width:25px;height:25px;flex:none;border-radius:50%;background:var(--av);color:#fff;font-family:var(--font-mono);font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center}
.cg-txt{display:flex;flex-direction:column;gap:1px;min-width:0}
.cg-t{font-size:12.5px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.cg-s{font-size:10px;color:var(--text-subtle);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--font-mono)}
.cg-s b{color:#B45309;font-weight:700}

.cg-track{position:relative;min-height:44px;width:var(--tw)}
.cg-bar{position:absolute;top:50%;transform:translateY(-50%);height:22px;border-radius:5px;overflow:hidden;
  background:color-mix(in srgb, var(--bc) 24%, transparent);border:1px solid color-mix(in srgb, var(--bc) 58%, transparent);
  transition:filter .12s}
.cg-row:hover .cg-bar{filter:brightness(1.06)}
.cg-fill{position:absolute;inset:0;background:var(--bc);opacity:.92}
.cg-rng{position:absolute;top:50%;right:7px;transform:translateY(-50%);font-family:var(--font-mono);font-size:9.5px;font-weight:700;z-index:1;white-space:nowrap;letter-spacing:.02em;color:var(--bt)}
.cg-bar.clipL{border-top-left-radius:0;border-bottom-left-radius:0;border-left:2px dashed color-mix(in srgb, var(--bc) 85%, transparent)}
.cg-bar.clipR{border-top-right-radius:0;border-bottom-right-radius:0;border-right:2px dashed color-mix(in srgb, var(--bc) 85%, transparent)}

.cg-done{--bc:#10B981;--bt:#04352A;--br:#065F46}
.cg-exec{--bc:#F59E0B;--bt:#3A2503;--br:#92400E}
.cg-late{--bc:#EF4444;--bt:#450A0A;--br:#991B1B}
.cg-idle{--bc:#94A3B8;--bt:#1B2432;--br:#475569}

.cg-ent{display:flex;align-items:center;justify-content:flex-end;padding:0 13px}
.cg-entp{font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--text-muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.cg-entp.late{color:#fff;background:#EF4444;padding:2px 7px;border-radius:99px}
.cg-entp.none{color:var(--text-subtle);font-weight:400}
.cg-foot{margin-top:10px;font-size:11.5px;color:var(--text-subtle);line-height:1.5;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.cg-foot b{color:var(--text-muted)}
.cg-foot-txt{flex:1 1 380px;min-width:0}

@media (max-width:700px){
  .cg-hrow,.cg-row{grid-template-columns:150px minmax(var(--tw),1fr) 66px}
  .cg-overlay{left:150px}
  .cg-legend{margin-left:0;width:100%}
  .fbar-sep{display:none}
  .cg-foot{gap:8px}
  .cg-mes{min-width:120px;font-size:12.5px}
  .cg-t{font-size:11.5px}
  .cg-av{width:21px;height:21px;font-size:8px}
  .cg-ent{padding:0 8px}
  .cg-scroll{max-height:clamp(280px,58vh,560px)}
}
@media (prefers-reduced-motion:reduce){
  .cg-row:hover .cg-bar{filter:none}
  .cg-arrow,.cg-tool,.cg-bar{transition:none}
}


@media (max-width:880px){
  .tl-row .frente-pill,.tl-row .dev-chip{display:none}
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;width:240px;transform:translateX(-100%);transition:transform .2s}
  .sidebar.open{transform:translateX(0)}
  .kpis{grid-template-columns:repeat(2,1fr)}
}
</style>

<script>
const DATA=JSON.parse(document.getElementById('roadmap-data').textContent);

const ALL_ITEMS=DATA.items;
// Lane derivada do Quimera (regra do Joao, 27/08/2026) -- auto-enforcada p/ nao depender de reconcile manual.
// finalizado OU em_validacao => concluido (lane entregue). cancelado => cancelado. Demais status preservam a lane curada.
// So vale p/ item com ticket; itens source:proposta nao tem quimera_key e ficam intactos.
const LANE_FROM_Q={backlog:'backlog',backlog_futuro:'adiado',fila_exec:'executando',em_andamento:'executando',bloqueado:'bloqueado',em_validacao:'entregue',finalizado:'entregue',cancelado:'cancelado'};
ALL_ITEMS.forEach(i=>{if(i.quimera_key&&LANE_FROM_Q[i.and_status])i.status=LANE_FROM_Q[i.and_status];});
// Reabertura: o negocio abriu ticket novo sobre item ja entregue. Se essa reabertura esta VIVA (fila/execucao/bloqueado)
// a lane volta a refletir a execucao. Reabertura cancelada ou ja re-concluida NAO mexe na lane -- fica so como historico.
// entrega_real e quimera_key originais sao preservados sempre: a entrega passada aconteceu e nao se apaga.
ALL_ITEMS.forEach(i=>{
  const l=LANE_FROM_Q[i.reaberto_status];
  if(l==='executando'||l==='bloqueado'){i.status=l;i.reaberto_vivo=true;}
  else if((l==='adiado'||l==='backlog')&&i.status!=='entregue')i.status=l;   // reabertura viva mas PARADA (backlog/backlog_futuro): revive item cancelado p/ a lane do ticket novo; item entregue nao regride
  else if(l&&!i.quimera_key)i.status=l;   // reabertura encerrada em item SEM ticket proprio: ela e o unico sinal de status
  if(i.quimera_key||i.reaberto_key)i.executando=(i.status==='executando'||i.status==='bloqueado');
});
const ITEMS=ALL_ITEMS.slice();   // roadmap Torre+Quimera (overview/board/timeline)

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

// pipeline = a lane resolvida pelo Quimera (executando/bloqueado). Ancorar na lane, e nao no and_status cru,
// Regra do negocio: fila_exec/em_andamento => executando ; bloqueado => bloqueado ; finalizado/em_validacao => entregue (concluido) ; cancelado => cancelado.
// O mapa cobre TODOS os status do Quimera: se faltar um, a lane do item fica presa no valor antigo quando o ticket sai de um status mapeado.
// backlog nao infla o pipeline porque emAndamentoQ le a LANE resolvida (executando/bloqueado), nao o and_status cru.
function emAndamentoQ(it){return it.status==='executando'||it.status==='bloqueado';}
// atrasado E já no pipeline do Quimera — recebe sinalização combinada na timeline
function isAtrasadoExec(it){return isAtrasado(it) && emAndamentoQ(it);}

/* donut */
function donut(segs,size){
  size=size||116;const r=size/2,inner=r*0.62;const total=segs.reduce((a,s)=>a+s.value,0)||1;let acc=0;
  const paths=segs.map(s=>{const frac=s.value/total;if(frac<=0)return'';const a0=acc*2*Math.PI-Math.PI/2;acc+=frac;const a1=acc*2*Math.PI-Math.PI/2;const lg=frac>0.5?1:0;
    const x0=r+r*Math.cos(a0),y0=r+r*Math.sin(a0),x1=r+r*Math.cos(a1),y1=r+r*Math.sin(a1);
    const xi0=r+inner*Math.cos(a1),yi0=r+inner*Math.sin(a1),xi1=r+inner*Math.cos(a0),yi1=r+inner*Math.sin(a0);
    return `<path d="M${x0} ${y0} A${r} ${r} 0 ${lg} 1 ${x1} ${y1} L${xi0} ${yi0} A${inner} ${inner} 0 ${lg} 0 ${xi1} ${yi1} Z" fill="${s.color}"/>`;}).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex:none">${paths}
    <text x="${r}" y="${r-2}" text-anchor="middle" font-family="var(--font-mono)" font-size="21" font-weight="700" fill="var(--text)">${total}</text>
    <text x="${r}" y="${r+13}" text-anchor="middle" font-size="9" fill="var(--text-subtle)">itens</text></svg>`;
}
function legend(segs){return `<div class="legend">`+segs.filter(s=>s.value>0).map(s=>`<div class="row"><span class="sw" style="background:${s.color}"></span><span class="ll">${esc(s.label)}</span><span class="lv">${s.value}</span></div>`).join('')+`</div>`;}
function bars(rows,max,wide){max=max||Math.max(1,...rows.map(r=>r.value));return `<div class="bars">`+rows.map(r=>`<div class="bar-row${wide?' wide':''}"><span class="bl">${esc(r.label)}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.round(r.value/max*100)}%;background:${r.color}"></div></div><span class="bv">${r.value}</span></div>`).join('')+`</div>`;}

  const m={};items.forEach(i=>{const k=(i[field]||'').slice(0,7);if(!k)return;(m[k]=m[k]||[]).push(i);});
  return Object.keys(m).sort().map(k=>[k,m[k].sort((a,b)=>(a[field]).localeCompare(b[field]))]);
}

/* ── modo Lista — visibilidade total + destaque de atrasados ── */

/* ── modo Gantt — barras derivadas + filtros ── */
function ganttDates(it){
  // reabertura VIVA: a barra mostra o retrabalho de agora, nao a entrega antiga
  if(it.reaberto_vivo){
    const ini=it.reaberto_inicio||it.prev_inicio||TODAY;
    const fim=(it.prev_entrega&&it.prev_entrega>=ini)?it.prev_entrega:(TODAY>ini?TODAY:ini);
    return {start:ini,end:fim,kind:'live'};
  }
  // reabertura JA CONCLUIDA: a barra cobre a janela da reabertura (1a entrega -> reentrega),
  // nao o vao inteiro desde o inicio original, que daria uma barra de meses sem trabalho contínuo.
  if(it.entrega_original&&it.entrega_real)return {start:it.reaberto_inicio||it.entrega_original,end:it.entrega_real,kind:'done'};
  // entregue: janela real de ponta a ponta
  if(it.entrega_real)return {start:it.inicio_real||it.entrega_real,end:it.entrega_real,kind:'done'};
  // em curso: comeca no INICIO REAL. Termina na previsao; se a previsao ja passou, estica ate hoje
  // (a barra precisa cobrir o tempo que a demanda esta rodando, senao fim < inicio e a barra some).
  if(it.inicio_real){
    const fim=(it.prev_entrega&&it.prev_entrega>=it.inicio_real)?it.prev_entrega:(TODAY>it.inicio_real?TODAY:it.inicio_real);
    return {start:it.inicio_real,end:fim,kind:'live'};
  }
  // nao comecou: janela prevista
  if(it.prev_inicio&&it.prev_entrega)return {start:it.prev_inicio,end:it.prev_entrega,kind:'plan'};
  if(it.prev_entrega)return {start:it.prev_entrega,end:it.prev_entrega,kind:'ms'};
  if(it.prev_inicio)return {start:it.prev_inicio,end:it.prev_inicio,kind:'ms'};
  return null;
}
function tlFiltered(){
  let a=ITEMS.slice();
  if(tlF.status.size)a=a.filter(i=>tlF.status.has(i.status));
  if(tlF.frentes.size)a=a.filter(i=>tlF.frentes.has(i.frente));
  if(tlF.devs.size)a=a.filter(i=>i.dev&&tlF.devs.has(i.dev));
  if(tlF.foraq)a=a.filter(i=>!i.quimera_key);
  if(tlF.atrasados)a=a.filter(isAtrasado);
  if(tlF.mesDe||tlF.mesAte)a=a.filter(i=>{const d=ganttDates(i);if(!d)return false;const s=d.start.slice(0,7),e=d.end.slice(0,7);
    if(tlF.mesDe&&e<tlF.mesDe)return false;if(tlF.mesAte&&s>tlF.mesAte)return false;return true;});
  return a;
}
function allGanttMonths(){
  let min=null,max=null;ITEMS.forEach(i=>{const d=ganttDates(i);if(!d)return;if(!min||d.start<min)min=d.start;if(!max||d.end>max)max=d.end;});
  if(!min)return [];const a=[];let cur=new Date(min.slice(0,7)+'-01T00:00:00');const end=new Date(max.slice(0,7)+'-01T00:00:00');
  while(cur<=end){a.push(cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0'));cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);}
  return a;
}
function ganttFilterBar(){
  const stOpts=STATUS_ORDER.map(s=>({val:s,label:STATUS_LABELS[s],color:STATUS_COLOR[s]}));

    `<button class="fchip-atraso ${tlF.atrasados?'on':''}" id="tlatraso">⚠ Só atrasados</button>`+
    `<span class="tl-datefilter">De <select id="tlmesde"><option value="">—</option>${monthOpts}</select> até <select id="tlmesate"><option value="">—</option>${monthOpts}</select></span>`+
    (active?`<button class="clr" id="tlclear">limpar</button>`:'')+

function paintGantt(){
  const ctl=document.getElementById('gctl');if(ctl)ctl.innerHTML=ganttCtl();   // so o grupo de controles: nao mexe nos dropdowns abertos
  const el=document.getElementById('tlchart');if(!el)return;
  el.innerHTML=renderGanttChart(tlFiltered());
  if(!gCentered){gCentered=true;gCenter(TODAY);}
}
let gCentered=false;
/* ===== Cronograma — Gantt por dia =====
   Janela: sem filtro de mês = mês navegado (default = mês de TODAY). Com filtro de mês = o intervalo inteiro,
   com scroll horizontal DENTRO do componente (a página nunca rola de lado).
   Cores: verde = concluído · amarelo = em andamento · vermelho = atrasado ou bloqueado · cinza = não iniciado.
   Sem percentual de conclusão por tarefa (decisão do João, 04/09/2026): o Quimera não tem campo de progresso,
   então a barra mostra só o intervalo de datas e o status pela cor. */
let gMes=TODAY.slice(0,7);
/* zoom: null = automatico (encaixa a janela na largura disponivel). Um zoom manual vale ate a janela mudar. */
let gZoom=null,gWKey='';
const G_ZMIN=16,G_ZMAX=68;
function gAvailW(){const el=document.getElementById('tlchart');const w=el?el.clientWidth:1040;
  const lbl=window.innerWidth<=700?150:250;return Math.max(240,w-lbl-86-14);}
function gAutoDW(n){return Math.max(G_ZMIN,Math.min(G_ZMAX,Math.floor(gAvailW()/Math.max(1,n))));}
function gNav(delta){const p=gMes.split('-');const d=new Date(+p[0],+p[1]-1+delta,1);
  gMes=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');paintGantt();}
function gHoje(){gMes=TODAY.slice(0,7);paintGantt();gCenter(TODAY);}
function gZ(delta){const D=gDays(gWin());const cur=gZoom||gAutoDW(D.n);
  gZoom=Math.max(G_ZMIN,Math.min(G_ZMAX,cur+delta));paintGantt();}
function gAuto(){gZoom=null;paintGantt();}

/* janela = filtro de mês (se houver) ou mês navegado */
function gWin(){
  if(tlF.mesDe||tlF.mesAte){
    const a=tlF.mesDe||tlF.mesAte,b=tlF.mesAte||tlF.mesDe;
    return a<=b?{from:a,to:b,filt:true}:{from:b,to:a,filt:true};
  }
  return {from:gMes,to:gMes,filt:false};
}
function gDays(w){
  const pf=w.from.split('-'),pt=w.to.split('-');
  const first=new Date(+pf[0],+pf[1]-1,1),last=new Date(+pt[0],+pt[1],0);
  return {first:first,last:last,n:Math.round((last-first)/86400000)+1};
}
const gIso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

function gState(it){
  if(it.status==='entregue')return 'done';
  if(it.status==='bloqueado')return 'late';
  if(isAtrasado(it))return 'late';
  if(it.status==='executando')return 'exec';
  return 'idle';
}
function gAvatar(dev){
  if(!dev)return '<span class="cg-av" style="--av:#94A3B8">--</span>';
  const w=String(dev).trim().split(/\s+/);
  const ini=(w.length>1?w[0][0]+w[1][0]:w[0].slice(0,2)).toUpperCase();
  return `<span class="cg-av" style="--av:${DEV_COLOR[dev]||'#94A3B8'}" title="${esc(dev)}">${esc(ini)}</span>`;
}
function gEntrega(it){return it.entrega_real||it.prev_entrega||'';}
/* centraliza uma data na viewport do componente */
function gCenter(iso){
  const s=document.querySelector('.cg-scroll');if(!s)return;
  const w=gWin(),D=gDays(w);const d=new Date(iso+'T00:00:00');
  if(d<D.first||d>D.last){s.scrollLeft=0;return;}
  const idx=Math.round((d-D.first)/86400000);
  const lbl=window.innerWidth<=700?150:250;
  s.scrollLeft=Math.max(0,idx*gZoom-(s.clientWidth-lbl)/2);
}

/* controles do Gantt (mes, periodo, zoom) — vivem DENTRO da barra de filtros, em linha */
function ganttCtl(){
  const w=gWin(),D=gDays(w),nDays=D.n;
  const mStart=gIso(D.first),mEnd=gIso(D.last);
  const janela=w.filt?(w.from===w.to?monthLabel(w.from):monthLabel(w.from)+' \u2192 '+monthLabel(w.to)):monthLabel(gMes);
  let h='';
  if(w.filt){
    h+=`<span class="cg-mes cg-mes-lock" title="A janela vem do filtro De/até desta mesma barra">${esc(janela)}</span>`;
  }else{
    h+=`<button class="cg-arrow" onclick="gNav(-1)" title="Mês anterior" aria-label="Mês anterior">&lsaquo;</button>`+
       `<button class="cg-mes" onclick="gHoje()" title="Voltar para o mês de hoje">${esc(janela)}</button>`+
       `<button class="cg-arrow" onclick="gNav(1)" title="Mês seguinte" aria-label="Mês seguinte">&rsaquo;</button>`;
  }
  h+=`<span class="cg-periodo"><span class="cg-pval">${fmtd(mStart)}/${mStart.slice(0,4)}</span><span class="cg-pto">até</span><span class="cg-pval">${fmtd(mEnd)}/${mEnd.slice(0,4)}</span><span class="cg-ndays">${nDays} dias</span></span>`;
  h+=`<button class="cg-tool" onclick="gZ(-6)" title="Menos zoom" aria-label="Menos zoom">&minus;</button>`+
     `<button class="cg-tool" onclick="gZ(6)" title="Mais zoom" aria-label="Mais zoom">+</button>`+
     `<button class="cg-tool wide${gZoom?'':' on'}" onclick="gAuto()" title="Encaixar a janela inteira na largura disponível">Auto</button>`+
     `<button class="cg-tool wide" onclick="gCenter(TODAY)" title="Rolar até hoje">Hoje</button>`;
  return h;
}

function renderGanttChart(items){
  const w=gWin(),D=gDays(w),nDays=D.n;
  const wkey=w.from+'|'+w.to;
  if(gWKey!==wkey){gWKey=wkey;gZoom=null;}   // janela mudou: volta ao zoom automatico
  const DW=gZoom||gAutoDW(nDays);
  const mStart=gIso(D.first),mEnd=gIso(D.last);
  const all=items.map(i=>({it:i,d:ganttDates(i)}));
  const rows=all.filter(x=>x.d&&x.d.start<=mEnd&&x.d.end>=mStart)
                .sort((a,b)=>a.d.start.localeCompare(b.d.start)||a.it.id.localeCompare(b.it.id));
  const fora=all.filter(x=>x.d&&!(x.d.start<=mEnd&&x.d.end>=mStart)).length;
  const nodate=items.filter(i=>!ganttDates(i));
  const WD=['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];
  const idxOf=s=>{const d=new Date(s+'T00:00:00');
    if(d<D.first)return 0;if(d>D.last)return nDays-1;return Math.round((d-D.first)/86400000);};
  const janela=w.filt?(w.from===w.to?monthLabel(w.from):monthLabel(w.from)+' → '+monthLabel(w.to)):monthLabel(gMes);

  let h='';
  if(!rows.length){
    h+=`<div class="cg-wrap"><div class="gantt-empty">Nenhuma demanda com data em ${esc(janela)}.${fora?` ${fora} ${fora===1?'item está':'itens estão'} fora desta janela — ${w.filt?'ajuste o filtro de mês':'use as setas'}.`:''}</div></div>`;
    if(nodate.length)h+=ganttNodateBlock(nodate);
    return h;
  }

  /* faixas de mês + células de dia */
  let mrow='',drow='';
  let cur=new Date(D.first.getFullYear(),D.first.getMonth(),1);
  while(cur<=D.last){
    const ms=new Date(Math.max(cur,D.first)),me=new Date(Math.min(new Date(cur.getFullYear(),cur.getMonth()+1,0),D.last));
    const span=Math.round((me-ms)/86400000)+1;
    mrow+=`<div class="cg-mband" style="width:${span*DW}px">${monthLabel(cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0'))}</div>`;
    cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);
  }
  for(let k=0;k<nDays;k++){
    const dd=new Date(D.first.getFullYear(),D.first.getMonth(),D.first.getDate()+k);
    const wd=dd.getDay(),we=(wd===0||wd===6),isT=gIso(dd)===TODAY;
    drow+=`<div class="cg-d${we?' we':''}${isT?' today':''}" style="width:${DW}px">${DW>=30?`<span class="cg-wd">${WD[wd]}</span>`:''}<span class="cg-dn">${dd.getDate()}</span></div>`;
  }

  /* overlay de fundo: fins de semana + linha de hoje, desenhado UMA vez atrás de todas as linhas */
  let bands='';
  for(let k=0;k<nDays;k++){
    const dd=new Date(D.first.getFullYear(),D.first.getMonth(),D.first.getDate()+k),wd=dd.getDay();
    if(wd===0||wd===6)bands+=`<span class="cg-we-band" style="left:${k*DW}px;width:${DW}px"></span>`;
  }
  const tIn=(TODAY>=mStart&&TODAY<=mEnd);
  const nowLine=tIn?`<span class="cg-now" style="left:${(idxOf(TODAY)+0.5)*DW}px"></span>`:'';

  const trackW=nDays*DW;
  h+=`<div class="cg-wrap"><div class="cg-scroll"><div class="cg-grid" style="--dw:${DW}px;--tw:${trackW}px">`;
  h+=`<div class="cg-hrow"><div class="cg-cell cg-hlbl">Tarefa</div>
      <div class="cg-hdays"><div class="cg-mrow">${mrow}</div><div class="cg-drow">${drow}</div></div>
      <div class="cg-cell cg-hent">Entrega</div></div>`;
  h+=`<div class="cg-body"><div class="cg-overlay" style="width:${trackW}px;background-size:${DW}px 100%">${bands}${nowLine}</div>`;
  rows.forEach(({it,d})=>{
    const f=FRENTES[it.frente];
    const st=gState(it);
    const a=idxOf(d.start),b=idxOf(d.end);
    const left=a*DW,bw=Math.max(DW,(b-a+1)*DW);
    const clipL=d.start<mStart,clipR=d.end>mEnd;
    const ent=gEntrega(it);const entVencida=!!ent&&ent<TODAY&&it.status!=='entregue';
    const rng=d.start===d.end?fmtd(d.start):`${fmtd(d.start)}–${fmtd(d.end)}`;
    const tip=`${it.id} · ${it.title} · ${rng} · ${STATUS_LABELS[it.status]}`;
    const showRng=bw>=112;
    h+=`<div class="cg-row" onclick="openItem('${it.id}')" tabindex="0" onkeydown="if(event.key==='Enter')openItem('${it.id}')">
      <div class="cg-cell cg-lbl" title="${esc(it.title)}">${gAvatar(it.dev)}<span class="cg-txt"><span class="cg-t">${esc(it.title)}</span><span class="cg-s">${it.id} · ${esc(f?f.label:'')}${it.reaberto_vivo?' · <b>reaberto</b>':''}</span></span></div>
      <div class="cg-track">
        <div class="cg-bar cg-${st}${clipL?' clipL':''}${clipR?' clipR':''}" style="left:${left}px;width:${bw}px" title="${esc(tip)}">
          <span class="cg-fill"></span>
          ${showRng?`<span class="cg-rng">${rng}</span>`:''}
        </div>
      </div>
      <div class="cg-cell cg-ent">${ent?`<span class="cg-entp${entVencida?' late':''}" title="${entVencida?'entrega prevista vencida':(it.status==='entregue'?'entrega real':'entrega prevista')}">${fmtd(ent)}</span>`:'<span class="cg-entp none">—</span>'}</div>
    </div>`;
  });
  h+=`</div></div></div></div>`;
  h+=`<div class="cg-foot"><span class="cg-foot-txt"><b>${rows.length}</b> ${rows.length===1?'demanda':'demandas'} em ${esc(janela)}${fora?` · ${fora} fora desta janela`:''}${nodate.length?` · ${nodate.length} sem data`:''} — o intervalo mostra início e entrega (real quando concluída, prevista quando não).</span>
  <span class="cg-legend">
    <span><i style="background:#10B981"></i>Concluído</span>
    <span><i style="background:#F59E0B"></i>Em andamento</span>
    <span><i style="background:#EF4444"></i>Atrasado</span>
    <span><i style="background:#94A3B8"></i>Não iniciado</span>
  </span></div>`;
  if(nodate.length)h+=ganttNodateBlock(nodate);
  return h;
}

function ganttNodateBlock(items){return `<div class="section-title" style="margin-top:18px">Sem data <span class="extra">${items.length} — não plotáveis no Gantt</span></div><div class="tl">`+tlMonthBlock('Itens sem nenhuma data',items,'prev_entrega','nodate')+`</div>`;}

/* drawer */
function openItem(id){
  const it=ALL_ITEMS.find(i=>i.id===id);if(!it)return;const f=FRENTES[it.frente];
  const d=document.getElementById('drawer');
  d.innerHTML=`<div class="drawer-head"><div><div class="dh-id">${it.id}</div><div class="dh-title">${esc(it.title)}</div></div><button class="drawer-close" onclick="closeDrawer()">×</button></div>
  <div class="drawer-body">
    <div class="d-badges"><span class="pbadge ${it.prioridade}">${PRIO_PCODE[it.prioridade]} · ${PRIO_LABELS[it.prioridade]}</span>
      <span class="pill status-pill ${it.status}">${STATUS_ICON[it.status]}${STATUS_LABELS[it.status]}</span>
      <span class="tipo ${it.tipo}">${TIPO_LABELS[it.tipo]}</span>
      ${it.executando?'<span class="exec-pill">▶ Executando</span>':''}
      ${it.reaberto_vivo?'<span class="reab-pill">↻ reaberto</span>':''}
      ${it.refino_tag&&REFINO[it.refino_tag]?`<span class="refino-pill" style="background:${REFINO[it.refino_tag].color}">${esc(REFINO[it.refino_tag].label)}</span>`:''}
      ${it.dep?'<span class="dep-tag">aguardando dependência</span>':''}</div>
    <div class="d-meta">
      <div><div class="mlab">Frente</div><div class="mval"><span class="frente-pill"><span class="d" style="background:${f.color}"></span>${esc(f.label)}</span></div></div>
      <div><div class="mlab">Responsável</div><div class="mval">${it.dev?`<span class="dev-chip" style="--dc:${DEV_COLOR[it.dev]}"><span class="d"></span>${esc(it.dev)}</span>`:'—'}</div></div>
      <div><div class="mlab">Esforço</div><div class="mval">${it.esforco||'—'}</div></div>
      <div><div class="mlab">Menu de origem</div><div class="mval">${esc(it.menu)}</div></div>
      ${it.quimera_key?`<div><div class="mlab">Quimera</div><div class="mval">#${esc(it.quimera_key)} · <span class="status-pill ${it.and_status}" style="background:${QCOLOR[it.and_status]||'#64748B'};color:#fff">${esc(QLABEL[it.and_status]||it.and_status)}</span></div></div>`:`<div><div class="mlab">Quimera</div><div class="mval"><span class="fora-q">✕ Fora do Quimera</span></div></div>`}
      ${it.entrega_original?`<div><div class="mlab">Entrega original</div><div class="mval"><span style="font-family:var(--font-mono);font-weight:700">${fmtd(it.entrega_original)}</span> <span style="color:var(--text-subtle);font-size:11px">— reaberta depois</span></div></div>`:''}
      ${it.reaberto_key?`<div><div class="mlab">Reaberto por</div><div class="mval">#${esc(it.reaberto_key)} · <span class="status-pill ${it.reaberto_status}" style="background:${QCOLOR[it.reaberto_status]||'#64748B'};color:#fff">${esc(QLABEL[it.reaberto_status]||it.reaberto_status)}</span></div></div>`:''}
      ${it.entrega_real?`<div><div class="mlab">Entrega real</div><div class="mval"><span style="font-family:var(--font-mono);font-weight:700;color:#10B981">✓ ${esc(it.entrega_real)}</span>${it.inicio_real?` · início ${esc(it.inicio_real)}`:''}</div></div>`:(it.prev_entrega?`<div><div class="mlab">Previsão de entrega</div><div class="mval"><span style="font-family:var(--font-mono);font-weight:700;color:var(--finza-blue)">${esc(it.prev_entrega)}</span></div></div>`:'')}
    </div>
    <div class="d-block"><h4>Descrição refinada</h4><div class="d-desc">${esc(it.desc)}</div></div>
    ${it.obs_refino?`<div class="d-block"><h4>Observação de refinamento</h4><div class="d-obs">${esc(it.obs_refino)}</div></div>`:''}
    ${it.nota_negocio?`<div class="d-block"><div class="d-nota"><div class="nl">Depende do negócio</div>${esc(it.nota_negocio)}</div></div>`:''}
  </div>`;
  d.classList.add('open');document.getElementById('overlay').classList.add('open');
}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('overlay').classList.remove('open');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});
document.addEventListener('click',e=>{if(!e.target.closest('.fdrop'))document.querySelectorAll('.fdrop.open').forEach(x=>x.classList.remove('open'));});

render('overview');
</script>
</body>
