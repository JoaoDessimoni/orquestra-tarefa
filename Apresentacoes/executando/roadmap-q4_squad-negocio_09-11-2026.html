2200916<br><br>Protocolo: 2408261836491 - Telefone: 95981014558<br>Protocolo: 2408265354788 - Telefone: 95981014558<\/p><img class=\"kb-img\" src=\"attachment://fa09e62b-cb3d-4fc0-a264-f3d7d2fdfad4/1787755897187_image.png\" alt=\"image.png\"><img class=\"kb-img\" src=\"attachment://fa09e62b-cb3d-4fc0-a264-f3d7d2fdfad4/1787755897187_image.png\" alt=\"image.png\"><p><\/p>","edd":null,"c":[{"a":"João Pedro","e":null,"dt":"2026-08-28T14:11:30.218335+00:00","x":"Conforme mencionado no FUP já foi corrigido e identificado as oportunidades onde ocorriam essas situações entre a diferença de canais por exemplo IDEAL -> IDEAL FINANCEIRO, se identificado nos casos entrem em contato comigo por gentileza","i":false}],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-08-26T15:21:28.867901+00:00","por":"João Pedro"},{"de":"fila_exec","para":"em_andamento","dt":"2026-08-26T15:21:36.362414+00:00","por":"João Pedro"},{"de":"em_andamento","para":"em_validacao","dt":"2026-08-28T14:11:56.340353+00:00","por":"João Pedro"},{"de":"em_validacao","para":"finalizado","dt":"2026-09-01T12:03:30.366921+00:00","por":"Solicitante (Quimera)"}]},"6985":{"t":"Continuação da demanda de ID 17 | Roadmap Torre de Controle","s":"finalizado","d":"<p>Boa tarde Senhores(as),<\/p><p><\/p><p>Peço que verifiquem a aplicação do filtro de período na aba métricas ele não está aplicando pra todo dashboard dessa aba o que invalida a demanda 17 do roadmap.<\/p><p><\/p><p>Grato J<\/p>","edd":null,"c":[{"a":"Marcos","e":null,"dt":"2026-09-08T21:17:54.910565+00:00","x":"Verificado. O filtro de período **está** sendo aplicado a todos os painéis da aba Métricas.\n\nOnde conferir: Torre de Controle > IA > agente > Métricas. Troque o período (7d / 30d / 90d) e observe: Acurácia, Protocolos com mensagens, Mensagens, Média por protocolo, Transferidos para humano, Desfechos por protocolo, Eventos de transferência, Atividade de mensagens, Ciclo de vida (movimentação no período), Tags, Funil (Conversão da coorte observada e Passagens no período), Sentimento e Chamadas A2A — todos mudam.\n\nTecnicamente a aba faz **uma única consulta** para montar a tela inteira, e o período vai nela. Não há como um painel ficar de fora.\n\nDois blocos não mudam com o período, **de propósito**, e cada um diz isso no próprio cabeçalho: **\"Fotografia atual — todos os protocolos\"** e a aba **\"Estado atual\"** do funil, que aparece com a etiqueta \"fotografia atual (sem filtro de período)\". Eles respondem \"como está agora\" — recortar por janela tiraria o sentido deles.\n\nO que estava de fato errado, e foi corrigido:\n\n1) Quando uma verificação de consistência reprovava, o número ia para \"—\" com um aviso genérico. Agora a tela diz **qual** verificação falhou, com a mensagem do servidor e uma tabela Esperado / Observado / Diferença.\n\n2) O selo \"Parcial\" não dizia por quê. Agora o tooltip aponta a causa exata (seção em erro, invariante reprovada, ou recorte restrito a agentes externos).\n\n3) Novo painel \"Detalhes técnicos e verificações\" no fim da tela, com procedência, cobertura, contadores de qualidade e status por seção.\n\n4) **Dois rótulos afirmavam uma data de recorte que o sistema não usa** — e é provável que sejam a origem da sensação de que o filtro não aplicava. A Acurácia dizia recortar por \"data da transição de status\" quando na verdade recorta por \"data da mensagem\", e o Sentimento dizia contar mensagens quando conta registros de interação. Os dois foram corrigidos.\n\n5) O seletor chamava-se \"Agrupamento das tags\" mas governa 4 séries (Atividade, Transferências, Tags e Chamadas A2A). Virou \"Agrupamento temporal\".\n\n6) O Sentimento aparece truncado em janelas acima de 30 dias porque a base dele tem 30 dias de retenção. A tela agora avisa isso no rodapé da seção.\n","i":false}],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-09-01T19:14:36.61103+00:00","por":"João Vinícius"},{"de":"fila_exec","para":"em_andamento","dt":"2026-09-04T14:16:44.763095+00:00","por":"Marcos"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-08T21:18:14.733812+00:00","por":"Automático (Quimera)"},{"de":"em_validacao","para":"finalizado","dt":"2026-09-10T20:29:32.275384+00:00","por":"Sistema/Negócio"}]},"6986":{"t":"Continuação da demanda de ID 48 | Roadmap Torre de Controle","s":"finalizado","d":"<p>Boa tarde Senhores(as),<\/p><p><\/p><p>Na aba filtros não é possível desativar ou ativar um filtro conforme solicitado na demanda 48 do roadmap. Além de desativar ou ativar o filtro teria que ter o filtro no topo da página pra marcar os ativos, desativos ou todos.<\/p><p><\/p><p>Grato J<\/p>","edd":null,"c":[{"a":"Marcos","e":null,"dt":"2026-09-08T21:37:07.752092+00:00","x":"Entregue e já em produção.\n\nOnde validar: Torre de Controle > Filtros.\n\n1) No topo da página, ao lado da busca, o seletor **Ativos | Inativos | Todos**. Ele abre em \"Ativos\".\n2) Para desativar: na visão de cartões, a chave Ativo/Inativo no próprio cartão. Na visão de lista, o menu da linha > \"Desativar\".\n3) O filtro desativado ganha o selo \"Inativo\" e sai dos seletores das outras telas — régua, carteira, regra de blocklist, dashboard.\n4) Para reativar: escolha \"Inativos\" no topo e ligue a chave de volta.\n\nUma coisa importante, e é de propósito: **desativar esconde o filtro de quem está escolhendo um filtro novo — não desliga nada que já está rodando.** Régua, carteira e regra de blocklist que já usam aquele filtro continuam funcionando igual, e o nome dele continua aparecendo onde já está vinculado. Se desativar mudasse quem é cobrado, organizar a biblioteca de filtros numa sexta mudaria em silêncio o disparo do sábado.\n\nDois detalhes que valem saber:\n\n- O recorte Ativos/Inativos/Todos não fica salvo ao recarregar a página — volta para \"Ativos\".\n- Não há ação em massa: a ativação/desativação é um filtro por vez.\n\nSobre o estado atual da base: hoje as três organizações têm todos os filtros ativos (60 na Blips, 56 na Finza, 40 no Portal Formalização), então ao abrir a aba você vê tudo em \"Ativos\" e a lista de \"Inativos\" começa vazia — isso é o esperado, não é erro.","i":false}],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-09-02T14:41:34.896753+00:00","por":"João Vinícius"},{"de":"fila_exec","para":"em_andamento","dt":"2026-09-04T14:16:40.226534+00:00","por":"Marcos"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-08T21:37:21.696738+00:00","por":"Automático (Quimera)"},{"de":"em_validacao","para":"finalizado","dt":"2026-09-10T20:30:11.239472+00:00","por":"Sistema/Negócio"}]},"6989":{"t":"Transferência para o SAC","s":"finalizado","d":"<p>Primeiramente boa tarde a todos,<\/p><p><\/p><p>A intenção deste chamado é para informar sobre uma transferência incorreta da Valentina para o SAC quando deveria ter sido para o departamento e Cobrança. Segue abaixo o protocolo que leva direto ao atendimento:<\/p><p><span style=\"color: rgb(179, 179, 179); font-size: 10.4px;\"><strong>2608265496439<\/strong><\/span><br><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://conversas.hyperflow.global/all-chats/all?sort=-createdAt&amp;search=2608265496439\">https://conversas.hyperflow.global/all-chats/all?sort=-createdAt&amp;search=2608265496439<\/a><\/p>","edd":null,"c":[{"a":"João Vinícius","e":null,"dt":"2026-08-28T14:11:56.986325+00:00","x":"@João Pedro da Silva Neto da uma olhada se não foi no agente de transferencia, se o ajuste for lá passa pro @Carlos Magno Caetano Silva , eu alinho com o @Saulo Jordão .","i":true},{"a":"João Pedro","e":null,"dt":"2026-08-28T14:13:15.194923+00:00","x":"Vai ser prompt, o motivo de cair no SAC é porque a Valentina não questionou CNPJ, apenas transferiu por causa da solicitação de desconto. Como não tinha a informação o agente de transferência não consegue ver o débito e encaminha para o SAC, comportamento esperado.","i":true}],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-08-28T14:10:55.62165+00:00","por":"João Vinícius"},{"de":"fila_exec","para":"em_andamento","dt":"2026-09-01T16:39:43.750125+00:00","por":"João Pedro"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-02T19:29:02.792813+00:00","por":"João Pedro"},{"de":"em_validacao","para":"finalizado","dt":"2026-09-03T12:44:40.641948+00:00","por":"Solicitante (Quimera)"}]},"6990":{"t":"Continuação da demanda de ID 7 | Roadmap Torre de Controle","s":"finalizado","d":"<p>Boa tarde Senhores(as),<\/p><p><\/p><p>Na aba campanha, monitoramento. Quando clicamos em uma campanha ela mostra ele relatório porém não mostra o relatório da campanha e sim de todo pipe que rodou exemplo no dia 26/08 queremos enxergar da campanha em questão.<\/p><p><\/p><img class=\"kb-img\" src=\"attachment://da445cc4-f473-4c32-b35c-6e98351683c5/1787771260584_image.png\" alt=\"image.png\"><p><\/p><p>Grato J<\/p>","edd":null,"c":[{"a":"Marcos","e":null,"dt":"2026-09-08T21:37:15.525554+00:00","x":"Entregue e já em produção. Vale retroativamente para todo o histórico — não precisa esperar execução nova.\n\nOnde validar: Torre de Controle > Campanhas > Monitoramento > clique em uma campanha.\n\n1) Pegue o lote de **26/08 às 07:30** (o do seu print) e abra as 7 campanhas dele, uma a uma. Os números agora são **diferentes entre si**. Antes as 7 mostravam os mesmos 6.880 / 4.931 / 1.722.\n2) Os três indicadores do topo — Contatos processados, Matches e Ações criadas — e o funil são **da campanha aberta**.\n3) Os números do lote continuam disponíveis, agora identificados: a caixa \"Execução em lote\" diz \"esta campanha foi 3 de 7 campanhas do lote\" e tem o botão \"Ver números do lote\".\n4) O bloco de exclusões mostra o motivo real de cada queda: trava do maior atraso, cadência, blocklist, dedup entre campanhas.\n\nO que estava errado: a lista de execuções tem uma linha por **campanha**, mas o relatório que abria puxava os números do **lote** — o agrupamento de todas as campanhas cujo horário bateu no mesmo minuto. Em 60 dias, nenhum lote da Blips teve uma campanha só: sempre de 2 a 7.\n\nDuas coisas seguem sendo do lote, porque não existem por campanha: **\"Títulos avaliados\"** e a **duração**. As duas ficam dentro da caixa \"Execução em lote\", identificadas como tal.\n\nUm rótulo mudou: **\"Após Dedup Int.\" virou \"Após travas do matching\"**. Ele atribuía à dedup por integração uma queda que é majoritariamente da trava do maior atraso — no lote de 26/08, 3.040 de 3.192.\n\nÚltima observação: a tabela de candidatos por campanha só existe por **48 horas** depois da execução. Em lotes antigos ela vem vazia e a tela agora avisa isso, em vez de deixar parecer que a campanha não avaliou ninguém.","i":false}],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-09-02T14:40:07.048859+00:00","por":"João Vinícius"},{"de":"fila_exec","para":"em_andamento","dt":"2026-09-02T17:12:11.553163+00:00","por":"Marcos"},{"de":"em_andamento","para":"fila_exec","dt":"2026-09-02T17:12:13.208442+00:00","por":"Marcos"},{"de":"fila_exec","para":"em_andamento","dt":"2026-09-04T14:16:41.43058+00:00","por":"Marcos"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-08T21:37:24.774951+00:00","por":"Automático (Quimera)"},{"de":"em_validacao","para":"finalizado","dt":"2026-09-10T20:37:04.192653+00:00","por":"Sistema/Negócio"}]},"6992":{"t":"Continuação da demanda de ID 5 | Roadmap Torre de Controle","s":"finalizado","d":"<p>Boa tarde Senhores(as),<\/p><p><\/p><p>Nesta demanda do roadmap está faltando adicionar sobre a fonte de dados, de onde vem, quais filtros e tratamentos são realizados na query pra compor os dash. <\/p><p><\/p><p>Grato J<\/p>","edd":null,"c":[{"a":"João Vinícius","e":null,"dt":"2026-09-01T18:21:01.26643+00:00","x":"@Marcos Rodrigues de Oliveira Júnior da uma melhorada na visão de fonte de dados dentro da documentação de negócio com visão de tabelas (entidades) e status (enums) , certifique-se de ter apenas tabelas relevantes ao negócio e nada mais, garantindo que o time da cobrança tenha o perfil com acessos corretos. ","i":true},{"a":"Marcos","e":null,"dt":"2026-09-04T01:43:42.895463+00:00","x":"Entregue e já em produção.\n\nOnde validar: Torre de Controle > Central de Documentação > Negócio > Dados > \"O Mapa dos Dados\".\n\nA página nova tem 11 seções e cobre o que foi pedido:\n\n- O relógio dos dados: quando cada carga roda e quanto tempo leva entre a origem e a tela.\n- As fontes, uma a uma: as 5 da Blips e as 3 da Finza, com o significado de negócio, o recorte e o volume de cada uma.\n- Filtros e tratamentos: o que cada consulta filtra e as 11 transformações entre a origem e a gravação.\n- O mapa completo: uma tabela com 67 linhas — tabela e campo no BigQuery, nome na consulta, significado, destino na Torre e quais fontes trazem.\n- Os status, um a um: os 7 vocabulários e os 48 valores que existem hoje.\n- Nativo x personalizado: 39 colunas próprias, 25 campos personalizados, 4 ligações.\n- O que a Torre calcula sozinha: atraso, aging, risco, valor em aberto, atribuição.\n- Do campo ao indicador: a cadeia dos 14 KPIs do Dashboard, do campo bruto até o número na tela.\n- Blips x Finza: o que uma organização recebe e a outra não.\n- De onde saiu esse número: as 8 dúvidas mais frequentes.\n\nTodo número da página foi apurado direto no banco de produção em 02/09/2026, não veio de documentação anterior.\n\nSobre o acesso do time de cobrança pedido no comentário: nada a fazer. Os cinco perfis (proprietário, administrador, gerente, operador e visualizador) já têm acesso ao pilar Negócio da Central de Documentação.","i":false}],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-09-01T18:21:03.401916+00:00","por":"João Vinícius"},{"de":"fila_exec","para":"em_andamento","dt":"2026-09-02T17:12:36.834193+00:00","por":"Marcos"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-04T01:44:49.667322+00:00","por":"Automático (Quimera)"},{"de":"em_validacao","para":"finalizado","dt":"2026-09-08T16:35:59.203522+00:00","por":"Sistema/Negócio"}]},"6995":{"t":"Continuação da demanda de ID 16 | Roadmap Torre de Controle","s":"finalizado","d":"<p>Boa tarde Senhores(as),<\/p><p><\/p><p>Os dados dessa demanda não estão batendo exemplo nessa print:<\/p><p>Aonde apresenta os dados de uma mesma tela com números diferentes.<\/p><img class=\"kb-img\" src=\"attachment://0e520a34-3e87-4417-8f27-50943f480799/1787771899434_image.png\" alt=\"image.png\"><p><\/p><p>Peço que corrijam por favor pra os números conversarem entre si dentro da torre.<\/p><p><\/p><p>Grato J<\/p>","edd":null,"c":[{"a":"Sistema/Negócio","e":null,"dt":"2026-09-08T16:47:14.119514+00:00","x":"Avaliando","i":false}],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-08-27T17:18:55.953605+00:00","por":"João Vinícius"},{"de":"fila_exec","para":"em_andamento","dt":"2026-08-27T19:16:43.793675+00:00","por":"Marcos"},{"de":"em_andamento","para":"em_validacao","dt":"2026-08-27T23:16:43.881325+00:00","por":"Marcos"},{"de":"em_validacao","para":"finalizado","dt":"2026-09-01T09:00:02.818341+00:00","por":"Automático (Quimera)"}]},"7045":{"t":"Filtro de RCS","s":"finalizado","d":"<p>Primeiramente, bom dia a todos.<\/p><p>A abertura deste chamado se deve à ausência de um filtro específico para RCS na aba <strong>Ações<\/strong> da Torre de Controle. Atualmente, é possível filtrar pelos demais tipos de integração, porém o RCS não está disponível entre as opções de filtro.<\/p><p>Solicitamos a correção desse ponto para que seja possível filtrar e acompanhar especificamente as ações realizadas via RCS, facilitando o monitoramento e a análise dessas integrações.<\/p><p><\/p>","edd":null,"c":[],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-08-27T16:33:45.290034+00:00","por":"João Vinícius"},{"de":"fila_exec","para":"em_andamento","dt":"2026-09-01T11:57:48.203031+00:00","por":"Leandro"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-02T22:18:06.942549+00:00","por":"João Vinícius"},{"de":"em_validacao","para":"finalizado","dt":"2026-09-03T12:44:24.448+00:00","por":"Solicitante (Quimera)"}]},"7085":{"t":"Criação de Template","s":"finalizado","d":"<p>Boa tarde Senhores(as),<\/p><p><\/p><p>Segue conforme solicitado Dessimoni:<\/p><p><\/p><img class=\"kb-img\" src=\"attachment://e0df32c0-2b69-4a4f-9885-87a679a82269/1787861605780_image.png\" alt=\"image.png\"><img class=\"kb-img\" src=\"attachment://e0df32c0-2b69-4a4f-9885-87a679a82269/1787861605780_image.png\" alt=\"image.png\"><p>Grato J<\/p><p><\/p>","edd":null,"c":[{"a":"João Vinícius","e":null,"dt":"2026-08-28T12:35:58.277532+00:00","x":"🔓 REGULARIZE SEU CONTRATO E VOLTE A USAR SEU EQUIPAMENTO!\n\nEntre em contato e saiba mais.\n","i":true},{"a":"João Pedro","e":null,"dt":"2026-08-28T14:20:50.345891+00:00","x":"Blips e Ideal já está aprovado e pode ser utilizado Finza segue pendente.","i":false},{"a":"Sistema/Negócio","e":null,"dt":"2026-09-02T13:23:04.374971+00:00","x":"[Solicitação de ajustes] No Hyper está 100% porém na Torre ficou pendente conforme solicitado na print que seria também ter a template na torre em todos os 6 números que temos. Peço que seja incluído para voltarmos a validação","i":false},{"a":"João Pedro","e":null,"dt":"2026-09-08T20:48:00.353606+00:00","x":"Os templates não estavam sendo atualizados dentro da torre de controle desde a criação do multi-org, feito alteração para que cada tenant tenha seus templates devidamente identificados de acordo com cada tenant\n","i":true},{"a":"Sistema/Negócio","e":null,"dt":"2026-09-10T14:47:44.763742+00:00","x":"[Solicitação de ajustes] .","i":false},{"a":"Sistema/Negócio","e":null,"dt":"2026-09-10T14:48:16.120308+00:00","x":"Não localizei a template consegue me orientar onde se localiza ou se de fato não está em produção?\n\n![image.png](attachment://e0df32c0-2b69-4a4f-9885-87a679a82269/1789051671660_cf81a5a6-e6cc-421b-a8b4-c32600d2cf98_image.png)\n","i":false},{"a":"João Pedro","e":null,"dt":"2026-09-10T18:47:00.038336+00:00","x":"Template: torre_tp_regularize_1, estava marcado como inativo já habilitei\n","i":false}],"h":[{"de":"backlog","para":"em_andamento","dt":"2026-08-28T12:36:27.99182+00:00","por":"João Vinícius"},{"de":"em_andamento","para":"em_validacao","dt":"2026-08-31T02:22:01.995569+00:00","por":"João Pedro"},{"de":"em_validacao","para":"em_andamento","dt":"2026-09-02T13:23:07.738813+00:00","por":"Sistema/Negócio"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-08T21:23:56.633504+00:00","por":"João Pedro"},{"de":"em_validacao","para":"em_andamento","dt":"2026-09-10T14:47:48.208443+00:00","por":"Sistema/Negócio"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-10T18:47:07.982855+00:00","por":"João Pedro"},{"de":"em_validacao","para":"finalizado","dt":"2026-09-10T20:07:32.49516+00:00","por":"Sistema/Negócio"}]},"7088":{"t":"Esperanza puxando errado parcelas - Leandro","s":"finalizado","d":"<p>Primeiramente boa tarde Leandro, <\/p><p><\/p><p>Conforme solicitado, a abertura deste card ocorre devido a um problema identificado hoje pela manhã em relação à Socorro, especificamente na integração com a Esperanza. Durante a consulta realizada pela Socorro à Esperanza, a IA não retornou corretamente as informações relacionadas ao contrato consultado.<br><br>Protocolo: <a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://conversas.hyperflow.global/all-chats/2708267770190\">https://conversas.hyperflow.global/all-chats/2708267770190<\/a><\/p>","edd":null,"c":[],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-08-28T12:41:16.905422+00:00","por":"João Vinícius"},{"de":"fila_exec","para":"em_andamento","dt":"2026-09-02T22:23:49.018245+00:00","por":"Leandro"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-03T13:32:05.913713+00:00","por":"Leandro"},{"de":"em_validacao","para":"finalizado","dt":"2026-09-03T14:14:58.107067+00:00","por":"Solicitante (Quimera)"}]},"7133":{"t":"Suspeita de falha no roteamento RCS","s":"finalizado","d":"<p>Boa tarde Senhores(as),<\/p><p><\/p><p>Peço que verifiquem o roteamento dos clientes que respondem o RCS enviado. Segue evidências:<\/p><p><\/p><p>Tenho esse protocolo do RCS que ficou travado não transferiu <strong>Protocolo:&nbsp;<\/strong>2808262184537<\/p><img class=\"kb-img\" src=\"attachment://bbfbf2bf-79e7-428e-8662-2939b9980613/1787930936604_image.png\" alt=\"image.png\"><p><\/p><p>Grato J<\/p>","edd":null,"c":[],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-08-28T15:50:23.877767+00:00","por":"João Pedro"},{"de":"fila_exec","para":"em_andamento","dt":"2026-09-01T14:01:27.13647+00:00","por":"João Pedro"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-01T15:13:40.991243+00:00","por":"João Pedro"},{"de":"em_validacao","para":"finalizado","dt":"2026-09-04T09:00:03.335466+00:00","por":"Automático (Quimera)"}]},"7134":{"t":"Agente de transferência intermediando [HUMANO] torre","s":"finalizado","d":"<p>Boa tarde Senhores(as)<\/p><p><\/p><p>Atualmente na torre de controle temos como exemplo o número da Blips: +55 34 9928-4199. E dentro da torre foi cadastrado o número 2x aonde um é [IA] e o outro [HUMANO] o que muda de um pro outro? Muda que quando o cliente responde um vai direto pra IA exemplo Esperanza e no HUMANO vai direto pro humano e atualmente está definido pra ir para o FIDC (departamento no qual não é mais utilizado).<\/p><p><\/p><p>Peço que façam o ajuste para que quando utilizarmos o [HUMANO] e o cliente responder seja enviado para a Agente de Transferência fazer o roteamento correto para o departamento analisando a situação do contrato e/ou contexto da resposta cliente assim como é feito na decisão atualmente quando passa pela [IA] e a Esperanza chama o agente de transferência pra rotear.<\/p><p><\/p><p>Grato J<\/p>","edd":null,"c":[{"a":"João Pedro","e":null,"dt":"2026-09-01T19:15:08.87551+00:00","x":"Quando o cliente entrar em contato e estiver numa régua 'HUMANO', vai passar pro agente de transferência onde ele será o responsável pelo roteamento desse cliente de acordo com as regras de departamento no STIA. Válido para atendimentos no WhatsApp e RCS. Em caso de falha nesse roteamento será utilizado o departamento COBRANÇA adicionando rótulo 'Transferência por Fallback [HUMANO]'","i":false},{"a":"Sistema/Negócio","e":null,"dt":"2026-09-08T19:03:29.038342+00:00","x":"J","i":false}],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-08-28T15:50:21.081552+00:00","por":"João Pedro"},{"de":"fila_exec","para":"em_andamento","dt":"2026-09-01T16:39:42.173119+00:00","por":"João Pedro"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-01T19:34:41.405533+00:00","por":"João Pedro"},{"de":"em_validacao","para":"finalizado","dt":"2026-09-04T09:00:03.17904+00:00","por":"Automático (Quimera)"}]},"7135":{"t":"Filtrar RCS pelo tipo de ações | Torre de Controle","s":"finalizado","d":"<p>Boa tarde Senhores(as),<\/p><p><\/p><p>Peço que seja acrescentado de forma dinâmica para que todo novo tipo de comunicação adicionado já seja uma opção de filtro.<\/p><p><\/p><img class=\"kb-img\" src=\"attachment://8881dda9-2e03-4de9-b76f-7524ac560155/1787931368113_image.png\" alt=\"image.png\"><p><\/p><p>Grato J<\/p><p><\/p>","edd":null,"c":[{"a":"Marcos","e":null,"dt":"2026-09-04T01:42:51.596121+00:00","x":"Entregue e já em produção.\n\nOnde validar: Torre de Controle > Ações.\n\n1) No filtro \"Tipo\", abra a lista. O RCS aparece como opção, junto com WhatsApp, E-mail, SMS, Voz, Webhook, Notificação e Negativação.\n2) Selecione RCS e confira a lista: as ações de RCS agora têm ícone e cor próprios. Antes elas vinham com um ícone genérico, o mesmo de \"outros\".\n\nSobre o pedido de ser dinâmico: a lista do filtro passou a ser montada a partir do catálogo de canais da Torre. Quando um canal novo for cadastrado, ele já entra no filtro automaticamente, e agora existe uma trava que impede um canal de entrar pela metade (sem nome ou sem ícone) — foi exatamente isso que aconteceu com o RCS.\n\nPara conferir há volume: 7.949 ações de RCS na Blips e 498 na Finza.","i":false}],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-09-01T19:08:46.671229+00:00","por":"João Vinícius"},{"de":"fila_exec","para":"em_andamento","dt":"2026-09-02T17:12:34.661758+00:00","por":"Marcos"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-04T01:44:23.461622+00:00","por":"Automático (Quimera)"},{"de":"em_validacao","para":"finalizado","dt":"2026-09-04T17:26:23.891494+00:00","por":"Sistema/Negócio"}]},"7136":{"t":"Permitir selecionar Template RCS para nova aba DISPAROS | Torre de Controle","s":"finalizado","d":"<p>Boa tarde Senhores(as),<\/p><p><\/p><p>Peço que seja adicionado a opção de selecionar a template do canal RCS pra conseguir configurar e disparar pela aba DISPAROS assim como é possível ao configurar ação dentro de RÉGUA/BROADCAST. <\/p><p><\/p><img class=\"kb-img\" src=\"attachment://0495e302-6c17-4ace-bac6-1c5ec8e8c05b/1787931529373_image.png\" alt=\"image.png\"><p><\/p><p>Grato J<\/p>","edd":null,"c":[{"a":"Marcos","e":null,"dt":"2026-09-04T01:42:55.386824+00:00","x":"Entregue e já em produção.\n\nOnde validar: Torre de Controle > Disparos.\n\n1) Escolha o tipo de ação RCS e a integração.\n2) Logo abaixo aparece o campo \"Template RCS (opcional)\", com o mesmo seletor que você já usa na Régua. Escolha o template.\n3) Siga o disparo normalmente. O botão \"Disparar\" libera com o template selecionado, mesmo sem digitar texto.\n4) Na mensagem entregue, o RCS agora sai com imagem, título e botões do template.\n\nO que estava errado: o RCS disparado pela aba Disparos saía como texto puro, sem imagem, sem título e sem botão. O tubo funcionava, mas o template não chegava até o envio porque a ação de disparo não tem etapa de régua associada. Agora o envio também aceita o template escolhido no Disparos.\n\nVale testar também um template de carrossel.","i":false},{"a":"Sistema/Negócio","e":null,"dt":"2026-09-04T19:41:34.205632+00:00","x":"[Solicitação de ajustes] .","i":false},{"a":"Sistema/Negócio","e":null,"dt":"2026-09-04T19:41:55.025868+00:00","x":"Fiz o teste do disparo porém não recebi mesmo dizendo que foi enviado. Peço que verifique\n\n\n![image.png](attachment://0495e302-6c17-4ace-bac6-1c5ec8e8c05b/1788550912168_65e6b03f-497d-4146-9f8d-6bf1af2748f4_image.png)\n\nOlhando no Hyper também não gerou nada\n\n![image.png](attachment://0495e302-6c17-4ace-bac6-1c5ec8e8c05b/1788551112375_8fbb1e01-5404-474e-a2a2-5873ed22f1a2_image.png)\n\n","i":false},{"a":"Sistema/Negócio","e":null,"dt":"2026-09-04T19:44:10.306192+00:00","x":"Além disso a prévisualização não mostra a template com as variaveis funcionando igual é feito no email ou whatsapp. Peço essa correção pra conseguir validar visualmente antes de enviar também\n\n\n![image.png](attachment://0495e302-6c17-4ace-bac6-1c5ec8e8c05b/1788550995410_40905dc5-e3b9-4bbe-afd6-c2bb95a8a69a_image.png)\n\n","i":false},{"a":"Marcos","e":null,"dt":"2026-09-08T21:37:48.469905+00:00","x":"Voltando nos dois pontos que você levantou. Os dois estão corrigidos e já em produção.\n\n**1) A prévia não mostrava a template com as variáveis: corrigido.**\n\nOnde validar: Torre de Controle > Disparos > tipo de ação RCS > escolha a integração e o Template RCS. A prévia agora desenha o **mesmo card** que você já vê na Régua — imagem, título, corpo com as variáveis resolvidas e botões.\n\nTrês coisas mudaram junto:\n- A prévia passou a receber o template escolhido. Antes ela não recebia, e por isso resolvia o corpo pelo campo Conteúdo, que fica vazio justamente quando você usa template.\n- O aviso de \"falta conteúdo\" e o botão \"Disparar\" agora usam a mesma regra. Antes o aviso dizia que faltava conteúdo enquanto o botão já liberava.\n- O seletor de template abre direto na aba **Templates Locais**, onde os templates de RCS realmente estão, e o texto dele deixou de falar de \"Ativação (HSM)\" e \"janela de 24h\", que são vocabulário de WhatsApp e não de RCS.\n\n**2) \"Foi enviado e não recebi, e no Hyper não gerou nada\": achamos a causa.**\n\nEra o **tamanho do corpo da mensagem**. Acima de 3.000 caracteres o RCS não é entregue — e o provedor devolve sucesso do mesmo jeito, então a Torre gravava \"Enviado\".\n\nMedimos no dia 04/09, mesmas campanhas e mesma integração: das **1.664** mensagens de RCS com até 3.000 caracteres, **41,6%** tiveram retorno do provedor; das **15** acima de 3.000, **nenhuma**.\n\nO seu disparo de teste é um desses 15: ele saiu com **3.434 caracteres**. O template \"🔓 Desbloqueie seu equipamento [BLIPS]\" tem 582 caracteres, mas a lista de dívida expande conforme o número de contratos e parcelas do cliente.\n\nO que mudou: **a lista de dívida agora se ajusta ao canal.** Ela mantém detalhadas as parcelas de maior atraso, avisa \"e mais N parcelas não listadas\", e o total de cada contrato continua somando **todas** as parcelas cobráveis — o cliente nunca vê valor menor do que deve. Simulado com o maior cliente da base (13 contratos, 195 parcelas): 15.734 → 2.048 caracteres, ainda exibindo os 13 contratos.\n\n**Pode repetir o teste com o mesmo template e o mesmo cliente.** Agora deve chegar.\n\nDuas coisas para você saber antes de testar:\n\n- Se algum caso ainda estourar o limite, a Torre agora **recusa e marca \"Falhou\" com o motivo escrito**, em vez de dizer \"Enviado\". Se acontecer, é a correção funcionando — prefira ver a falha a receber um \"Enviado\" que não chegou. A prévia também avisa antes de você disparar.\n- Achamos e corrigimos um terceiro problema que você não tinha relatado, e era o mais grave: nesse mesmo fluxo, o disparo estava mandando o texto literal **\"Nenhum título cobrável\"** no lugar da dívida do cliente. Isso afetava 21 dos 24 templates de RCS ativos.\n\nUm aviso não relacionado: se você testar com o mesmo contato de antes, o nome dele aparece como \"JOÃƒO\" na mensagem. Isso é o nome gravado com acentuação corrompida no cadastro, não a mensagem — são 12 contatos em toda a base e vai num card separado.","i":false}],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-09-01T18:23:22.092139+00:00","por":"João Vinícius"},{"de":"fila_exec","para":"em_andamento","dt":"2026-09-02T17:12:33.284075+00:00","por":"Marcos"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-04T01:44:26.597707+00:00","por":"Automático (Quimera)"},{"de":"em_validacao","para":"em_andamento","dt":"2026-09-04T19:41:37.844697+00:00","por":"Sistema/Negócio"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-08T21:37:55.115402+00:00","por":"Automático (Quimera)"},{"de":"em_validacao","para":"finalizado","dt":"2026-09-10T14:35:54.558861+00:00","por":"Sistema/Negócio"}]},"7137":{"t":"Adicionar opção de filtrar TODOS na aba DISPAROS | Torre de Controle","s":"finalizado","d":"<p>Boa tarde Senhores(as),<\/p><p><\/p><p>Atualmente a aba DISPAROS mostra até o máximo de 100 e se preciso de selecionar 600 contatos pra disparo preciso selecionar todos da aba 1, depois 2, 3 até a 6. Peço que com apenas um clique eu selecione TODOS, porém mantendo essa opção de selecionar apenas o que observo.<\/p><p><\/p><img class=\"kb-img\" src=\"attachment://8be37992-8596-46cf-8e30-c4ba089d8578/1787931663519_image.png\" alt=\"image.png\"><p><\/p><p>Grato J<\/p><p><\/p>","edd":null,"c":[{"a":"Marcos","e":null,"dt":"2026-09-04T01:42:58.316121+00:00","x":"Entregue e já em produção.\n\nOnde validar: Torre de Controle > Disparos.\n\n1) Aplique os filtros que quiser (busca, Carteiras, Réguas, Filtros).\n2) Acima da lista, ao lado de \"N contato(s) no filtro atual\", aparece o botão \"Selecionar todos os N\". O número vem no próprio rótulo, para você saber o tamanho do lote antes de clicar. Um clique só, sem precisar passar de página em página.\n3) O checkbox do cabeçalho continua marcando somente a página que você está vendo, como você pediu. As duas opções convivem.\n\nUm detalhe importante: se você tiver colado uma lista de documentos ou de contratos, o \"Selecionar todos\" respeita essa lista. Ele não amplia o lote para além do que você filtrou.\n\nPode testar direto com o cenário do card: mais de 600 contatos, um clique.","i":false}],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-09-01T18:22:16.268492+00:00","por":"João Vinícius"},{"de":"fila_exec","para":"em_andamento","dt":"2026-09-02T17:12:30.01252+00:00","por":"Marcos"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-04T01:44:32.812973+00:00","por":"Automático (Quimera)"},{"de":"em_validacao","para":"finalizado","dt":"2026-09-04T19:34:08.797133+00:00","por":"Sistema/Negócio"}]},"7138":{"t":"Permitir cancelar ações geradas pela campanha massivamente | Torre de Controle","s":"finalizado","d":"<p>Boa tarde Senhores(as),<\/p><p><\/p><p>Peço que seja adicionado a opção de cancelar massivamente ações geradas por X campanha ou régua de maneira massiva. Se a campanha gerou 100 e disparou 10 eu só seria capaz de cancelar as 90 restantes.<\/p><p><\/p><img class=\"kb-img\" src=\"attachment://2bc200e0-c757-4d2e-88be-9eb89b06c3b1/1787931853357_image.png\" alt=\"image.png\"><p><\/p><p>Grato J<\/p><p><\/p>","edd":null,"c":[{"a":"Marcos","e":null,"dt":"2026-09-04T01:43:11.452095+00:00","x":"Entregue e já em produção.\n\nOnde validar: Torre de Controle > Campanhas > aba \"Monitoramento\".\n\n1) Na tabela de execuções, na linha da campanha, clique no ícone de proibido na última coluna (\"Cancelar ações pendentes desta campanha\").\n2) A tela mostra QUANTAS ações serão canceladas antes de você confirmar.\n3) Confirme. Só as ações ainda Pendentes são canceladas. O que já foi enviado não é tocado.\n\nÉ exatamente o cenário do card: gerou 100, disparou 10, cancela as 90 restantes.\n\nUma observação: ações no estado \"Processando\" (as que estão saindo para o envio naquele instante) ficam de fora por segurança, e o número delas aparece separado na tela. Se fossem canceladas, a mensagem poderia ser entregue mesmo assim e ficaria registrada como cancelada — a tela mentiria sobre um cliente que foi cobrado.\n\nDica para testar: escolha um horário em que ainda exista fila pendente, logo após a execução das campanhas da manhã. Em horário de baixa a fila costuma estar zerada e o botão vai mostrar 0 ações.","i":false}],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-09-01T19:10:50.98679+00:00","por":"João Vinícius"},{"de":"fila_exec","para":"em_andamento","dt":"2026-09-02T17:12:26.949998+00:00","por":"Marcos"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-04T01:44:35.931652+00:00","por":"Automático (Quimera)"},{"de":"em_validacao","para":"finalizado","dt":"2026-09-04T19:32:39.839336+00:00","por":"Sistema/Negócio"}]},"7157":{"t":"RECEPTIVO HYPER FERIADO 31/08","s":"finalizado","d":"<p>Boa tarde Senhores(as),<\/p><p><\/p><p>Dia 31/08 provavelmente não iremos trabalhar por conta do feriado falando do time da Jéssica. Peço que quando o cliente entrar de forma receptiva em algum dos nossos departamentos seja informado a seguinte mensagem:<br>=-=-=-=-=-=-=-=<br>Olá! 👋<br><br>Informamos que, no dia 31/08, é feriado municipal em Uberlândia, em comemoração ao aniversário da cidade. 🎉<br><br>Por esse motivo, não haverá expediente nesta data.<br><br>As mensagens recebidas serão respondidas a partir de 01/09, às 08h.<br><br>Agradecemos a compreensão!<\/p><p>=-=-=-=-=-=-=-=<br>Sugestão do Hyper:<br><\/p><img class=\"kb-img\" src=\"attachment://afa931c3-0bd4-4abd-84c5-e1b12c3c52c3/1787941367022_image.png\" alt=\"image.png\"><p><\/p><p>Grato J<\/p>","edd":null,"c":[{"a":"Sistema/Negócio","e":null,"dt":"2026-09-02T13:08:53.361575+00:00","x":"[Solicitação de ajustes] Passei um caso para o João Neto verificar aguardando retorno pra validação pensando em próximos feríados","i":false},{"a":"João Pedro","e":null,"dt":"2026-09-02T16:57:14.791355+00:00","x":"\n![image.png](attachment://afa931c3-0bd4-4abd-84c5-e1b12c3c52c3/1788368218936_04b09ff8-6d59-4a6d-9761-d224303b86e7_image.png)\n\nNa BLIPS o cliente que não recebeu a mensagem era um acionamento e não teve retorno do cliente e quando ele retornou caiu para o operador\nE na FINZA ocorreu um erro no fluxo e foi transferido para Formalização sem a mensagem\nPortanto 100% das mensagens que deveriam ser entregues foram entregues","i":false},{"a":"João Pedro","e":null,"dt":"2026-09-02T16:58:32.345124+00:00","x":"Protocolo\n\nBlips 1806266584805\nFinza 3108267827728","i":false}],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-08-28T18:34:24.160175+00:00","por":"João Pedro"},{"de":"fila_exec","para":"em_andamento","dt":"2026-08-28T18:34:32.824482+00:00","por":"João Pedro"},{"de":"em_andamento","para":"em_validacao","dt":"2026-08-31T02:18:49.726241+00:00","por":"João Pedro"},{"de":"em_validacao","para":"em_andamento","dt":"2026-08-31T02:21:56.169575+00:00","por":"João Pedro"},{"de":"em_andamento","para":"em_validacao","dt":"2026-08-31T02:58:48.73382+00:00","por":"João Pedro"},{"de":"em_validacao","para":"em_andamento","dt":"2026-09-02T13:08:56.772691+00:00","por":"Sistema/Negócio"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-02T16:58:53.792462+00:00","por":"João Pedro"},{"de":"em_validacao","para":"finalizado","dt":"2026-09-02T20:45:36.464585+00:00","por":"Sistema/Negócio"}]},"7162":{"t":"Alteração de variável | Torre de Controle","s":"finalizado","d":"<p>Boa tarde Senhores(as),<\/p><p><\/p><p>Peço que seja alterado e não criado uma varíavel da torre. A variável é a da print em questão: <\/p><img class=\"kb-img\" src=\"attachment://832b013e-cc5f-4af3-a94b-a375eed1f472/1787943211427_image.png\" alt=\"image.png\"><p>Ela mostra 1° parcela em aberto porém quero que seja a 1a parcela com um desses status de título (expirado,recomprado ou disponível)<\/p><p><\/p><p>Grato J<\/p>","edd":null,"c":[{"a":"Marcos","e":null,"dt":"2026-09-04T01:43:18.633164+00:00","x":"Entregue e já em produção.\n\nA variável \"1ª Parcela em Aberto\" ({{contract.min_open_installment}}) foi ALTERADA, como você pediu — não foi criada uma nova. Agora ela considera somente títulos com status Disponível, Recomprado ou Expirado.\n\nAntes ela aceitava também \"Aguardando Cancelamento\", \"Aguardando Recompra\" e um status legado. Era a única variável do catálogo fora do padrão de cobrável que as vizinhas já usavam.\n\nOnde validar: em qualquer lugar que usa a variável — Templates de mensagem, Filtros e colunas da Carteira. A descrição da variável na tela também foi atualizada para dizer a regra nova.\n\nQualquer dúvida na conferência, é só chamar.","i":false}],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-09-01T18:27:48.594298+00:00","por":"João Vinícius"},{"de":"fila_exec","para":"em_andamento","dt":"2026-09-02T17:12:21.265059+00:00","por":"Marcos"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-04T01:44:43.007832+00:00","por":"Automático (Quimera)"},{"de":"em_validacao","para":"finalizado","dt":"2026-09-04T19:28:55.228759+00:00","por":"Sistema/Negócio"}]},"7186":{"t":"Automação de instalação do equipamento","s":"finalizado","d":"<p>Gentileza verificar em qual timing a mensagem de instalação está sendo enviada para o cliente pois este exemplo anexado, o cliente instalou em 08/07 e recebeu essa mensagem em 21/08.<\/p><p>Número do cliente: 21 99320-9044<\/p>","edd":null,"c":[{"a":"Solicitante (Quimera)","e":null,"dt":"2026-09-09T12:21:08.583238+00:00","x":"Mapeamento da cadeia de envio da mensagem de instalacao - links dos fluxos:\n\nCADEIA REAL\nPlataforma Blips (backend) -> POST https://runtime.hyperflowapis.global/api/dneeXMnM7/modulo-financeiro/confirmation-deal -> Fluxo API (gnHWe4vR_) -> Activate user -> Fluxo de mensagem (Hft89nUI3) -> condicional contract_type -> HSM WhatsApp\n\nFLUXOS HYPERFLOW\n1) Mensagem ao cliente (Hft89nUI3):\nhttps://integracoes.hyperflow.global/apps/blips-1/flows/equipamento-enviado_instalado-modulo-financeiro-1\n\n2) API gatilho (gnHWe4vR_):\nhttps://integracoes.hyperflow.global/apps/blips-1/flows/api-ativo-enviado_instalado-modulo-financeiro-1\n\n3) Alerta TI (3KgLyR6Ic) - referenciado por no orfao, nao dispara:\nhttps://integracoes.hyperflow.global/apps/blips-1/flows/ativo---alerta-financeiro-gerado-tecnologia-1\n\n4) Transbordo humano (_oI1UMhui) - destino do botao \"Preciso de Ajuda\":\nhttps://integracoes.hyperflow.global/apps/blips-1/flows/transbordo-humano-56\n\nTEMPLATES HSM (canal WhatsApp Blips +55 34 8425-6589)\n- Locacao: geracao_financeiro_instalacao_locacao  (foi o enviado neste caso)\n- Venda: mf_instalacao_locacao\n- Orfao/desconectado: geracao_financeiro_instalacao_venda_novo\n\nN8N - verificado, NENHUM workflow dispara este fluxo (varredura nos 4 ambientes, 1337 workflows). Fluxos n8n vizinhos da esteira de instalacao, apenas para referencia:\n- https://automacao.blips-labs.com/workflow/06KTtGnsHG9uXq5X  ([INSTALACAO] Confirmar instalacao tecnico)\n- https://automacao.blips-labs.com/workflow/oC3jJGUvKgernLrA  ([Instalacao] Gatilho link confirmacao instalacao)\n- https://automacao.blips-labs.com/workflow/BSNmVfWKhZjGjaEw  ([NOVO] Confirmacao de Entrega)\n\nCONTATO NO HYPERFLOW\nOPULENTO GOURMET LTDA | 26053422000119 | 12608755 - telefone 5521993209044 (confere com o contrato da mensagem)\n\nSOBRE O TIMING\nNenhum dos dois fluxos Hyperflow tem no de espera, delay ou agendamento - o HSM sai no mesmo instante do POST da plataforma. O gatilho real e a geracao do financeiro do contrato, nao a data de instalacao. A propria mensagem comprova: \"Observacao: Parcela uso proporcional referente uso 08/07/2026 a 05/08/2026\" (plataforma ja tinha a data de instalacao 08/07 no payload) e \"Primeiro Pagamento: 05/09/2026\" (financeiro gerado em agosto). Conclusao: o atraso de 44 dias esta na esteira do Modulo Financeiro / plataforma, nao na automacao.","i":true},{"a":"João Vinícius","e":null,"dt":"2026-09-10T16:18:51.18277+00:00","x":"@Bruna Rodrigues Morais boa tarde! Foi realizada a análise do caso e foi visto que as automações referentes a esse disparo não é de competência da squad da IA, isso porque quem dispara essa mensagem é o finza start, o responsável é o @Marco Aurélio de Oliveira Garuthi . Já repassei a análise feita pela nossa squad para o time do portal da finza para ajustar o ocorrido para que não se repita mais o erro. Peço para que qualquer outro incidente relacionado a essa mensagem seja aberta a demanda para o time de IA & Automações FINZA para que possamos repassar a demanda corretamente e com mais agilidade. Qualquer dúvidas estou a disposição no google chat!","i":false}],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-09-08T20:11:47.397484+00:00","por":"Solicitante (Quimera)"},{"de":"fila_exec","para":"finalizado","dt":"2026-09-10T17:28:21.289192+00:00","por":"João Vinícius"}]},"7231":{"t":"Atualização Bitrix","s":"finalizado","d":"<p>Boa tarde Senhores(as),<\/p><p><\/p><p>Peço que avaliem a atualização dos cards no Bitrix principalmente do logistica reversa cobrança 4.0 segue exemplo de card desatualizado.<\/p><p>Pelo que vi está com atraso incorreto e na raia Finzamesmo sendo blips.<\/p><p><\/p><img class=\"kb-img\" src=\"attachment://8eefe8d6-00bf-4dea-8178-ebb462ecdc61/1788286884975_image.png\" alt=\"image.png\"><img class=\"kb-img\" src=\"attachment://8eefe8d6-00bf-4dea-8178-ebb462ecdc61/1788286884975_image.png\" alt=\"image.png\"><p><\/p><p>Grato J<\/p>","edd":null,"c":[{"a":"João Pedro","e":null,"dt":"2026-09-04T21:22:53.525607+00:00","x":"@João Pedro Borges Martins vou encerrar esse card, onde a não atualização de dias em atraso já foi identificada e quando a realoação nas raias vão ser tratadas no outro card que foi aberto onde vou seguir aquela ordem que tratamos no google chat.\n","i":false}],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-09-01T18:23:50.801597+00:00","por":"João Vinícius"},{"de":"fila_exec","para":"em_andamento","dt":"2026-09-02T19:30:48.764351+00:00","por":"João Pedro"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-04T21:23:04.009798+00:00","por":"João Pedro"},{"de":"em_validacao","para":"finalizado","dt":"2026-09-08T12:19:59.681562+00:00","por":"Sistema/Negócio"}]},"7237":{"t":"Contexto mesmo número 24hrs | IA's","s":"finalizado","d":"<p>Boa tarde Senhores(as),<\/p><p><\/p><p>Dessimoni conforme falado no email<\/p><p>Peço que nossas IA's tenham o contexto de 24hrs para que em situações no qual o cliente tem uma conversa com algum de nossos humanos tendo o protocolo finalizado mas por algum motivo ele retorna caindo na IA a IA possa ter esse contexto olhando pelo número do cliente mesmo que protocolo diferente.<\/p><p><\/p><p>Grato J<\/p>","edd":null,"c":[{"a":"João Pedro","e":null,"dt":"2026-10-09T04:58:08.874855+00:00","x":"A Valentina e a Esperanza passam a enxergar o atendimento humano das últimas 24 h do mesmo número, mesmo que tenha sido em outro protocolo. É o cenário do chamado: o humano finaliza, o cliente volta, cai na IA e ela já sabe o que aconteceu.\n\nO que a IA vê\nPara cada atendimento humano encerrado nas últimas 24 h naquele número, a IA recebe:\n- data/hora, departamento e protocolo;\n- a classificação usada pelo atendente no encerramento (ex.: 4.1 - Promessa de Pagamento);\n- a conversa daquele atendimento, com no máximo ~1.400 caracteres e sempre as falas mais recentes.\n\nJunto vai um conjunto de regras de uso:\n- a classificação é o registro oficial e deve ser respeitada;\n- se a conversa contradisser a classificação, vale a conversa: o cliente diz que não é o titular, pede para não ser mais contatado ou fala em ação judicial. Nesses casos a IA deve parar de cobrar e encaminhar para um humano;\n- valor, prazo, desconto ou acordo combinado com o humano não pode ser repetido, confirmado nem usado em cálculo pela IA;\n- a IA não cita o nome do atendente. Se o cliente cobrar o que foi combinado, ela encaminha para um humano;\n- a IA não inventa nada que não esteja escrito.\n\nLimite por agente: recebem até 3 atendimentos (esse valor pode ser alterado de acordo com o desempenho).\n\nO que a IA NÃO vê\n- Atendimentos feitos só por robô/IA (a não ser que ela mesma tenha feito o atendimento anterior)\n- Classificações que não dizem nada sobre o caso. Exemplos: inatividade, duplicidade, \"Finalizado com sucesso bot\", \"Cliente não possui WhatsApp\", testes.\n- Atendimentos com mais de 24 h.\n- Atendimentos de outra empresa: a Valentina vê só a Finza; a Esperanza vê só o canal que o cliente está falando.\n\nLimites conhecidos\n- Conversa incompleta.\n- Na Blips/Ideal a conversa completa só fica disponível ~30 min após o encerramento. Antes disso entra só uma parte.\n- Mensagens automáticas (abertura, template) aparecem como fala de \"Atendente\". Às vezes trazem o nome da pessoa no texto, por exemplo \"Sou a Raquel…\".\n\nPedido ao time: acompanhar de perto nos próximos dias\n\nEstamos dando mais informação para a IA, e isso aumenta o risco de alucinação. ","i":false},{"a":"Sistema/Negócio","e":null,"dt":"2026-10-09T16:47:25.494211+00:00","x":"Filipe estará atuando nesse acompanhamento nos próximos dias","i":false}],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-09-01T19:10:09.664436+00:00","por":"João Vinícius"},{"de":"fila_exec","para":"em_andamento","dt":"2026-09-30T12:32:17.861158+00:00","por":"João Pedro"},{"de":"em_andamento","para":"bloqueado","dt":"2026-10-08T05:08:56.320086+00:00","por":"João Pedro"},{"de":"bloqueado","para":"em_andamento","dt":"2026-10-08T12:37:29.080483+00:00","por":"João Pedro"},{"de":"em_andamento","para":"em_validacao","dt":"2026-10-09T04:58:18.679524+00:00","por":"João Pedro"},{"de":"em_validacao","para":"finalizado","dt":"2026-10-14T09:00:02.12684+00:00","por":"Automático (Quimera)"}]},"7241":{"t":"Filtros da aba com bugs","s":"finalizado","d":"<p>Boa tarde! Tudo bem? Espero que sim! <br><br>Na demanda do roadmap da Torre de controle, consta como entregue a melhoria dos filtros na aba <strong>Ações – ID 28<\/strong>. Porém, durante a validação, identifiquei que a melhoria ainda apresenta algumas oportunidades de ajuste.<\/p><p>Por exemplo:<\/p><ul><li><p>Ao realizar uma pesquisa pelo <strong>telefone<\/strong>, são apresentadas apenas algumas das ações realizadas, não sendo possível visualizar todo o histórico de disparos relacionados ao número pesquisado.<\/p><\/li><li><p>Ao pesquisar pelo <strong>CNPJ<\/strong>, é apresentado somente o card de negativação, sem exibir todas as ações de disparo realizadas para aquele CNPJ, o que dificulta a validação do histórico completo.<\/p><\/li><li><p>Também identifiquei uma dificuldade na pesquisa, pois é necessário <strong>remover os caracteres do telefone<\/strong> e <strong>os pontos e barras do CNPJ<\/strong> para que a busca seja realizada corretamente.<\/p><\/li><\/ul><p>Dessa forma, apesar de a melhoria constar como entregue, ainda existem pontos que impactam a usabilidade e a validação das ações realizadas.<\/p><p><strong>Anexo evidências dos comportamentos identificados para análise.<\/strong><br><br>ANDERSON JOSE DOS SANTOS MATOS<br>CNPJ/CPF: 51.314.506/0001-06<br>Telefone: (13) 9 9616-9972<br>Email: <a target=\"_blank\" rel=\"noopener noreferrer\" href=\"mailto:arteandersonmatos@gmail.com\">arteandersonmatos@gmail.com<\/a><\/p><p><\/p><img class=\"kb-img\" src=\"attachment://a583d51a-254a-421b-9d07-94c52137dffa/1788292947891_image.png\" alt=\"image.png\"><img class=\"kb-img\" src=\"attachment://a583d51a-254a-421b-9d07-94c52137dffa/1788292947891_image.png\" alt=\"image.png\"><img class=\"kb-img\" src=\"attachment://a583d51a-254a-421b-9d07-94c52137dffa/1788292947891_image.png\" alt=\"image.png\"><img class=\"kb-img\" src=\"attachment://a583d51a-254a-421b-9d07-94c52137dffa/1788292947891_image.png\" alt=\"image.png\"><p>Gostaria que ao digitar o CNPJ por exemplo apresentasse todas as informaões de ações para esse cliente. <br><br><\/p>","edd":null,"c":[{"a":"Solicitante (Quimera)","e":null,"dt":"2026-09-01T20:35:10.297109+00:00","x":"@Renato Lemes da Silva Costa Esta demanda não seria para o time de IA e automação da Finza?\n","i":false},{"a":"Solicitante (Quimera)","e":null,"dt":"2026-09-01T21:05:49.161917+00:00","x":"Sim, abri errado, você consegue direcionar para o time correto? Desde já agradeço!\n","i":false},{"a":"Marcos","e":null,"dt":"2026-09-04T01:43:35.102812+00:00","x":"Entregue e já em produção. Obrigado pelas evidências, elas apontaram exatamente o problema.\n\nO que estava acontecendo: a busca da aba Ações olhava o nome, o destinatário e o conteúdo da mensagem, mas nunca olhava o documento, o telefone e o e-mail do cadastro do cliente. Por isso cada termo trazia um recorte diferente, e o CNPJ com pontuação não trazia nada (a base guarda só os números).\n\nOnde validar: Torre de Controle > Ações, campo de busca. Pode testar com o próprio caso do card (ANDERSON JOSE DOS SANTOS MATOS):\n\n1) 51.314.506/0001-06\n2) 51314506000106\n3) (13) 9 9616-9972\n4) 13996169972\n5) arteandersonmatos@gmail.com\n\nAs cinco buscas agora trazem o MESMO resultado: o histórico completo do cliente. Antes elas traziam, respectivamente, 0, 1, 0, 11 e 11 ações. Agora as cinco trazem o histórico inteiro — 23 ações na Finza e 97 na Blips.\n\nNão é mais preciso tirar os pontos, as barras nem os parênteses. A busca aceita o texto do jeito que você lê na tela.\n\nMais duas coisas para você observar:\n\nQuando a Torre reconhece que você digitou um documento, telefone ou e-mail, aparece um aviso no topo do filtro dizendo de quem é o histórico e avisando que o período não se aplica — porque nesse modo a busca traz TODAS as ações do cliente, não só as do período escolhido. Há um botão \"Voltar ao período\" para desfazer.\n\nNesse modo os cartões de indicadores do dia e o progresso de envio saem de cena e dão lugar a um aviso. É de propósito: eles medem a fila de hoje, e deixá-los no ar mostraria \"97 na lista / 1 nos indicadores\" — a mesma contradição que você reportou, só com números novos.\n\nSe um mesmo telefone pertencer a mais de um cliente, todos aparecem, e o aviso informa quantos são.","i":false}],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-09-02T12:44:02.174379+00:00","por":"João Vinícius"},{"de":"fila_exec","para":"em_andamento","dt":"2026-09-02T17:12:19.707053+00:00","por":"Marcos"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-04T01:44:46.337737+00:00","por":"Automático (Quimera)"},{"de":"em_validacao","para":"finalizado","dt":"2026-09-04T14:39:26.63291+00:00","por":"Solicitante (Quimera)"}]},"7286":{"t":"Whatsapp Flows","s":"finalizado","d":"<p>Demanda se trata de implementar whatsapp flows nos canais da finza (4). <br><br>O Flows deve contemplar todos os casos de uso que o cliente finza necessitar, como consulta e material de apoio segue o levantamento das informações.<br><br>OBS: validar com o dessimoni e J antes sobre todo o funil <\/p>","edd":"2026-09-25","c":[{"a":"João Pedro","e":null,"dt":"2026-09-25T19:23:34.471527+00:00","x":"Reunião de apresentação do MVP · Novo Atendimento Finza · 25/09/2026\n\nApresentamos a proposta de atendimento em 3 níveis para os canais oficiais da Finza:\n- Nível 1: WhatsApp Flows, com telas guiadas dentro do WhatsApp.\n- Nível 2: atendimento pela IA (Valentina).\n- Nível 3: atendimento humano, com a distribuição por departamento e faixa de atraso mantida como está hoje.\n\nA proposta vale para 100% dos canais oficiais da Finza. Também vale para os canais da Blips e da Ideal quando a jornada de cobrança começar por eles.\n\nDecisões alinhadas\n- A renegociação sai do menu do Flow por enquanto. As APIs de renegociação chegam com o projeto No Comando. Até lá, a alternativa de pagamento é o cartão de crédito.\n- Os casos de \"cobrança não é minha\" serão tabulados, sem bloqueio automático do telefone, porque o mesmo número pode estar ligado a outros contratos.\n- A virada será gradual, por lotes de clientes ou por departamento.\n- As telas serão cocriadas e homologadas pela área de negócio no Claude Design, que substitui o envio manual de ajustes.\n- O chatbot tradicional continua ativo para clientes com celulares que não suportam WhatsApp Flows.\n\nAinda em aberto\n- Data de go-live: a virada no início de outubro foi descartada por causa do fechamento de mês e da fase 1 do No Comando. A nova data depende do planejamento e da homologação.\n- Clientes com vários contratos ou equipamentos: falta definir a prioridade de exibição.\n- Contratos com flag de jurídico: falta a regra de direcionamento do atendimento.\n- Clientes adimplentes: a regra proposta é que, dentro da janela preventiva, por exemplo com vencimento em até 10 dias, o cliente veja as opções de pagamento. Um cliente totalmente em dia não recebe opção de quitação. Falta confirmar o tamanho da janela.\n- Desbloqueio em confiança: falta definir a régua de dias de atraso.\n- Suporte técnico da carteira Blips: a regularização financeira é pré-requisito antes da transferência para o suporte.","i":false},{"a":"João Pedro","e":null,"dt":"2026-09-25T19:23:57.483775+00:00","x":"\n![simulador-apresentacao.html](attachment://311fbd64-c660-46e7-b5ef-9c0fa7380cb7/1790364233327_f4202da5-a9d8-40c2-b5f8-51ac77011735_simulador-apresentacao.html)\n","i":true}],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-09-02T13:15:16.75087+00:00","por":"João Vinícius"},{"de":"fila_exec","para":"em_andamento","dt":"2026-09-17T12:39:17.608491+00:00","por":"João Vinícius"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-25T19:24:04.877915+00:00","por":"João Pedro"},{"de":"em_validacao","para":"finalizado","dt":"2026-09-28T12:37:41.236714+00:00","por":"João Vinícius"}]},"7317":{"t":"Scorização de telefones","s":"finalizado","d":"**Descrição Refinada**\nCriar modelo estatístico de scorização de telefones a partir dos status retornados pela Meta e pelo Hyper. O modelo precisa indicar se o número nos bloqueou, qual número bloqueou, e quais números não são WhatsApp. A base resultante fica disponível no front da Torre e no banco.\n\nEscopo:\n- Definir os sinais de entrada vindos da Meta e do Hyper.\n- Definir os pesos e o modelo estatístico do score.\n- Persistir a base de score no banco.\n- Expor a visualização do score no front da Torre.\n\n**Observação**\nDemanda grande — precisa ser fatiada antes de entrar em execução. Quatro definições faltam e nenhuma é técnica: quais sinais entram, quais pesos, qual modelo estatístico e como o score aparece dentro da Torre. Scorização de telefone não é hoje uma feature documentada da Torre, então é desenho do zero, não ajuste. Não confundir com a configuração de número por compliance (ref. #4052, finalizado).\n\n**Objetivo**\nA Torre passa a indicar a qualidade de cada telefone da base, permitindo priorizar o acionamento por número com maior chance de entrega.","edd":"2026-09-23","c":[],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-09-09T12:48:57.020547+00:00","por":"João Vinícius"},{"de":"fila_exec","para":"em_andamento","dt":"2026-09-16T15:27:54.029784+00:00","por":"Marcos"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-22T20:36:04.78532+00:00","por":"Marcos"},{"de":"em_validacao","para":"finalizado","dt":"2026-09-25T09:00:02.265129+00:00","por":"Automático (Quimera)"},{"de":"finalizado","para":"em_validacao","dt":"2026-09-28T12:54:00.103655+00:00","por":"João Vinícius"},{"de":"em_validacao","para":"finalizado","dt":"2026-10-01T09:00:03.548719+00:00","por":"Automático (Quimera)"}]},"7318":{"t":"Bloqueio e desbloqueio em massa","s":"finalizado","d":"**Descrição Refinada**\nHoje o blocklist atua por documento (CPF/CNPJ) e impede o acionamento enquanto ativo, mas a operação é individual. Criar a integração que permite desbloquear em massa (casos de confiança/exceção) e bloquear em massa, seja por um período determinado com desbloqueio automático depois, seja por tempo indeterminado até a quitação.\n\nEscopo:\n- Permitir desbloqueio em massa por lista de documentos.\n- Permitir bloqueio em massa com prazo definido e desbloqueio automático ao fim.\n- Permitir bloqueio em massa por tempo indeterminado, liberando na quitação.\n- Integrar com o serviço responsável pelo blocklist.\n\n**Observação**\nEm teoria é simples, mas duas coisas precisam ser definidas antes: onde a ação acontece na Torre e qual serviço responde pelo blocklist. Ação em massa sobre blocklist é destrutiva — desbloquear em lote pode reabrir cobrança para quem não deveria receber. Prever confirmação explícita e registro de quem executou. Não confundir com o ajuste de granularidade por régua (ref. #6219, cancelado) nem com os ajustes pontuais já entregues (ref. #3939, #3424).\n\n**Objetivo**\nA operação bloqueia e desbloqueia listas de clientes em uma única ação, com prazo configurável e liberação automática, sem depender de operação individual.","edd":"2026-09-16","c":[{"a":"Marcos","e":null,"dt":"2026-09-10T01:40:08.768988+00:00","x":"Entregue e já em produção.\n\nOnde validar: Torre de Controle > Carteira > Blocklist.\n\n1) Na aba \"Bloqueios ativos\", use \"Bloquear em massa\". Escolha o tipo de alvo, cole a lista (um CPF/CNPJ por linha; vírgula e ponto-e-vírgula também funcionam) e clique em Resolver. Ele mostra quantos encontrou e quais não existem no cadastro antes de gravar qualquer coisa. O botão de confirmar só habilita depois disso, e traz a contagem do que vai ser afetado.\n\n2) Preencha \"Bloquear até\" com uma data para o bloqueio cair sozinho no fim do prazo, ou deixe vazio para bloqueio sem prazo.\n\n3) Na aba nova, \"Desbloqueados\", use \"Liberar em massa\" do mesmo jeito. É o passe livre: o cliente volta a ser acionado mesmo continuando bloqueado por uma regra.\n\n4) Nas regras de bloqueio por filtro há um campo novo, \"Regra vale até\". Na data escolhida a regra para de gerar bloqueios e os que ela já tinha criado são removidos.\n\nO que faltava: o bloqueio era um a um, e havia um caso sem saída. Na Blips, 196 dos 285 bloqueios ativos vinham de regra automática e cobriam 175 clientes — e nenhum deles podia ser removido individualmente. Para liberar um único cliente só existia pausar a regra inteira, o que soltava os 175 de uma vez. Também passamos a registrar quem executou cada bloqueio; esse campo estava em branco nos 297 bloqueios que existiam.\n\nO que não muda:\n- O cadeado continua aparecendo na carteira para quem tem passe livre. É de propósito: liberar não apaga o bloqueio, neutraliza. Se a liberação tiver prazo e vencer, o bloqueio volta a valer sozinho.\n- \"Liberando na quitação\" só vale para bloqueio criado por regra de filtro. Bloqueio manual sai por prazo ou por remoção — não some sozinho quando o cliente paga.\n- Colar lista vale para cliente, contrato, suprimento, e-mail e telefone. Título e parcela de suprimento continuam um a um, porque o número deles se repete entre contratos e uma lista atingiria o alvo errado.\n- Não existe serviço externo de blocklist para integrar: a própria Torre é quem responde por ele.\n\nNada foi liberado automaticamente. Todos os bloqueios existentes continuam valendo até alguém criar um desbloqueio.","i":false},{"a":"Sistema/Negócio","e":null,"dt":"2026-09-10T20:48:38.533823+00:00","x":"[Solicitação de ajustes] .","i":false},{"a":"Sistema/Negócio","e":null,"dt":"2026-09-10T20:51:40.674641+00:00","x":"Pelo que verifiquei não tem opção de desbloquear em massa.\n![image.png](attachment://eebc864f-b4c5-4e6b-8c65-3515ea9c788b/1789073325021_f9c4641b-9ba6-40db-b6ba-65a74bfc54d7_image.png)\n\nTambém não tem como deletar algum blocklist incorreto ou editar pra talvez ajustar o blocklist incorreto.\n![image.png](attachment://eebc864f-b4c5-4e6b-8c65-3515ea9c788b/1789073361493_04c062eb-cd88-4261-8ee2-3d024015d2de_image.png)\n\nTambém não é possível adicionar blocklist de um cliente que não pertence a torre. Isso é importante pois atualmente usamos a torre como fonte verdadeira de qualquer tipo de blocklist e pra adicionar um cliente externo de forma manual não é possível, pode não fazer sentido para o time tech mas pro time de negócio é importante.\n![image.png](attachment://eebc864f-b4c5-4e6b-8c65-3515ea9c788b/1789073439552_57bb65ed-0955-4b4a-a9cf-1720f16b4acf_image.png)\n","i":false},{"a":"Marcos","e":null,"dt":"2026-09-10T21:35:03.449785+00:00","x":"Sobre  o desbloquear em massa: \n![image.png](attachment://eebc864f-b4c5-4e6b-8c65-3515ea9c788b/1789075851895_efebad91-34fc-4f5e-935b-60fb8bc71e8c_image.png)\nBasta clicar em liberar em massa, que todo contato adicionado por essa funcionalidade, independente de qualquer outro bloqueio possível q ele esteja, será ignorado. \n\nSobre o deletar, existe a opçao sim, mas nao para contatos bloqueados a partir de uma regra (a opcao de bloquear por filtro) para remover os bloqueados por filtro, tem q remover o bloqueio por regra\n![image.png](attachment://eebc864f-b4c5-4e6b-8c65-3515ea9c788b/1789075974473_fca1b983-498f-4bfb-8567-51e17c634773_image.png)\n\nSobre criar  adicionar na blocklist clientes que nao estão na Torre é possível via manual por email ou numero, vc precisa adicionar contratos ou titulos sem estar na torre tambem? Consegue me explicar o motivo?\n![image.png](attachment://eebc864f-b4c5-4e6b-8c65-3515ea9c788b/1789076086506_5e40ee43-a0a6-4ad1-8c8f-ecbb25aec6bc_image.png)\n","i":false},{"a":"Sistema/Negócio","e":null,"dt":"2026-09-11T13:58:32.461082+00:00","x":"Legal sobre os 2 primeiros pontos era falta de conhecimento mesmo. Sobre o 3° exemplo enriquecimento número que foi acionado e não está na torre e não é o cliente. ","i":false},{"a":"Sistema/Negócio","e":null,"dt":"2026-09-11T13:58:42.010324+00:00","x":"[Solicitação de ajustes] descrito acima","i":false},{"a":"Marcos","e":null,"dt":"2026-09-11T14:06:12.375936+00:00","x":"Nao entendi... hj vc ja consegue adicionar um numero para bloquear que nao está na torre... numero e email.... ","i":false},{"a":"Sistema/Negócio","e":null,"dt":"2026-09-11T17:53:11.311725+00:00","x":"Que loucura, deu certo mesmo","i":false}],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-09-04T13:52:04.056593+00:00","por":"João Vinícius"},{"de":"fila_exec","para":"em_andamento","dt":"2026-09-09T18:11:18.30977+00:00","por":"Marcos"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-10T01:40:17.129449+00:00","por":"Automático (Quimera)"},{"de":"em_validacao","para":"em_andamento","dt":"2026-09-10T20:48:42.150039+00:00","por":"Sistema/Negócio"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-10T21:36:10.228838+00:00","por":"Marcos"},{"de":"em_validacao","para":"em_andamento","dt":"2026-09-11T13:58:45.56366+00:00","por":"Sistema/Negócio"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-11T14:40:59.045242+00:00","por":"Marcos"},{"de":"em_validacao","para":"finalizado","dt":"2026-09-15T19:34:56.807513+00:00","por":"João Vinícius"}]},"7319":{"t":"Botões sem funcionamento","s":"finalizado","d":"**Descrição Refinada**\nExistem botões na Torre que não abrem nada ou não executam a ação esperada. Mapear todos, corrigir os que estão quebrados e homologar o comportamento de cada um.\n\nEscopo:\n- Mapear os botões da Torre, separando o que abre do que não abre.\n- Corrigir os que não executam a ação esperada.\n- Homologar o comportamento de cada botão corrigido.\n\n**Observação**\nTecnicamente simples, mas o escopo está aberto: o negócio precisa dizer quais botões não funcionam. Sem essa lista o mapeamento vira varredura da Torre inteira e o esforço deixa de ser previsível. Fechar a lista antes de entrar em execução.\n\n**Objetivo**\nTodo botão da Torre executa a ação que promete, com o comportamento homologado.","edd":"2026-09-14","c":[{"a":"João Vinícius","e":null,"dt":"2026-09-04T13:02:54.634359+00:00","x":"@João Pedro Borges Martins entendo que isso é você que tem que nos mostrar oque não esta funcionando com exatidão, não conseguimos fazer o regressivo completo na torre até porque temos outros itens na fila e temos uma capacidade limitada. Peço para que você faça uma analise completa do que funciona e do que não funciona para começarmos essa demanda","i":false},{"a":"Sistema/Negócio","e":null,"dt":"2026-09-08T13:43:29.961581+00:00","x":"Bom dia Dessimoni tudo bem? Até consigo sim clicar em cada botão e ver se ele está clicável/funcional e te reportar, porém, na minha visão é algo que deveria ser testado por vocês se aplicação está com alguma falha de funcionalidade nos botões existentes até porque com a IA e o código-fonte em mãos podem pedir pra ela validar a funcionalidade. Discorda do meu ponto de vista? Realmente deveria ser o time de negócio a testar funcionalidade de botões da aplicação?","i":false}],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-09-04T13:03:10.948052+00:00","por":"João Vinícius"},{"de":"fila_exec","para":"em_andamento","dt":"2026-09-09T02:11:18.976883+00:00","por":"Leandro"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-10T12:43:26.094863+00:00","por":"Leandro"},{"de":"em_validacao","para":"finalizado","dt":"2026-09-10T14:57:12.267132+00:00","por":"Sistema/Negócio"}]},"7320":{"t":"Filtros e busca globais da Torre","s":"finalizado","d":"**Descrição Refinada**\nOs filtros da Torre não funcionam por completo: alguns estão com bug, outros filtram incorretamente, e há filtros presentes em algumas abas e ausentes em outras. Revisar todos, criar um padrão único de filtro e melhorar a busca global.\n\nEscopo:\n- Revisar todos os filtros da Torre, aba por aba.\n- Definir e aplicar um padrão único de filtro.\n- Melhorar a busca global por documento, telefone, contrato e e-mail.\n\n**Observação**\nItem genérico no estado atual — precisa de refinamento maior com o negócio antes de estimar: quais filtros não funcionam exatamente. Sem essa lista, \"revisar todos os filtros\" é escopo aberto. Atenção à performance: os filtros da Torre já causaram timeout antes (ref. #5700, #5702, #5703, todos entregues), então validar o plano de execução das consultas. Trabalho anterior de escopo menor no mesmo domínio: ref. #3343 (busca por nome, finalizado).\n\n**Objetivo**\nTodo filtro da Torre funciona de forma consistente e previsível, seguindo um padrão único, e a busca global encontra o cliente por documento, telefone, contrato ou e-mail.","edd":"2026-09-14","c":[],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-09-02T22:22:06.778037+00:00","por":"João Vinícius"},{"de":"fila_exec","para":"em_andamento","dt":"2026-09-03T13:32:33.18932+00:00","por":"Leandro"},{"de":"em_andamento","para":"fila_exec","dt":"2026-09-03T13:32:36.104906+00:00","por":"Leandro"},{"de":"fila_exec","para":"em_andamento","dt":"2026-09-03T13:32:38.442356+00:00","por":"Leandro"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-10T12:43:29.838165+00:00","por":"Leandro"},{"de":"em_validacao","para":"finalizado","dt":"2026-09-10T14:52:02.764536+00:00","por":"Sistema/Negócio"}]},"7321":{"t":"Funil completo na aba de Ações","s":"cancelado","d":"**Descrição Refinada**\nA aba de Ações não mostra o funil completo do acionamento. Levar para lá a visão de funil ponta a ponta, do disparo até o desfecho, no mesmo recorte que a aba já usa.\n\nEscopo:\n- Definir as etapas do funil que a aba de Ações precisa mostrar.\n- Implementar a visão de funil respeitando os filtros da aba.\n- Garantir que o funil e os cards da aba contem a mesma história.\n\n**Observação**\nEscopo genérico — o negócio precisa dizer quais etapas compõem esse funil e onde ele começa e termina. Há sobreposição a esclarecer com a refatoração dos dashboards (R45 · #6856, na fila): se o funil ponta a ponta for definido lá, este item pode virar só a réplica na aba de Ações. Alinhar antes de executar para não construir duas vezes. O funil do dashboard já teve problema de performance (ref. #5700, entregue) — validar a consulta.\n\n**Objetivo**\nA aba de Ações mostra o funil completo do acionamento, coerente com os números dos cards da própria aba.","edd":"2026-09-21","c":[{"a":"João Vinícius","e":null,"dt":"2026-09-17T19:30:53.612007+00:00","x":"@João Pedro Borges Martins movi pra cancelada essa aqui pois entendo que vai entrar na questão do artefato das métricas também, quando formos fazer relembramos dessa aqui\n","i":false}],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-09-02T22:22:11.876336+00:00","por":"João Vinícius"},{"de":"fila_exec","para":"cancelado","dt":"2026-09-17T19:29:53.491627+00:00","por":"João Vinícius"}]},"7322":{"t":"Permissões personalizáveis","s":"cancelado","d":"**Descrição Refinada**\nA Torre tem hoje 5 papéis fixos (Owner > Admin > Manager > Operator > Viewer), com RBAC no front e RLS no backend. Permitir personalizar permissões e criar novos cargos, flexibilizando essa matriz.\n\nEscopo:\n- Permitir criar cargos além dos 5 papéis atuais.\n- Permitir personalizar as permissões de cada cargo.\n- Manter a consistência entre o RBAC do front e o RLS do backend.\n\n**Observação**\nPrecisa de alinhamento com o João Vinícius antes de qualquer implementação — o desenho da matriz é decisão dele. Risco técnico relevante: permissão na Torre é aplicada em duas camadas (RBAC no front e RLS no banco), e flexibilizar a matriz sem manter as duas em sincronia abre brecha de acesso. Esforço alto; considerar fatiar entre \"criar cargo\" e \"personalizar permissão\".\n\n**Objetivo**\nA Torre permite criar cargos e definir suas permissões, sem depender dos 5 papéis fixos e sem divergência entre o que o front esconde e o que o banco protege.","edd":null,"c":[],"h":[{"de":"backlog","para":"cancelado","dt":"2026-09-02T18:11:18.442455+00:00","por":"João Vinícius"},{"de":"cancelado","para":"backlog","dt":"2026-09-02T18:12:42.305509+00:00","por":"João Vinícius"},{"de":"backlog","para":"backlog_futuro","dt":"2026-09-02T18:13:28.951286+00:00","por":"João Vinícius"},{"de":"backlog_futuro","para":"backlog","dt":"2026-11-10T12:21:30.747901+00:00","por":"João Vinícius"},{"de":"backlog","para":"cancelado","dt":"2026-11-10T12:21:34.040381+00:00","por":"João Vinícius"}]},"7323":{"t":"IA omnicanal — N1 em todos os canais","s":"finalizado","d":"**Descrição Refinada**\nA IA atende hoje apenas no WhatsApp. Torná-la o atendimento de Nível 1 em todos os canais possíveis: e-mail, RCS, telefone, SMS e push do app.\n\nEscopo:\n- Definir quais canais entram e em que ordem.\n- Adaptar o comportamento da IA por canal.\n- Habilitar o N1 em cada canal habilitado.\n\n**Observação**\nAvaliar a necessidade real antes de executar — falta refinamento do negócio sobre quais canais valem o esforço. Ressalva técnica: a Esperanza é otimizada para canal síncrono, então expandir para e-mail e SMS não é só ligar um switch, exige adaptar o modo de conversa por canal (tempo de resposta, tamanho de mensagem, ausência de contexto contínuo). Trabalho anterior relacionado, de outro recorte: ref. #3291 (IA N1 em 100% dos atendimentos de cobrança, finalizado) — aquele tratava cobertura de volume, este trata cobertura de canal.\n\n**Objetivo**\nA IA responde como Nível 1 nos canais definidos pelo negócio, e não apenas no WhatsApp.","edd":null,"c":[{"a":"João Pedro","e":null,"dt":"2026-09-02T18:17:47.901192+00:00","x":"Atualmente, WhatsApp e RCS já possuem atendimento via IA em operação, incluindo transferência para atendimento humano quando necessário.\n\nO E-mail ficará fora do escopo nesta etapa, devido ao baixo volume e ao perfil das interações, que são majoritariamente promessas de pagamento, confirmações de recebimento e retornos automáticos.\nHá também uma limitação no tratamento de anexos, pois os documentos recebidos são criptografados e, atualmente, não conseguimos disponibilizar seu conteúdo para visualização e análise pelo agente.\n\nCaso o volume de e-mails aumente significativamente no futuro, o canal poderá ser reavaliado através de um estudo específico de viabilidade, custo e esforço.","i":false}],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-09-02T18:05:05.378594+00:00","por":"João Vinícius"},{"de":"fila_exec","para":"em_andamento","dt":"2026-09-02T18:14:21.544996+00:00","por":"João Pedro"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-02T18:17:55.80498+00:00","por":"João Pedro"},{"de":"em_validacao","para":"finalizado","dt":"2026-09-07T09:00:03.595696+00:00","por":"Automático (Quimera)"}]},"7325":{"t":"Logs de auditoria da Torre","s":"finalizado","d":"**Descrição Refinada**\nA Torre não tem trilha de auditoria. Registrar as ações realizadas na plataforma e expor esse histórico ao nível proprietário, em modelo semelhante ao log de auditoria do Discord.\n\nEscopo:\n- Definir quais ações são auditáveis e quais campos cada registro guarda.\n- Persistir a trilha de auditoria.\n- Expor a consulta do histórico ao nível proprietário.\n\n**Observação**\nEsforço alto e dependência dura: fica para depois da refatoração da Torre. Auditar tudo cria volume de escrita em toda ação da plataforma — definir o recorte antes, sob risco de impacto em performance e custo de armazenamento. Não confundir com a consolidação de análises da Torre já entregue (ref. #4982), que é documento, não trilha de sistema.\n\n**Objetivo**\nO nível proprietário consegue consultar quem fez o quê e quando dentro da Torre.","edd":"2026-09-25","c":[],"h":[{"de":"backlog","para":"cancelado","dt":"2026-09-02T18:09:57.855715+00:00","por":"João Vinícius"},{"de":"cancelado","para":"backlog","dt":"2026-09-02T18:13:12.413602+00:00","por":"João Vinícius"},{"de":"backlog","para":"backlog_futuro","dt":"2026-09-02T18:13:22.830319+00:00","por":"João Vinícius"},{"de":"backlog_futuro","para":"backlog","dt":"2026-09-09T12:49:35.226191+00:00","por":"João Vinícius"},{"de":"backlog","para":"fila_exec","dt":"2026-09-09T12:49:45.890321+00:00","por":"João Vinícius"},{"de":"fila_exec","para":"em_andamento","dt":"2026-09-14T12:45:44.58997+00:00","por":"Marcos"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-17T12:28:49.346564+00:00","por":"Marcos"},{"de":"em_validacao","para":"finalizado","dt":"2026-09-17T12:34:17.03496+00:00","por":"João Vinícius"}]},"7326":{"t":"Gestão de custos da Torre","s":"finalizado","d":"**Descrição Refinada**\nA Torre não mostra o custo da operação que ela mesma executa. Criar a visão de gestão de custo dentro da plataforma, contemplando disparos, metas, campanhas e agentes.\n\nEscopo:\n- Definir a fonte e a fórmula de custo de cada dimensão (disparo, campanha, agente).\n- Implementar a visão de custo dentro da Torre.\n- Permitir comparar custo contra meta.\n\n**Observação**\nDepende de decisão de negócio antes de virar dev: de onde vem o custo de cada canal e de cada agente, e se a apuração é por disparo, por conversa ou por período. Sem essa definição não há o que implementar. Existe análise anterior de redução de custos (ref. #4398, finalizado) que pode servir de base para a fórmula — conferir antes de começar do zero. Este ticket ainda não tem responsável definido.\n\n**Objetivo**\nA Torre mostra quanto custa a operação de cobrança por disparo, campanha e agente, permitindo acompanhar o custo contra a meta.","edd":"2026-09-30","c":[],"h":[{"de":"backlog","para":"backlog_futuro","dt":"2026-09-02T19:35:33.560527+00:00","por":"João Vinícius"},{"de":"backlog_futuro","para":"backlog","dt":"2026-09-04T13:52:38.172198+00:00","por":"João Vinícius"},{"de":"backlog","para":"fila_exec","dt":"2026-09-08T13:00:41.487217+00:00","por":"João Vinícius"},{"de":"fila_exec","para":"em_andamento","dt":"2026-09-16T15:27:54.883304+00:00","por":"Marcos"},{"de":"em_andamento","para":"bloqueado","dt":"2026-09-28T01:32:43.718559+00:00","por":"Marcos"},{"de":"bloqueado","para":"em_validacao","dt":"2026-09-28T01:32:46.208022+00:00","por":"Marcos"},{"de":"em_validacao","para":"finalizado","dt":"2026-09-29T14:28:56.270667+00:00","por":"João Vinícius"}]},"7376":{"t":"Inclusão de novos e-mails no Hyper","s":"finalizado","d":"<p>Bom dia Senhores(as),<\/p><p><\/p><p>Precisamos cadastrar os e-mails abaixo no Hyper. <br>O Bitrix foi configurado com eles, e em especial o Finza, será cadastrado no site. <br>O time precisa ter acesso as respostas para tratativas. <br><br>Acredito que será necessário alguns parâmetros adicionais para configurar as contas no Hyper, além da senha. Nesse caso, precisa solicitar diretamente ao Miquéias.<br><br><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"mailto:relacionamento.financeiro@blips.com.br\">relacionamento.financeiro@blips.com.br<\/a><br><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"mailto:relacionamento.financeiro@finza.com.br\">relacionamento.financeiro@finza.com.br<\/a><br><br>Blips@123!@#<br>Finza@123!@#<\/p><p><\/p><p>Grato J<\/p>","edd":null,"c":[{"a":"João Pedro","e":null,"dt":"2026-09-03T13:46:13.868295+00:00","x":"Os e-mail já estão configurados dentro do hyperflow mantendo o padrão anterior que a gente já possuia, caso seja recebido um e-mail transferimos para 'Cobrança - Email' e passamos uma anotação com as informações de contrato baseado na mensagem que foi enviada ao cliente e também consultando no BQ para verificar se é um email no nosso banco de dados. \n\nInformação importante: Para configurar e-mails dentro do hyperflow precisamos ativar o segundo fator de autenticação(2fa) onde hoje estamos utilizando o celular do Dessimoni, caso seja necessário o login e pedir código pode falar diretamente com ele.","i":false}],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-09-03T13:43:10.716314+00:00","por":"João Vinícius"},{"de":"fila_exec","para":"em_andamento","dt":"2026-09-03T13:46:26.023883+00:00","por":"João Pedro"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-03T13:46:29.251773+00:00","por":"João Pedro"},{"de":"em_validacao","para":"finalizado","dt":"2026-09-03T17:18:22.967653+00:00","por":"Sistema/Negócio"}]},"7378":{"t":"Suprimentos | Torre","s":"finalizado","d":"<p>Bom dia Senhores(as),<\/p><p><\/p><p>Suprimentos está com grande % de falha nas ações diferente do comportamento dos que não são suprimentos. Investigando vi que é porque está sendo gerado ações pra clientes mesmo sem telefone e na hora de disparar ação pra ele da falha. Mas este nem é o real problema, pelo que vi são clientes que tem número de telefone porém por algum motivo não tem na torre. Peço que corrijam pra os suprimentos terem telefone.<\/p><p><\/p><p>Grato J<\/p>","edd":null,"c":[{"a":"Marcos","e":null,"dt":"2026-09-08T21:38:08.892718+00:00","x":"Já em produção. Respondendo separadamente às duas partes do seu pedido, porque elas têm respostas diferentes.\n\n**PARTE 1 — ação nascendo para cliente sem telefone: CORRIGIDA.**\n\nOnde validar, **a partir da execução de amanhã às 07:30** (o deploy foi depois da execução de hoje, então o motor ainda não rodou com a correção):\n\n1) Torre
