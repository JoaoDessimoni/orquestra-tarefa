na Torre e qual serviço responde pelo blocklist. Ação em massa sobre blocklist é destrutiva — desbloquear em lote pode reabrir cobrança para quem não deveria receber. Prever confirmação explícita e registro de quem executou. Não confundir com o ajuste de granularidade por régua (ref. #6219, cancelado) nem com os ajustes pontuais já entregues (ref. #3939, #3424).\n\n**Objetivo**\nA operação bloqueia e desbloqueia listas de clientes em uma única ação, com prazo configurável e liberação automática, sem depender de operação individual.","c":[{"a":"Sistema/Negócio","e":null,"dt":"2026-09-11T17:53:11.311725+00:00","x":"Que loucura, deu certo mesmo","i":false},{"a":"Marcos","e":null,"dt":"2026-09-11T14:06:12.375936+00:00","x":"Nao entendi... hj vc ja consegue adicionar um numero para bloquear que nao está na torre... numero e email.... ","i":false},{"a":"Sistema/Negócio","e":null,"dt":"2026-09-11T13:58:42.010324+00:00","x":"[Solicitação de ajustes] descrito acima","i":false},{"a":"Sistema/Negócio","e":null,"dt":"2026-09-11T13:58:32.461082+00:00","x":"Legal sobre os 2 primeiros pontos era falta de conhecimento mesmo. Sobre o 3° exemplo enriquecimento número que foi acionado e não está na torre e não é o cliente. ","i":false},{"a":"Marcos","e":null,"dt":"2026-09-10T21:35:03.449785+00:00","x":"Sobre  o desbloquear em massa: \n![image.png](attachment://eebc864f-b4c5-4e6b-8c65-3515ea9c788b/1789075851895_efebad91-34fc-4f5e-935b-60fb8bc71e8c_image.png)\nBasta clicar em liberar em massa, que todo contato adicionado por essa funcionalidade, independente de qualquer outro bloqueio possível q ele esteja, será ignorado. \n\nSobre o deletar, existe a opçao sim, mas nao para contatos bloqueados a partir de uma regra (a opcao de bloquear por filtro) para remover os bloqueados por filtro, tem q remover o bloqueio por regra\n![image.png](attachment://eebc864f-b4c5-4e6b-8c65-3515ea9c788b/1789075974473_fca1b983-498f-4bfb-8567-51e17c634773_image.png)\n\nSobre criar  adicionar na blocklist clientes que nao estão na Torre é possível via manual por email ou numero, vc precisa adicionar contratos ou titulos sem estar na torre tambem? Consegue me explicar o motivo?\n![image.png](attachment://eebc864f-b4c5-4e6b-8c65-3515ea9c788b/1789076086506_5e40ee43-a0a6-4ad1-8c8f-ecbb25aec6bc_image.png)\n","i":false},{"a":"Sistema/Negócio","e":null,"dt":"2026-09-10T20:51:40.674641+00:00","x":"Pelo que verifiquei não tem opção de desbloquear em massa.\n![image.png](attachment://eebc864f-b4c5-4e6b-8c65-3515ea9c788b/1789073325021_f9c4641b-9ba6-40db-b6ba-65a74bfc54d7_image.png)\n\nTambém não tem como deletar algum blocklist incorreto ou editar pra talvez ajustar o blocklist incorreto.\n![image.png](attachment://eebc864f-b4c5-4e6b-8c65-3515ea9c788b/1789073361493_04c062eb-cd88-4261-8ee2-3d024015d2de_image.png)\n\nTambém não é possível adicionar blocklist de um cliente que não pertence a torre. Isso é importante pois atualmente usamos a torre como fonte verdadeira de qualquer tipo de blocklist e pra adicionar um cliente externo de forma manual não é possível, pode não fazer sentido para o time tech mas pro time de negócio é importante.\n![image.png](attachment://eebc864f-b4c5-4e6b-8c65-3515ea9c788b/1789073439552_57bb65ed-0955-4b4a-a9cf-1720f16b4acf_image.png)\n","i":false},{"a":"Sistema/Negócio","e":null,"dt":"2026-09-10T20:48:38.533823+00:00","x":"[Solicitação de ajustes] .","i":false},{"a":"Marcos","e":null,"dt":"2026-09-10T01:40:08.768988+00:00","x":"Entregue e já em produção.\n\nOnde validar: Torre de Controle > Carteira > Blocklist.\n\n1) Na aba \"Bloqueios ativos\", use \"Bloquear em massa\". Escolha o tipo de alvo, cole a lista (um CPF/CNPJ por linha; vírgula e ponto-e-vírgula também funcionam) e clique em Resolver. Ele mostra quantos encontrou e quais não existem no cadastro antes de gravar qualquer coisa. O botão de confirmar só habilita depois disso, e traz a contagem do que vai ser afetado.\n\n2) Preencha \"Bloquear até\" com uma data para o bloqueio cair sozinho no fim do prazo, ou deixe vazio para bloqueio sem prazo.\n\n3) Na aba nova, \"Desbloqueados\", use \"Liberar em massa\" do mesmo jeito. É o passe livre: o cliente volta a ser acionado mesmo continuando bloqueado por uma regra.\n\n4) Nas regras de bloqueio por filtro há um campo novo, \"Regra vale até\". Na data escolhida a regra para de gerar bloqueios e os que ela já tinha criado são removidos.\n\nO que faltava: o bloqueio era um a um, e havia um caso sem saída. Na Blips, 196 dos 285 bloqueios ativos vinham de regra automática e cobriam 175 clientes — e nenhum deles podia ser removido individualmente. Para liberar um único cliente só existia pausar a regra inteira, o que soltava os 175 de uma vez. Também passamos a registrar quem executou cada bloqueio; esse campo estava em branco nos 297 bloqueios que existiam.\n\nO que não muda:\n- O cadeado continua aparecendo na carteira para quem tem passe livre. É de propósito: liberar não apaga o bloqueio, neutraliza. Se a liberação tiver prazo e vencer, o bloqueio volta a valer sozinho.\n- \"Liberando na quitação\" só vale para bloqueio criado por regra de filtro. Bloqueio manual sai por prazo ou por remoção — não some sozinho quando o cliente paga.\n- Colar lista vale para cliente, contrato, suprimento, e-mail e telefone. Título e parcela de suprimento continuam um a um, porque o número deles se repete entre contratos e uma lista atingiria o alvo errado.\n- Não existe serviço externo de blocklist para integrar: a própria Torre é quem responde por ele.\n\nNada foi liberado automaticamente. Todos os bloqueios existentes continuam valendo até alguém criar um desbloqueio.","i":false}]},"7319":{"t":"Botões sem funcionamento","s":"finalizado","d":"**Descrição Refinada**\nExistem botões na Torre que não abrem nada ou não executam a ação esperada. Mapear todos, corrigir os que estão quebrados e homologar o comportamento de cada um.\n\nEscopo:\n- Mapear os botões da Torre, separando o que abre do que não abre.\n- Corrigir os que não executam a ação esperada.\n- Homologar o comportamento de cada botão corrigido.\n\n**Observação**\nTecnicamente simples, mas o escopo está aberto: o negócio precisa dizer quais botões não funcionam. Sem essa lista o mapeamento vira varredura da Torre inteira e o esforço deixa de ser previsível. Fechar a lista antes de entrar em execução.\n\n**Objetivo**\nTodo botão da Torre executa a ação que promete, com o comportamento homologado.","c":[{"a":"Sistema/Negócio","e":null,"dt":"2026-09-08T13:43:29.961581+00:00","x":"Bom dia Dessimoni tudo bem? Até consigo sim clicar em cada botão e ver se ele está clicável/funcional e te reportar, porém, na minha visão é algo que deveria ser testado por vocês se aplicação está com alguma falha de funcionalidade nos botões existentes até porque com a IA e o código-fonte em mãos podem pedir pra ela validar a funcionalidade. Discorda do meu ponto de vista? Realmente deveria ser o time de negócio a testar funcionalidade de botões da aplicação?","i":false},{"a":"João Vinícius","e":null,"dt":"2026-09-04T13:02:54.634359+00:00","x":"@João Pedro Borges Martins entendo que isso é você que tem que nos mostrar oque não esta funcionando com exatidão, não conseguimos fazer o regressivo completo na torre até porque temos outros itens na fila e temos uma capacidade limitada. Peço para que você faça uma analise completa do que funciona e do que não funciona para começarmos essa demanda","i":false}]},"7320":{"t":"Filtros e busca globais da Torre","s":"finalizado","d":"**Descrição Refinada**\nOs filtros da Torre não funcionam por completo: alguns estão com bug, outros filtram incorretamente, e há filtros presentes em algumas abas e ausentes em outras. Revisar todos, criar um padrão único de filtro e melhorar a busca global.\n\nEscopo:\n- Revisar todos os filtros da Torre, aba por aba.\n- Definir e aplicar um padrão único de filtro.\n- Melhorar a busca global por documento, telefone, contrato e e-mail.\n\n**Observação**\nItem genérico no estado atual — precisa de refinamento maior com o negócio antes de estimar: quais filtros não funcionam exatamente. Sem essa lista, \"revisar todos os filtros\" é escopo aberto. Atenção à performance: os filtros da Torre já causaram timeout antes (ref. #5700, #5702, #5703, todos entregues), então validar o plano de execução das consultas. Trabalho anterior de escopo menor no mesmo domínio: ref. #3343 (busca por nome, finalizado).\n\n**Objetivo**\nTodo filtro da Torre funciona de forma consistente e previsível, seguindo um padrão único, e a busca global encontra o cliente por documento, telefone, contrato ou e-mail.","c":[]},"7321":{"t":"Funil completo na aba de Ações","s":"cancelado","d":"**Descrição Refinada**\nA aba de Ações não mostra o funil completo do acionamento. Levar para lá a visão de funil ponta a ponta, do disparo até o desfecho, no mesmo recorte que a aba já usa.\n\nEscopo:\n- Definir as etapas do funil que a aba de Ações precisa mostrar.\n- Implementar a visão de funil respeitando os filtros da aba.\n- Garantir que o funil e os cards da aba contem a mesma história.\n\n**Observação**\nEscopo genérico — o negócio precisa dizer quais etapas compõem esse funil e onde ele começa e termina. Há sobreposição a esclarecer com a refatoração dos dashboards (R45 · #6856, na fila): se o funil ponta a ponta for definido lá, este item pode virar só a réplica na aba de Ações. Alinhar antes de executar para não construir duas vezes. O funil do dashboard já teve problema de performance (ref. #5700, entregue) — validar a consulta.\n\n**Objetivo**\nA aba de Ações mostra o funil completo do acionamento, coerente com os números dos cards da própria aba.","c":[{"a":"João Vinícius","e":null,"dt":"2026-09-17T19:30:53.612007+00:00","x":"@João Pedro Borges Martins movi pra cancelada essa aqui pois entendo que vai entrar na questão do artefato das métricas também, quando formos fazer relembramos dessa aqui\n","i":false}]},"7322":{"t":"Permissões personalizáveis","s":"cancelado","d":"**Descrição Refinada**\nA Torre tem hoje 5 papéis fixos (Owner > Admin > Manager > Operator > Viewer), com RBAC no front e RLS no backend. Permitir personalizar permissões e criar novos cargos, flexibilizando essa matriz.\n\nEscopo:\n- Permitir criar cargos além dos 5 papéis atuais.\n- Permitir personalizar as permissões de cada cargo.\n- Manter a consistência entre o RBAC do front e o RLS do backend.\n\n**Observação**\nPrecisa de alinhamento com o João Vinícius antes de qualquer implementação — o desenho da matriz é decisão dele. Risco técnico relevante: permissão na Torre é aplicada em duas camadas (RBAC no front e RLS no banco), e flexibilizar a matriz sem manter as duas em sincronia abre brecha de acesso. Esforço alto; considerar fatiar entre \"criar cargo\" e \"personalizar permissão\".\n\n**Objetivo**\nA Torre permite criar cargos e definir suas permissões, sem depender dos 5 papéis fixos e sem divergência entre o que o front esconde e o que o banco protege.","c":[]},"7323":{"t":"IA omnicanal — N1 em todos os canais","s":"finalizado","d":"**Descrição Refinada**\nA IA atende hoje apenas no WhatsApp. Torná-la o atendimento de Nível 1 em todos os canais possíveis: e-mail, RCS, telefone, SMS e push do app.\n\nEscopo:\n- Definir quais canais entram e em que ordem.\n- Adaptar o comportamento da IA por canal.\n- Habilitar o N1 em cada canal habilitado.\n\n**Observação**\nAvaliar a necessidade real antes de executar — falta refinamento do negócio sobre quais canais valem o esforço. Ressalva técnica: a Esperanza é otimizada para canal síncrono, então expandir para e-mail e SMS não é só ligar um switch, exige adaptar o modo de conversa por canal (tempo de resposta, tamanho de mensagem, ausência de contexto contínuo). Trabalho anterior relacionado, de outro recorte: ref. #3291 (IA N1 em 100% dos atendimentos de cobrança, finalizado) — aquele tratava cobertura de volume, este trata cobertura de canal.\n\n**Objetivo**\nA IA responde como Nível 1 nos canais definidos pelo negócio, e não apenas no WhatsApp.","c":[{"a":"João Pedro","e":null,"dt":"2026-09-02T18:17:47.901192+00:00","x":"Atualmente, WhatsApp e RCS já possuem atendimento via IA em operação, incluindo transferência para atendimento humano quando necessário.\n\nO E-mail ficará fora do escopo nesta etapa, devido ao baixo volume e ao perfil das interações, que são majoritariamente promessas de pagamento, confirmações de recebimento e retornos automáticos.\nHá também uma limitação no tratamento de anexos, pois os documentos recebidos são criptografados e, atualmente, não conseguimos disponibilizar seu conteúdo para visualização e análise pelo agente.\n\nCaso o volume de e-mails aumente significativamente no futuro, o canal poderá ser reavaliado através de um estudo específico de viabilidade, custo e esforço.","i":false}]},"7325":{"t":"Logs de auditoria da Torre","s":"finalizado","d":"**Descrição Refinada**\nA Torre não tem trilha de auditoria. Registrar as ações realizadas na plataforma e expor esse histórico ao nível proprietário, em modelo semelhante ao log de auditoria do Discord.\n\nEscopo:\n- Definir quais ações são auditáveis e quais campos cada registro guarda.\n- Persistir a trilha de auditoria.\n- Expor a consulta do histórico ao nível proprietário.\n\n**Observação**\nEsforço alto e dependência dura: fica para depois da refatoração da Torre. Auditar tudo cria volume de escrita em toda ação da plataforma — definir o recorte antes, sob risco de impacto em performance e custo de armazenamento. Não confundir com a consolidação de análises da Torre já entregue (ref. #4982), que é documento, não trilha de sistema.\n\n**Objetivo**\nO nível proprietário consegue consultar quem fez o quê e quando dentro da Torre.","c":[]},"7326":{"t":"Gestão de custos da Torre","s":"finalizado","d":"**Descrição Refinada**\nA Torre não mostra o custo da operação que ela mesma executa. Criar a visão de gestão de custo dentro da plataforma, contemplando disparos, metas, campanhas e agentes.\n\nEscopo:\n- Definir a fonte e a fórmula de custo de cada dimensão (disparo, campanha, agente).\n- Implementar a visão de custo dentro da Torre.\n- Permitir comparar custo contra meta.\n\n**Observação**\nDepende de decisão de negócio antes de virar dev: de onde vem o custo de cada canal e de cada agente, e se a apuração é por disparo, por conversa ou por período. Sem essa definição não há o que implementar. Existe análise anterior de redução de custos (ref. #4398, finalizado) que pode servir de base para a fórmula — conferir antes de começar do zero. Este ticket ainda não tem responsável definido.\n\n**Objetivo**\nA Torre mostra quanto custa a operação de cobrança por disparo, campanha e agente, permitindo acompanhar o custo contra a meta.","c":[]},"7562":{"t":"Escopo Métricas IA | Torre de Controle ( Continuação da #6856 )","s":"cancelado","d":"<p>Boa tarde Senhores(as),</p><p></p><p>Dessimoni segue conforme solicitado a abertura de uma nova demanda com foco no escopo da métricas feito pela Jéssica.</p><p><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://claude.ai/code/artifact/e73b0d2c-d35e-4676-b7b6-4dd91fbe54a4\"><span style=\"color: rgb(0, 0, 0); font-size: 14px;\">https://claude.ai/code/artifact/e73b0d2c-d35e-4676-b7b6-4dd91fbe54a4</span></a></p><p>Fico no aguardo do SLA conforme falamos na nossa FUP na 1a semana de setembro.</p><p></p><p>Grato J</p>","c":[{"a":"João Vinícius","e":null,"dt":"2026-11-10T12:20:43.529881+00:00","x":"@João Pedro Borges Martins essa demanda ta sendo atendida nos cards de desenvolvimento dos agentes, vou cancelar ela aqui só pra não ficar com card duplicado\n","i":false}]},"7886":{"t":"Importar base externa para disparo | Torre de Controle","s":"finalizado","d":"<p>Bom dia Senhores(as),</p><p></p><p>No passado recente quando apresentaram sobre a nova aba DISPAROS me perguntaram se atenderia e me recordo de ter falado sobre listas/arquivos externos de clientes/telefone/email que não estão na torre.</p><p>Peço que seja possível importar um arquivo no qual temos que definir o melhor formato para a implantação dessa melhoria.</p><p>O intuito é usar a torre pra fazer ações até para clientes/contatos que não estão na torre.</p><p></p><img class=\"kb-img\" src=\"attachment://4e8498fb-a8b3-4887-a112-76e1117c5306/1789393816270_image.png\" alt=\"image.png\"><p></p><p>Grato J</p><p></p>","c":[]},"7897":{"t":"Nova Era | Bitrix","s":"finalizado","d":"<p>Bom dia Senhores(as),</p><p></p><p>João Neto, segue documentos que falamos sobre o Bitrix. Nele focamos mais em como queremos que esteja. E o que quero dizer com isto? Se tem Card Jurídico criado o foco foi em orientar que queremos que seja retirado contratos jurídico e como tirar.</p><p>Muitos pontos que já estão OK/funcionando exemplo acionamento pelo Bitrix não é mencionado porque está OK, não quer dizer que queremos que retire ou mexido.</p><p>Caso ao ler o documento veja que algum ajuste que propomos irá quebrar algo ou não faz sentido peço que entre em contato pra gente nos alinhar pois de fato tem muitas coisas aplicadas no Bitrix antes de eu assumir esse processo aqui do time de negócio Finza e que posso não ter conhecimento e acabar quebrando o que já funciona por falta de conhecimento mesmo, por isso nossa parceria será primordial pra chegarmos no outro lado.</p><p></p><p>É um tema muito importante que não conseguimos de fato resolver até hoje, tivemos grandes avanços sim porém ainda não sentimos confortáveis e temos vários GAPS por isso pedindo apoio ao time pra juntos resolvermos esse problema.</p><p></p><p>São 3 Bitrix que será tratado nessa demanda que pra nós é prioridade alta:<br>Formalização: <a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://blips.bitrix24.com.br/crm/deal/category/5/\">https://blips.bitrix24.com.br/crm/deal/category/5/</a><br>Cobrança: <a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://blips.bitrix24.com.br/page/logistica_reversa/todas_as_opcoes_selecionadas/type/1070/kanban/category/203/\">https://blips.bitrix24.com.br/page/logistica_reversa/todas_as_opcoes_selecionadas/type/1070/kanban/category/203/</a><br>Distrato/Retirada: <a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://blips.bitrix24.com.br/page/logistica_reversa/todas_as_opcoes_selecionadas/type/1070/kanban/category/69/\">https://blips.bitrix24.com.br/page/logistica_reversa/todas_as_opcoes_selecionadas/type/1070/kanban/category/69/</a></p><p></p><p>Documentação de Cobrança, Distrato/Retirada: <a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://claude.ai/code/artifact/6ab1126b-ee84-4be8-979e-7abd86cda7a0?sk=LK2FQvjLe17xGr1J0_hX0g\">https://claude.ai/code/artifact/6ab1126b-ee84-4be8-979e-7abd86cda7a0?sk=LK2FQvjLe17xGr1J0_hX0g</a></p><p>Formalização está em anexo.</p><p>Grato J</p>","c":[{"a":"João Pedro","e":null,"dt":"2026-10-22T02:56:25.617759+00:00","x":"Atualização: Formalização (funil 5 do Bitrix)\n\nA parte da Formalização que é do time de IA está em produção. A partir de agora, a automação move o card em três momentos:\n\n1. Link de biometria enviado ao cliente: o card vai para Biometria.\n2. Sinal pago no financiado ou na locação: cerca de 35 min depois, o card sai de Pagamento de Sinal e vai para a raia da etapa atual na plataforma, normalmente Endereço do Responsável.\n3. Sinal pago na compra à vista: cerca de 35 min depois, o card vai para Checklist Vistoria.\n\nTambém paramos de criar card duplicado quando o Bitrix falha na consulta.\n\nO que encontramos: quem move a maior parte do funil é um robô do painel do Bitrix.\n\nO que não é do time de IA e foi encaminhado:\n- Time de Processos: 10 ajustes no painel, em documento anexo. Entre eles: regras de Endereço, Formalização e cancelado, responsável por raia, ordem das raias com Pagamento de Sinal primeiro, a raia Reprovado Compliance e a limpeza de 249 cards inconsistentes.\n- Time de negócio: decidir se e como mover os 14 cards que já estavam parados em Pagamento de Sinal antes da automação. A planilha está em anexo:\n\n\n![03-estoque-sinal-mover-a-mao.csv](attachment://42a221e6-187e-4012-a981-30d9ea9e8af9/1792637782836_673be463-7254-4c90-8166-c15ee6828058_03-estoque-sinal-mover-a-mao.csv)\n","i":false},{"a":"João Pedro","e":null,"dt":"2026-10-22T02:54:53.273519+00:00","x":"Atualização: funis de Cobrança (203) e Logística Reversa (69)\n\n1. Nova esteira de Cobrança: em produção desde 06/10/2026.\n- O que mudou: a esteira que cria e atualiza os cards da Cobrança foi refeita e substituiu as duas antigas.\n- Mais rápida:\n  - a rodada das 05:30, que é a mais pesada, leva cerca de 1 h;\n  - as rodadas das 07:00, 12:00 e 16:00 levam de 3 a 11 min;\n  - antes, só a criação levava de 52 a 176 min.\n- Horários: 05:30 (cria e atualiza), 07:00, 12:00 e 16:00 (atualizam), de segunda a sexta. Os dias de atraso continuam sendo gravados todos os dias.\n- Regras incluídas: cards preventivos (D-10 a D0), novos originadores em raia própria, blocklist da Torre por nível, Finza com prioridade sobre FIDC e responsável por raia e faixa de atraso.\n\n2. Movimentação entre raias da 203: concluída por Processos em 19/10.\n- O workflow de Processos passou a mover os cards entre raias pela regra que definimos.\n- Conferimos 2.718 cards abertos: nenhum estava na raia errada. O aceite foi dado em 21/10.\n- A entrada na raia Suprimentos parou depois da mudança de 19/10. Processos corrigiu em 21/10: 45 cards entraram e não sobrou suprimento em Nova Solicitação.\n\n3. Jurídico: regra corrigida (detalhes na IAF-10714).\n- O que aconteceu: em 06/10 a esteira passou a levar ao Jurídico cards da Logística Reversa e da Cobrança com critério largo demais. A cada movimentação, um robô do Bitrix abria um card no Jurídico Ativo.\n- Correção de 19/10:\n  - os 254 cards movidos desde 06/10 voltaram para a etapa de origem;\n  - os cards duplicados no Jurídico Ativo foram excluídos;\n  - a esteira não tira mais card das 8 etapas físicas da 69 (Logística, Manutenção Interna, Termo/Laudo, Abertura de OS, Agendamento, Retirada com Técnico, Aguardando Emissão NF e Retirada Odeen).\n- Regra definitiva, desde 21/10:\n  - cliente com sinal jurídico não ganha card de cobrança. Sinal jurídico é a marcação na plataforma, o bloqueio judicial na Torre ou um card aberto no Jurídico;\n  - se o card já existe na 203, ele vai para a perda \"Jurídico\" da própria 203, olhando só o contrato do card;\n  - a 69 não é tocada.\n\n4. Logística Reversa (69)\n- Dias em atrasos passam a atualizar\n- Os 64 cards de etapa física que tinham ido para a perda voltaram para a origem (opção B de Processos) e continuam lá nas rodadas de 20 e 21/10.\n- Os responsáveis do funil 69 foram confirmados por Processos.","i":false},{"a":"Sistema/Negócio","e":null,"dt":"2026-09-15T12:59:40.437659+00:00","x":"Peço que se toda essa mudança for impactar a operação enquanto correções/ajustes são aplicados seja criado outra régua. ","i":false},{"a":"Sistema/Negócio","e":null,"dt":"2026-09-14T14:35:03.970967+00:00","x":"\n![MODELO IDEAL CONTRATOS À VISTA.png](attachment://42a221e6-187e-4012-a981-30d9ea9e8af9/1789396493511_3e3836b3-d74a-4772-b963-013b940d4612_modelo-ideal-contratos-a-vista.png)\n\n![MODELO IDEAL BITRIX FORMALIZAÇÃO (1).png](attachment://42a221e6-187e-4012-a981-30d9ea9e8af9/1789396498845_21eb646a-74cd-4e59-8d4a-a5a70104dc33_modelo-ideal-bitrix-formalizacao-1.png)\n","i":false}]},"8215":{"t":"Novos tipos de mensagem | Torre de Controle & Hyper","s":"finalizado","d":"<p>Boa tarde Senhores(as),</p><p></p><p>Peço que avaliem e que possamos fazer uma call para inclusão de templates ou tipos de mensagem sendo elas:<br>Audio e imagem nas ferramentas que forem possíveis exemplo (wpp,rcs,email)<br>Intuito melhorar engajamento com o cliente.</p><p></p><p>Caso tenha outro tipo de mensagem possível a ser enviada peço que traga pra nossa pauta e que nos diga as possibilidades de audio e imagem pra melhor escoparmos a demanda.</p><p></p><p>Grato J</p>","c":[{"a":"Marcos","e":null,"dt":"2026-10-19T18:51:45.026021+00:00","x":"Entregue e já em produção.\n\nA Torre passou a mandar imagem e áudio junto com as mensagens. A equipe sobe os arquivos na própria Torre e escolhe qual vai em cada passo da régua, em cada Disparo ou em cada ação manual. O mesmo template pode sair com imagens e áudios diferentes conforme o passo (por exemplo, um áudio no D-3 e outro no D+5).\n\nPor enquanto está funcionando só na Blips. Assim que vocês validarem, levamos para a Finza.\n\nOnde validar (org Blips):\n- Torre de Controle > Disparos\n- Torre de Controle > Réguas > passo de WhatsApp ou RCS > fase \"Conteúdo\"\n- No cliente > \"Nova Ação\"\n- E-mail: editor do template > \"Editar visualmente\" > \"Links, imagens, áudio...\"\n\nEm cada campo há \"Enviar novo\" (sobe do computador) e \"Escolher da biblioteca\" (reaproveita o que a equipe já subiu).\n\nPara testar, criamos dois templates de WhatsApp no número da Blips, já aprovados pela Meta e disponíveis na Torre:\n- teste_8215_imagem: aviso de contrato com imagem no cabeçalho\n- teste_8215_audio: \"Temos uma mensagem em áudio sobre o seu contrato... Toque em 'Ouvir mensagem' para receber.\", com o botão \"Ouvir mensagem\"\n\nComo testar pela tela de Disparos (use um cliente de teste ou o seu próprio número):\n1) Torre de Controle > Disparos > escolha o cliente e uma integração de WhatsApp da Blips\n2) Imagem: escolha o template teste_8215_imagem. Vai aparecer o campo \"Imagem do cabeçalho\": clique em \"Enviar novo\" e suba um JPG ou PNG. A prévia mostra a imagem no topo da mensagem. Dispare: a mensagem chega com a imagem escolhida\n3) Áudio: escolha o template teste_8215_audio. Vai aparecer o campo \"Áudio após o clique\": suba um arquivo OGG. Dispare: chega a mensagem com o botão \"Ouvir mensagem\". Ao tocar no botão, o áudio chega na hora\n4) Sem escolher a imagem no template de imagem, o botão de disparar fica bloqueado, porque a Meta recusaria o envio\n5) RCS: escolha uma integração de RCS e um template RCS, e suba uma imagem: ela entra no lugar da imagem do card\n\nO que foi testado em 19/10, em produção, com um cliente de teste:\n1) teste_8215_imagem: o template chegou com a imagem escolhida no Disparo\n2) teste_8215_audio: chegou o template com o botão; ao tocar, chegou só o áudio. O atendimento normal só continuou depois que o cliente respondeu\n3) RCS com template: a imagem escolhida substitui a do card\n\nFormatos aceitos:\n- Imagem: JPG ou PNG, até 5 MB (até 2 MB no RCS)\n- Áudio no WhatsApp: OGG com codec Opus. No RCS e no e-mail: MP3. Até 16 MB\n\nO que não muda ou ainda não funciona:\n- Só a Blips por enquanto. Finza (e Ideal, se quiserem) depois da validação de vocês\n- Vídeo e documento ficaram fora desta entrega\n- E-mail não toca áudio dentro da mensagem. O áudio vai como um botão \"Ouvir mensagem\", que abre no navegador\n- RCS com áudio: a Torre já envia, mas o provedor de RCS está recusando o arquivo. Estamos tratando com o Hyperflow. Enquanto isso, a imagem no RCS funciona normalmente\n- No carrossel do RCS, cada card mantém a própria imagem\n\nADENDO - O QUE PRECISAMOS DE VOCÊS\n\n1) Os templates de WhatsApp que vão usar imagem ou áudio. Os dois de teste servem para validar, mas não são para uso com cliente. Cada template definitivo precisa ser criado e aprovado na Meta e configurado no fluxo, então nos passem os textos que querem e para quais números (Blips, Ideal, Finza).\n- Para imagem: o template precisa ser criado com cabeçalho de imagem\n- Para áudio: o template precisa ter um botão de resposta rápida\n\n2) O áudio no WhatsApp precisa de uma mensagem de ativação. A Meta não permite áudio dentro do template. O áudio só pode ser enviado depois que o cliente interage com a mensagem. Então o envio funciona assim:\n- A Torre manda um template de ativação, por exemplo: \"Olá, Maria! Temos uma mensagem em áudio sobre o seu contrato 12345. Toque em 'Ouvir mensagem' para receber.\" com o botão \"Ouvir mensagem\"\n- Quando o cliente toca no botão, o áudio chega na hora\n- Quem não tocar no botão não recebe o áudio\n- Um mesmo template pode ter imagem no cabeçalho e o botão de áudio, para mandar os dois","i":false},{"a":"Marcos","e":null,"dt":"2026-10-06T14:09:10.631496+00:00","x":"Marca a reunião no google, coloca o Dessimoni também","i":false}]},"8351":{"t":"Valentina V2","s":"finalizado","d":"<p>Conforme planejado ao longo da semana passada, esta demanda tem o foco de transcrever a valentina e esperanza atualmente em código em um unico agente valentina; Segue o artefato objetivo:<br><br><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://claude.ai/artifact/G86h7rYqbW3WBquiUcvVHR?sk=RgEjNn3eLf0ad1dURwxaVA\">https://claude.ai/artifact/G86h7rYqbW3WBquiUcvVHR?sk=RgEjNn3eLf0ad1dURwxaVA</a><br><br>tecnologias auxiliares:<br><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://obs.blips-labs.com\">https://obs.blips-labs.com</a><br><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://litellm.blips-labs.com/ui/?login=success\">https://litellm.blips-labs.com/ui/?login=success</a></p>","c":[]},"8442":{"t":"Torre de Controle — negativar CPF de avalista, além do CNPJ do contrato","s":"backlog_futuro","d":"<p><strong>O que preciso</strong></p><p>Hoje a Torre negativa apenas o documento do contato vinculado ao contrato — na prática, o CNPJ da empresa. Quando a CCB (FINZA) tem avalista qualificado, esse CPF também é parte obrigada e deveria entrar na negativação.</p><p>Pedido: incluir o CPF do avalista como parte negativável nos contratos em que existir essa qualificação.</p><p><strong>Regra de negócio</strong></p><p>Negativar o avalista quando:</p><ol><li><p>a CCB do contrato tiver signatário com qualificação de <strong>avalista</strong>, e</p></li><li><p>esse avalista tiver <strong>assinatura registrada</strong> (não basta estar cadastrado no pedido), e</p></li><li><p>o contrato atingir o mesmo gatilho que hoje dispara a negativação do CNPJ.</p></li></ol><p>A negativação do avalista acompanha a do contrato: mesma régua, mesmo gatilho, e a reversão de uma reverte a outra.</p><p><strong>Fonte do dado</strong></p><p>Projeto <code>finza-prod-481500</code>, dataset <code>silver</code>:</p><ul><li><p><code>silver_signature_request</code> — pedido de assinatura da CCB (<code>origin_ref</code> = <code>silver_proposal.public_id</code>)</p></li><li><p><code>silver_signature_request_signer</code> — signatários; <code>title = 'Avalista'</code>, <code>document_number</code> = CPF, <code>signed_at</code> = data da assinatura</p></li></ul><p>Ponto de atenção: <code>title</code> só é preenchido a partir de ago/2026.<br><br><strong>O que provavelmente muda na Torre</strong></p><p><code>org_finza_contacts</code> tem um único <code>document</code> por contato e não existe entidade de coobrigado. Então o trabalho deve envolver três frentes:</p><ol><li><p>ingestão do avalista a partir das tabelas de assinatura</p></li><li><p>vínculo contrato → avalista (novo relacionamento ou contato secundário)</p></li><li><p>ajuste da regra de negativação para acionar os dois documentos</p></li></ol><p>A modelagem fica a critério de vocês — só sinalizo para dimensionar o esforço.</p><p><strong>Critério de aceite</strong></p><p>Um contrato com avalista assinado, ao atingir o gatilho, gera registro de negativação para o CNPJ <strong>e</strong> para o CPF do avalista, com reversão espelhada.</p>","c":[]},"8459":{"t":"Segregar Disparos","s":"finalizado","d":"<p>Conforme conversado hoje dia 21/09 é necessário segregar os fluxos de disparo da torre no hyper para distribuição de carga;</p>","c":[{"a":"João Pedro","e":null,"dt":"2026-10-21T04:55:02.764343+00:00","x":"Segregação dos disparos da Torre: fase de validação em produção\n\nO que fiz\n- Criei dois fluxos no Hyperflow, clonados do Mensagem Cobrança - Torre de Controle [WHATSAPP + EMAIL] atual. Cada um ficou só com os nós da sua marca:\n  - [BLIPS] v2: https://integracoes.hyperflow.global/apps/blips-1/flows/mensagem-cobranca---torre-de-controle-_blips_-v2-1\n  - [IDEAL] v2: https://integracoes.hyperflow.global/apps/blips-1/flows/mensagem-cobranca---torre-de-controle-_ideal_-v2-1\n- Antes de publicar, conferi a estrutura de cada cópia contra o fluxo original. Nenhum nó ou conexão da marca ficou faltando, e nenhum nó da outra marca ou órfão sobrou.\n- Criei a variável de protocolo fluxo_torre (BLIPS / IDEAL), que identifica qual fluxo disparou o atendimento. Dá para usá-la como filtro em \"Todos os chats\" e nas métricas. Atendimento sem essa variável veio do fluxo antigo.\n- No roteador Ativação do Fluxo - Torre de Controle, estes canais já apontam para os fluxos novos:\n  - blips_credito → [BLIPS] v2\n  - ideal_financeiro_3 → [IDEAL] v2\n  - ideal → [IDEAL] v2\n\nValidação (21/10, ~01:45)\n- Testei blips_credito e ideal_financeiro_3 com ação fictícia, sem alterar nenhuma ação real na Torre. Cada disparo rodou no fluxo novo da marca, saiu pelo número certo e gravou fluxo_torre. A confirmação veio pelo trace do Studio.\n\nPróximos passos\n- 22/10, depois das 12h: migrar os canais restantes (blips, blips_financeiro_3 e ideal_financeiro) para os fluxos novos.\n- O fluxo antigo continua publicado por pelo menos 30 dias, porque clientes que clicam em mensagens antigas ainda caem nele. Só vou desligá-lo depois de 7 dias seguidos sem nenhuma execução.\n- Até o desligamento, qualquer alteração no fluxo antigo precisa ser repetida nos fluxos v2.\n\nObservação: a divisão por marca isola as duas operações: uma edição ou erro num fluxo não afeta mais a outra marca. Ela não muda o limite de envio, que continua sendo controlado pela Torre (30 envios por minuto somando Blips e Ideal).","i":true}]},"8513":{"t":"Continuação da demanda: 6862","s":"finalizado","d":"<p>Bom dia Senhores(as)</p><p></p><p>Ao tentar criar hoje uma variável robusta/aninhada com outras variáveis dentro me deparei com variáveis com erro. Preciso que todas variáveis simples/personalizadas sejam possíveis de serem aplicadas nas variáveis compostas.</p><img class=\"kb-img\" src=\"attachment://ca9787ec-ebe5-4efd-b42c-fed4f88847de/1790083416470_image.png\" alt=\"image.png\"><p>Grato J</p>","c":[]},"8609":{"t":"Envio de lista ( Boletos, PDF, QR Code ) | Torre de Controle","s":"finalizado","d":"<p>Boa tarde Senhores(as),</p><p></p><p>Atualmente pela torre de controle não temos a possibilidade de \"boletar\" de enviar meios de pagamento massivamente ao cliente como se fosse a ativação de um gatilho massivo.</p><p>O intuito é que eu possa pegar um cliente que deve 3 contratos, 6 parcelas e enviar pra ele de maneira clara, individual, segmentada, fácil de copiar e pagar.</p><p>Enviando assim como a operação manda pro cliente o arquivo PDF do boleto, o QR Code imagem e o Pix copia e cola pro cliente clicar e pagar tudo com facilidade.</p><p>Peço apoio neste tema com prioridade e que façamos uma call para melhor alinharmos.</p><p>Grato J</p>","c":[{"a":"Marcos","e":null,"dt":"2026-10-14T13:42:59.37209+00:00","x":"DEMANDA 8609 - UMA MENSAGEM POR PARCELA, COM PIX E BOLETO PRONTOS PARA COPIAR\n\nO pedido foi: pegar um cliente que deve varios contratos e parcelas e mandar para ele, de forma clara e separada, cada parcela com o codigo para pagar. A entrega foi feita em duas partes, e as duas ja estao em producao. Peco que voces validem se e isso que querem antes de usarmos com clientes.\n\n\n1. NOVO MODO NA ABA DISPAROS: \"UMA MENSAGEM POR PARCELA\"\n\nAte agora o Disparos mandava uma unica mensagem por cliente, sobre a parcela mais atrasada. Agora existe a opcao \"Modo de envio\":\n- Uma mensagem por cliente (como sempre foi, nada mudou nesse modo)\n- Uma mensagem por parcela (novo)\n\nNo modo por parcela, quem monta o disparo escolhe:\n- Quantos contratos por cliente entram (de 1 a 20, padrao 3)\n- Quantas parcelas por contrato entram (de 1 a 20, padrao 3)\n- O maximo de mensagens por cliente (de 1 a 10, padrao 6)\n- Se vai so parcela vencida (padrao) ou tambem as que vencem nos proximos dias (ate 30 dias)\n\nComo o sistema escolhe e ordena:\n- Contratos do mais atrasado para o menos atrasado\n- Dentro de cada contrato, da parcela mais antiga para a mais nova\n- Se passar do maximo por cliente, as ultimas ficam de fora\n- Contrato cancelado e parcela ja paga nao entram\n- As mensagens do mesmo cliente saem com 1 minuto de intervalo, na ordem, para chegarem na sequencia certa\n\nAntes de confirmar, a tela mostra quantos clientes e quantas mensagens o disparo vai gerar, e a previa permite ver cliente por cliente e parcela por parcela (\"Parcela 2 de 5 - contrato X, vencimento dd/mm\").\n\nFunciona em WhatsApp, RCS e e-mail. Cada parcela vira uma acao propria na Torre, entao da para acompanhar o status de cada uma separadamente. Se o cliente pagar uma parcela entre o disparo e o envio, aquela mensagem e cancelada sozinha.\n\n\n2. NOVO TEMPLATE DE WHATSAPP COM BOTAO DE PAGAMENTO\n\nNome: torre_tp_parcela_pagamento_1 (aprovado pela Meta como Utilidade)\n\nTexto que o cliente recebe:\n\n  Ola, {nome}! A parcela {numero} do contrato {contrato} venceu em {data}, no valor de {valor}.\n\n  Toque no botao abaixo para copiar o codigo Pix ou a linha digitavel do boleto.\n\n  Se voce ja pagou nas ultimas 48 horas, desconsidere esta mensagem.\n\n  [botao de pagamento]\n\nAo tocar no botao, o WhatsApp abre o resumo do pedido (parcela, contrato e valor) com o Pix copia e cola como forma principal e o boleto (linha digitavel) como segunda opcao. O cliente copia com um toque, sem precisar selecionar texto.\n\nSobre o nome do botao: quem escreve o texto do botao e o proprio WhatsApp, no idioma do celular do cliente. Nao da para trocar por outro texto. Por isso a mensagem diz \"o botao abaixo\", sem citar o nome dele.\n\n\n![image.png](attachment://868b42ca-5f5f-4809-9777-f240069926c6/1791985368919_cc9e0db5-fd57-4ea8-8d2a-5a041656dc33_image.png)\n\n\nO valor que aparece no resumo do pedido vem da Torre, parcela por parcela (no teste: R$ 500,00 em cada uma das 3 parcelas).\n\n\n3. O QUE JA FOI TESTADO\n\nEm 14/10, em producao, com um cliente de teste:\n- 3 parcelas do mesmo contrato, uma mensagem para cada uma, pelo numero Blips Financeiro III\n- As 3 chegaram com o template novo, o botao de pagamento e o valor certo\n- Nenhuma caiu na mensagem generica de lembrete\n\nAinda nao testado:\n- Parcela sem Pix (so boleto). Hoje cerca de 7 mil das 24,8 mil parcelas cobraveis da Blips nao tem Pix (em sua maioria suprimento). A expectativa e que a Meta recuse o botao sem Pix e o cliente receba a mensagem generica de lembrete no lugar.\n- Numeros da Ideal e o fluxo da Finza: o template e o botao foram configurados so para os numeros da Blips.\n\n\n4. O QUE PRECISA ACONTECER ANTES DE USAR COM CLIENTE\n\n- Chave Pix e nome do recebedor: no teste usamos uma chave e um nome ficticios. O Pix copia e cola de cada parcela e o verdadeiro, mas o resumo do pedido mostra tambem a chave e o nome de quem recebe. Precisamos da chave Pix oficial e do nome que deve aparecer.\n- Definir se vamos usar com parcelas sem Pix (ver pergunta 3).\n\n\n5. LIMITACOES QUE VOCES PRECISAM CONHECER\n\n- Cliente que ja esta falando com um atendente humano: as mensagens seguintes do mesmo cliente nao sao enviadas (ficam como \"Em Atendimento\"), para nao atropelar o atendimento.\n- Respostas e interacoes: no WhatsApp, a resposta do cliente fica registrada na ultima parcela enviada, nao em cada uma.\n- Custo: cada parcela e uma mensagem cobrada pela Meta. Um cliente com 6 parcelas custa 6 mensagens. A tela mostra o total antes de confirmar.\n- E-mail: cada parcela e um e-mail separado; em disparo grande isso pesa na cota diaria de envio.\n\n\n6. ALEM DISSO (PRIMEIRA PARTE DA DEMANDA, JA EM PRODUCAO)\n\nLink individual do cliente: uma variavel que, colocada em qualquer mensagem, gera um link unico por cliente. O link abre uma pagina com todas as parcelas em aberto e os meios de pagamento de cada uma (Pix, linha digitavel e boleto em PDF quando existir). E a alternativa para quem prefere mandar uma mensagem so, com tudo junto.\n\n\nPERGUNTAS PARA O TIME DE NEGOCIO\n\n1. O texto do template atende? Se quiserem mudar alguma palavra, e preciso submeter um template novo para aprovacao da Meta (costuma levar de minutos a 1 dia).\n2. Os padroes da tela (3 contratos, 3 parcelas por contrato, maximo de 6 mensagens por cliente, so vencidas) fazem sentido para o uso de voces?\n3. Parcela sem Pix: preferem (a) tirar essas parcelas do disparo, (b) criar um segundo template so com boleto, ou (c) deixar cair na mensagem generica?\n4. Qual chave Pix e qual nome de recebedor devem aparecer no resumo do pedido?\n5. Vao precisar do mesmo template nos numeros da Ideal e na Finza? Se sim, cada um precisa ter o template aprovado e o fluxo configurado.\n\nOs itens que nao dependem de voces (configuracao dos fluxos de WhatsApp e ajustes de cadastro das integracoes) seguem em paralelo do nosso lado.\n","i":false}]},"8611":{"t":"Blocklist por step | Torre de Controle","s":"finalizado","d":"<p>Boa tarde Senhores(as),</p><p></p><p>Marco segue conforme falamos sendo parte da continuação da demanda: 6219</p><img class=\"kb-img\" src=\"attachment://3288946b-0946-48ad-ac3d-ae407638acca/1790185348249_image.png\" alt=\"image.png\"><p></p><p>Grato J</p>","c":[{"a":"Sistema/Negócio","e":null,"dt":"2026-10-02T19:12:15.964914+00:00","x":"\n![image.png](attachment://3288946b-0946-48ad-ac3d-ae407638acca/1790968320271_c309a864-284c-4503-90d7-3d37f2ecb4c9_image.png)\n\n![image.png](attachment://3288946b-0946-48ad-ac3d-ae407638acca/1790968333666_0faa4ad3-61e5-495a-a24e-365ce8bcb4bc_image.png)\n","i":false},{"a":"Sistema/Negócio","e":null,"dt":"2026-10-02T19:10:27.188958+00:00","x":"O teste é o seguinte, vou colocar ele em blocklist hoje por 10 dias no step 8 porque ele ta com 5 dias de atraso no dia de hoje então segunda-feira sairá uma ação pra ele por conta do dia de atraso. Se sair n funcionou o block se não sair funcionou. Vou avaliar se não vai sair no step 8 e se no 11 sairá","i":false},{"a":"Sistema/Negócio","e":null,"dt":"2026-10-02T19:08:50.936067+00:00","x":"Usando este caso pra validação 61.465.874/0001-09\n","i":false}]},"8760":{"t":"Criação de Template Torre","s":"finalizado","d":"<p>Necessário criar uma automação que crie templates HSM dentro da torre com aprovação humana da parte da TI; </p>","c":[]},"9004":{"t":"Remover quebra de mensagens","s":"finalizado","d":"<p>Hoje os agentes de IA (Esperanza, Valentina, Clara e os outros que usam o mesmo padrão) quebram a resposta final em várias mensagens curtas antes de enviar pelo WhatsApp. Isso é feito pelo passo \"Quebrar Msgs\", um LLM com parser que devolve uma lista de mensagens. Cada parte sai como uma mensagem separada no Hyperflow.</p><p>A Meta passa a usar um novo modelo de cobrança a partir de 01/10. Com ele, cada mensagem enviada pesa no custo, e uma resposta quebrada em 3 ou 4 partes passa a custar 3 ou 4 vezes mais do que se fosse enviada inteira.</p>","c":[{"a":"João Pedro","e":null,"dt":"2026-10-02T01:38:25.371982+00:00","x":"O que mudou: o passo \"Quebrar Msgs\", que usava IA para dividir cada resposta em várias mensagens, foi trocado por um nó simples, sem IA. Agora a resposta chega ao cliente inteira, numa mensagem só, com os parágrafos separados como antes.\n\nExceções:\n- O PIX copia-e-cola e a linha digitável do boleto continuam em mensagem separada, para o cliente copiar o código sozinho e colar no app do banco.\n- O link de pagamento fica dentro do texto, logo abaixo da parcela a que ele pertence.\n\nAbrangência: Valentina (Finza), Esperanza - Superprojeto (Blips, Ideal e Finza) e Clara - Formalização (Blips e Finza). O teste pela Torre da Esperanza continua dividindo em blocos, a pedido do time.\n\nImpacto esperado: cerca de 40% menos mensagens enviadas, calculado sobre as respostas dos últimos 30 dias. Eram 25.500 mensagens ou mais por mês e passam a ser cerca de 15.000. Também cai uma chamada de IA por resposta. O ganho vale para todos os canais desses três agentes.","i":true}]},"9888":{"t":"Gestão de Custos","s":"finalizado","d":"<p>Atualmente o módulo de custos da Torre não esta 100% ainda, segue os ajustes que devem ser realizados:</p><p></p><ul><li><p>primeiro vamos começar pela área de configuração:</p></li></ul><img class=\"kb-img\" src=\"attachment://3f91eaf9-6b34-4c1a-8030-e2217fcd2869/1791314967559_image.png\" alt=\"image.png\"><p>Não vejo porque de ter horário específico para o calculo de custos; Necessário remover.</p><p></p><img class=\"kb-img\" src=\"attachment://3f91eaf9-6b34-4c1a-8030-e2217fcd2869/1791314967559_image.png\" alt=\"image.png\"><p>também não vejo como necessário.<br></p><img class=\"kb-img\" src=\"attachment://3f91eaf9-6b34-4c1a-8030-e2217fcd2869/1791314967559_image.png\" alt=\"image.png\"><p>pode remover esse histórico da tela de configuração, ja é possivel ver o historico de tarifa entrando na tela de ajuste de preço<br></p><img class=\"kb-img\" src=\"attachment://3f91eaf9-6b34-4c1a-8030-e2217fcd2869/1791314967559_image.png\" alt=\"image.png\"><p>na tela de configuração da tarefa simplifica colocando o card de tarifa no topo, remove o recalculos (achei desnecessário) e vigencias anteriores também ficou sem nexo, a menos que deixe como histórico de movimentações de tarifas, pra ficar registrando sempre que a tarifa mudar efetivamente de valor;<br></p><ul><li><p>agora a tela de custos:</p></li></ul><img class=\"kb-img\" src=\"attachment://3f91eaf9-6b34-4c1a-8030-e2217fcd2869/1791314967559_image.png\" alt=\"image.png\"><p>ganha espaço aqui com os filtros e melhora eles plmrds<br><br></p><img class=\"kb-img\" src=\"attachment://3f91eaf9-6b34-4c1a-8030-e2217fcd2869/1791314967559_image.png\" alt=\"image.png\"><p>faltou KPIs e BigNumbers aqui, quantos disparos totais? Quantas conversas totais? quantos protocolos? Principais custos? Divisão e proporção dos custos? </p><p></p><img class=\"kb-img\" src=\"attachment://3f91eaf9-6b34-4c1a-8030-e2217fcd2869/1791314967559_image.png\" alt=\"image.png\"><p>essa tela aqui ta bem ruim e confusa a visualização, sendo honesto você consegue olhar pra essa tela e entender de primeira os custos sem precisar pensar muito?<br><br></p><img class=\"kb-img\" src=\"attachment://3f91eaf9-6b34-4c1a-8030-e2217fcd2869/1791314967559_image.png\" alt=\"image.png\"><p>esse gráfico aqui precisa de melhorar com visão linha ou colunar em pilha;<br><br></p><img class=\"kb-img\" src=\"attachment://3f91eaf9-6b34-4c1a-8030-e2217fcd2869/1791314967559_image.png\" alt=\"image.png\"><p>totalmente desnecessário, da nem pra entender direito;</p><p></p><img class=\"kb-img\" src=\"attachment://3f91eaf9-6b34-4c1a-8030-e2217fcd2869/1791314967559_image.png\" alt=\"image.png\"><p>precisa ressaltar que agente não ta funcionando na torre; </p><img class=\"kb-img\" src=\"attachment://3f91eaf9-6b34-4c1a-8030-e2217fcd2869/1791314967559_image.png\" alt=\"image.png\"><p>de disparo também não, ta sem nexo nenhum esses filtros kkkkk;<br></p><p>ai vai as considerações finais: <br><br>- deixe os tipos de gastos segregados em uma visão e dasboards<br>- coloque uma tabela de custos<br>- diminua a execução de validação de custos meta, uma vez por dia ta muita coisa e desnecessário, uma vez por semana é o necessário<br>- gestão de custo de agente não esta funcionando na torre<br>- gestão de disparo não esta redonda também<br>- falta granularidade como por exemplo quanto um protocolo custa ao todo incluindo custos de disparos e agente;<br>- pobreza de dados <br>- redundância em rotina desnecessária <br>- muita informação na tela mas nada conclusivo e objetivo<br>- faltou dashboards e métricas<br>- essa é bonus: possibilidade de colocar um 'orçamento limite' na torre, caso o custos passe emita um alarme e seja visivel em tela e dashboards</p>","c":[{"a":"Marcos","e":null,"dt":"2026-10-06T22:11:01.454918+00:00","x":"GESTÃO DE CUSTOS - RETORNO SOBRE OS PONTOS LEVANTADOS\n\nRevisei cada comentário. Para isso, voltei à tela, ao código, aos dados de produção e ao fluxo do n8n que alimenta os custos. Resumo: a maior parte dos pontos procede. Em alguns itens proponho um meio-termo: a funcionalidade continua, porque existe um motivo concreto para ela, mas sai da frente do usuário.\n\n\n1. CONFIGURAÇÃO\n\n1.1 \"Não vejo porque ter horário específico para o cálculo de custos\"\n\nConcordo em tirar o horário da tela, mas o cálculo automático precisa continuar.\nAs ações acontecem o dia todo, e o custo só sobe no painel quando o cálculo roda. Sem atualização periódica, o número exibido fica velho.\nO que não precisa é ser configurável. Hoje roda em 4 horários fixos, o que deixa o número parado das 17:30 até as 07:30 do dia seguinte.\n\nMedidas:\n- Remover o campo de horário.\n- O cálculo passa a rodar sozinho, de hora em hora (cada execução leva cerca de 15 segundos).\n- Na tela, fica só \"Atualizado há X min\" e o botão \"Atualizar agora\".\n\n\n1.2 \"Pode remover esse histórico da tela de configuração\"\n\nDe acordo. Essa lista é o registro de execuções do cálculo (\"Agendada / Cálculo concluído\", 4 linhas por dia) e não ajuda quem está olhando custo.\n\nMedida: trocar por \"Última atualização\" e um alerta visível quando uma execução falhar.\n\n\n1.3 Card de tarifa no topo, recálculos e vigências anteriores\n\nCard de tarifa no topo: de acordo.\n\nRecálculos: entendo a impressão de \"desnecessário\", mas a função é necessária agora. Quando uma tarifa é cadastrada ou corrigida, o sistema não volta sozinho para reprecificar o que já foi calculado. Caso real neste momento: o RCS tem 5.277 ações sem tarifa no período, e cadastrar o preço não alcança essas ações sem recálculo.\n\nO que sobra na tela é a seção separada, não a função.\nMedidas:\n- A lista de recálculos sai da tela.\n- O recálculo vira uma opção dentro do próprio cadastro de tarifa: \"aplicar este valor desde dd/mm\".\n\nVigências anteriores: é exatamente o que você descreveu, o histórico de cada vez que a tarifa mudou de valor. Cada vigência registra quanto custava em determinada época, e isso garante que um custo de agosto continue com o preço de agosto. Aparece vazio porque nenhuma tarifa mudou desde a implantação.\nMedida: renomear para \"Histórico de preço\" e esconder enquanto estiver vazio.\n\n\n2. TELA DE CUSTOS\n\n2.1 Filtros: \"ganha espaço aqui e melhora eles\"\n\nConcordo. Hoje há três problemas:\n- \"Origem\" e \"Escopo\" são termos internos do sistema, não do negócio;\n- algumas combinações dão resultado sem sentido: \"Custo da organização\" + \"Da org\" mostra \"Nada custeado\";\n- dois dos cards do topo ignoram o filtro aplicado (\"Período inteiro, sem filtros\").\n\nMedidas:\n- Uma linha só, com Período, Canal, Campanha e Agente.\n- O custo compartilhado (IA) sempre aparece em bloco próprio, e deixa de ser filtro.\n\n\n2.2 KPIs e big numbers\n\nDe acordo, e os dados existem. Proposta para o topo da tela:\n- Custo total do período, com variação contra o período anterior;\n- Disparos, conversas e protocolos do período;\n- Custo por disparo\n- Principais custos (top canais e top campanhas);\n- Divisão dos custos (proporção por canal e IA).\n\n\n2.3 Tabela confusa\n\nConcordo, vou simplificar. Hoje a tabela abre em 4 níveis (família, tipo, recorte e vigência), mostra a \"tarifa da época\" e mistura o custo compartilhado.\n\nMedidas:\n- A tabela principal fica com Canal, Quantidade, Custo e % do total.\n- O detalhe de tarifa e de vigência fica num clique, para quem precisar.\n\n\n2.4 Gráfico: linha ou colunas empilhadas\n\nDe acordo. Barra de uma cor só mostra quanto custou no dia, mas não o quê.\n\nMedidas:\n- Colunas empilhadas por canal, que mostram o que puxou cada pico.\n- Opção de linha para comparar a tendência.\n\nObs.: os dias sem barra são fins de semana sem disparo, não falha.\n\n\n2.5 \"Totalmente desnecessário\" (painel \"O que falta para o número ficar completo\")\n\nConcordo em tirar o painel, mas não a informação que ele carrega. Hoje o total está abaixo do real porque o RCS e a negativação não têm tarifa, e isso precisa ser visível.\n\nMedidas:\n- O painel sai.\n- Entra um aviso de uma linha no topo, só quando houver pendência. Ex.: \"Total incompleto: RCS e Negativação sem tarifa - Cadastrar\".\n\n\n2.6 Tabela de custos\n\nExiste hoje uma tabela-resumo. Entendo que a ideia é uma tabela detalhada e exportável.\n\nMedida: tabela por dia, canal e campanha, com exportação. Se for outro recorte, me diga qual.\n\n\n3. CONSIDERAÇÕES FINAIS\n\n3.1 Validação da tarifa da Meta: de 1x por dia para 1x por semana\n\nDe acordo. O risco de \"a tarifa muda numa quarta e quinta/sexta ficam erradas\" não acontece na prática:\n- a Meta só muda preço em 1/jan, 1/abr, 1/jul e 1/out, com anúncio prévio;\n- a tabela consultada é mantida no n8n e só muda quando a atualizamos, então consultar todo dia não pega mudança sozinho.\n\nMedidas:\n- Consulta semanal e no dia 1 de cada trimestre.\n- Lembrete trimestral para atualizar a tabela da Meta.\n\n\n3.2 Redundância em rotina desnecessária\n\nProcede. Além da Meta, o custo de IA era consultado 8x por dia (OpenAI) e 7x por dia (Gemini), mas esses dados chegam com 2 a 5 dias de atraso.\n\nMedidas:\n- IA 1x por dia.\n- Cálculo de hora em hora (item 1.1).\n- Meta semanal (item 3.1).\n\n3.3 Gestão de custo de agente e custo por protocolo\n\nAgente: o custo de IA entra pelo total diário que a OpenAI e a Gemini informam, só dos agentes da Torre (Esperanza, Valentina e Tageador). A mensagem de WhatsApp enviada pelo agente é custeada à parte, pela tarifa da Meta.\n\nCusto por protocolo: o custo exato de cada protocolo não é possível hoje. A OpenAI e a Gemini só informam o gasto total do dia de cada agente, nunca por conversa, e os fluxos dos agentes não registram o consumo de cada chamada. O que dá para mostrar com honestidade é o custo MÉDIO:\n- IA: gasto do período dividido pelo número de protocolos do período (hoje, cerca de US$ 0,05 por protocolo);\n- WhatsApp do atendimento: esse sim é exato, porque cada mensagem do agente já é custeada individualmente;\n- somando os dois, temos o custo médio de um atendimento, que é um bom indicador de tendência, mas não o valor de um protocolo específico.\n\nSe for necessário o custo exato por protocolo, o caminho é os fluxos dos agentes (n8n) passarem a registrar o consumo de tokens de cada chamada junto com o protocolo. Isso é uma mudança nos agentes, não só na Torre, e pode entrar como demanda separada.\n\nMedidas:\n- Custo médio por protocolo no painel, sinalizado como média.\n- Custo de IA dividido entre as organizações pelo número de protocolos de cada uma. Hoje o mesmo valor aparece inteiro em todas.\n\n3.4 Gestão de disparo não está redonda / pobreza de dados\n\nConcordo, por três motivos:\n- Buracos: RCS e negativação sem tarifa. O total do período deixa de fora mais de 5.500 envios.\n- Preço de tabela x o que a Hyperflow cobra: o WhatsApp é custeado pelo preço de tabela da Meta (ver 3.4.1).\n- Pouco número de negócio na tela: faltam volume, custo unitário, quebra por campanha e agente, e comparação entre períodos. Os itens 2.1 e 2.2 cobrem isso.\n\n3.4.1 Custo por mensagem da Hyperflow\n\nCom o que temos hoje, não é possível definir quanto a Hyperflow cobra por mensagem da Torre. Os motivos:\n- A fatura é da conta inteira da Blips na Hyperflow, não da cobrança. Em julho foram cerca de 105 mil templates enviados por 59 departamentos; a Torre (org Blips) respondeu por cerca de 26 mil. A fatura não separa o gasto por departamento.\n- O \"Crédito Meta (WhatsApp)\" da fatura é recarga de crédito pré-pago (de 5 a 12 recargas por mês), não o consumo do mês. Recarregar num mês e consumir em outro distorce qualquer conta de custo por mensagem.\n- A base de faturas no BigQuery vai só até julho/2026 e só tem a Blips; não há fatura da Finza.\n- Nenhuma API da Hyperflow devolve o custo de cada mensagem.\n\nPor isso, dividir a fatura pelos disparos da Torre dá um número sem significado (o gasto de todas as áreas dividido pelos envios de uma só). Como ordem de grandeza, a fatura de julho dividida por todos os templates da conta dá cerca de R$ 0,39 por template, compatível com a tabela da Meta. Isso não indica que a Torre esteja subestimando o custo, mas também não é uma conferência.\n\nDá para colocar a Hyperflow com o mesmo funcionamento da OpenAI? Em parte:\n- O fluxo do n8n que traz o custo da OpenAI já sabe consultar a fatura da Hyperflow no BigQuery. A Torre pode cadastrar a Hyperflow como um custo da organização, do mesmo jeito.\n- A diferença é que a fatura é mensal, não diária. Ela entraria como custo mensal rateado pelos dias, e não como total do dia.\n- Só entrariam o \"Plano\" (R$ 10.800/mês) e o \"Crédito Hyperflow\" (entre R$ 3,8 mil e R$ 11 mil por mês). Hoje nenhum dos dois aparece na Torre.\n- O \"Crédito Meta (WhatsApp)\" não entraria, porque a Torre já custeia cada mensagem pela tabela da Meta, e somar os dois contaria o mesmo gasto duas vezes.\n- Como a fatura é da empresa inteira, o valor precisaria ser rateado pela participação da cobrança no volume de mensagens da conta (cerca de 25% em julho). Ou seja, seria uma estimativa, não uma medição, e a regra precisa ser alinhada antes.\n- Pré-requisito: a base de faturas da Hyperflow no BigQuery precisa voltar a ser atualizada (parou em julho).\n\nPara chegar no custo por mensagem de verdade, o caminho é pedir à Hyperflow um relatório de consumo por departamento (ou por número de envio). Com ele, dá para comparar com a tabela e ajustar a tarifa se houver diferença.\n\n3.5 Muita informação e nada conclusivo / faltaram dashboards\n\nConcordo. A tela atual explica demais como o número é formado e mostra de menos o que ele significa. A nova organização:\n1. Big numbers (custo, volume, custo unitário);\n2. Gráfico empilhado por canal;\n3. Divisão dos custos (por canal, por campanha, IA);\n4. Tabela detalhada e exportável;\n5. A metodologia sai do caminho e fica num link \"Como este número é calculado\".\n\n3.6 Orçamento limite com alarme (bônus)\n\nÉ viável. O custo já é consolidado por dia e por organização.\n\nMedidas:\n- Definir um orçamento mensal por organização, com alerta em 80% e 100%.\n- O aviso aparece na tela de custos e no dashboard, e é enviado no Google Chat.\n","i":false}]},"10013":{"t":"Ligações Hyperflow V2 - Finza","s":"finalizado","d":"<p>Boa tarde Senhores(as),</p><p></p><p>Segue o escopo da URA pra organização Finza no Hyper conforme solicitado para implantarmos na semana vigente.<br><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://claude.ai/artifact/T7ercH6XTzxzjn3sWjyysi?sk=fZGvJTZXsS_TKu_s3au92Q\">https://claude.ai/artifact/T7ercH6XTzxzjn3sWjyysi?sk=fZGvJTZXsS_TKu_s3au92Q</a></p><p></p><p>Grato J</p>","c":[{"a":"João Vinícius","e":null,"dt":"2026-10-23T13:24:16.276553+00:00","x":"Fizemos todos os ajustes do nosso lado, estamos aguardando ajuste do lado do hyper para estabilizar operação, qualquer duvida pode me chamar no GC","i":false},{"a":"Sistema/Negócio","e":null,"dt":"2026-10-22T17:17:38.658592+00:00","x":"[Solicitação de ajustes] Testei novamente e repassei no google chat a série de oportunidades na aplicação","i":false},{"a":"Sistema/Negócio","e":null,"dt":"2026-10-20T17:14:42.889445+00:00","x":"[Solicitação de ajustes] Fiz dois testes aonde no primeiro a raquel atendeu a ligação mas entrou em pausa e ao tocar pra giovanna não foi possível. No segundo teste não tocou pra giovanna mesmo ela estando disponivel.","i":false},{"a":"Sistema/Negócio","e":null,"dt":"2026-10-16T14:38:35.324017+00:00","x":"[Solicitação de ajustes] Peço que a demanda seja bloqueada pois teve implementações feitas não foi possível homologar pelas falhas identificadas no hyper. Quando o Hyper ajustar e for possível prosseguir com a validação fico disposição.","i":false}]},"10063":{"t":"Expurgo Supabase","s":"finalizado","d":"<p>Atualmente no supabase esta chegando o seguinte comunicado<br></p><img class=\"kb-img\" src=\"attachment://b2d4eb32-c1a5-4546-ab6a-cc4cbfc779e9/1791467090567_image.png\" alt=\"image.png\"><p>necessário remover todas as informações desnecessárias como logs, chamadas de efs e informações inuteis que são armazenadas no supa</p>","c":[{"a":"Marcos","e":null,"dt":"2026-10-09T05:31:13.751725+00:00","x":"O QUE ESTAVA ACONTECENDO\n\nO aviso do Supabase veio porque o disco do banco de produção aumentou sozinho de 27 para 40 GB em 07/10.\n\nA causa foi uma rotina automática que apaga os registros temporários das importações (ETL), que deveriam ficar guardados só 3 dias. Ela tentava apagar tudo de uma vez, foi ficando mais lenta e, a partir de 06/10, passou a estourar o tempo limite do banco. Quando estoura, nada é apagado e no dia seguinte há ainda mais para apagar. Esses registros chegaram a ocupar 13,4 GB dos 23 GB do banco. Havia também tabelas de log sem limpeza nenhuma.\n\nO QUE FOI FEITO (já em produção)\n\n- Limpeza dos registros de importação: agora apaga em lotes pequenos a cada 15 minutos, em vez de tudo de uma vez por dia. Cada execução leva sempre o mesmo tempo e, se uma falhar, a próxima tenta de novo.\n- Limpeza nova para dois logs que só cresciam: o log de ações puladas pelas campanhas (guarda 30 dias) e o histórico das rotinas automáticas (guarda 14 dias).\n- Remoção de 4 índices que o banco nunca usava e que só deixavam a importação mais pesada. Isso liberou cerca de 2 GB na hora: o banco foi de ~23 para ~21 GB e parou de crescer.\n- Alerta no Google Chat: avisa quando o banco chegar a 70% do disco (e com prioridade alta a 80%), antes de o Supabase expandir sozinho, e também quando alguma dessas limpezas falhar. O aviso continua aparecendo até o problema ser resolvido. Esse alerta não existia: a falha de 06/10 chegou a aparecer, mas sumia sozinha meia hora depois.\n\nSOBRE O ESPAÇO\n\nO disco de 40 GB não diminui sozinho: o Supabase não reduz o disco depois de expandido, só numa atualização de versão do projeto. Hoje o banco usa ~21 GB (52%) e não deve crescer pelo mesmo motivo de novo. O custo desse disco extra é de cerca de US$ 4 por mês.","i":false}]},"10359":{"t":"Protesto | Torre de Controle","s":"finalizado","d":"<p>Bom dia Senhores(as),</p><p></p><p>Dessimoni segue formalização da demanda conforme solicitado. Os detalhes já é o que falamos no google chat, em calls e os alinhamentos entre você Marco e Jéssica.</p><p></p><p>Dúvidas a disposição. Grato J</p>","c":[{"a":"Sistema/Negócio","e":null,"dt":"2026-10-16T14:39:19.185618+00:00","x":"[Solicitação de ajustes] Peço ajuste do nome de webhook pra Protesto e colocar um icone personalizado","i":false},{"a":"Marcos","e":null,"dt":"2026-10-15T20:47:17.331101+00:00","x":"Integração via webhook criada, pode começar a suar\n\n\n![image.png](attachment://4035aa81-ed84-4143-bfff-12e2cd39d49a/1792097222429_a6d91c63-b243-45dd-a9e4-7cb889097e2a_image.png)\n","i":false},{"a":"Sistema/Negócio","e":null,"dt":"2026-10-14T19:28:19.144154+00:00","x":"O Objetivo é usar o protesto assim como é na negativação, sendo mais uma ação coercetiva disponível de ser utilizada pela torre de controle tanto nas ações seja broadcast, régua ou disparo manual. De maneira bem objetiva é isto. Mas será importante possuir os mesmos filtros que tem pra negativação pra conseguir filtrar, monitorar, visualizar o que já foi protestado ou não, dash e afins.","i":false},{"a":"João Vinícius","e":null,"dt":"2026-10-14T18:40:05.688697+00:00","x":"POST - https://finza-negativation.blips-labs.com/prod/v1/negativation\n\nHeader.Authorization = Bearer {SEU_TOKEN}\n\nPayload:\n\n{\n  \"contract_number\": \"123456\",\n  \"action_type\": \"PROTEST\",\n  \"reason\": \"Inadimplente a X dias\"\n}\n\n@Marcos Rodrigues de Oliveira Júnior ","i":true}]},"10381":{"t":"Parado na IA","s":"finalizado","d":"<p>segue os protocolos que estão parados em 'preso no bot':<br><br><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://omni.blips.com.br/clientes-sem-resposta?f=%7B%22foco%22%3A%5B%22ia%22%5D%2C%22departamento%22%3A%5B%22IA+-+Financeiro%22%5D%7D\">https://omni.blips.com.br/clientes-sem-resposta?f=%7B%22foco%22%3A%5B%22ia%22%5D%2C%22departamento%22%3A%5B%22IA+-+Financeiro%22%5D%7D</a><br><br>necessário entender os motivos e resolver permanentemente</p>","c":[{"a":"João Pedro","e":null,"dt":"2026-10-21T04:03:26.37966+00:00","x":"Andamento — chats presos no IA - Financeiro\n\nPor que os chats ficavam presos\nQuando o cliente fazia a 2ª interação, o fluxo do Hyperflow desligava o timer de inatividade antes de passar para a IA. Quem religa o timer é a próxima mensagem da IA. Quando essa mensagem não saía, o chat ficava aberto, sem agente e sem timer, até alguém fechar à mão.\n\nOs motivos encontrados nos 8 protocolos do chamado:\n- Encerramento no número errado (3 casos Finza): a Esperanza decidia encerrar, mas o pedido ia sempre para o número principal da Blips. O Hyperflow abria e fechava um chat \"fantasma\" lá, e o chat real da Finza continuava aberto.\n- Transferência com falso sucesso (2 casos Blips): a função de transferência devolvia \"sucesso\" sem ter transferido.\n  - Num dos casos, o cliente tinha outro chat aberto, com humano, em outro número.\n  - No outro, ele clicou num disparo antigo que carregava o canal errado.\n- Mensagem que não chegava à IA (2 casos): um clique em \"Falar com atendente\" e um \"Não\" à pergunta de inatividade da Finza.\n- Falso positivo do painel (1 caso): o bot tinha respondido, mas o painel continuou mostrando o cliente como último a falar.\n\nVolume: cerca de 19 chats realmente presos em 30 dias.\n\nO que foi feito (aplicado)\n1. Limpeza do acúmulo: encerramos 5.044 chats da caixa de e-mail boleto@blips.com.br, de fev e mar/2026, que estavam abertos no IA - Financeiro sem nenhuma mensagem. Os chats abertos no departamento na Blips caíram de mais de 5.500 para 198.\n2. Correção do encerramento na Esperanza: o encerramento passou a usar o número da própria conversa e não cria mais chat fantasma.\n3. Ajustes no Studio do Hyperflow:\n   - não criar chat novo quando o pedido é de encerramento;\n   - usar o canal do chat real;\n   - religar o timer de inatividade;\n   - aceitar o IA - Financeiro na checagem da Finza.\n4. CRON de monitoramento (n8n-prod-automacao, aMNBO8CWcMjXbawm), ativo em modo real:\n   - a cada 30 min, das 07h às 19h30, procura chats do IA - Financeiro em que o cliente falou por último há mais de 7 h, confirmando pela mensagem real do chat;\n   - quando a causa é o encerramento no número errado, encerra o chat;\n   - nos demais casos, transfere para humano: Liquidação Financeira na Blips e na Ideal, Cobrança na Finza;\n   - cada ação é avisada ao time.\n\nSolicitado ao time de IA Blips\nAbrimos um card para a Função - Transfere Hyperflow, chamada pelo Agente de Transferência, com o caso 1310263345624 como evidência. Quando o cliente tem outro chat aberto num departamento humano, a função encontra esse outro chat, conclui que ele \"já estava transferido\" e devolve sucesso sem transferir o chat da IA. Pedimos que ela procure o chat pelo protocolo, e não pelo telefone, e que devolva falha quando não transferir. Enviamos uma proposta de JSON como ponto de partida. Enquanto isso não é corrigido, o CRON leva esses casos para humano em até ~7,5 h.\n\nPróximos passos\n- Acompanhar os primeiros ciclos reais do CRON, em especial a transferência na Finza, que ainda não teve um caso real.\n- Avaliar a limpeza dos cerca de 320 chats abertos com o bot falando por último (189 Blips e 130 Finza), que ainda bloqueiam disparos da Torre.","i":true}]},"10449":{"t":"Melhoria de Custos","s":"finalizado","d":"<p>Conforme conversado, segue os ajustes:<br><br>- remoção de email e sms<br>- colocar custo hyper via webhook<br>- segregar custos zap entre disparo e conversa<br>- descobrir o custo da negativação simples</p>","c":[]},"10714":{"t":"Automação Logística Reversa -> Jurídico","s":"finalizado","d":"<p>No dia 06/10, foram encaminhados <strong>237 cards ao funil Jurídico Ativo (Bitrix)</strong>, aparentemente por meio da integração com os funis de Cobrança e Logística Reversa.</p><p>Com o apoio do <strong>Claude</strong>, realizamos um levantamento preliminar desses registros, identificando os seguintes pontos:</p><ul><li><p><strong>100 cards:</strong> contratos já existentes no Jurídico (68 em andamento e 32 encerrados).</p></li><li><p><strong>107 cards:</strong> casos novos no Jurídico.</p></li><li><p><strong>30 cards:</strong> mesmo CNPJ, porém contratos distintos.<br><br>O retorno do time de processos é que: Foi identificado que uma automação é executada diariamente, às 6h, 12h e 16h, movimentando os cards da Logística Reversa para a raia do Jurídico, com base em critérios que ainda estão sendo investigados pelo time de Processos.<br><br>Assim sendo, solicito apoio do time de automações para verificar qual gatilho da automação está direcionando em massa os cards para o jurídico.</p></li></ul><p></p>","c":[{"a":"João Pedro","e":null,"dt":"2026-10-21T19:39:54.750151+00:00","x":"Olá, pessoal! Segue o retorno sobre os cards que chegavam ao Jurídico Ativo pela automação.\n\nO que acontecia\nA esteira automática de cobrança passou, em 06/10, a levar para o Jurídico qualquer card da Logística Reversa ou da Cobrança cujo cliente tivesse algum sinal jurídico. Entravam também casos de outro contrato do mesmo CNPJ, processos já encerrados e itens do Jurídico Passivo e Administrativo. A cada card movido, um robô do Bitrix abria um card novo no Jurídico Ativo, sem checar se o contrato já tinha um. Por isso chegaram 237 cards, com repetições e casos que não eram novos. Quando a equipe devolvia um card para a Logística, a rodada seguinte o levava de volta ao Jurídico.\n\nO que foi feito\n1. 19/10: a automação parou de levar cards da Logística Reversa ao Jurídico e não mexe mais em cards das etapas da operação (Logística, Manutenção Interna, Termo/Laudo, Abertura de OS, Agendamento e Retirada). Os 254 cards movidos desde 06/10 voltaram para a etapa de onde saíram. Os cards duplicados que o robô abriu no Jurídico Ativo foram excluídos, e os que vocês já tinham trabalhado foram mantidos.\n2. 21/10, regra definitiva:\n   - cliente com sinal jurídico não ganha card de cobrança. O sinal pode ser a marcação Jurídico na plataforma, o bloqueio judicial na Torre ou um card aberto no Jurídico;\n   - se o card já existe na Cobrança, ele é encerrado como perda \"Jurídico\" no próprio funil da Cobrança, e o cliente sai da fila de cobrança humana;\n   - a automação não abre card no funil de vocês. A Logística Reversa não é tocada.\n\nAtenção a um ponto de hoje\nNa primeira aplicação da regra (21/10, 16:09), 29 cards da Cobrança foram encerrados como perda Jurídico. O robô do Bitrix ainda estava ligado nesse funil e abriu 29 cards no Jurídico Ativo com título COBRANÇA | <contrato>. Esses 29 são duplicados automáticos e serão removidos. Pedimos que não sejam trabalhados. O time de Processos já desativou o robô para que isso não se repita.\n\nComo validar\n1. Card 122343 (contrato 12514268): o card que ia e voltava entre Logística e Jurídico. Ele está em Logística desde 19/10, sem novas movimentações.\n2. Jurídico Ativo: depois da remoção dos 29, nenhum card novo deve aparecer criado automaticamente, com título começando em COBRANÇA | ou LOGISTICA REVERSA |.\n3. Card 133247 (contrato 12504163, cliente com processo): saiu da Cobrança como perda \"Jurídico\" em 21/10 e não deve ganhar card de cobrança novo nas próximas rodadas.\n\nO robô responsável pela movimentação desses cards de COBRANÇA e RETIRADA para o JURÍDICO é mantido pelo time de processos, Renato já desativou esse robô temporariamente para que seja alinhado com a Sinara o novo comportamento do mesmo.\n\nFico a disposição para quaisquer e eventuais dúvidas e ajustes!","i":false}]},"10717":{"t":"Demonstrativo de Débito CCB | NOTIFICAÇÕES","s":"bloqueado","d":"<p>Prezados,</p><p>Preciso concluir a estruturação do Kit de Ajuizamento para ações de Busca e Apreensão e Execução de Cédula de Crédito Bancário – CCB.</p><p>Esse kit consiste em um conjunto de documentos que serão reunidos pela Lívia – IA Jurídico, de modo que o material seja entregue de forma completa e pronta para o ajuizamento. Quero implementar essa mesma possibilidade também nos casos da FINZA.</p><p>Hoje, já temos:</p><p>Cédula de Crédito Bancário – CCB: aqui, preciso verificar se o sistema da Celcoin possui API que permita à Lívia – IA Jurídico acessar e buscar a CCB diretamente no sistema. Isso é necessário para que ela consiga montar o kit de forma automatizada;</p><p>Notificação extrajudicial via AR: automação pronta;</p><p>Notificação por e-mail: automação pronta.</p><p>Permanecem pendentes:</p><p>Demonstrativo atualizado do débito: precisamos desenvolver um documento específico, de acordo com as condições previstas na CCB e no respectivo CET. Esse demonstrativo também é importante para o próprio usuário, que, ao acessar a plataforma, deverá conseguir visualizar a evolução da dívida.</p><p>O demonstrativo deverá apresentar de forma clara a evolução do débito, incluindo o vencimento antecipado, além dos juros remuneratórios, juros de mora, multa e demais encargos contratuais aplicáveis.</p><p>Já temos modelos semelhantes utilizados na BLIPS e na IDEAL e, se necessário, posso disponibilizá-los como referência. No entanto, neste caso, precisaremos desenvolver um modelo específico, pois se trata de uma Cédula de Crédito Bancário.</p><p>Também precisamos padronizar os disparos dessas notificações e o arquivamento dos respectivos comprovantes, para que o jurídico receba o kit completo no momento do ajuizamento.</p><p>A ideia é garantir um fluxo mais seguro, ágil e padronizado para a recuperação judicial do crédito.</p>","c":[{"a":"Marcos","e":null,"dt":"2026-11-11T17:24:26.770692+00:00","x":"Atualização: Kit Preventivo e Kit Ajuizamento FINZA/CCB, o que já foi feito e o que precisamos de você\n\nOlá, Sara! Segue um resumo consolidado de onde estamos e do que falta para liberar os kits dos contratos com financiamento (CCB). Ele substitui as perguntas dos comentários anteriores.\n\n==================================================\n1. O QUE JÁ ESTÁ PRONTO\n==================================================\n\nKits BLIPS e IDEAL (sem financiamento)\n- Kit Preventivo e Kit Ajuizamento funcionando para as duas modalidades, como combinado em 31/10.\n- O demonstrativo de débito continua como funciona hoje (só parcelas vencidas, multa de 10% na BLIPS e 2% na IDEAL, juros de 1% a.m.).\n\nKit FINZA/IDEAL com financiamento (CCB): peças prontas\n- Contrato de compra e venda: a Lívia já busca.\n- E-mails de cobrança: a Lívia busca nas caixas da IDEAL e da BLIPS. Testamos com as 12 CCBs com mais atraso, e todas têm e-mails.\n- Nota fiscal de venda do equipamento (aba FRETE da plataforma): pronta, sai como \"Nota Fiscal de Venda\".\n- Carta AR da MRS (só no Kit Ajuizamento): mesma busca do kit atual.\n- CCB assinada: RESOLVIDA. Não precisamos mais da Celcoin. A CCB assinada vem da API da própria Finza, consultada pelo número do contrato. A etapa da Lívia que baixa a CCB e salva na pasta do kit está pronta e testada (contrato 12602418).\n- Termo de endosso: vem no mesmo PDF da CCB, nas últimas páginas (\"TERMO DE ENDOSSO nº <número da CCB>\", endossante VIA CAPITAL SCD, endossatário FINZA FIDC).\n- Dados para o demonstrativo: a Lívia já lê o cabeçalho da CCB (número, cliente, emissão, valor, taxa, CET) e o cronograma de parcelas com a situação de cada uma (paga, vencida ou a vencer). Também já calcula o valor presente das parcelas a vencer.\n\nKits de exemplo, com clientes reais\nMontamos 3 kits pela Lívia, pelo mesmo caminho do kit oficial, para você ver como estão ficando:\n\n- Kit Ajuizamento, contrato 12602418: contrato, carta AR da MRS, 13 e-mails de cobrança, nota fiscal de venda e CCB assinada com o termo de endosso.\n  https://drive.google.com/drive/folders/16NbcNE7g9Sx0jHsOvGC0KJi9SENKXMhW\n- Kit Preventivo, contrato 12602418: as mesmas peças, sem a carta MRS (dá para comparar os dois kits do mesmo cliente).\n  https://drive.google.com/drive/folders/1F4uRDw4PM4LaEQBGhMlg4YuCwqN11GJl\n- Kit Preventivo, contrato 12603553: contrato, 13 e-mails de cobrança, nota fiscal de venda e CCB assinada.\n  https://drive.google.com/drive/folders/1aRac6IPAyWeggC34XZMWn7iqu8nWAL8A\n\nObservações:\n- O demonstrativo de débito ainda não está nos kits. Não colocamos o demonstrativo atual da BLIPS/IDEAL porque, para a CCB, ele sairia errado (só com as parcelas vencidas). Ele entra assim que as regras do item 3 forem confirmadas.\n- O Kit Ajuizamento do 12603553 não foi gerado porque esse contrato ainda não tem carta registrada na MRS. A Lívia avisa isso automaticamente.\n- Se faltar ou sobrar alguma peça nos kits, é só nos avisar.\n\nEnquanto o demonstrativo da CCB não fica pronto, a Lívia continua respondendo que o kit FINZA está em desenvolvimento, para não gerar um kit incompleto. Os kits acima foram gerados numa versão de teste.\n\n==================================================\n2. O QUE AINDA FALTA DA NOSSA PARTE\n==================================================\n\n- Demonstrativo de débito da CCB. Como você pediu, ele é diferente do demonstrativo da BLIPS e da IDEAL: considera o vencimento antecipado da dívida inteira, mostra separadamente as parcelas vencidas (com encargos) e as a vencer (trazidas a valor presente), e o saldo devedor total contempla a dívida integral, com FINZA como credora. Vamos aproveitar o mesmo modelo visual do demonstrativo atual, numa versão CCB. Depende das confirmações do item 3.\n- Incluir a CCB e o demonstrativo CCB nos kits FINZA (Preventivo e Ajuizamento) e liberar os dois comandos.\n- Testar com contratos reais e te enviar um kit de exemplo para validação antes de liberar.\n\n==================================================\n3. O QUE PRECISAMOS DE VOCÊ\n==================================================\n\n3.1 Confirmar as regras do demonstrativo da CCB\nMontamos as regras a partir das cláusulas da própria CCB. Conferimos 3 CCBs (contratos 12602418, 12603553 e 12600417), e as três usam o mesmo modelo. Basta confirmar ou corrigir cada item:\n\na) Credora no demonstrativo: FINZA (endossatária).\nb) Juros de mora: 1% ao mês, proporcional aos dias de atraso, do vencimento de cada parcela até a data do cálculo (cláusula 8ª, §1º, \"a\").\nc) Multa: 2% sobre o total da parcela vencida + juros de mora (cláusula 8ª, §1º, \"b\").\nd) Vencimento antecipado: com qualquer parcela em atraso, todas as parcelas a vencer passam a ser cobradas (cláusula 11ª, \"a\").\ne) Parcelas a vencer: trazidas a valor presente pela taxa de juros da própria CCB, com redução proporcional dos juros (cláusula 13ª). Sobre elas não incidem multa nem mora. Exemplo: no contrato 12602418 a taxa é de 5,09% a.m.\nf) Correção monetária: não aplicar, porque a CCB não prevê índice.\ng) Parcelas renegociadas ou com boleto reemitido: usar sempre o valor e o vencimento originais da CCB.\n\nExemplo da regra aplicada a uma parcela de R$ 646,00 vencida há 60 dias:\n- juros de mora: 1% x 2 meses = R$ 12,92\n- multa: 2% de R$ 658,92 = R$ 13,18\n- total da parcela no demonstrativo: R$ 672,10\n\n3.2 Pontos que a CCB não deixa claros\n1. A CCB fala em mora de \"1% ao mês, ou fração\". Calculamos proporcional aos dias (ex.: 15 dias = 0,5%) ou cobramos o mês cheio a cada fração de mês?\n2. A CCB diz que a mora incide \"sobre o valor do principal, acrescido dos juros remuneratórios\". Usamos o valor total da parcela (principal + juros). Está correto?\n3. Qual data usamos como vencimento antecipado: a data do cálculo (quando o kit é gerado), a data da primeira parcela em atraso ou a data da notificação extrajudicial?\n4. Honorários de 20% (cláusula 8ª, §2º): devem aparecer como linha no demonstrativo ou ficam só na petição?\n\n3.3 Termo de endosso\nNas 3 CCBs conferidas, o termo de endosso que vem no PDF tem dois pontos que precisam da avaliação do jurídico:\n- o CNPJ do endossatário (FINZA FIDC) está igual ao da endossante Via Capital (48.632.754/0001-90);\n- a data do contrato de promessa de endosso está em branco (\"FIRMADO ENTRE ENDOSSANTE E ENDOSSATÁRIO, EM , ...\").\nEsse termo que vem dentro da CCB é suf
