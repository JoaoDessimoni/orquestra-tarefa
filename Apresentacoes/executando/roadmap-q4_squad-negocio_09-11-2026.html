ia classificado como MARKETING pela Meta, e não como Utilidade.\n\nMotivo:\n- O assunto da mensagem (devolução do equipamento) está todo dentro da variável {{1}}. O texto fixo atual (\"Preciso combinar uma coisa com você\") é um gancho de curiosidade e não informa do que se trata.\n- Template com conteúdo só na variável permite enviar qualquer mensagem, o que a Meta trata como abuso de categoria e pode restringir os templates de utilidade da conta.\n- O botão \"Quero resolver\" é vago e não descreve a ação.\n\nVersão sugerida (Utilidade):\nCabeçalho: Devolução de equipamento\nCorpo: Olá, {{1}}. Com o encerramento do contrato {{2}}, é necessário agendar a devolução do equipamento {{3}}. Responda esta mensagem ou escolha uma opção abaixo para combinarmos a data da coleta.\nRodapé: Time de Relacionamento\nBotões: Resposta rápida \"Agendar coleta\" | \"Falar com atendente\" | \"Já devolvi\"\nExemplos: João | 123456 | Forno de Lastro Y","i":false}],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-11-10T12:18:21.394444+00:00","por":"João Vinícius"},{"de":"fila_exec","para":"em_andamento","dt":"2026-11-11T22:58:02.852727+00:00","por":"João Pedro"},{"de":"em_andamento","para":"em_validacao","dt":"2026-11-11T23:30:35.196395+00:00","por":"João Pedro"},{"de":"em_validacao","para":"finalizado","dt":"2026-11-12T13:31:46.750467+00:00","por":"João Vinícius"}]},"12648":{"t":"Template WhatsApp: torre_tp_gen08_retorno_semlink","s":"finalizado","d":"Solicitação de template WhatsApp (HSM) aberta pela Torre de Controle.\n\n**Aprovar ou reprovar na Torre:** https://cobranca.finza.com.br/templates?tab=solicitacoes&request=7724b3a3-ae58-4cdb-8a5c-4aada5eb6a26\n\n- **Nome:** `torre_tp_gen08_retorno_semlink`\n- **Categoria:** Utilidade (`UTILITY`)\n- **Idioma:** pt_BR\n- **WABAs-alvo:** Blips, Finza, Ideal\n- **Solicitante:** renato.costa@blips.com.br (org `blips`)\n\nAdicionar ao DESK: não\n\n**Corpo:**\n> Estou aguardando o seu retorno sobre o seu contrato. {{1}} Assim que puder, me responde por aqui.\n\n**Exemplos das variáveis:**\n- {{1}} = Precisamos alinhar a devolução do equipamento do seu contrato.\n\n**Rodapé:** Time de Relacionamento\n\n**Botões:**\n- Resposta rápida: \"Responder agora\"\n- Resposta rápida: \"Falar com atendente\"\n\n_Botões de resposta rápida exigem os handles no fluxo \"Mensagem Cobrança - Torre de Controle\" do Hyperflow antes do uso em régua/disparo._\n\n---\n_Created via MCP (source: mcp)_","edd":null,"c":[{"a":"João Pedro","e":null,"dt":"2026-11-10T12:42:46.244757+00:00","x":"Reprovado na Torre por joaopedro@blips.com.br.\n\nMotivo: O template solicitado não se encaixa na categoria UTILIDADE, portanto foi recusado.","i":false}],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-11-10T12:18:18.726632+00:00","por":"João Vinícius"},{"de":"fila_exec","para":"finalizado","dt":"2026-11-10T12:45:23.200941+00:00","por":"João Vinícius"}]},"12649":{"t":"Telefone & Email inativo | Torre de Controle","s":"finalizado","d":"<p>Boa tarde Senhores(as),<\/p><p><\/p><p>Peço apoio no seguinte, será necessário ajustar em todas fontes de dados da torre de controle pra evitar que isso ocorra:<\/p><p><\/p><p>Onde está a informação: na tabela de contratos do Módulo Financeiro (bronze_mongodb_<a target=\"_blank\" rel=\"noopener noreferrer\" href=\"http://moduloFinanceiro.deals\">moduloFinanceiro.deals<\/a>), na lista de contatos do cliente, customer.contacts. Cada contato traz:<\/p><p>- type: \"Telefone\", \"Celular\" ou \"E-mail\"<\/p><p>- value: o número ou o e-mail<\/p><p>- status: \"Ativo\" ou \"Inativo\" (é esta a coluna que diz se o contato vale)<\/p><p>- deactivated_at: data em que foi desativado<\/p><p>O problema:<\/p><p>- Telefone: a consulta pega o telefone de <a target=\"_blank\" rel=\"noopener noreferrer\" href=\"http://negotiation.contractor.business\">negotiation.contractor.business<\/a>_data.cellphone, da Plataforma. A Plataforma não sabe que o número foi desativado no Módulo.<\/p><p>- E-mail: a consulta pega o primeiro e-mail de customer.contacts sem olhar o status. Pode sair um e-mail inativo.<\/p><p>Como filtrar:<\/p><p>1. Telefone: comparar o celular da Plataforma com os telefones de customer.contacts, só pelos dígitos e pelos 8 finais. O Módulo grava o mesmo número com ou sem +55, com ou sem espaço.<\/p><p>   - Se o número aparece só com status = 'Inativo', não usar. No lugar, usar o telefone com status = 'Ativo' mais recente (maior created_at).<\/p><p>   - Se o mesmo número também aparece como \"Ativo\" num registro em outro formato, mantém. O Módulo inativa o registro antigo e recadastra o número quando alguém edita o contato.<\/p><p>2. E-mail: considerar só type = 'E-mail' com status = 'Ativo', pegando o mais recente por created_at.<\/p><p>3. status vazio deve contar como \"Ativo\". Hoje não há nenhum caso, mas protege registros antigos.<\/p><p>Tamanho hoje: 8 contratos (49 títulos) com celular inativo, todos com outro telefone ativo no Módulo, e 2 contratos com e-mail inativo.<\/p><p><\/p><p><\/p><p>Grato J<\/p>","edd":"2026-11-18","c":[{"a":"Sistema/Negócio","e":null,"dt":"2026-11-16T12:43:01.474432+00:00","x":"[Solicitação de ajustes] Me tira uma dúvida, foi aplicado a solução na organização Blips e Finza da torre e em todas fontes de dados?\n\nSuprimentos ou Equipamentos\nDisponível, Pago, humano etc...?","i":false},{"a":"Marcos Rodrigues de Oliveira Júnior","e":null,"dt":"2026-11-16T19:00:13.855653+00:00","x":"Oi João! Sim, foi aplicado nas duas organizações, Blips e Finza, em todas as fontes de Equipamentos: Disponível, Pagos e Cobrança Humano. São 3 fontes por organização, todas alteradas juntas em 11/11 e conferidas de novo hoje (16/11). Os 10 contratos afetados (9 Blips, 1 Finza) já estão com o telefone/e-mail ativo do Módulo. A exceção é o 12501982, que não tem título em aberto e por isso não recebe cobrança.\n\nSuprimentos não entraram na mudança, porque as fontes de suprimento vêm do Sankhya e não leem os contatos do Módulo Financeiro. Na prática:\n- cliente que tem equipamento e suprimento usa o telefone e o e-mail das fontes de equipamento, que já estão corrigidas;\n- cliente só de suprimento recebe o telefone da Plataforma e o e-mail do Sankhya, sem a checagem de status do Módulo.\n\nSe quiser essa mesma trava para os clientes só de suprimento (cruzar com o Módulo pelo CPF/CNPJ), consigo medir quantos seriam afetados e aplicar.","i":false}],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-11-10T12:15:54.757283+00:00","por":"João Vinicius Dessimoni Fernandes"},{"de":"fila_exec","para":"em_andamento","dt":"2026-11-11T18:52:27.646002+00:00","por":"Marcos Rodrigues de Oliveira Júnior"},{"de":"em_andamento","para":"em_validacao","dt":"2026-11-12T13:13:48.920504+00:00","por":"Marcos Rodrigues de Oliveira Júnior"},{"de":"em_validacao","para":"em_andamento","dt":"2026-11-16T12:43:07.049168+00:00","por":"Sistema/Negócio"},{"de":"em_andamento","para":"em_validacao","dt":"2026-11-16T19:00:15.424987+00:00","por":"Automático (Quimera)"},{"de":"em_validacao","para":"finalizado","dt":"2026-11-18T13:15:43.102801+00:00","por":"João Vinicius Dessimoni Fernandes"}],"res":"2026-11-18T13:15:43.102801+00:00","dv":"Marcos","sp":2},"12730":{"t":"Vincular Número Hyperflow","s":"finalizado","d":"Solicitação de reconexão de linha WhatsApp (coexistence) no Hyperflow.\n\n• Número: 34992048477\n• Nome (Hyperflow): —\n• E-mail do responsável: luiza.cotonhoto@blips.com.br\n• Departamento: Retirada de Equipamentos\n• Empresa: Blips\n\nSolicitado por: joaopedro@blips.com.br\n\nCobrança / Liquidação Financeira / Retirada de Equipamentos / Finza — aberta no time da Finza.\n\nAberta automaticamente pelo Monitor de Conexões (Hyperflow).\n\n---\n_Created via MCP (source: monitor-hyperflow)_","edd":null,"c":[],"h":[{"de":"backlog","para":"em_andamento","dt":"2026-11-10T13:56:59.823772+00:00","por":"João Pedro"},{"de":"em_andamento","para":"em_validacao","dt":"2026-11-10T14:04:36.02436+00:00","por":"João Pedro"},{"de":"em_validacao","para":"finalizado","dt":"2026-11-10T14:05:09.375104+00:00","por":"João Pedro"}]},"12747":{"t":"Vincular Número Hyperflow","s":"finalizado","d":"Solicitação de reconexão de linha WhatsApp (coexistence) no Hyperflow.\n\n• Número: (34) 9 9936-4829\n• Nome (Hyperflow): Juliane Oliveira\n• E-mail do responsável: juliane.oliveira@blips.com.br\n• Departamento: Cobrança - 61 a 90 dias\n• Empresa: Blips\n\nSolicitado por: filipe.borges@blips.com.br\n\nCobrança / Liquidação Financeira / Retirada de Equipamentos / Finza — aberta no time da Finza.\n\nAberta automaticamente pelo Monitor de Conexões (Hyperflow).\n\n---\n_Created via MCP (source: monitor-hyperflow)_","edd":null,"c":[],"h":[{"de":"backlog","para":"em_andamento","dt":"2026-11-10T15:09:10.227525+00:00","por":"João Pedro"},{"de":"em_andamento","para":"em_validacao","dt":"2026-11-11T13:58:36.505391+00:00","por":"João Pedro"},{"de":"em_validacao","para":"finalizado","dt":"2026-11-11T17:05:38.440449+00:00","por":"João Vinícius"}]},"12840":{"t":"Transferência Hyper -Jurídico Finza e Blips ","s":"cancelado","d":"<p>Bom dia!<\/p><p>Solicito a habilitação da funcionalidade de transferência de casos no HYPER entre os setores <strong>Jurídico Finza e Jurídico Blips<\/strong>, permitindo a movimentação em ambos os sentidos.<\/p><p>A necessidade é possibilitar a transferência dos casos entre as duas áreas, conforme a demanda operacional.<\/p>","edd":null,"c":[{"a":"João Vinícius","e":null,"dt":"2026-11-11T19:54:12.08219+00:00","x":"Boa tarde @Sara Clara Teixeira ! Tudo bem? Sobre a demanda a cima não é possível fazer transferência entre organizações do hyperflow, como são contas diferentes o juridico blips e juridico finza infelizmente não há forma por enquanto; Havíamos solicitado essa funcionalidade a um tempo atrás mas segundo o hyper nãos será possível;  ","i":false}],"h":[{"de":"backlog","para":"cancelado","dt":"2026-11-11T19:54:20.228966+00:00","por":"João Vinícius"}]},"12844":{"t":"Agendamento Disparos","s":"finalizado","d":"<p>Bom dia Senhores(as),<\/p><p><\/p><p>Na aba disparos não tem a ação de agendar o disparo:<\/p><img class=\"kb-img\" src=\"attachment://1eb0e4ef-d066-4905-8d6f-434937015d1b/1794397792427_image.png\" alt=\"image.png\"><p><\/p><p>Grato J<\/p>","edd":"2026-11-20","c":[{"a":"Marcos Rodrigues de Oliveira Júnior","e":null,"dt":"2026-11-13T14:14:43.225084+00:00","x":"Entregue e já em produção.\n\nOnde validar: Torre de Controle > Disparos > \"Novo disparo\" (e também a aba \"Dados externos\").\n\n1) Monte um disparo como de costume: escolha os clientes, o tipo de ação e a mensagem. Ao lado do botão \"Disparar\" agora existe o botão \"Agendar\".\n2) Clique em \"Agendar\" e escolha data e hora. O horário é sempre o de Brasília, mesmo se o seu computador estiver em outro fuso. Dá para agendar de 5 minutos a 30 dias à frente.\n3) Confirme. A tela volta para um disparo novo e aparece o aviso \"Disparo agendado para dd/mm/aaaa hh:mm\".\n4) Vá em Disparos > \"Histórico\". O agendamento aparece no topo como \"Agendado para dd/mm hh:mm por <seu nome>\", com as opções \"Alterar horário\", \"Cancelar agendamento\" e \"Ver detalhes\".\n5) No horário marcado, o card passa para \"Executando\" e depois para o lote normal. O lote mostra quantas ações foram criadas e quantos clientes foram pulados.\n\nComo funciona no horário:\n- Os clientes que você marcou ficam guardados. Nos envios de negativação e notificação, os contratos escolhidos também ficam guardados.\n- Na hora do envio, o sistema recalcula o título e a parcela de cada cliente. Quem pagou nesse meio-tempo, ou não tem mais nada a cobrar, é pulado e aparece contado como \"sem título cobrável\".\n- Em \"Dados externos\", as linhas do arquivo ficam guardadas e saem no horário escolhido.\n\nO que NÃO muda depois de agendar:\n- Só o horário pode ser alterado. Para trocar a lista de clientes ou a mensagem, cancele e agende de novo.\n- Alterar e cancelar só funcionam enquanto o agendamento ainda não começou. Depois disso a tela avisa que ele já foi executado ou cancelado.\n- O filtro da carteira não é reavaliado no horário: valem os clientes marcados no momento do agendamento.\n- Não há agendamento recorrente (todo dia ou toda semana). Cada agendamento roda uma vez.\n- O ritmo de envio da organização continua valendo. Um agendamento grande sai aos poucos, como um disparo normal.\n- Ignorar a blocklist continua restrito a proprietário e administrador, e é conferido no momento de agendar.\n\nSugestão de teste: agende um disparo pequeno, de 2 ou 3 clientes, para daqui a uns 10 minutos, troque o horário uma vez e acompanhe o card no Histórico até virar lote.","i":false},{"a":"Sistema/Negócio","e":null,"dt":"2026-11-16T13:38:58.497518+00:00","x":"[Solicitação de ajustes] Realizei o teste porém não recebi o RCS mesmo falando que foi enviado peço que verifiquem e o email mesmo após 30 min não enviou. Avaliar o envio e recebimento na modalidade de agendamento de disparos por favor. Além de delay/cache na atualização, agendei 10:05 porém 10:10 ainda estava falando que nada foi disparado e ainda estava agendado pra 10:05, como se fosse um bug visual.","i":false},{"a":"Marcos Rodrigues de Oliveira Júnior","e":null,"dt":"2026-11-16T18:50:41.410973+00:00","x":"Voltando nos três pontos que você levantou. Conferimos o seu teste de hoje: o agendamento rodou às 10:05 em ponto e criou as três mensagens, WhatsApp, RCS e e-mail.\n\n1) Tela parada em \"Agendado para 10:05\": você está certo, é um defeito nosso. O disparo saiu no horário, mas o Histórico não se atualizou sozinho e continuou mostrando o estado anterior até a página ser recarregada. Vamos corrigir já, para o card passar sozinho para \"Executando\" e depois para o lote, sem precisar recarregar. Aviso aqui quando estiver em produção.\n\n2) E-mail que não saiu: ele saiu, mas às 11:16, 71 minutos depois do horário agendado. O agendamento não teve relação com o atraso. Na hora do seu disparo havia cerca de 1.500 e-mails de campanhas do fim de semana na fila de envio da Blips, e o seu entrou na mesma fila, com a mesma prioridade. Um disparo feito na hora pelo botão \"Disparar\" teria esperado o mesmo tempo.\n\nPrecisamos da sua decisão sobre como isso deve funcionar:\n- Opção A: disparos, imediatos ou agendados, passam na frente das campanhas e saem logo. Em compensação, as campanhas da fila atrasam um pouco mais.\n- Opção B: manter como está, com disparos respeitando a ordem da fila junto com as campanhas.\n- Se preferir outra regra, por exemplo prioridade só para disparos pequenos ou só para alguns canais, é só dizer.\n\n3) RCS que não chegou: do lado da Torre está tudo certo. A mensagem foi enviada às 10:06 e o provedor confirmou o recebimento. O que acontece depois disso fica no Hyperflow, e vou olhar lá o que houve com essa mensagem. Um detalhe que pode ajudar: dessa vez você usou a integração \"[HUMANO] RCS - Blips\", e nos seus testes anteriores, que chegaram, foi a \"[IA] RCS - Blips\". Volto aqui com o resultado.","i":false},{"a":"Sistema/Negócio","e":null,"dt":"2026-11-16T19:45:38.221038+00:00","x":"Entendido, sobre o RCS fico no aguardo e a correção do \"bug visual\". Sobre a prioridade pode priorizar as da aba disparos atrasando os demais da campanha.","i":false},{"a":"Marcos Rodrigues de Oliveira Júnior","e":null,"dt":"2026-11-16T21:37:39.816922+00:00","x":"Os dois ajustes já estão em produção.\n\nOnde validar: Torre de Controle > Disparos > \"Novo disparo\" > \"Agendar\", e depois Disparos > \"Histórico\".\n\n1) Tela que não atualizava: corrigido. Com a aba \"Histórico\" aberta, o card agora troca de estado sozinho, sem precisar recarregar a página. Poucos segundos depois do horário marcado ele passa de \"Agendado\" para \"Executando\" e depois vira o lote, como no seu teste das 10:05.\n\n2) Demora do e-mail: definimos que o disparo agendado passa na frente das campanhas. No horário marcado, as mensagens agendadas entram no começo da fila de envio do canal e saem antes das mensagens de campanha que estiverem esperando. No seu teste, o e-mail esperou 71 minutos atrás de cerca de 1.500 e-mails de campanha; com essa mudança, ele sairia logo após o horário.\n\n3) RCS: conferimos de novo e não é do nosso lado. A Torre enviou o RCS às 10:06 e o provedor confirmou o recebimento, igual aos seus testes anteriores. O agendamento está funcionando corretamente. Peço que você verifique, no aparelho do número 34 99186-9713:\n- se o RCS está ativo, ou seja, se a opção de chat do aplicativo de mensagens (Google Mensagens) está ligada e conectada;\n- se a mensagem não chegou em outra conversa ou na pasta de spam do aplicativo de mensagens;\n- se o número está com dados móveis ou Wi-Fi ativos no horário do envio.\n\nSugestão de teste: agende para daqui a uns 5 minutos um disparo pequeno com WhatsApp e e-mail, deixe a aba \"Histórico\" aberta e acompanhe o card mudar sozinho.\n\nO que não muda:\n- Só o disparo agendado ganhou prioridade. O disparo feito na hora pelo botão \"Disparar\" continua respeitando a ordem da fila junto com as campanhas.\n- Um agendamento grande sai inteiro na frente das campanhas daquele canal, e elas atrasam na mesma proporção.\n- O ritmo de envio da organização continua valendo.","i":false}],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-11-12T13:36:44.079676+00:00","por":"João Vinicius Dessimoni Fernandes"},{"de":"fila_exec","para":"em_andamento","dt":"2026-11-12T20:12:38.246538+00:00","por":"Marcos Rodrigues de Oliveira Júnior"},{"de":"em_andamento","para":"em_validacao","dt":"2026-11-13T14:14:48.687287+00:00","por":"Automático (Quimera)"},{"de":"em_validacao","para":"em_andamento","dt":"2026-11-16T13:39:01.305528+00:00","por":"Sistema/Negócio"},{"de":"em_andamento","para":"em_validacao","dt":"2026-11-16T21:38:26.635587+00:00","por":"Automático (Quimera)"},{"de":"em_validacao","para":"finalizado","dt":"2026-11-18T13:15:27.324841+00:00","por":"João Vinicius Dessimoni Fernandes"}],"res":"2026-11-18T13:15:27.324841+00:00","dv":"Marcos","sp":3},"12905":{"t":"Disparos: fila de E-mail/RCS travada por parcelas aguardando a parcela anterior (parcel_order_wait)","s":"finalizado","d":"SINTOMA\nNo Historico de Disparos, os lotes \"Em massa\" de E-mail (1.043 acoes) e RCS (1.043 acoes) de 11/11 09:13 ficaram com cerca de 900 acoes em \"Pendente / Processando\" por horas. O ultimo envio de E-mail foi as 11:34 BRT e o de RCS as 12:04 BRT. O WhatsApp do mesmo horario terminou normalmente.\n\nTAMANHO (org_blips, medido em 11/11 15:15 BRT, somando lotes de 10/11 e 11/11)\n- E-mail: 3.666 pendentes (1.012 parcelas seq>=2, 1.119 parcelas seq 1 e 1.535 de disparo comum, que nao e por parcela)\n- RCS: 3.850 pendentes (1.067 parcelas seq>=2, 1.206 parcelas seq 1 e 1.577 de disparo comum)\n\nO scheduled-action-processor roda todo minuto e termina com sent: 0 e 280 skipped, todos com skipped_reason = parcel_order_wait.\n\nCAUSA\n1. claim_org_dispatch_actions_v2 escolhe as acoes por (priority, id). O id e um uuid aleatorio, entao a ordem nao tem relacao com o numero da parcela.\n2. O guard de ordem do Disparo por parcela (IAF-8609, regra 54) adia por 60s a parcela seq>=2 que ainda tem irma de seq menor pendente.\n3. 60s e o mesmo intervalo do cron, entao a acao adiada volta a ser elegivel na rodada seguinte e reaparece no topo da fila.\n4. Cada vez que uma parcela 1 chegava ao topo, ela era enviada e saia da fila. Com o tempo, o topo de cada canal (50 de e-mail, 20 de RCS) ficou so com parcelas seq>=2 que esperam uma irma de id MAIOR. Essa irma nunca entra no lote do minuto.\nMedido: das 50 primeiras acoes da fila de cada canal, as 50 sao parcelas seq>=2 bloqueadas por uma irma que esta mais atras na fila. Resultado: um livelock em que a cota do minuto vai inteira em adiamento e nenhum envio acontece, inclusive dos disparos comuns.\n\nCORRECAO PROPOSTA\n- O claim passa a ordenar tambem pelo numero da parcela (metadata->parcel_dispatch->seq, com 1 como padrao), dentro da mesma prioridade, para a parcela anterior sair antes da seguinte.\n- Avaliar: adiamento do parcel_order_wait diferente de 60s, para a acao nao voltar sempre na rodada seguinte.\n- Teste SQL cobrindo o cenario: parcela seq 2 com id menor que a seq 1 deve ter a seq 1 pega antes.\n\nPONTO DE NEGOCIO\nCerca de metade da fila e de 10/11. Quando a fila destravar, essas mensagens saem com um dia de atraso. Decidir se cancela os lotes de ontem antes.\n\nACHADO SEPARADO (fora do escopo deste card)\nO process-webhook-retries registra a cada minuto \"Skipping org_blips: column webhook_retry_queue.next_retry_at does not exist\". A fila de retry de callbacks nao esta sendo processada para org_blips.\n\n---\n_Created via MCP (source: mcp)_","edd":"2026-11-13","c":[{"a":"Marcos Rodrigues de Oliveira Júnior","e":null,"dt":"2026-11-11T19:36:19.959815+00:00","x":"Entregue e já em produção desde hoje, 11/11, às 16:24. Vale também para as ações que já estavam paradas: não é preciso criar nenhum disparo novo.\n\nOnde validar: Torre de Controle > Disparos > Histórico\n\n1) Abra os dois lotes \"Em massa\" de hoje às 09:13, o de E-mail e o de RCS (1.043 ações cada). Até as 16:23 eles estavam parados com cerca de 900 ações em \"Pendente / Processando\" cada, e nenhum envio desde o fim da manhã.\n2) Atualize a tela de tempos em tempos. O número de \"Enviado\" volta a subir a cada minuto. Entre 16:24 e 16:33 saíram 233 e-mails e 121 RCS.\n3) Faça o mesmo com os lotes de 10/11: eles também estavam parados e voltaram para a fila.\n\nO que esperar no ritmo:\n- O e-mail sai a até 50 por minuto. A fila, somando os lotes de ontem e de hoje (cerca de 3.200), deve zerar em umas 2 horas.\n- O RCS sai a até 20 por minuto. São cerca de 3.550 na fila, então ele leva de 3 a 4 horas. Se precisar ir mais rápido, dá para aumentar em Configurações > Velocidade de disparo.\n\nO que não muda:\n- No modo \"Uma mensagem por parcela\", as parcelas seguintes de um mesmo cliente ainda podem ficar alguns minutos em \"Pendente\" enquanto a anterior sai. É a ordem sendo respeitada, como antes. A diferença é que elas não seguram mais o envio dos outros clientes nem dos disparos comuns.\n- As mensagens que estavam paradas saem agora, com o atraso acumulado. Os lotes de 10/11 estão sendo enviados com mais de um dia de atraso. Se algum deles não deveria mais sair, cancele pelo Histórico, que o que ainda estiver em \"Pendente\" deixa de ser enviado.\n- Parte dos RCS volta como \"Falhou\" com \"Aparelho não possui suporte ao RCS\". É o celular do cliente que não aceita RCS, igual aos outros disparos.\n\nUm aviso não relacionado: encontramos outra fila interna da Blips, a de reprocessamento de retornos dos canais, sem rodar. Ela vai num card separado.","i":false}],"h":[{"de":"em_andamento","para":"em_validacao","dt":"2026-11-11T20:11:43.913393+00:00","por":"Automático (Quimera)"},{"de":"em_validacao","para":"finalizado","dt":"2026-11-12T13:13:16.874581+00:00","por":"João Vinicius Dessimoni Fernandes"},{"de":"finalizado","para":"cancelado","dt":"2026-11-17T00:20:16.340998+00:00","por":"Marcos Rodrigues de Oliveira Júnior"},{"de":"cancelado","para":"finalizado","dt":"2026-11-17T00:20:32.276636+00:00","por":"Marcos Rodrigues de Oliveira Júnior"}],"res":"2026-11-17T00:20:32.276636+00:00","dv":"Marcos","sp":3},"12941":{"t":"Chamadas Finza","s":"finalizado","d":"<p>Boa tarde Senhores(as),<\/p><p><\/p><p>Chamadas do Hyper Finza estão sendo recusadas por conta de billing:<\/p><p><\/p><img class=\"kb-img\" src=\"attachment://2a624f56-e097-4781-9b47-766d72dea590/1794429008598_image.png\" alt=\"image.png\"><p><\/p><p>Grato J<\/p><p><\/p>","edd":"2026-11-13","c":[],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-11-12T13:41:13.651839+00:00","por":"João Vinicius Dessimoni Fernandes"},{"de":"fila_exec","para":"em_andamento","dt":"2026-11-12T13:41:20.695318+00:00","por":"João Vinicius Dessimoni Fernandes"},{"de":"em_andamento","para":"finalizado","dt":"2026-11-16T12:55:18.510761+00:00","por":"João Vinicius Dessimoni Fernandes"}],"res":"2026-11-16T12:55:18.510761+00:00","dv":"João Vinícius","sp":2},"12972":{"t":"Configuração CCB Valentina v2","s":"finalizado","d":"<p>Configurar o envio de link/pdf Valentina V2<\/p>","edd":null,"c":[],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-11-12T01:00:10.61552+00:00","por":"Leandro Marques Gontijo Jersé"},{"de":"fila_exec","para":"finalizado","dt":"2026-11-12T01:00:16.137013+00:00","por":"Leandro Marques Gontijo Jersé"}],"res":"2026-11-12T01:00:16.137013+00:00","dv":"Leandro","sp":3},"12984":{"t":"Testes e validação Valentina em Stg","s":"finalizado","d":"<p>Testes de validação do agente Valentina que esta em stg, testes de ferramentas, respostas, prompt, etc.<\/p>","edd":"2026-11-13","c":[],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-11-12T12:13:43.521456+00:00","por":"Leandro Marques Gontijo Jersé"},{"de":"fila_exec","para":"em_andamento","dt":"2026-11-12T12:13:47.643163+00:00","por":"Leandro Marques Gontijo Jersé"},{"de":"em_andamento","para":"em_validacao","dt":"2026-11-15T20:52:59.50953+00:00","por":"Leandro Marques Gontijo Jersé"},{"de":"em_validacao","para":"finalizado","dt":"2026-11-17T13:06:12.632496+00:00","por":"João Vinicius Dessimoni Fernandes"}],"res":"2026-11-17T13:06:12.632496+00:00","dv":"Leandro","sp":3},"13001":{"t":"Aprovação dos testes","s":"finalizado","d":"<p>Bom dia Senhores(as),<\/p><p><\/p><p>Segue formalização conforme falamos:<\/p><img class=\"kb-img\" src=\"attachment://5e6ddd15-64e4-42ac-9340-27133b6b5fa9/1794490978269_image.png\" alt=\"image.png\"><p><\/p><p>Grato J<\/p><p><\/p>","edd":"2026-11-20","c":[{"a":"Marcos Rodrigues de Oliveira Júnior","e":null,"dt":"2026-11-17T00:20:31.080227+00:00","x":"Pronto. A Finza agora tem o mesmo funcionamento de imagem, áudio e cobrança por parcela que a Blips já usava.\n\nO que fizemos\n1) Templates na Meta: criamos na conta de WhatsApp da Finza os 3 templates que a Blips usa, com o mesmo nome e o mesmo conteúdo: \"teste_8215_imagem\", \"teste_8215_audio\" e \"torre_tp_parcela_pagamento_1\". Os 3 foram aprovados e estão ativos na Torre (Finza).\n2) Fluxos do Hyperflow da Finza: os dois fluxos de cobrança passaram a receber a imagem, o áudio e o valor da parcela vindos da Torre. Entraram os ramos de cada template:\n- imagem: a mensagem sai com a imagem escolhida no disparo no topo;\n- áudio: a mensagem sai com o botão \"Ouvir mensagem\" e, quando o cliente toca, o fluxo manda o áudio escolhido no disparo;\n- parcela: a mensagem sai como cartão de pagamento, com o valor e os botões \"Copiar código Pix\" e \"Copiar código do boleto\".\n3) Mensagens especiais com conversa aberta: imagem, áudio e cartão saem no formato certo mesmo quando o cliente já falou com a Finza no dia. Antes, nesse caso, sairia só o texto.\n4) Cobrança por parcela: no disparo \"Uma mensagem por parcela\", da 2ª parcela em diante a mensagem passa mesmo com o atendimento da IA aberto. Assim todas as parcelas chegam, e não só a primeira.\n5) Integrações da Torre (Finza): as integrações [IA] passaram a enviar o valor da parcela, que o cartão usa.\n6) Catálogo de templates: a sincronização de templates da Finza passou a trazer os templates de imagem e áudio, para eles aparecerem no Disparos.\n\nFizemos backup dos dois fluxos antes da mudança.","i":false},{"a":"Marcos Rodrigues de Oliveira Júnior","e":null,"dt":"2026-11-17T00:20:33.019352+00:00","x":"Já em produção e testado ponta a ponta em 16/11, com um cliente de teste e um celular nosso.\n\nOnde validar: Torre de Controle > Disparos > Novo disparo (org Finza), canal WhatsApp, integração com [IA] no nome.\n\n1) Imagem: escolha o template \"teste_8215_imagem\", preencha as 3 variáveis e suba uma imagem no campo de imagem do cabeçalho. Chega com a imagem no topo e o texto preenchido. No nosso teste chegou às 20:40.\n2) Áudio: escolha \"teste_8215_audio\" e suba um áudio no campo de áudio. Chega a mensagem com o botão \"Ouvir mensagem\". Ao tocar, chega o áudio como nota de voz. No teste, o áudio chegou 1 minuto depois do toque.\n3) Parcela: escolha \"torre_tp_parcela_pagamento_1\", marque \"Uma mensagem por parcela\" e limite a 3 parcelas. Chegam 3 cartões, da parcela mais antiga para a mais nova, com cerca de 1 minuto entre eles. Cada um traz o valor e os botões \"Copiar código Pix\" e \"Copiar código do boleto\". No teste, as 3 saíram às 20:59, 21:00 e 21:01, e nenhuma ficou como \"Em Atendimento\".\n\nO que não muda:\n- Os outros templates da Finza seguem chegando exatamente como antes.\n- Use a integração com [IA] no nome para cobrar por parcela. Pela integração [HUMANO], só a primeira parcela passa quando há atendimento aberto.\n- Áudio continua só no WhatsApp. No RCS, o provedor não aceita, como já acontece na Blips.\n- Os nomes \"teste_8215_imagem\" e \"teste_8215_audio\" são os mesmos usados na Blips. Se quiserem textos definitivos, criamos templates novos com o conteúdo que vocês mandarem.\n\nValidei os três testes no celular e está tudo funcionando. Pode repetir com qualquer contato de teste.","i":false}],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-11-12T17:53:25.255349+00:00","por":"João Vinicius Dessimoni Fernandes"},{"de":"fila_exec","para":"em_andamento","dt":"2026-11-16T19:22:48.841696+00:00","por":"Marcos Rodrigues de Oliveira Júnior"},{"de":"em_andamento","para":"em_validacao","dt":"2026-11-17T00:20:40.273371+00:00","por":"Automático (Quimera)"},{"de":"em_validacao","para":"finalizado","dt":"2026-11-18T13:15:29.019161+00:00","por":"João Vinicius Dessimoni Fernandes"}],"res":"2026-11-18T13:15:29.019161+00:00","dv":"Marcos","sp":3},"13002":{"t":"Aprovação do teste de novo modelo de template","s":"fila_exec","d":"<p>Bom dia Senhores(as),<\/p><p><\/p><p>Segue formalização conforme falamos Marcos:<\/p><img class=\"kb-img\" src=\"attachment://c8561c9c-2e7d-4590-8896-003f62fa9a4c/1794491051259_image.png\" alt=\"image.png\"><p><\/p><p>Grato J<\/p><p><\/p>","edd":"2026-11-25","c":[{"a":"Marcos Rodrigues de Oliveira Júnior","e":null,"dt":"2026-11-17T11:46:43.726019+00:00","x":"Preciso que você me de mais detalhes de como quer o template\n","i":false}],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-11-12T17:53:20.538053+00:00","por":"João Vinicius Dessimoni Fernandes"}],"dv":"Marcos","sp":2},"13003":{"t":"Hyperflow Finza: replicar imagem, áudio e disparo por parcela que já funcionam na Blips","s":"finalizado","d":"<p>Na Torre, imagem/áudio (8215) e disparo por parcela com botão de pagamento (8609/12188) já valem para todas as orgs. O que ficou só na Blips foi a parte de fora da Torre: flows do Hyperflow, templates na Meta e corpo das integrações.<\/p><p><strong>Situação da Finza em prod (12/11):<\/strong> 0 ações com imagem/áudio e 0 WhatsApp por parcela nos últimos 40 dias; nenhuma das 16 integrações WhatsApp tem <code>title_current_value_decimal<\/code> no corpo (Blips: 16 de 16); <code>torre_tp_parcela_pagamento_1<\/code> já aprovado e sincronizado.<\/p><p><strong>Escopo:<\/strong><\/p><ul><li>Flow WhatsApp da Finza: repassar <code>media_url<\/code>/<code>audio_url<\/code>, nó de template com imagem no cabeçalho, ramo do áudio após o botão, ramo do <code>torre_tp_parcela_pagamento_1<\/code> (cartão de pagamento).<\/li><li>Integrações WhatsApp da Finza: acrescentar <code>title_current_value_decimal<\/code>.<\/li><li>Templates de imagem e áudio na WABA da Finza.<\/li><li>Teste ponta a ponta em telefone de teste.<\/li><\/ul><p>Fora: áudio no RCS (provedor recusa também na Blips).<\/p>\n\n---\n_Created via MCP (source: mcp)_","edd":null,"c":[{"a":"Marcos Rodrigues de Oliveira Júnior","e":null,"dt":"2026-11-17T00:09:39.394661+00:00","x":"Pronto. A Finza agora tem o mesmo funcionamento de imagem, áudio e cobrança por parcela que a Blips já usava.\n\nO que fizemos\n1) Templates na Meta: criamos na conta de WhatsApp da Finza os 3 templates que a Blips usa, com o mesmo nome e o mesmo conteúdo: \"teste_8215_imagem\", \"teste_8215_audio\" e \"torre_tp_parcela_pagamento_1\". Os 3 foram aprovados e estão ativos na Torre (Finza).\n2) Fluxos do Hyperflow da Finza: os dois fluxos de cobrança passaram a receber a imagem, o áudio e o valor da parcela vindos da Torre. Entraram os ramos de cada template:\n- imagem: a mensagem sai com a imagem escolhida no disparo no topo;\n- áudio: a mensagem sai com o botão \"Ouvir mensagem\" e, quando o cliente toca, o fluxo manda o áudio escolhido no disparo;\n- parcela: a mensagem sai como cartão de pagamento, com o valor e os botões \"Copiar código Pix\" e \"Copiar código do boleto\".\n3) Mensagens especiais com conversa aberta: imagem, áudio e cartão saem no formato certo mesmo quando o cliente já falou com a Finza no dia. Antes, nesse caso, sairia só o texto.\n4) Cobrança por parcela: no disparo \"Uma mensagem por parcela\", da 2ª parcela em diante a mensagem passa mesmo com o atendimento da IA aberto. Assim todas as parcelas chegam, e não só a primeira.\n5) Integrações da Torre (Finza): as integrações [IA] passaram a enviar o valor da parcela, que o cartão usa.\n6) Catálogo de templates: a sincronização de templates da Finza passou a trazer os templates de imagem e áudio, para eles aparecerem no Disparos.\n\nFizemos backup dos dois fluxos antes da mudança.","i":false},{"a":"Marcos Rodrigues de Oliveira Júnior","e":null,"dt":"2026-11-17T00:09:48.50067+00:00","x":"Já em produção e testado ponta a ponta em 16/11, com um cliente de teste e um celular nosso.\n\nOnde validar: Torre de Controle > Disparos > Novo disparo (org Finza), canal WhatsApp, integração com [IA] no nome.\n\n1) Imagem: escolha o template \"teste_8215_imagem\", preencha as 3 variáveis e suba uma imagem no campo de imagem do cabeçalho. Chega com a imagem no topo e o texto preenchido. No nosso teste chegou às 20:40.\n2) Áudio: escolha \"teste_8215_audio\" e suba um áudio no campo de áudio. Chega a mensagem com o botão \"Ouvir mensagem\". Ao tocar, chega o áudio como nota de voz. No teste, o áudio chegou 1 minuto depois do toque.\n3) Parcela: escolha \"torre_tp_parcela_pagamento_1\", marque \"Uma mensagem por parcela\" e limite a 3 parcelas. Chegam 3 cartões, da parcela mais antiga para a mais nova, com cerca de 1 minuto entre eles. Cada um traz o valor e os botões \"Copiar código Pix\" e \"Copiar código do boleto\". No teste, as 3 saíram às 20:59, 21:00 e 21:01, e nenhuma ficou como \"Em Atendimento\".\n\nO que não muda:\n- Os outros templates da Finza seguem chegando exatamente como antes.\n- Use a integração com [IA] no nome para cobrar por parcela. Pela integração [HUMANO], só a primeira parcela passa quando há atendimento aberto.\n- Áudio continua só no WhatsApp. No RCS, o provedor não aceita, como já acontece na Blips.\n- Os nomes \"teste_8215_imagem\" e \"teste_8215_audio\" são os mesmos usados na Blips. Se quiserem textos definitivos, criamos templates novos com o conteúdo que vocês mandarem.\n\nValidei os três testes no celular e está tudo funcionando. Pode repetir com qualquer contato de teste.","i":false}],"h":[{"de":"em_andamento","para":"em_validacao","dt":"2026-11-17T00:10:07.326768+00:00","por":"Automático (Quimera)"},{"de":"em_validacao","para":"finalizado","dt":"2026-11-17T00:20:54.43574+00:00","por":"Marcos Rodrigues de Oliveira Júnior"}],"res":"2026-11-17T00:20:54.43574+00:00","dv":"Marcos","sp":5},"13006":{"t":"Melhorias na solicitação de templates WhatsApp (HSM) pela Torre de Controle (tela /templates, aba Solicitações)","s":"finalizado","d":"<p>1. Card do Quimera aberto em nome de quem pediu<\/p><p>- Antes: todo card saía no nome do dono da chave de integração, e quem pediu não recebia nenhuma notificação do card.<\/p><p>- Agora: a Torre abre o card pelo endpoint tickets-inbound do Quimera, em nome do solicitante, que passa a receber as notificações.<\/p><p>- Se o e-mail do solicitante não estiver cadastrado no Quimera, o card é aberto no e-mail padrão da integração e isso fica registrado no log.<\/p><p>- Área solicitante: Cobrança. Time executor: IA Automação Finza.<\/p><p>- O responsável do card continua sendo atribuído automaticamente logo após a abertura.<\/p><p>2. Texto do card legível<\/p><p>- A descrição saía com marcações (asteriscos, crases, \"&gt;\") que o Quimera não interpreta. Agora sai em texto limpo.<\/p><p>3. Solicitações visíveis em todas as organizações<\/p><p>- Os templates são criados em todas as WABAs, então qualquer organização da Torre passa a ver todas as solicitações.<\/p><p>- A lista ganhou a coluna \"Organização\", com a origem de cada pedido.<\/p><p>- Cancelar continua permitido só para quem pediu ou para um aprovador.<\/p><p>4. Emoji barrado onde a Meta não aceita<\/p><p>- A Torre recusa emoji no cabeçalho, no rodapé e no texto dos botões, antes de enviar o pedido. No corpo da mensagem o emoji continua permitido.<\/p><p>- Isso evita pedido que seria reprovado depois pela Meta.<\/p>","edd":null,"c":[],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-11-12T14:10:29.826889+00:00","por":"João Pedro da Silva Neto"},{"de":"fila_exec","para":"em_andamento","dt":"2026-11-12T14:10:34.508457+00:00","por":"João Pedro da Silva Neto"},{"de":"em_andamento","para":"em_validacao","dt":"2026-11-12T19:59:19.570483+00:00","por":"João Pedro da Silva Neto"},{"de":"em_validacao","para":"finalizado","dt":"2026-11-12T19:59:32.088203+00:00","por":"João Pedro da Silva Neto"}],"res":"2026-11-12T19:59:32.088203+00:00","dv":"João Pedro","sp":5},"13017":{"t":"Email com anexo boleto","s":"finalizado","d":"<p>Boa tarde Senhores(as),<\/p><p><\/p><p>Segue formalização conforme falamos Marcos:<\/p><img class=\"kb-img\" src=\"attachment://7a58d0c5-50e6-4b5b-aa8b-5cb202dc6388/1794495287107_image.png\" alt=\"image.png\"><p><\/p><p>Grato J<\/p><p><\/p>","edd":"2026-11-20","c":[{"a":"Marcos Rodrigues de Oliveira Júnior","e":null,"dt":"2026-11-13T21:48:40.42862+00:00","x":"Entregue e já em produção. O e-mail de cobrança agora pode levar o boleto em PDF anexado. A opção vem desligada e só muda algo onde vocês ligarem.\n\nOnde ligar:\n- Régua: Torre de Controle > Réguas de Cobrança > abra a régua > passo de e-mail > fase \"Conteúdo\" > \"Anexar boleto (PDF)\"\n- Disparo avulso: Torre de Controle > Disparos > \"Novo disparo\" > canal e-mail > mesma opção\n- Ação manual: Torre de Controle > Gestão de Carteira > abra o cliente > nova ação de e-mail > mesma opção\n\nAo ligar, aparece uma segunda opção, \"Anexar também de parcela vencida\", também desligada. A prévia passa a mostrar a linha \"Anexo: boleto em PDF das parcelas citadas\".\n\nComo funciona, com exemplos:\n1) Vão anexados os boletos das parcelas que aparecem no texto do e-mail, nem mais nem menos.\n- A mensagem lista 3 parcelas a vencer (25/11, 25/12 e 25/01): vão 3 PDFs.\n- A lista mostra 5 parcelas e termina com \"e mais 2\": vão os 5 PDFs mostrados, não os 7.\n- A mensagem fala só do valor e do vencimento de uma parcela: vai 1 PDF.\n2) Parcela vencida só vai com a segunda opção ligada. Exemplo: uma parcela vencida em 05/11 e outra a vencer em 25/11, com a opção desligada: vai só a de 25/11. Isso pesa. Nos últimos 30 dias, metade dos e-mails da Finza com boleto falava de parcela já vencida. Deixamos desligado porque o PDF mostra o vencimento original, e vale confirmar com o financeiro se esse boleto continua pagável depois do vencimento.\n3) Parcela sem PDF fica de fora e o e-mail sai normalmente. Nos últimos 30 dias, tinham PDF 100% dos e-mails da Finza, 94% da Blips e só 36% da Ideal (suprimento não tem PDF).\n4) O máximo é de 10 boletos por e-mail.\n5) Se um PDF não puder ser baixado na hora do envio, o e-mail sai sem aquele anexo, em vez de não sair.\n\nPara validar:\n1) Faça uma ação manual de e-mail para um cliente de teste com o seu e-mail cadastrado. Use uma mensagem com a lista de parcelas e ligue \"Anexar boleto (PDF)\".\n2) Confira se chegou um PDF para cada parcela listada e se o nome do arquivo traz o número da parcela.\n3) Repita com a opção desligada: o e-mail chega igual ao de hoje, sem anexo.\nJá testamos o envio de um boleto real pelas contas de e-mail da Finza e da Blips, e os dois chegaram com o PDF.\n\nO que não muda:\n- WhatsApp e RCS seguem sem anexo. A opção existe só no canal e-mail.\n- Em \"Dados externos\" não há parcela, então não há boleto para anexar.\n- Uma lista de contratos montada como variável personalizada não anexa boletos. Só as listas padrão da Torre anexam.\n- O limite diário de envio de cada conta de e-mail é o mesmo.\n- Por enquanto, use a opção em disparos e ações pontuais. Antes de ligar em réguas de volume alto, fale comigo: falta um ajuste interno do nosso lado para esse volume, e eu aviso quando estiver pronto.","i":false},{"a":"Sistema/Negócio","e":null,"dt":"2026-11-16T14:01:48.43831+00:00","x":"[Solicitação de ajustes] Não entendi a parte de utilização, tenho que usar alguma variável especifica?","i":false},{"a":"Marcos Rodrigues de Oliveira Júnior","e":null,"dt":"2026-11-16T18:52:04.817765+00:00","x":"Não precisa de variável nova. O anexo segue as variáveis que a mensagem já usa: com a opção ligada, vai o boleto de cada parcela que essas variáveis escreverem no e-mail.\n\nNa prática, para os e-mails de cobrança de hoje basta ligar a opção. Em 13/11, 628 passos de e-mail ativos (Blips e Finza) usavam a variável \"Contratos com Títulos Disponíveis, Recomprado ou Expirado (vencidos e a vencer 10 dias)\", que já lista as parcelas. Nesses passos, ligar \"Anexar boleto (PDF)\" é tudo o que precisa.\n\nVariáveis que anexam boleto, com o nome que aparece no seletor do editor:\n1) Listas de parcelas: anexam cada parcela que aparece na lista.\n- Contratos com Títulos Disponíveis, Recomprado ou Expirado (vencidos e a vencer 10 dias)\n- Contratos E Suprimentos com Títulos Cobráveis (vencidos e a vencer 10 dias). As parcelas de suprimento ficam sem anexo, porque não têm PDF.\n- Contratos com Títulos Vencidos (e a vencer 10 dias)\n- Lista de Contratos (todos em aberto)\n- Lista de Títulos, Lista de Títulos (Valor Original) e Lista de Títulos com Links\n- Variáveis personalizadas que montam lista de parcelas: anexam as parcelas exibidas, respeitando o limite de itens configurado.\n2) Dados de uma parcela: anexam o boleto da parcela daquela cobrança.\n- Qualquer variável do grupo do título, como Número do Título, Data de Vencimento e Valor Atual.\n- Valor do Pagamento, Data do Pagamento, Código de Barras, Link do Boleto, Código PIX Copia e Cola e Chave PIX.\n- Se o cliente tem mais de uma parcela em aberto e o texto usa Número do Título, Valor Atual, Data de Vencimento ou Dias em Atraso, a Torre troca esses dados pela lista de todas as parcelas em aberto, e então vão os boletos de todas. Isso não acontece em e-mail montado em HTML.\n- No Disparo com \"Uma mensagem por parcela\", vai só o boleto daquela parcela.\n\nVariáveis que não anexam nada sozinhas: Lista de Contratos (números), Valor Total da Dívida e os demais totais, Link de Pagamento, Link do PIX, Link do Cliente e os dados do cliente.\n\nExemplo: \"Olá {nome}, sua dívida é de {Valor Total da Dívida}. Pague em {Link de Pagamento}\". Esse e-mail sai sem anexo mesmo com a opção ligada, porque o texto não cita nenhuma parcela. Se você acrescentar a lista de contratos com títulos disponíveis, passam a ir os PDFs das parcelas listadas.\n\nUm cuidado com a prévia: a linha \"Anexo: boleto em PDF das parcelas citadas\" aparece sempre que a opção está ligada. Ela confirma que a opção está ligada, não que vai algum PDF. Quem decide quais PDFs vão é o texto final.\n\nUma correção ao comentário anterior: lá eu disse que só as listas padrão da Torre anexam. Variável personalizada que monta lista de parcelas também anexa, como no item 1.","i":false}],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-11-12T17:53:17.998538+00:00","por":"João Vinicius Dessimoni Fernandes"},{"de":"fila_exec","para":"em_andamento","dt":"2026-11-13T14:09:10.703747+00:00","por":"Marcos Rodrigues de Oliveira Júnior"},{"de":"em_andamento","para":"em_validacao","dt":"2026-11-13T21:48:42.03042+00:00","por":"Automático (Quimera)"},{"de":"em_validacao","para":"em_andamento","dt":"2026-11-16T14:01:51.459106+00:00","por":"Sistema/Negócio"},{"de":"e function ring(pct,max,color,ticks){const r=78,c=2*Math.PI*r,f=Math.max(0,Math.min(pct,max))/max;
  const tk=ticks.map(t=>{const a=(t/max)*2*Math.PI-Math.PI/2;const x1=100+Math.cos(a)*(r-15),y1=100+Math.sin(a)*(r-15),x2=100+Math.cos(a)*(r+15),y2=100+Math.sin(a)*(r+15),lx=100+Math.cos(a)*(r+26),ly=100+Math.sin(a)*(r+26);
    return`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#B4B8CC" stroke-width="1"/><text x="${lx.toFixed(1)}" y="${(ly+3).toFixed(1)}" font-size="9" fill="#6F7290" text-anchor="middle" font-family="JetBrains Mono,monospace">${t}%</text>`}).join('');
  return`<svg viewBox="-16 -16 232 232" role="img" aria-label="${Math.round(pct)}% da meta"><circle cx="100" cy="100" r="${r}" fill="none" stroke="#ECEEF4" stroke-width="17"/>
    <circle cx="100" cy="100" r="${r}" fill="none" stroke="${color}" stroke-width="17" stroke-linecap="round" stroke-dasharray="${(c*f).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 100 100)"/>${tk}</svg>`}

/* ---------- DEMANDA ---------- */
function startHist(id){if(S.histFor===id)return;stopHist();S.histFor=id;S.hist=[];if(!S.db)return;
  try{S.histUnsub=S.db.collection('historico').where('demanda','==',id).onSnapshot(s=>{S.hist=s.docs.map(x=>x.data()).sort((a,b)=>(b.em||'').localeCompare(a.em||''));paintTL();names(S.hist.map(h=>h.por)).then(ch=>{if(ch)paintTL()})},()=>{})}catch(e){}}
function stopHist(){if(S.histUnsub){S.histUnsub();S.histUnsub=null}S.histFor=null}

  startHist(d.id);

    return`<div class="hs ${cls}"><span class="dot">${cls==='done'?ic('check'):i+1}</span><span>${i===2&&h.status==='ajustes'?'Ajustes solicitados':stepLbl[i]}</span></div>`}).join('');
  const rel=(d.rel||[]).map(x=>{const t=Object.values(S.items).find(i=>('#'+i.key)===x||i.id===x);return t?`<button class="chip" style="--c:${fc(t)}" data-open="${t.id}"><i></i>${esc(x.startsWith('#')?x+' · '+t.titulo:t.titulo)}</button>`:`<span class="tkt">${esc(x)}</span>`}).join('');
  const hBtns=canW?[h.status!=='aprovada'?`<button class="btn ok" data-hq="aprovada">${ic('check')}Aprovar homologação</button>`:'',
      h.status!=='ajustes'?`<button class="btn bad" data-hq="ajustes">${ic('warn')}Pedir ajustes</button>`:'',
      !['em_andamento','aprovada'].includes(h.status)?`<button class="btn" data-hq="em_andamento">${ic('play')}Iniciar homologação</button>`:'',
      h.status!=='nao_aplica'?`<button class="btn ghost sm" data-hq="nao_aplica">Não se aplica</button>`:''].join(''):'';
  el.innerHTML=`<div class="grid" style="gap:14px">
  <button class="back" data-back>${ic('back','width:16px;height:16px')}Voltar para ${back}</button>
  <div class="dhero" style="--c:${fc(d)}">
    <div class="tags">${tkt(d)}<span class="pill plain" style="--s:color-mix(in srgb,${fc(d)} 12%,#fff);--t:var(--text)">${esc(fl(d))}</span>${pillQ(d)}${mk?'':pillH(d)}${lt?late('Atrasada'):''}</div>
    <h1>${esc(d.titulo)}</h1>
    <div class="dstrip">
      <div><span>Responsável técnico</span><b>${avatar(d.dev)}${esc(d.dev||'A definir')}</b></div>
      <div><span>Solicitante</span><b>${esc(d.sol||'—')}</b></div>
      <div><span>Início</span><b class="mono">${brf(d.ir||d.ip)}</b></div>
      <div><span>Entrega</span><b class="mono"${lt?' style="color:#B91C1C"':''}>${brf(d.fr||d.fp)}</b></div>
      <div><span>Esforço</span><b class="mono">${d.sp?d.sp+' SP':'—'}</b></div>
    </div>
  </div>
  <div class="grid" style="gap:14px">
    <div class="card"><div class="ch"><h3>Sobre a demanda</h3></div><div class="prose">${fmtDesc(d.desc)}</div>
      ${d.ac?`<div class="ac">${ic('target')}<div><b>Critério de aceite ou próximo passo</b><br>${esc(d.ac)}</div></div>`:''}
      ${rel?`<div style="margin-top:14px"><div class="lbl" style="margin-bottom:8px">Relacionadas</div><div class="rel">${rel}</div></div>`:''}</div>
    <div class="card"><div class="ch"><h3>Planejamento</h3><small>${esc(dfTxt)}</small></div>
      <div class="plan">
        <div><div class="dtl"><div class="h"></div><div class="h">Previsto</div><div class="h">Real</div><div class="h">Início</div><div class="v">${brf(d.ip)}</div><div class="v">${brf(d.ir)}</div><div class="h">Entrega</div><div class="v"${lt?' style="color:#B91C1C"':''}>${brf(d.fp)}</div><div class="v"${d.fr?' style="color:#047857"':''}>${brf(d.fr)}</div></div>
        ${d.fpq?`<p class="src">Entrega prevista = data do Quimera (#${esc(d.key)}). Para mudar, altere no Quimera.</p>`:d.df==='sugerida'?`<div class="note">${ic('info')}<span>Datas sugeridas pelo supervisor. O time técnico confirma ao puxar a demanda.</span></div>`:''}</div>
        <div><dl class="kv" style="margin:0"><dt>No Quimera</dt><dd>${d.key?`Sim · <span class="mono">#${d.key}</span>`:mk?'Não se aplica':'<span style="color:#B91C1C">Ainda não criada</span>'}</dd><dt>Status</dt><dd>${esc(mk?'Marco':QM[qs(d)].l)}</dd><dt>Prioridade</dt><dd style="text-transform:capitalize">${esc(d.prio||'—')}</dd>${mk?'':`<dt>Homologação</dt><dd>${pillH(d)}</dd>`}</dl>
        ${!mk&&!showH&&!DONE.has(qs(d))&&qs(d)!=='cancelado'?`<p class="src">A homologação abre quando a demanda chegar em <b>Em validação</b> no Quimera.</p>`:''}
        <p class="src"><b>Fonte:</b> ${esc(d.fonte||'—')}</p></div>
      </div>
      ${S.canAdmin?`<details class="ed" style="margin-top:14px"><summary class="btn sm">${ic('edit','width:15px;height:15px')}Editar planejamento</summary><div class="edit">
        <label class="fld">Status no Quimera<select id="e-qs">${QS.map(q=>`<option value="${q[0]}"${qs(d)===q[0]?' selected':''}>${esc(q[1])}</option>`).join('')}</select></label>
        <label class="fld">Nº do ticket<input id="e-key" inputmode="numeric" value="${esc(d.key||'')}"></label>
        <label class="fld">Responsável técnico<select id="e-dev"><option value="">A definir</option>${Object.keys(DEVS).map(n=>`<option${d.dev===n?' selected':''}>${esc(n)}</option>`).join('')}</select></label>
        <label class="fld">Story points<input id="e-sp" inputmode="numeric" value="${esc(d.sp||'')}"></label>
        <label class="fld">Início previsto<input type="date" id="e-ip" value="${esc(d.ip||'')}"></label><label class="fld">Entrega prevista<input type="date" id="e-fp" value="${esc(d.fp||'')}"></label>
        <label class="fld">Início real<input type="date" id="e-ir" value="${esc(d.ir||'')}"></label><label class="fld">Entrega real<input type="date" id="e-fr" value="${esc(d.fr||'')}"></label>
        <div class="full acts"><button class="btn pri sm" data-save-dem>Salvar planejamento</button><button class="btn sm" data-cancel-dem>Cancelar e descartar</button><span class="svst" id="e-st"></span><button class="btn sm" data-del-dem style="margin-left:auto;color:#B91C1C;border-color:#F3C2C2">Excluir demanda</button></div></div></details>`:''}
    </div>
  </div>
  ${!showH?'':`<div class="card strip" style="--c:${H.c}"><div class="ch"><h3>Homologação</h3><small>${h.seed?'Situação inicial do roadmap':h.por?'Última mudança: '+esc(nm(h.por))+' · '+when(h.em):''}</small></div>
    <div class="hcard">
      <div><div class="hstate" style="--s:${H.s};--t:${H.t};--c:${H.c}"><span class="ic">${ic(h.status==='aprovada'?'check':h.status==='ajustes'?'warn':h.status==='em_andamento'?'play':'clock')}</span><div><b>${esc(H.l)}</b><span>${h.resp?'Responsável: '+esc(h.resp):'Responsável no negócio a definir'}</span></div></div>
        ${h.parecer?`<p class="hpar" style="--c:${H.c}">${esc(h.parecer)}</p>`:''}
        <div class="hsteps">${steps}</div></div>
      ${canW?`<div class="grid" style="gap:10px"><label class="fld">Quem homologa no negócio<input id="h-resp" value="${esc(h.resp||'')}" placeholder="Nome do responsável"></label>
        <label class="fld">Parecer<textarea id="h-par" rows="3" placeholder="O que foi testado e o resultado"></textarea></label></div>
      <div class="hacts">${hBtns}<span class="svst" id="h-st"></span></div>`:'<p class="muted" style="margin:0;font-size:13px;grid-column:span 2">Você está com acesso de leitura. Peça acesso de colaborador para registrar a homologação.</p>'}
    </div></div>`}
  <div class="card"><div class="ch"><h3>Comentários e histórico no Quimera</h3><small>${d.key?'Espelho do ticket #'+esc(d.key)+' · somente leitura':'Sem ticket vinculado'}</small></div><div class="qc-wrap">${qchat(d)}</div>${qhist(d)}</div>
  <div class="drow2">
    <div class="card"><div class="ch"><h3>Registro formal</h3><small>vai para o histórico com autor e horário</small></div>
      <div class="grid" style="gap:10px">
        <p class="muted" style="margin:0;font-size:13px">Para o que precisa ficar formalizado entre negócio e desenvolvimento: uma decisão, uma aprovação, uma solicitação, uma mudança de escopo.</p>
        <label class="fld">Tipo<select id="r-cat" ${canW?'':'disabled'}>${REGCAT.map(c=>`<option>${esc(c)}</option>`).join('')}</select></label>
        <label class="fld">Registro<textarea id="r-txt" rows="4" placeholder="Ex.: decidido com a Cobrança que a régua só usa telefones com nota acima de 40." ${canW?'':'disabled'}></textarea></label>
        <div class="acts"><button class="btn pri sm" data-reg ${canW?'':'disabled'}>${ic('doc','width:15px;height:15px')}Registrar</button><span class="svst" id="r-st"></span></div>${canW?'':'<p class="muted" style="margin:0;font-size:12.5px">Seu acesso a este roadmap é de leitura ou comentário. Para registrar, peça ao João Vinícius acesso de <b>Colaborador</b>.</p>'}</div>
    </div>
    <div class="card"><div class="ch"><h3>Histórico</h3><small id="h-ct"></small></div><div class="tl" id="tl"><span class="muted">Carregando…</span></div></div>
  </div></div>`;
  paintTL()}
function paintTL(){const el=$('#tl');if(!el)return;const H=S.hist;const c=$('#h-ct');if(c)c.textContent=H.length?H.length+' registros':'';
  if(!H.length){el.innerHTML='<span class="muted">Sem registros ainda. Homologações, observações e decisões aparecem aqui, com autor e horário.</span>';return}
  el.innerHTML=H.map(h=>{const t=TIPO[h.tipo]||TIPO.demanda;let body='';
    if(h.tipo==='homolog')body=`<div class="body">${esc(HM[h.de]?.l||'—')} → <b>${esc(HM[h.para]?.l||'—')}</b>${h.resp?' · responsável: '+esc(h.resp):''}</div>${h.texto?`<div class="quote">${esc(h.texto)}</div>`:''}`;
    else if(h.tipo==='registro')body=`<div class="body"><b>${esc(h.categoria||'Registro')}</b></div><div class="quote">${esc(h.texto)}</div>`;
    else if(h.tipo==='obs')body=`<details><summary>Ver versão ${h.rev||''} do texto</summary><div class="quote">${esc(h.texto)||'<i>texto apagado</i>'}</div></details>`;
    else body=`<div class="quote mono" style="font-size:12px">${esc(h.texto)}</div>`;
    return`<div class="tli"><span class="ic" style="--s:${t[2]};--t:${t[3]}">${ic(t[1])}</span><div style="min-width:0"><div class="who"><b>${esc(nm(h.por))}</b> · ${esc(t[0])} · ${when(h.em)}</div>${body}</div></div>`}).join('')}

/* ---------- escrita ---------- */
const chain={};
function q(path,fn){const p=(chain[path]||Promise.resolve()).catch(()=>{}).then(fn);chain[path]=p;return p}
async function retry(fn){try{return await fn()}catch(e){if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,400+Math.random()*600));return fn()}throw e}}
function failMsg(e){try{console.error('[roadmap] falha ao gravar',e)}catch(_){}const em=String((e&&e.message)||'');if(e&&e.code==='permission_denied'){S.canWrite=false;return'Sem permissão para registrar. Peça acesso de colaborador ao dono do roadmap.'}if(e&&e.code==='invalid_argument'){if(S.canAdmin)return'O banco recusou a gravação ('+(/size|large|limit|big|byte/i.test(em)?'documento grande demais':'dado inválido')+'). Detalhe: '+(em||e.code);S.canWrite=false;return'Sem permissão para registrar. Peça acesso de colaborador ao dono do roadmap.'}if(e&&e.code==='quota_exceeded')return'O banco do roadmap está cheio. Avise o squad IAF.';return'Não salvou. Tente de novo em instantes.'}
const hist=o=>retry(()=>S.db.collection('historico').add(Object.assign({por:S.me&&S.me.id,em:new Date().toISOString()},o)));
function setSt(id,t,cls){const e=$(id);if(e){e.className='svst'+(cls?' '+cls:'');e.textContent=t}}
async function saveHom(para){const d=S.items[S.demand];if(!d)return;const h=homOf(d);
  const par=($('#h-par')?.value||'').trim(),resp=($('#h-resp')?.value||'').trim();
  if(para==='ajustes'&&!par){setSt('#h-st','Descreva os ajustes no parecer antes de enviar.','err');$('#h-par').focus();return}
  setSt('#h-st','Salvando…');
  const doc={status:para,parecer:par||(para===h.status?h.parecer||'':''),resp,por:S.me&&S.me.id,em:new Date().toISOString()};
  try{await q('homolog/'+d.id,()=>retry(()=>S.db.doc('homolog/'+d.id).set(doc)));await hist({demanda:d.id,tipo:'homolog',de:h.status,para,texto:par,resp})}catch(e){setSt('#h-st',failMsg(e),'err')}}
let obsT=null,obsPend=null;
function obsMark(t,ed){const e=$('#o-st');if(e)e.innerHTML=`<span class="live${ed?' ed':''}"></span>${esc(t)}`}
function obsInput(){obsPend={id:S.demand,v:$('#o-txt').value};obsMark('Editando…',true);clearTimeout(obsT);obsT=setTimeout(flushObs,1200)}
function flushObs(){clearTimeout(obsT);if(!obsPend||!S.db)return;const{id,v}=obsPend;obsPend=null;const cur=S.obs[id];if(cur&&cur.texto===v){obsMark('Salvo');return}
  const rev=(cur&&cur.rev||0)+1;const doc={texto:v,rev,por:S.me&&S.me.id,em:new Date().toISOString()};S.obs[id]=doc;
  q('obs/'+id,()=>retry(()=>S.db.doc('obs/'+id).set(doc))).then(()=>hist({demanda:id,tipo:'obs',texto:v,rev})).then(()=>{if(S.demand===id)obsMark(`Salvo · versão ${rev} · ${when(doc.em)}`)})
   .catch(e=>{if(S.demand===id){const el=$('#o-st');if(el){el.innerHTML='';const s=document.createElement('span');s.className='svst err';s.textContent=failMsg(e);el.appendChild(s)}}})}
async function saveReg(){const t=($('#r-txt').value||'').trim();if(!t){setSt('#r-st','Escreva o registro antes de enviar.','err');return}
  setSt('#r-st','Registrando…');try{await hist({demanda:S.demand,tipo:'registro',categoria:$('#r-cat').value,texto:t});$('#r-txt').value='';setSt('#r-st','Registrado no histórico.','okk')}catch(e){setSt('#r-st',failMsg(e),'err')}}
async function saveDem(){const d=S.items[S.demand];const v=id=>($(id).value||'').trim()||null;
  const patch={qs:$('#e-qs').value,key:v('#e-key')?Number(v('#e-key')):null,dev:v('#e-dev'),sp:v('#e-sp')?Number(v('#e-sp')):null,ip:v('#e-ip'),fp:v('#e-fp'),ir:v('#e-ir'),fr:v('#e-fr')};
  const ch=Object.keys(patch).filter(k=>(patch[k]??null)!==(d[k]??null));if(!ch.length){setSt('#e-st','Nada mudou.');return}
  if(ch.some(k=>['ip','fp','ir','fr'].includes(k)))patch.df='confirmada';
  setSt('#e-st','Salvando…');
  try{await q('roadmap/demandas',()=>retry(()=>S.db.doc('roadmap/demandas').update({items:{[d.id]:patch}})));
    await hist({demanda:d.id,tipo:'demanda',texto:ch.map(k=>`${k}: ${d[k]??'—'} → ${patch[k]??'—'}`).join('\n')})}catch(e){setSt('#e-st',e&&e.code==='invalid_argument'&&!S.canAdmin?'Só editores do roadmap mudam o planejamento.':failMsg(e),'err')}}
async function delDem(){const d=S.items[S.demand];if(!d)return;setSt('#e-st','Excluindo…');try{await q('roadmap/demandas',()=>retry(()=>S.db.doc('roadmap/demandas').update({items:{[d.id]:{deleted:true}}})));await hist({demanda:d.id,tipo:'demanda',texto:'Demanda excluída do roadmap'});flushObs();location.hash=(S.prev&&S.prev!=='demanda')?S.prev:'quadro'}catch(e){setSt('#e-st',e&&e.code==='invalid_argument'&&!S.canAdmin?'Só editores do roadmap excluem demandas.':failMsg(e),'err')}}
/* Quimera → roadmap: aplicado automaticamente na leitura (qoverlay). Sem botão. */
function qoverlay(c){if(c.key==null)return c;const m=QMIRROR[String(c.key)];if(!m||m.missing)return c;
  if(m.s)c.qs=m.s;
  if(m.edd){c.fp=m.edd;c.df='quimera';c.fpq=true}
  if(m.s==='finalizado'&&m.res)c.fr=String(m.res).slice(0,10);
  if(m.dv)c.dev=m.dv;if(m.sp!=null)c.sp=m.sp;return c}
function paintSync(){const el=$('#qsync-st');if(!el||!QMETA.at)return;const d=new Date(QMETA.at);el.textContent='Quimera sincronizado em '+d.toLocaleDateString('pt-BR')+' às '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+'.'}


/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  document.querySelectorAll('details.dd[open]').forEach(dt=>{if(!dt.contains(e.target))dt.open=false});
  const t=e.target.closest('button');if(!t)return;const ds=t.dataset;
  if(ds.v){location.hash=ds.v;return}
  if(ds.open){flushObs();location.hash='demanda-'+ds.open;return}
  if(t.hasAttribute('data-back')){flushObs();location.hash=S.prev;return}
  if(ds.fr){S.f.fr.has(ds.fr)?S.f.fr.delete(ds.fr):S.f.fr.add(ds.fr);ls.set('fr',[...S.f.fr]);paintFr();render();return}
  if(ds.fst){S.f.st.has(ds.fst)?S.f.st.delete(ds.fst):S.f.st.add(ds.fst);ls.set('fst',[...S.f.st]);paintFr();render();return}
  if(ds.fquim!==undefined){S.f.quim=ds.fquim;ls.set('quim',S.f.quim);$('#f-quimd').open=false;paintFr();render();return}
  if(ds.fdev!==undefined){S.f.dev=ds.fdev;$('#f-devd').open=false;paintFr();render();return}
  if(ds.fhom!==undefined){S.f.hom=ds.fhom;$('#f-homd').open=false;paintFr();render();return}
  if(t.id==='f-late'){S.f.late=!S.f.late;paintFr();render();return}
  if(t.hasAttribute('data-cancel-dem')){const dt=t.closest('details');if(dt)dt.open=false;render();return}
  if(ds.hom){S.f.hom=S.f.hom===ds.hom?'':ds.hom;syncFilters();location.hash='quadro';render();return}
  if(ds.late){S.f.late=true;syncFilters();location.hash='quadro';render();return}
  if(ds.go){location.hash=ds.go;return}
  if(ds.per){S.per=ds.per;ls.set('per',S.per);render();return}
  if(ds.cron){S.cron=ds.cron;ls.set('cron',S.cron);render();return}
  if(ds.cal!==undefined){const n=+ds.cal;if(!n)S.cal={y:tm.getFullYear(),m:tm.getMonth()};else{let m=S.cal.m+n,y=S.cal.y;if(m<0){m=11;y--}if(m>11){m=0;y++}S.cal={y,m}}S.calExp='';render();return}
  if(ds.exp!==undefined){S.calExp=ds.exp;render();return}
  if(ds.gm){S.g.mode=ds.gm;ls.set('gmode',ds.gm);render();return}
  if(ds.gn!==undefined){const n=+ds.gn;if(!n){S.g.y=tm.getFullYear();S.g.m=tm.getMonth()}else{let m=S.g.m+n,y=S.g.y;if(m<0){m=11;y--}if(m>11){m=0;y++}S.g.y=y;S.g.m=m}render();return}
  if(ds.gcol){const k=ds.gcol;S.g.col.has(k)?S.g.col.delete(k):S.g.col.add(k);ls.set('gcol',[...S.g.col]);render();return}
  if(ds.gall){S.g.col=ds.gall==='close'?new Set(Object.keys(FR)):new Set();ls.set('gcol',[...S.g.col]);render();return}
  if(ds.dtab){flushObs();S.dtab=ds.dtab;render();return}
  if(ds.hq){saveHom(ds.hq);return}
  if(t.hasAttribute('data-reg')){saveReg();return}
  if(t.hasAttribute('data-save-dem')){saveDem();return}
  if(t.hasAttribute('data-del-dem')){if(t.dataset.armed){delDem()}else{t.dataset.armed='1';t.textContent='Confirmar exclusão';t.style.background='#B91C1C';t.style.color='#fff';t.style.borderColor='#B91C1C';setTimeout(()=>{if(t&&t.isConnected){t.dataset.armed='';t.textContent='Excluir demanda';t.style.background='';t.style.color='#B91C1C';t.style.borderColor='#F3C2C2'}},4000)}return}
  if(t.id==='qexport'){location.hash='export';return}
  if(t.id==='f-clear'){S.f={q:'',dev:'',hom:'',late:false,fr:new Set(),st:new Set(),quim:''};ls.set('fr',[]);ls.set('fst',[]);ls.set('quim','');syncFilters();render();return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('details.dd[open]').forEach(dt=>dt.open=false)});
document.addEventListener('input',e=>{if(e.target.id==='o-txt')obsInput();if(e.target.id==='f-q'){S.f.q=e.target.value.trim();paintFr();render()}});
document.addEventListener('focusout',e=>{if(e.target.id==='o-txt')flushObs()});
document.addEventListener('change',e=>{if(e.target.id==='cal-st'){ls.set('calstart',e.target.checked);render()}});
window.addEventListener('hashchange',()=>setView(location.hash.slice(1)));
window.addEventListener('pagehide',flushObs);
let rz,lastW=innerWidth;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{applyFit();if(S.view==='cronograma'||S.view==='quadro'||Math.abs(innerWidth-lastW)>150)safeRender();lastW=innerWidth},150)});
function safeRender(){const a=document.activeElement;if(S.view==='demanda'&&a&&$('#view').contains(a)&&/TEXTAREA|INPUT|SELECT/.test(a.tagName))return;if(S.view==='demanda'&&obsPend)return;render()}

/* ---------- boot ---------- */
chrome();setView(location.hash.slice(1)||'painel');
try{paintSync()}catch(e){}
const slow=setTimeout(()=>{if(!S.loaded){S.dbState='slow';render()}},10000);
(async()=>{
  const cl=window.claude;if(!cl||!cl.use){S.dbState='none';clearTimeout(slow);render();return}
  const[db,user]=await Promise.all([cl.use('db'),cl.use('user')]);S.user=user;
  if(user){try{S.me=await user.me();S.canAdmin=await user.canEdit();const w=await user.can('data.write');S.canWrite=w!==false;
    const me=$('#me');me.innerHTML='<img alt=""><div><b></b><span></span></div>';me.querySelector('img').src=S.me.avatarUrl;me.querySelector('b').textContent=S.me.name||'Você';me.querySelector('span').textContent=S.canAdmin?'Editor':S.canWrite?'Colaborador':'Leitura';const qeb=$('#qexport');if(qeb)qeb.hidden=!S.canAdmin}catch(e){}}
  if(!db){S.dbState='none';clearTimeout(slow);render();return}
  S.db=db;
  db.doc('roadmap/demandas').onSnapshot(s=>{const raw=(s.exists&&s.data().items)||{};const its={};S.hy=new Set();Object.entries(raw).forEach(([k,d])=>{const c=Object.assign({},d);try{if(!c.desc&&c.key!=null){const m=QMIRROR[String(c.key)];if(m&&m.d){c.desc=m.d;S.hy.add(k)}}qoverlay(c)}catch(e){}its[k]=c});S.items=its;if(!s.metadata.fromCache||Object.keys(S.items).length){S.loaded=true;clearTimeout(slow)}safeRender()},()=>{S.dbState='none';render()});
  db.doc('roadmap/config').onSnapshot(s=>{S.cfg=s.exists?s.data():null;if(S.loaded&&S.view==='painel')render()},()=>{});
  db.collection('homolog').onSnapshot(s=>{const m={};s.docs.forEach(x=>m[x.id]=x.data());S.hom=m;if(S.loaded)safeRender()},()=>{});
  db.collection('obs').onSnapshot(s=>{const m={};s.docs.forEach(x=>m[x.id]=x.data());S.obs=m;
    const ta=$('#o-txt');if(S.view==='demanda'&&ta&&document.activeElement!==ta&&!obsPend){const o=m[S.demand];if(o&&ta.value!==o.texto){ta.value=o.texto;obsMark(`Salvo · versão ${o.rev||1} · ${nm(o.por)} · ${when(o.em)}`)}}},()=>{});
  db.collection('historico').orderBy('em','desc').limit(30).onSnapshot(s=>{S.recent=s.docs.map(x=>x.data());paintAct()},()=>{});
})();
})();
</script>
