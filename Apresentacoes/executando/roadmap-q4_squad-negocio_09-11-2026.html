<script type="application/json" id="qmirror">{"3424":{"t":"[Bitrix ID-1869] Blocklist Torre de Controle","s":"finalizado","d":"[IAF-187] criado em 11/05/2026 por mateus@blips.com.br\r\n\r\nSolicitante: João Martins  \r\nÁrea Solicitante: Cobrança  \r\nDemanda Original: Boa tarde Senhores(as)\r\n\r\nPeço melhoria no blocklist da torre de controle com os seguintes pontos:\r\n\r\n* Blocklist por selo\r\n* Blocklist por step de régua \r\n* Blocklist por tempo determinado\r\n* Blocklist por telefone\r\n* Blocklist por e-mail\r\n* Blocklist por contrato\r\n* Blocklist por status contrato plataforma\r\n* Blocklist por status título Módulo\r\n\r\nGrato J.\r\n\r\nLink Bitrix: [https://blips.bitrix24.com.br/crm/type/1170/details/1869/](https://blips.bitrix24.com.br/crm/type/1170/details/1869/)\r\n\r\nDescrição: Implementar melhorias na funcionalidade de blocklist da Torre de Controle da área de Cobrança, ampliando os critérios disponíveis para inclusão e controle de bloqueios. A demanda solicita que a blocklist passe a permitir configurações por diferentes atributos operacionais e cadastrais, contemplando: selo, step de régua, tempo determinado de bloqueio, telefone, e-mail, contrato, status do contrato na plataforma e status do título no Módulo.\r\n\r\nObjetivo da tarefa: permitir maior granularidade e flexibilidade na gestão da blocklist da Torre de Controle, possibilitando que a área de Cobrança bloqueie comunicações, ações ou registros conforme regras específicas de negócio.\r\n\r\nEscopo esperado:\r\n\r\n* Analisar a implementação atual da blocklist na Torre de Controle;\r\n* Mapear os campos e fontes de dados necessários para cada novo critério solicitado;\r\n* Definir como os critérios serão cadastrados, consultados e aplicados dentro da automação/sistema atual;\r\n* Implementar suporte para blocklist por selo;\r\n* Implementar suporte para blocklist por step de régua;\r\n* Implementar suporte para blocklist por tempo determinado, com início e fim de validade do bloqueio;\r\n* Implementar suporte para blocklist por telefone;\r\n* Implementar suporte para blocklist por e-mail;\r\n* Implementar suporte para blocklist por contrato;\r\n* Implementar suporte para blocklist por status do contrato na plataforma;\r\n* Implementar suporte para blocklist por status do título no Módulo;\r\n* Validar os cenários com a área solicitante antes da conclusão.\r\n\r\nObservações: não foram informados anexos adicionais.","c":[]},"3989":{"t":"STIA Torre","s":"finalizado","d":"Hoje todos os agentes finza exceto Esperanza estão dentro do STIA para configuração, treinamento e telemetrização. É necessário transformar a área de agente da torre em multi-agentes e passar todos os agentes finza para lá, os agentes são:\n\n- Valentina\n- Prudente\n- Livia\n- Clara\n- Francisco\n\nOBS: Faça um estudo do STIA como referência e agregue na Torre. Lembrando que não há receita de bolo para configuração e treinamento dos agentes, apenas boas práticas que devemos seguir, no estudo do STIA inclua também boas práticas e engenharia de prompt nos estudos.","c":[]},"4147":{"t":"Documentar Templates","s":"finalizado","d":"Necessário documentar o fluxo de todos os templates (mensagens padrão) que o cliente finza recebe ao longo de toda jornada, desde a formalização até o destrato. Inclua os templates plataforma, temos todos os templates dentro da torre para visualização, eu quero que seja feito o entendimento e seja realizando uma apresentação documentando todos os templates de forma visual e em funil com claude desing. segue referencia:\n\nhttps://claude.ai/design/p/ac5ca644-6557-4ef5-8157-c9dbbb7d4608?file=Jornada+WhatsApp+Blips.dc.html","c":[{"a":"João Pedro","e":null,"dt":"2026-07-02T12:35:48.422088+00:00","x":"@João Vinicius Dessimoni Fernandes valida aqui por favor.\n\n![IAF-4147.html](attachment://1f7c4da2-3065-4d16-972c-dd7d54e71815/1782995725733_c95abee1-4108-4ad0-99d3-b3929bca85e0_iaf-4147.html)\n","i":true}]},"4175":{"t":"Renegociação | IA","s":"finalizado","d":"Boa tarde Senhores(as),\n\n\nSegue em anexo um vídeo gravado detalhando o processo de renegociação do início ao fim, para avançarmos na decisão de permitir que a IA conduza esse fluxo.\n\nCasos dentro da alçada: a IA realiza a renegociação de ponta a ponta.\n\nCasos fora da alçada a IA poderá simular uma alçada acima sistêmica informando que é uma proposta que terá que ser analisada o caso do cliente podendo não ser aprovada via sistema e perguntar se a possível proposta faz sentido pra ele. Caso ele aceite a IA não deve executar a renegociação mas sim fazer o Hand-off pro humano aprovar a proposta ou recusar considerando a situação do cliente.\n\nTemos também que ter a capacidade de simplesmente alterar pra IA não ofertar nada acima da alçada e apenas transferir pro humano trabalhar.\n\n\nFinalizando renegociação precisamos avançar em reparcelamento.\n\n\nGrato J\n","c":[{"a":"Sistema/Negócio","e":null,"dt":"2026-07-01T18:53:27.643139+00:00","x":"Senhores(as) a partir do dia 03/07/2026 até 10/07/2026 estarei ausente. Caso precisem de validação ou follow up acionem a jéssica e ela irá atribuir o responsável pelo tema caso não seja ela.","i":false}]},"4266":{"t":"Configuração de novo Canal Hyperflow - Webchat","s":"cancelado","d":"Solicito a configuração de um novo canal de comunicação Webchat na plataforma Hyperflow, que será utilizado na plataforma Blips, na visão do cliente.\n\nObjetivo da solicitação:\nDisponibilizar um canal de Webchat para que o cliente tenha a opção de entrar em contato diretamente com o setor financeiro (Cobrança), direcionando o atendimento para a equipe responsável usando o chat na Plataforma Blips\n\nConfigurações necessárias:\n\n- Criar um novo canal do tipo Webchat na seção Canais do Hyperflow;\n- Criar um departamento denominado Cobrança Chat;\n- Vincular ao departamento o fluxo de atendimento correspondente ao setor de Cobrança;\n- Disponibilizar as orientações ou o código necessário para integração/publicação do Webchat na plataforma Blips, conforme a configuração realizada.\n\nEssa configuração permitirá que os clientes iniciem o atendimento via chat na Blips e sejam direcionados ao time de Cobrança por meio do novo departamento Cobrança Chat.\n\nAvaliar se é possível conectar a IA para atendimento N1 usando esse canal. ","c":[{"a":"João Pedro","e":null,"dt":"2026-07-28T20:15:37.219142+00:00","x":"Whitelab - www.app.finza.com.br hoje existe apenas um botão que redireciona para o whatsapp.\n","i":true}]},"4275":{"t":"Sincronização Torre x Módulo Financeiro","s":"finalizado","d":"Conforme foi solicitado pelo time de cobrança:\n\n\"Garantir que todas as fontes de dados da Torre atualizem, no mínimo, junto com o BigQuery do Módulo Financeiro. Hoje há desincronização entre a Torre e o MF e até entre as abas Gestão de Carteira e Fonte de Dados.\"\n\nPara isso é necessário avaliar a performance das consultas de fontes de dados e reduzirem se tempo de execução para 30 em 30 minutos (atual atualização do MF no BQ)","c":[]},"4276":{"t":"Padronizar a query de títulos pagos","s":"finalizado","d":"Conforme solicitado:\n\n\"Na query de títulos pagos há registros com data de pagamento e outros sem; padronizar o tratamento.\"\n\nÉ necessário analisar as consultas de pagos e disponíveis de fonte de dados e avaliar o real motivo de registros com data de pagamento nulos e criar uma tratativa de contorno.","c":[{"a":"Sistema/Negócio","e":null,"dt":"2026-07-01T18:53:24.053829+00:00","x":"Senhores(as) a partir do dia 03/07/2026 até 10/07/2026 estarei ausente. Caso precisem de validação ou follow up acionem a jéssica e ela irá atribuir o responsável pelo tema caso não seja ela.","i":false}]},"4277":{"t":"Esperanza lendo titulos futuros da Torre","s":"finalizado","d":"Conforme alertado pelo negócio:\n\n\"A Esperanza passou a puxar informações da Torre, e não do BigQuery. A informação diverge do BQ e, por enxergar apenas 20 dias de vencimento futuro, a IA informa ao cliente que ele está quitando. Corrigir a fonte e a janela.\"\n\nÉ necessário analisar a viabilidade trazer os dados sumarizados para torre ou criar fallback na esperanza para consultar o BQ. Possível melhoria definitiva em refactor.","c":[{"a":"Sistema/Negócio","e":null,"dt":"2026-07-01T18:53:13.484607+00:00","x":"Senhores(as) a partir do dia 03/07/2026 até 10/07/2026 estarei ausente. Caso precisem de validação ou follow up acionem a jéssica e ela irá atribuir o responsável pelo tema caso não seja ela.","i":false}]},"4285":{"t":"Conciliar carteira Torre x Dash Inadimplência","s":"finalizado","d":"Conforme solicitado pelo negocio:\n\n\"Na carteira Ideal (multi-org Finza + Blips) a Torre mostra mais de R$ 2 mi, mas o dash de inadimplência, no mesmo status de título, mostra R$ 1.788.000. Reconciliar as duas fontes.\"\n\nNecessário validar com o Leonardo Salgi quais consultas estão sendo utilizadas para gerar os dashs finza da Jéssica, ele é o pai dos dashs. Verifique se não há discordância e ajuste consulta caso necessário.","c":[{"a":"Marcos","e":null,"dt":"2026-07-02T20:06:08.121731+00:00","x":"Analise feita: \n\nComo a Torre monta cada número da carteira\n\nTodos saem da mesma base: títulos importados do Módulo Financeiro (tabela bronze_mongodb_moduloFinanceiro.deals no BigQuery; cada parcela vem de deals.installments).\n\n- Contatos (5.535) — clientes distintos (campo documento = customer.document).\n- Contratos (6.843) — contratos distintos (campo contract.number).\n- Títulos (40.960) — todas as parcelas (campo our_number). Inclui pagos, em aberto, expirados...\n- Total (R$ 62,4 mi) — soma do valor atualizado de cada título (campo updated_value_interest_penalty = valor com juros/multa; se não tiver, usa o valor de face value). Soma TUDO: Pagos + Disponível (em aberto) + Expirado + Recomprado + Aguardando Cancelamento + Aguardando Recompra.\n- Pago (R$ 37 mi) — soma do valor recebido (campo received_value) só dos títulos pagos.\n- Em aberto (R$ 31,8 mi) — saldo que falta receber dos títulos ainda ativos: valor atualizado (updated_value_interest_penalty) − valor pago (received_value), usando o status (campo status) pra zerar pagos/cancelados.\n- Vencido (R$ 23,8 mi) — o mesmo cálculo do \"em aberto\", mas só dos títulos cuja data de vencimento (campo due_date) já passou. É sempre um subconjunto do em aberto.\n\nDe onde vêm os títulos na Torre (explica os limites)\n\n- Fonte: Módulo Financeiro → bronze_mongodb_moduloFinanceiro.deals (base do app, MongoDB).\n- Em aberto: só traz o que vence em até 20 dias (ou já vencido), pela data de vencimento (due_date). O que vence depois não entra.\n- Pago: só capta pagamentos dos últimos 2 dias a cada rodada (pela payment_date) e vai acumulando desde que a Torre ligou — não tem o histórico anterior.\n\nDe onde vêm os títulos no dash (a cadeia real, do outro lado)\n\n- Fonte: Sankhya (ERP), não o Módulo Financeiro. A base das parcelas é a tabela TitulosTgffin (TGFFIN) + TitulosFull do Sankhya, que passam pelas views view_parcelas_novo (Blips/Ideal) e view_parcelas_silver_finza (Finza) → view_parcelas_contrato_gold → view_acionamentos_cobranca.\n- O Módulo Financeiro até aparece nessa cadeia, mas só como enriquecimento (casa payment_line com LINHA_DIGITAVEL pra dizer meio de pagamento/parceiro) — nunca como fonte das linhas.\n- Em aberto: traz TODAS as parcelas, inclusive as que vencem lá na frente (marcadas como FUTURO) — sem a janela de 20 dias. Usa a data de vencimento (DTVENC) e o valor da parcela (VALOR_PARCELA).\n- Vencido: parcela sem baixa (DHBAIXA vazio) e com vencimento (DTVENC) já passado.\n- Pago: usa a data da baixa (DHBAIXA) e o valor baixado (VALOR_BAIXA); tem o histórico completo, não é incremental como na Torre.\n\n---\nDivergências com o dash de inadimplência (não batem, de propósito)\n\n- Fonte dos números: Torre lê do Módulo Financeiro (deals / MongoDB) / Dash lê do Sankhya (ERP, TitulosTgffin). São dois sistemas de registro diferentes da mesma operação.\n- Produtos: Torre só equipamentos / Dash equipamentos + suprimentos.\n- Em aberto: Torre só vencidos + próximos 20 dias (~10% do total) / Dash tudo, inclusive parcelas futuras.\n- Pago: Torre só o que entrou depois que ela ligou (vai crescendo) / Dash histórico completo.\n- Venda à vista: Torre inclui / Dash exclui (~17% dos contratos).\n- Cancelado: Torre não traz / Dash mantém e marca.\n- Finza: não tem separação no dash — pela fonte, o Sankhya já traz as parcelas Finza misturadas (via view_parcelas_silver_finza). A separação de Finza existe só na Torre, que exclui esses contratos e manda pra outro ambiente.","i":true},{"a":"Sistema/Negócio","e":null,"dt":"2026-07-01T18:53:06.610177+00:00","x":"Senhores(as) a partir do dia 03/07/2026 até 10/07/2026 estarei ausente. Caso precisem de validação ou follow up acionem a jéssica e ela irá atribuir o responsável pelo tema caso não seja ela.","i":false},{"a":"Marcos","e":null,"dt":"2026-07-01T18:45:55.975272+00:00","x":"\n![image.png](attachment://400f1f96-fd33-47b2-a7bc-14aae93dcf36/1782931548039_3f64ab16-5a3b-4b78-88a7-d9f12d1c9ddf_image.png)\nEsperando resposta","i":true}]},"4297":{"t":"RCS v3 continuação do ticket #3957 & #4171 — RCS - Completo","s":"finalizado","d":"Boa tarde Senhores(as),\n\nSegue informativo passado pelo Hyper sobre as possibilidades do RCS, peço que seja feita na torre este aprimoramento pra conseguir configurar e melhorar o impacto da ação.\n\n1 - Os arquivos suportados devem estar em formato .gif, .jpg ou .png, com um tamanho máximo de 2MB.\n2 - A resolução ideal para as imagens é de 500px de largura por 300px de altura.\n3 - É recomendável que, ao usar imagens, busque centralizar e deixar uma margem nas laterais de até 100x100px.\n4 - Sobre boas práticas, costumamos indicar de dar preferência a GIF no lugar de Vídeos pois o GIF abre rodando\n5 - Se for usar carrossel, não deixar texto maior que 2 linhas em cada card\n6 - Ainda para carrossel, ideal 1 botão por card\n7 - Para cards unicos, é sempre melhor trabalhar com no maximo 3 botões\n8 - Sempre lembrar que o que vai aparecer na notificação é o titulo do card, então ele deve ser bem \"convidativo\".\n9 - Evitar textos muito grandes, a maior parte do público brasileiro não lê o texto todo, vão olhar principalmente a imagem, o titulo e os botões, então eles precisam ter as informações mais importantes.\n\nPrecisamos ter todas opções disponíveis para disparar na Torre ou no Hyper que estevam configuráveis os canais de forma correta e isolada, além de serem templates personalizáveis/dinâmicos nada engessado.\n\nGrato J","c":[{"a":"Sistema/Negócio","e":null,"dt":"2026-07-01T18:53:00.478218+00:00","x":"Senhores(as) a partir do dia 03/07/2026 até 10/07/2026 estarei ausente. Caso precisem de validação ou follow up acionem a jéssica e ela irá atribuir o responsável pelo tema caso não seja ela.","i":false}]},"4368":{"t":"Timout Esperanza","s":"finalizado","d":"Atualmente a Esperanza esta com muitos problemas de timout, é necessário investigar a raiz do problema e resolver. Caso seja um erro no fluxo é necessário refatora-lo para impedir o timout, caso o erro for infraestrutura avaliamos de subir mais processamento, o objetivo é que os fluxos não demorem mais do que 10minutos para executar. segue os erros:\n\nn8n-avisos, App, Ontem 15:04\nErro fluxo - Esperanza - Superprojeto:\nhttps://n8n-assistants.blips-labs.com/workflow/qtz5qC8NuMVXGz0h/executions/4245195\nErro fluxo - Esperanza - Superprojeto:\nhttps://n8n-assistants.blips-labs.com/workflow/qtz5qC8NuMVXGz0h/executions/4245284\nErro fluxo - Esperanza - Superprojeto:\nhttps://n8n-assistants.blips-labs.com/workflow/qtz5qC8NuMVXGz0h/executions/4245286\nn8n-avisos, App, Ontem 15:07\nErro fluxo - Esperanza - Superprojeto:\nhttps://n8n-assistants.blips-labs.com/workflow/qtz5qC8NuMVXGz0h/executions/4245263\nErro fluxo - Esperanza - Superprojeto:\nhttps://n8n-assistants.blips-labs.com/workflow/qtz5qC8NuMVXGz0h/executions/4245328\nErro fluxo - Esperanza - Superprojeto:\nhttps://n8n-assistants.blips-labs.com/workflow/qtz5qC8NuMVXGz0h/executions/4245332\nn8n-avisos, App, 09:00\nErro fluxo - Esperanza - Superprojeto:\nhttps://n8n-assistants.blips-labs.com/workflow/qtz5qC8NuMVXGz0h/executions/4251860\nn8n-avisos, App, 09:25\nErro fluxo - Esperanza - Superprojeto:\nhttps://n8n-assistants.blips-labs.com/workflow/qtz5qC8NuMVXGz0h/executions/4252500\nErro fluxo - Esperanza - Superprojeto:\nhttps://n8n-assistants.blips-labs.com/workflow/qtz5qC8NuMVXGz0h/executions/4252675\nErro fluxo - Esperanza - Superprojeto:\nhttps://n8n-assistants.blips-labs.com/workflow/qtz5qC8NuMVXGz0h/executions/4252679\nn8n-avisos, App, 09:59\nErro fluxo - Esperanza - Superprojeto:\nhttps://n8n-assistants.blips-labs.com/workflow/qtz5qC8NuMVXGz0h/executions/4253743\nn8n-avisos, App, 10:20\nErro fluxo - Esperanza - Superprojeto:\nhttps://n8n-assistants.blips-labs.com/workflow/qtz5qC8NuMVXGz0h/executions/4254218\nn8n-avisos, App, 14:31\nVEIO SEM CANAL!!!\n Erro fluxo - Esperanza - Superprojeto:\nhttps://n8n-assistants.blips-labs.com/workflow/qtz5qC8NuMVXGz0h/executions/4258048\nErro fluxo - Esperanza - Superprojeto:\nhttps://n8n-assistants.blips-labs.com/workflow/qtz5qC8NuMVXGz0h/executions/4258048\n","c":[]},"4399":{"t":"Filtro de período personalizado não é respeitado","s":"finalizado","d":"No dashboard de Performance de IA, o filtro de período personalizado não é respeitado (ex.: ao filtrar 15/06 o dia não aparece). Corrigir o filtro de data para refletir exatamente o intervalo escolhido.\n\nObservação de refinamento: coisa simples, necessário corrigir e validar filtros, confirmar antes com o negocio","c":[]},"4400":{"t":"Filtros múltiplos quebrando na régua","s":"finalizado","d":"Ao usar dois ou mais filtros, a régua quebra e não exibe os filtros habilitados. Corrigir a combinação de múltiplos filtros na régua.\n\nObservação de refinamento: simples, deve apenas entender com negocio antes","c":[]},"4401":{"t":"Excluir ações de disparo avulsas","s":"finalizado","d":"Hoje não é possível excluir ações de disparo criadas fora de uma régua/campanha (só desabilitar). Permitir a exclusão dessas ações avulsas.\n\nObservação de refinamento: simples, deve apenas entender com negocio antes","c":[]},"4402":{"t":"Revisar e padronizar filtros","s":"finalizado","d":"Padronizar filtros: permitir ativar, desativar, excluir e alterar, com uma flag no topo para ver ativos/desativados/todos, com o mesmo comportamento entre as abas. Base para a revisão global de filtros (R33).\n\nObservação de refinamento: hoje tudo isso já é possivel menos desativar o filtro.","c":[]},"4403":{"t":"Função de excluir cadastro","s":"finalizado","d":"A função de deletar cadastro não está funcional (testado com cadastro de teste). Corrigir a exclusão de cadastro na Gestão de Carteira.\n\nObservação de refinamento: simples, deve apenas entender com negocio antes","c":[{"a":"Marcos","e":null,"dt":"2026-07-15T22:48:50.377968+00:00","x":"Durante o desenvolvimento foi achado bugs no \"modal\" de cadastro, vou resolver amanha. Mas eu particularmente ja validei a exclusao de cliente via gestao da carteira (com outros contatos q ja eram mocks)","i":false},{"a":"Marcos","e":null,"dt":"2026-07-09T16:09:26.480899+00:00","x":"Preciso de mais detalhes referente a essa demanda ","i":false}]},"4404":{"t":"Card Carteira Total (valor atualizado x original)","s":"finalizado","d":"O card Carteira Total usa o valor atualizado (com juros/multa). Informar isso na legenda e adicionar um card com o valor original, para não confundir os dois conceitos.\n\nObservação de refinamento: simples, confirmar com negócio","c":[]},"4405":{"t":"Separar vencidos de vincendas no card Em aberto","s":"finalizado","d":"O card 'Em aberto' soma vencidos e vincendas. Separar os dois (título-a-título por days_overdue) ou, no mínimo, explicar na legenda que agrega ambos.\n\nObservação de refinamento: simples, confirmar com negócio","c":[]},"4406":{"t":"Acesso à Gestão de Carteira pelo detalhe da ação","s":"finalizado","d":"No pop-up de detalhes da ação, permitir abrir a Gestão de Carteira do contrato — navegação direta da ação para o cadastro.\n\nObservação de refinamento: simples, confirmar com o negocio","c":[]},"4407":{"t":"Envio automático do relatório da Torre","s":"finalizado","d":"O relatório da Torre não é enviado automaticamente; automatizar o envio (recorrência/e-mail) como diferencial.\n\nObservação de refinamento: simples, necessário apenas avaliar o relatorio em si\n\nDepende do negócio: Definir destinatários, recorte e periodicidade do envio automático.","c":[]},"4408":{"t":"Playground com busca de contato","s":"finalizado","d":"No Playground, permitir pesquisar um contato dentro da Gestão de Carteira para auxiliar a simulação com dados reais.\n\nObservação de refinamento: simples","c":[]},"4409":{"t":"Legenda do card Vencida","s":"finalizado","d":"Informar na legenda que o card 'Vencida' representa o valor vencido em aberto, não pago (inadimplente), para não confundir com carteira total ou em aberto.\n\nObservação de refinamento: simples","c":[]},"4616":{"t":"Apresentar por granularidade de protocolo","s":"finalizado","d":"O indicador não apresenta por granularidade de protocolo. Ajustar para permitir a visão por protocolo de atendimento, não só consolidada.\n\n— Origem: roadmap Torre (R10) · 2ª etapa da migração do STIA para dentro da Torre (ticket-mãe #3989).\n\n---\n_Created via MCP (source: mcp)_","c":[]},"4617":{"t":"Indicador de frequência de acionamento","s":"finalizado","d":"Segundo o Leandro, o indicador de frequência de acionamento nunca funcionou. Revisar a fonte e o cálculo (nº de ações por contrato/título ao longo do tempo) e corrigir.\n\n— Origem: roadmap Torre (R14) · 2ª etapa da migração do STIA para dentro da Torre (ticket-mãe #3989).\n\n---\n_Created via MCP (source: mcp)_","c":[]},"4618":{"t":"Métrica de transbordo para humano","s":"finalizado","d":"O indicador 'Solicitou atendimento' conta quem clicou no botão, mas precisamos da quantidade efetivamente transferida ao humano — alinhada ao relatório de Performance de IA (status Respondido/Em Atendimento). Expor a métrica de transbordo efetivo.\n\n— Origem: roadmap Torre (R16) · 2ª etapa da migração do STIA para dentro da Torre (ticket-mãe #3989).\n\n---\n_Created via MCP (source: mcp)_","c":[]},"4619":{"t":"Filtro por data de ação","s":"finalizado","d":"Adicionar filtro por data de ação para distinguir os atendimentos da IA de hoje das ações remanescentes (fila que sobrou de dias anteriores).\n\n— Origem: roadmap Torre (R34) · 2ª etapa da migração do STIA para dentro da Torre (ticket-mãe #3989).\n\n---\n_Created via MCP (source: mcp)_","c":[]},"4620":{"t":"Trackear a Esperanza como sub-agente","s":"finalizado","d":"Quando a Esperanza atua como sub-agente de outras IAs não há tracking. Trackear e diferenciar quando ela é a IA principal vs sub-agente, para as métricas não misturarem os dois papéis.\n\n— Origem: roadmap Torre (R37) · 2ª etapa da migração do STIA para dentro da Torre (ticket-mãe #3989).\n\n---\n_Created via MCP (source: mcp)_","c":[]},"4621":{"t":"Granularidade da transferência para humano","s":"finalizado","d":"Permitir visualizar em detalhe as transferências para humano e o funil completo do que foi ao humano, do início ao fim (motivo → conversa → mensagens).\n\n— Origem: roadmap Torre (R44) · 2ª etapa da migração do STIA para dentro da Torre (ticket-mãe #3989).\n\n---\n_Created via MCP (source: mcp)_","c":[]},"4831":{"t":"Monitoramento preventivo de novos valores padrão","s":"cancelado","d":"Quando um novo valor padrão é criado sem avisar a Torre, gera-se um gap descoberto só de forma reativa. Criar monitoramento/tratamento preventivo que detecte valores padrão novos e sinalize antes de virar acionamento indevido.\n\nNota de negócio: definir quais campos de \"valor padrão\" devem ser monitorados e o canal do alerta.\n\nA refinar: alinhar com o João Pedro qual o impacto e o resultado esperado.\n","c":[]},"5700":{"t":"Funil de cobrança com time out","s":"finalizado","d":"**Descrição Refinada**\nO funil de cobrança do dashboard da Torre de Controle carrega com lentidão severa e frequentemente estoura em time out. A causa provável é a consulta que monta o funil, sem otimização (falta de paginação/materialização). Somado a isso, a nomenclatura dos indicadores exibidos não está clara e dificulta a leitura.\n\nEscopo:\n- Otimizar a consulta que alimenta o funil (avaliar paginação, materialização de view/cache).\n- Revisar a arquitetura do serviço que serve o funil.\n- Renomear os indicadores do funil para nomes claros e autoexplicativos.\n\n**Observação**\nÉ preciso validar a performance da consulta e a arquitetura do serviço. É algo tecnicamente simples que não deveria estar acontecendo — investigar a causa raiz da lentidão antes de aplicar paliativos.\n\n**Objetivo**\nGarantir que o funil de cobrança carregue de forma rápida e confiável (sem time out) e que seus indicadores tenham nomenclatura clara, permitindo leitura executiva imediata da visão de funil.","c":[{"a":"Marcos","e":null,"dt":"2026-09-04T01:43:58.797201+00:00","x":"Entregue e já em produção.\n\nOnde validar: Torre de Controle > Dashboard > Visão Executiva > Funil de Cobrança.\n\nForam três frentes:\n\n1) PERFORMANCE. O funil não estoura mais em time out. A consulta foi otimizada e nas últimas 24 horas de produção não houve nenhum time out do funil.\n\n2) NÚMEROS CORRETOS. O funil estava contando títulos REMOVIDOS nos níveis 2 e 3, e por isso o nível 2 chegava a aparecer MAIOR que o nível 1 — a conversão publicava 118,9%, o que não descreve nada. Corrigido: os quatro níveis passam a contar a mesma população. Na janela de 30 dias o nível 2 caiu de 6.271 para 5.844 títulos e o nível 3 de 1.074 para 954.\n\n3) NOMENCLATURA, que era o segundo pedido do card:\n- Cada número tem agora um \"?\" ao lado explicando o que ele conta e sobre qual data.\n- Os níveis deixaram de ser uma fila única. \"Base Elegível\" e \"Contatados com Sucesso\" são etapas em série; \"Responderam\" e \"Pagaram\" aparecem lado a lado, sem seta entre eles, porque são desfechos ALTERNATIVOS — quem paga por PIX depois do WhatsApp nunca pede atendimento. Empilhar os dois gerava porcentagens sem sentido.\n- Cada cartão diz na própria face qual data ele usa.\n- O painel \"Por canal\" passou a avisar que é cobertura, não repartição (a soma passa de 100% por construção, porque o mesmo cliente recebe e-mail E WhatsApp).\n- Os cartões viraram botões acessíveis por teclado.\n\nUma ressalva honesta: alguns percentuais ainda podem passar de 100%. Isso é legítimo e acontece porque os níveis usam DATAS diferentes (vencimento, agendamento e pagamento). A tela não esconde mais isso: quando acontece, ela avisa \"acima de 100% — ver ?\" e o \"?\" explica quais datas estão sendo comparadas. Alinhar as datas é uma decisão de produto que vale um card próprio.\n\nE como o funil deixou de contar títulos removidos, o total de ações enviadas exibido no painel também cai cerca de 6%. Esse é o número correto.","i":false}]},"5702":{"t":"Filtros do dashboard carregam incorretamente","s":"finalizado","d":"**Descrição Refinada**\nOs filtros da aba de Dashboard não carregam corretamente. Em alguns casos os dados corrompem, não carregam, ou o resultado filtrado diverge do filtro aplicado. Causa provável: o filtro não monta/aplica corretamente a chamada ao endpoint GET com os query params.\n\nEscopo:\n- Validar o comportamento de cada filtro do dashboard.\n- Garantir que o filtro chame o endpoint GET com os query params corretos.\n- Padronizar o comportamento (mesmo input → mesmo resultado).\n\n**Observação**\nAjuste simples. Garantir que os filtros de fato alterem a consulta e chamem o endpoint GET com os query params corretos. Validar antes de fechar.\n\n**Objetivo**\nFiltros do dashboard aplicam de forma consistente e confiável, sem corromper nem divergir dos dados esperados.","c":[{"a":"Sistema/Negócio","e":null,"dt":"2026-09-08T19:25:30.705095+00:00","x":"J","i":false}]},"5703":{"t":"Filtros da aba com bugs","s":"finalizado","d":"**Descrição Refinada**\nOs filtros da aba de Ações têm baixa performance, apresentam bug visual e nem sempre aplicam à página inteira. Corrigir a performance da aplicação do filtro, o bug visual e garantir que o filtro valha para toda a aba.\n\nEscopo:\n- Corrigir a performance da consulta/aplicação do filtro.\n- Corrigir o bug visual do componente de filtro.\n- Garantir que o filtro seja aplicado a toda a aba (página inteira), não parcialmente.\n\n**Observação**\nValidar a performance da consulta e a arquitetura do serviço. É algo tecnicamente simples que não deveria estar acontecendo — investigar a causa raiz antes de aplicar paliativos.\n\n**Objetivo**\nFiltros da aba de Ações rápidos, sem bug visual e aplicados de forma consistente a toda a aba.","c":[]},"6016":{"t":"Recurso \"melhorar com IA\" nos steps da régua não funciona","s":"finalizado","d":"**Descrição Refinada**\nA opção \"melhorar o texto com IA\" nos steps da régua não funciona. Corrigir o recurso e explorar seu potencial: melhorar a redação, validar e revisar a ortografia do conteúdo dos steps.\n\nEscopo:\n- Corrigir a falha que impede o \"melhorar com IA\" de funcionar.\n- Garantir a melhoria de redação do texto do step.\n- Adicionar validação e revisão ortográfica do conteúdo.\n\n**Observação**\nValidar a integração com o provedor de IA (chave, endpoint, limite de uso). Confirmar com o negócio o escopo do \"explorar o potencial\" para não expandir além da correção do bug.\n\n**Objetivo**\nRecurso \"melhorar com IA\" funcionando nos steps da régua, melhorando a redação e corrigindo a ortografia do conteúdo.","c":[]},"6175":{"t":"Acionamentos ao longo do tempo (espontâneo x ação)","s":"finalizado","d":"**Descrição Refinada**\nNo indicador \"acionamentos ao longo do tempo\" (Dashboard - Visão Executiva), separar o pagamento espontâneo do pagamento por ação da Torre (regra D+2) e documentar os conceitos de \"Pago Torre\" e \"Cancelado Pago\".\n\nEscopo:\n- Separar, no indicador, pagamento espontâneo de pagamento atribuível a ação da Torre (janela D+2).\n- Documentar as definições de \"Pago Torre\" e \"Cancelado Pago\".\n\n**Observação**\n\"Pago Torre\" e \"Cancelado Pago\" não são status canônicos — definir a regra exata (janela D+2 e o que conta como atribuível à Torre) antes de implementar. Em teoria o negócio consegue apurar parte disso sozinho; avaliar. Se não conseguir, a demanda é habilitar esse ajuste para o negócio.\n\n**Objetivo**\nO indicador de acionamentos distingue pagamento espontâneo de pagamento por ação da Torre, com os conceitos \"Pago Torre\" e \"Cancelado Pago\" documentados e alinhados com o negócio.","c":[{"a":"Marcos","e":null,"dt":"2026-08-21T01:29:10.026405+00:00","x":"Pronto e já em produção.\n\nOnde validar: Dashboard, aba Visão Executiva, painel \"Acionamentos ao Longo do Tempo\".\n\nO que mudou: agora são duas barras por período. Uma de ações e outra de pagamentos, e os pagamentos vêm separados entre \"Pago (Torre)\" e \"Pago (espontâneo)\". Antes a fatia espontânea não aparecia na tela.\n\nComo conferir na org Blips, deixando a granularidade em \"Dia\":\n\n18/08 - Torre 546, espontâneo 138\n17/08 - Torre 118, espontâneo 426\n14/08 - Torre 445, espontâneo 304\n10/08 - Torre 3, espontâneo 155\n\nOs dias 17/08 e 10/08 são os melhores para olhar, porque neles o espontâneo é maior que o da Torre - exatamente o que não era visível antes.\n\nPassando o mouse, a porcentagem agora é calculada dentro de cada grupo (ação com ação, pagamento com pagamento). Antes ela somava as duas coisas no mesmo denominador.\n\nUma ressalva esperada: pagamento do dia corrente só entra no gráfico depois que o cálculo de atribuição roda, que é de hora em hora. Se olhar \"hoje\" logo depois de um pagamento, ele pode ainda não estar em nenhuma das duas barras. Não é erro.","i":false}]},"6176":{"t":"Filtros por tipo de ação e dimensões (Gestão de Carteira)","s":"finalizado","d":"**Descrição Refinada**\nNa Gestão de Carteira, permitir filtrar por tipo de ação (negativação, WhatsApp, e-mail, step de régua) e ampliar os filtros por dimensões (ex.: Segmento, Equipamento).\n\nEscopo:\n- Adicionar filtro por tipo de ação (negativação, WhatsApp, e-mail, step de régua).\n- Ampliar os filtros por dimensão (Segmento, Equipamento).\n\n**Observação**\nEscopo ainda genérico — o negócio precisa ditar exatamente quais filtros e dimensões são necessários antes de estimar e implementar.\n\n**Objetivo**\nA Gestão de Carteira permite filtrar por tipo de ação e pelas dimensões que o negócio priorizar.","c":[{"a":"Marcos","e":null,"dt":"2026-08-21T01:30:01.759201+00:00","x":"Pronto e já em produção, agora completo. O WhatsApp e o E-mail que estavam pendentes foram corrigidos.\n\nOnde validar: Gestão de Carteira, aba \"Contatos\". Três filtros novos: Segmento, Tipo de ação e Step da régua. Eles somam com os filtros que já existiam e valem também para a barra de números do topo.\n\nNúmeros esperados na org Blips (contatos):\n\nSem filtro nenhum - 5.721\nTipo de ação \"WhatsApp\" - 5.584\nTipo de ação \"E-mail\" - 5.596\nTipo de ação \"SMS\" - 2.322\nTipo de ação \"Negativação\" - 2.213\nTipo de ação \"RCS\" - 1.084\nTipo de ação \"Notificação extrajudicial\" - 933\nSegmento \"Comunicação Visual\" - 2.275\nSegmento \"Artesanato e Brindes\" - 1.070\n\nSobre o WhatsApp e o E-mail: eles davam erro porque são os dois de longe mais volumosos (cerca de 225 mil e 253 mil ações, contra 4,6 mil de negativação) e a consulta não terminava no tempo limite da tela. Foi reescrita e agora responde em menos de 1 segundo. Os números não mudaram, só passaram a aparecer.\n\nSobre o Segmento: a lista traz 12 opções. \"Comunicação Visual\" aparecia escrita de duas formas na base, com V maiúsculo e minúsculo, e estava partida quase ao meio. Agora as duas contam como uma só. O que não fizemos: juntar nomes diferentes que talvez signifiquem a mesma coisa. Alimentar, Food e Pizza seguem separados, porque unificar isso é decisão de vocês.\n\nSobre o Step da régua: o campo só habilita depois de escolher uma régua, e isso é de propósito. Sem régua a lista teria centenas de steps e ficaria inutilizável. Passando o mouse nele aparece a dica \"escolha uma régua primeiro\".\n\nUma combinação que ficou útil: marcar \"Sem ação\" junto com \"Negativação\" responde \"quem NÃO recebeu negativação nos últimos 30 dias\". Não é contradição, é uma das perguntas mais pedidas.\n\nUma observação para a validação: os números acima são da org Blips. Na Finza a base é bem menor, então os totais são outros, mas o comportamento é o mesmo.","i":false}]},"6177":{"t":"Tornar o \"+N réguas\" clicável (Gestão de Carteira)","s":"finalizado","d":"**Descrição Refinada**\nAo abrir o cliente na Gestão de Carteira, a lista de réguas mostra \"+6\" (ou \"+N\") quando há muitas, mas o \"+N\" não é clicável — não dá para ver em quais outras réguas o cliente está. Tornar o \"+N\" clicável e navegável.\n\nEscopo:\n- Tornar o indicador \"+N réguas\" clicável.\n- Exibir e navegar a lista completa de réguas do cliente ao clicar.\n\n**Observação**\nEntender melhor com o negócio o comportamento esperado ao expandir (modal, tooltip ou navegação) antes de implementar.\n\n**Objetivo**\nO usuário consegue clicar no \"+N\" e visualizar todas as réguas em que o cliente está.","c":[{"a":"Marcos","e":null,"dt":"2026-08-21T01:29:26.476435+00:00","x":"Pronto e já em produção.\n\nOnde validar: Gestão de Carteira, coluna \"Réguas\". E também na ficha do contato, no bloco \"Vínculos Ativos\".\n\nO que mudou: o nome da régua virou link e leva direto para ela. Quando o cliente participa de muitas, o \"+N\" agora é um botão: clicar abre a lista com todas as réguas, não só as que estavam escondidas, e cada item da lista também navega.\n\nComo conferir:\n\n1. Pegue um contato que esteja em 1 ou 2 réguas (aquele que não tem o \"+N\") e clique no nome da régua. Tem que abrir a régua.\n2. Pegue um contato que esteja em 3 ou mais e clique no \"+N\". A lista tem que mostrar todas, e clicar em qualquer uma leva para ela.\n3. Clicar na régua não pode abrir a ficha do contato por acidente, nem aplicar selo quando o modo de aplicar selo está ligado.\n4. Funciona no celular e pelo teclado (Tab e Enter). Antes a lista só respondia ao passar o mouse, o que era inútil no celular.\n\nPor que a coluna \"Carteira\" continua sem link: não existe tela de detalhe de carteira, então ali o nome segue como texto. Preferimos isso a um link que não leva a lugar nenhum.","i":false}]},"6852":{"t":"Eficiência por step comparativa entre períodos","s":"finalizado","d":"**Descrição Refinada**\nO Dashboard (Visão Executiva) mostra hoje apenas o consolidado de eficiência dos steps da régua. Não há como comparar a evolução de um mesmo step entre períodos, o que impede identificar se uma mudança de texto, canal ou horário melhorou ou piorou o resultado.\n\nEscopo:\n- Criar visão comparativa de eficiência por step entre dois ou mais períodos.\n- Manter o consolidado atual como visão padrão.\n- Permitir recorte por régua e por step.\n\n**Observação**\nQuem define o escopo aqui é o negócio, não o dev. Antes de estimar, é preciso fechar três pontos: o que exatamente se compara (períodos fixos, período móvel, mesmo dia da semana), o que conta como \"eficiência\" de um step (taxa de envio, taxa de interação, conversão em pagamento) e quais steps entram no recorte. Sem essas três respostas o item não entra na fila de execução.\n\n**Objetivo**\nO negócio consegue abrir o dashboard e ver, por step da régua, se a eficiência subiu ou caiu em relação a um período anterior — sustentando decisão de ajuste de texto, canal e horário com dado comparável.","c":[]},"6853":{"t":"Deduplicação de réguas","s":"finalizado","d":"**Descrição Refinada**\nContratos podem entrar em mais de uma régua programada ao mesmo tempo, por falha de filtro, e receber acionamento duplicado. Hoje não existe nem relatório para detectar isso antes do disparo, nem tratamento automático no momento do disparo.\n\nEscopo:\n- Criar relatório de contratos em duplicidade de réguas programadas, para correção antes do disparo.\n- Aplicar deduplicação automática no disparo, com prioridade de régua configurável.\n- Usar como 2º critério de desempate o maior atraso do contrato (ordem decrescente).\n\n**Observação**\nA deduplicação no disparo encaixa no cross_dedup do Pipeline v2 — confirmar o ponto exato de integração antes de codar. O conteúdo do relatório precisa ser refinado com o solicitante: quais colunas, qual recorte de período e se ele serve para auditoria ou para ação corretiva. Definir também a regra de prioridade entre réguas — sem ela, a deduplicação escolhe de forma arbitrária qual acionamento sobrevive.\n\n**Objetivo**\nNenhum contrato recebe acionamento duplicado por estar em duas réguas ao mesmo tempo, e o time enxerga as duplicidades em relatório antes do disparo.","c":[{"a":"Sistema/Negócio","e":null,"dt":"2026-09-08T19:12:09.299509+00:00","x":"J","i":false}]},"6854":{"t":"Troca de canal em massa nos steps da régua","s":"finalizado","d":"**Descrição Refinada**\nTrocar o canal/integração de uma régua exige editar step a step. Na migração de Blips 1 para Blips 2, isso significa reconfigurar manualmente cada step de WhatsApp de cada régua — trabalho repetitivo e sujeito a erro.\n\nEscopo:\n- Adicionar, no topo da régua, ação para trocar o canal/integração de todos os steps de um mesmo tipo de uma vez (ex.: todos os steps de WhatsApp).\n- Permitir escolher o tipo de canal alvo antes de aplicar.\n- Exibir o que será alterado antes de confirmar.\n\n**Observação**\nRefinar com o negócio a visualização e a expectativa: se a troca vale para a régua inteira ou permite seleção de steps, e se é preciso desfazer. Toda ação em massa sobre régua ativa é destrutiva — prever confirmação explícita e registro de quem alterou, sob risco de reconfigurar em produção sem rastro.\n\n**Objetivo**\nMigrar o canal de uma régua inteira em uma única ação, sem editar step a step, viabilizando a troca de Blips 1 para Blips 2 sem retrabalho manual.","c":[{"a":"Sistema/Negócio","e":null,"dt":"2026-09-08T19:11:58.735086+00:00","x":"Vou reabrir pois pelo que vi aqui não ta funcionando","i":false}]},"6855":{"t":"Exportar relatório de ações","s":"finalizado","d":"**Descrição Refinada**\nA aba de Ações não permite extrair as ações em relatório. Sem isso, o time não consegue comprovar acionamento — a evidência de que o contato com o cliente foi feito, quando e por qual canal.\n\nEscopo:\n- Adicionar botão de exportação do relatório de ações.\n- Respeitar os filtros aplicados na tela no momento da exportação.\n- Incluir os campos que comprovam o acionamento (data/hora, canal, contrato, destinatário, status de envio).\n\n**Observação**\nA funcionalidade em si não tem segredo técnico. O que falta é o negócio validar e consolidar exatamente quais relatórios e quais campos entram. Comprovação de acionamento tem uso possivelmente jurídico — a lista de campos precisa estar fechada antes de codar, não depois.\n\n**Objetivo**\nO time extrai da aba de Ações um relatório que comprova o acionamento do cliente, respeitando o filtro aplicado na tela.","c":[{"a":"Sistema/Negócio","e":null,"dt":"2026-09-08T19:11:18.516662+00:00","x":"J","i":false}]},"6856":{"t":"Refatorar dashboards contando a história ponta a ponta","s":"cancelado","d":"**Descrição Refinada**\nOs dashboards da Torre apresentam indicadores isolados. Falta a narrativa do processo: da base elegível ao pagamento, passando por acionamento, interação e acordo. Refatorar o conjunto para que os indicadores contem o processo de forma coerente, com cada etapa mapeada.\n\nEscopo:\n- Mapear as etapas do processo, da base elegível ao pagamento.\n- Reorganizar os indicadores existentes na ordem da narrativa.\n- Identificar e sinalizar as etapas que hoje não têm indicador.\n\n**Observação**\nItem extremamente genérico no estado atual — não é executável como está. Antes de qualquer refatoração, o negócio precisa responder: que história, quais etapas, qual o início e qual o fim do funil. Enquanto isso não estiver escrito, o dev não começa. Esforço alto: mexer na narrativa dos dashboards toca praticamente todas as telas de indicador, com risco de regressão em métrica já validada.\n\n**Objetivo**\nOs dashboards narram o processo de cobrança de ponta a ponta, com cada etapa mapeada e visível, permitindo leitura executiva de onde o funil perde.","c":[{"a":"Sistema/Negócio","e":null,"dt":"2026-09-08T18:04:50.016769+00:00","x":"Segue demanda: https://quimera.blips.com.br/tickets/7562\n\nprint do roadmap torre\n![image.png](attachment://5984b221-7b3a-467c-91d4-84dd003e9aa4/1788890532763_75d8801e-818b-4727-a07a-9b633806b3c4_image.png)\n","i":false},{"a":"João Vinícius","e":null,"dt":"2026-09-08T13:08:41.937895+00:00","x":"@João Pedro Borges Martins estou cancelando essa demanda para recriarmos ela seguindo o padrão que a jéssica ditou no artefato dela https://claude.ai/code/artifact/e73b0d2c-d35e-4676-b7b6-4dd91fbe54a4; peço para que seja criado uma nova demanda, vou atualizar o status dessa no roadmap.xlsx","i":false}]},"6857":{"t":"HTML no e-mail com pré-visualização","s":"finalizado","d":"**Descrição Refinada**\nOs steps de e-mail da régua não aceitam HTML nem oferecem pré-visualização, ao contrário do WhatsApp, que já tem prévia. Isso limita a comunicação visual dos e-mails e obriga o time a disparar às cegas para conferir o resultado.\n\nEscopo:\n- Permitir cadastrar HTML no conteúdo do step de e-mail.\n- Oferecer pré-visualização do e-mail antes de salvar, no mesmo padrão da prévia de WhatsApp.\n- Tratar as variáveis de template dentro do HTML.\n\n**Observação**\nRefinar com o negócio a necessidade real antes de arquitetar: se o caminho é HTML livre ou biblioteca de templates prontos. HTML livre em e-mail transacional traz risco de quebra por cliente de e-mail e de conteúdo malformado chegando ao cliente final. Depois da definição, arquitetar o serviço e os templates antes de executar. Esforço alto.\n\n**Objetivo**\nO time monta e-mails com layout próprio e confere o resultado na tela antes de salvar, sem precisar disparar para validar.","c":[{"a":"Sistema/Negócio","e":null,"dt":"2026-09-10T14:43:46.029455+00:00","x":"<!DOCTYPE html>\n<html lang=\"pt-BR\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <title>Notificação Extrajudicial – Finza</title>\n  <link href=\"https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap\" rel=\"stylesheet\" />\n  <style>\n    * { margin: 0; padding: 0; box-sizing: border-box; }\n\n    body {\n      background: #f0f0f0;\n      font-family: 'Inter', sans-serif;\n      color: #1a1a1a;\n      padding: 40px 20px;\n    }\n\n    .email-wrapper {\n      max-width: 620px;\n      margin: 0 auto;\n    }\n\n    /* ── HEADER ── */\n    .email-header {\n      background: #ffffff;\n      border-radius: 16px 16px 0 0;\n      padding: 28px 40px 24px;\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      position: relative;\n      overflow: hidden;\n      border-bottom: 3px solid #3D3DE8;\n    }\n\n    .email-header::before {\n      content: '';\n      position: absolute;\n      top: -60px; right: -60px;\n      width: 200px; height: 200px;\n      background: radial-gradient(circle, rgba(61,61,232,0.07) 0%, transparent 70%);\n      border-radius: 50%;\n    }\n\n    .logo-img {\n      height: 36px;\n      width: auto;\n    }\n\n    .header-badge {\n      background: rgba(61,61,232,0.08);\n      border: 1px solid rgba(61,61,232,0.25);\n      border-radius: 20px;\n      padding: 5px 14px;\n      font-size: 11px;\n      font-weight: 600;\n      color: #3D3DE8;\n      letter-spacing: 1px;\n      text-transform: uppercase;\n    }\n\n    /* ── ALERT BANNER ── */\n    .alert-banner {\n      background: #3D3DE8;\n      padding: 14px 40px;\n      display: flex;\n      align-items: center;\n      gap: 10px;\n    }\n\n    .alert-icon { font-size: 18px; flex-shrink: 0; }\n\n    .alert-text {\n      font-family: 'Syne', sans-serif;\n      font-weight: 700;\n      font-size: 13px;\n      color: #ffffff;\n      letter-spacing: 0.5px;\n      text-transform: uppercase;\n    }\n\n    /* ── BODY ── */\n    .email-body {\n      background: #ffffff;\n      padding: 40px 40px 32px;\n    }\n\n    .section-title {\n      font-family: 'Syne', sans-serif;\n      font-weight: 800;\n      font-size: 22px;\n      color: #0A0A0A;\n      line-height: 1.2;\n      margin-bottom: 24px;\n    }\n\n    .section-title span { color: #3D3DE8; }\n\n    /* Parties card */\n    .parties-grid {\n      display: grid;\n      grid-template-columns: 1fr 1fr;\n      gap: 12px;\n      margin-bottom: 14px;\n    }\n\n    .party-card {\n      background: #F7F7FC;\n      border: 1px solid #E0E0F5;\n      border-radius: 10px;\n      padding: 16px;\n    }\n\n    .party-label {\n      font-size: 10px;\n      font-weight: 700;\n      color: #999;\n      text-transform: uppercase;\n      letter-spacing: 1px;\n      margin-bottom: 6px;\n    }\n\n    .party-name {\n      font-family: 'Syne', sans-serif;\n      font-weight: 700;\n      font-size: 14px;\n      color: #0A0A0A;\n      margin-bottom: 3px;\n    }\n\n    .party-doc { font-size: 12px; color: #666; }\n\n    /* Data boxes */\n    .parcelas-box {\n      border: 1px solid #EBEBEB;\n      border-radius: 10px;\n      overflow: hidden;\n      margin-bottom: 14px;\n    }\n\n    .parcelas-header {\n      background: #3D3DE8;\n      padding: 12px 18px;\n      display: flex;\n      align-items: center;\n      gap: 8px;\n    }\n\n    .parcelas-header-text {\n      font-family: 'Syne', sans-serif;\n      font-weight: 700;\n      font-size: 12px;\n      color: #ffffff;\n      text-transform: uppercase;\n      letter-spacing: 0.8px;\n    }\n\n    .parcelas-content {\n      padding: 4px 18px;\n      background: #F7F7FC;\n    }\n\n    .parcela-item {\n      font-size: 13px;\n      color: #1a1a1a;\n      padding: 8px 0;\n      border-bottom: 1px dashed #E0E0F5;\n      font-family: 'Inter', sans-serif;\n    }\n\n    .parcela-item:last-child { border-bottom: none; }\n\n    /* Body text */\n    .body-text {\n      font-size: 14px;\n      line-height: 1.7;\n      color: #333;\n      margin-bottom: 20px;\n    }\n\n    /* Warning box */\n    .warning-box {\n      background: #F0F0FD;\n      border-left: 4px solid #3D3DE8;\n      border-radius: 0 8px 8px 0;\n      padding: 16px 18px;\n      margin-bottom: 24px;\n    }\n\n    .warning-title {\n      font-family: 'Syne', sans-serif;\n      font-weight: 700;\n      font-size: 13px;\n      color: #0A0A0A;\n      margin-bottom: 8px;\n      text-transform: uppercase;\n      letter-spacing: 0.5px;\n    }\n\n    .warning-text { font-size: 13px; color: #555; line-height: 1.6; }\n\n    /* Consequences */\n    .consequences-title {\n      font-family: 'Syne', sans-serif;\n      font-weight: 700;\n      font-size: 13px;\n      color: #0A0A0A;\n      text-transform: uppercase;\n      letter-spacing: 0.5px;\n      margin-bottom: 10px;\n    }\n\n    .consequence-item {\n      display: flex;\n      align-items: flex-start;\n      gap: 10px;\n      padding: 8px 0;\n      border-bottom: 1px solid #F0F0F0;\n      font-size: 13px;\n      color: #444;\n      line-height: 1.5;\n    }\n\n    .consequence-item:last-child { border-bottom: none; }\n\n    .bullet {\n      width: 6px; height: 6px;\n      background: #3D3DE8;\n      border-radius: 50%;\n      flex-shrink: 0;\n      margin-top: 6px;\n    }\n\n    /* Deadline */\n    .deadline-box {\n      background: #3D3DE8;\n      border-radius: 10px;\n      padding: 18px 22px;\n      margin: 24px 0;\n      display: flex;\n      align-items: center;\n      gap: 14px;\n    }\n\n    .deadline-icon { font-size: 28px; flex-shrink: 0; }\n\n    .deadline-text {\n      font-family: 'Syne', sans-serif;\n      font-weight: 700;\n      font-size: 14px;\n      color: #ffffff;\n      line-height: 1.4;\n    }\n\n    .deadline-sub {\n      font-size: 12px;\n      color: rgba(255,255,255,0.65);\n      margin-top: 3px;\n    }\n\n    /* Negotiate banner */\n    .negotiate-banner {\n      background: linear-gradient(135deg, #3D3DE8 0%, #2929C4 100%);\n      border-radius: 10px;\n      padding: 20px 24px;\n      text-align: center;\n      margin-bottom: 28px;\n    }\n\n    .negotiate-title {\n      font-family: 'Syne', sans-serif;\n      font-weight: 800;\n      font-size: 16px;\n      color: #ffffff;\n      margin-bottom: 4px;\n    }\n\n    .negotiate-sub { font-size: 13px; color: rgba(255,255,255,0.75); }\n\n    /* Contact */\n    .contact-title {\n      font-family: 'Syne', sans-serif;\n      font-weight: 700;\n      font-size: 13px;\n      color: #0A0A0A;\n      text-transform: uppercase;\n      letter-spacing: 0.5px;\n      margin-bottom: 12px;\n    }\n\n    .contact-grid {\n      display: grid;\n      grid-template-columns: repeat(3, 1fr);\n      gap: 10px;\n      margin-bottom: 28px;\n    }\n\n    .contact-card {\n      border: 1px solid #E0E0F5;\n      border-radius: 8px;\n      padding: 12px 14px;\n      text-align: center;\n      text-decoration: none;\n      transition: border-color 0.2s;\n    }\n\n    .contact-card:hover { border-color: #3D3DE8; }\n\n    .contact-card-icon { font-size: 20px; margin-bottom: 6px; display: block; }\n\n    .contact-card-label {\n      font-size: 10px;\n      font-weight: 600;\n      color: #999;\n      text-transform: uppercase;\n      letter-spacing: 0.8px;\n      display: block;\n      margin-bottom: 3px;\n    }\n\n    .contact-card-value {\n      font-size: 12px;\n      font-weight: 600;\n      color: #0A0A0A;\n      word-break: break-all;\n    }\n\n    /* CTA Button */\n    .cta-btn {\n      display: block;\n      background: #3D3DE8;\n      color: #ffffff;\n      text-decoration: none;\n      text-align: center;\n      padding: 16px;\n      border-radius: 10px;\n      font-family: 'Syne', sans-serif;\n      font-weight: 700;\n      font-size: 14px;\n      letter-spacing: 0.5px;\n      margin-bottom: 8px;\n    }\n\n    /* ── FOOTER ── */\n    .email-footer {\n      background: #0A0A0A;\n      border-radius: 0 0 16px 16px;\n      padding: 24px 40px;\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n    }\n\n    .footer-cnpj { font-size: 11px; color: #555; margin-top: 2px; }\n\n    .footer-legal {\n      font-size: 11px;\n      color: #555;\n      text-align: right;\n      line-height: 1.5;\n    }\n\n    @media (max-width: 480px) {\n      .email-header, .email-body, .email-footer { padding-left: 24px; padding-right: 24px; }\n      .alert-banner { padding-left: 24px; padding-right: 24px; }\n      .parties-grid { grid-template-columns: 1fr; }\n      .contact-grid { grid-template-columns: 1fr; }\n      .email-footer { flex-direction: column; gap: 12px; text-align: center; }\n      .footer-legal { text-align: center; }\n    }\n  </style>\n</head>\n<body>\n  <div class=\"email-wrapper\">\n\n    <!-- HEADER -->\n    <div class=\"email-header\">\n      <img class=\"logo-img\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAACYCAYAAACS0lH9AAA5ZklEQVR4nO29eZxcVZnw/711u6o6kk6xJCdsio64i2yOqRZIt+AyomhIJ4jIgDi4vTqivq55lQRhHPUnbuOGoig6iiQdo7jMoEAnLF1NnBgWGVFBVoUTtupO0ktV3fP749zTdbvSS1V1dS3dz/fzuZ+urqp776l7zz3Pc57zLB51oTD+Kr1i74eAdwEHA0/DC7z6tEFoUcaAp4DfAOsymdQDPT3G7+31CtPvJgiCIExHHYRvIQ5+4bhjH29LJBLfAs6d2IJg7psgzAcM8ACwKpNJ7Vx54q1t2256WSF8XxAEQaiQ2FwefM3aAPCD4459fP9EInENcDZ2RjdK1CwgCDPjAUcAN6TT2VO23fSy/D8evzVGXZRYQRCE+cecKQBr1gZs2hjjuGMfX5pIJH4NvBoIgDiQCM8tszehUlLAL9Pp7Fu2/09XoafHxKAgSoAgCEKFzMnAufKk0bZtNybz6RVDLwJ+ChyJFfYmPGdR8ZAlAKFyXKe5IJNJfbVr5fX+1m1dAfiiUAqCIJRJzS0AK08aTWy7MVlIrxjqBK7FCn8n9P25OKew4IiF21fS6ezFW7edXNiwPmZkVUkQBKF8amoBWHnSKNtuTJJeMfQ64D+x5toZWiAWAGHWfCuTWfxObH82Vs8UBEEQpqNGs/FCVPi/FeilHOEvCLPHAO9Ip3dvPPLI+5Lgez09BsQ5UBAEYVpqMEgWvDVrPX/Txlg+vWLog8DnsYOyVS5khi/MPSaRSHhjY2O/Bs7OZFJP9PQYr7fXE58AQRCEKajYAuD71rwai8 celas-header-text\">Contrato(s)</span>\n        </div>\n        <div class=\"parcelas-content\">\n          <div class=\"parcela-item\">{{Number}}</div>\n        </div>\n      </div>\n\n      <!-- Parcelas em atraso -->\n      <div class=\"parcelas-box\">\n        <div class=\"parcelas-header\">\n          <span style=\"font-size:14px;\">📋</span>\n          <span class=\"parcelas-header-text\">Parcelas em atraso</span>\n        </div>\n        <div class=\"parcelas-content\">\n          <div class=\"parcela-item\">{{Titles List}}</div>\n        </div>\n      </div>\n\n      <!-- Intro -->\n      <p class=\"body-text\">\n        A presente notificação tem como finalidade dar <strong>ciência formal da inadimplência</strong> e oportunizar a <strong>regularização amigável</strong> do débito.\n      </p>\n\n      <p class=\"body-text\">Caso não haja regularização, o débito poderá ser encaminhado para:</p>\n\n      <div style=\"margin-bottom: 24px;\">\n        <div class=\"consequence-item\"><div class=\"bullet\"></div><div>Negativação junto aos órgãos de proteção ao crédito</div></div>\n        <div class=\"consequence-item\"><div class=\"bullet\"></div><div>Protesto em cartório</div></div>\n      </div>\n\n      <!-- Warning -->\n      <div class=\"warning-box\">\n        <div class=\"warning-title\">⚠️ Importante</div>\n        <div class=\"warning-text\">\n          Em caso de <strong>protesto</strong>, não é possível isentar as taxas cartorárias, sendo que a <strong>baixa do protesto</strong> somente ocorrerá mediante pagamento integral da dívida acrescida das custas cartorárias.\n        </div>\n      </div>\n\n      <!-- Deadline -->\n      <div class=\"deadline-box\">\n        <div class=\"deadline-icon\">⏰</div>\n        <div>\n          <div class=\"deadline-text\">Prazo: 03 (três) dias a partir do recebimento desta notificação</div>\n          <div class=\"deadline-sub\">Solicitamos contato dentro do prazo para regularização amigável</div>\n        </div>\n      </div>\n\n      <p class=\"body-text\">O não atendimento no prazo poderá resultar em:</p>\n      <div style=\"margin-bottom: 24px;\">\n        <div class=\"consequence-item\"><div class=\"bullet\"></div><div>Vencimento antecipado da dívida</div></div>\n        <div class=\"consequence-item\"><div class=\"bullet\"></div><div>Rescisão contratual</div></div>\n        <div class=\"consequence-item\"><div class=\"bullet\"></div><div>Adoção de medidas judiciais cabíveis, inclusive busca e apreensão do bem</div></div>\n      </div>\n\n      <!-- Negotiate -->\n      <div class=\"negotiate-banner\">\n        <div class=\"negotiate-title\">🤝 Não perca a oportunidade de negociar!</div>\n        <div class=\"negotiate-sub\">Estamos à disposição para encontrar a melhor solução para você.</div>\n      </div>\n\n      <!-- Contact -->\n      <div class=\"contact-title\">Entre em contato</div>\n      <div class=\"contact-grid\">\n        <a href=\"https://app.blips.com.br/auth/login\" class=\"contact-card\">\n          <span class=\"contact-card-icon\">💳</span>\n          <span class=\"contact-card-label\">Portal</span>\n          <span class=\"contact-card-value\">Emita seu boleto</span>\n        </a>\n        <a href=\"https://wa.me/5534991341930\" class=\"contact-card\">\n          <span class=\"contact-card-icon\">💬</span>\n          <span class=\"contact-card-label\">WhatsApp</span>\n          <span class=\"contact-card-value\">+55 34 9913-4193</span>\n        </a>\n        <a href=\"mailto:boleto@finza.com.br\" class=\"contact-card\">\n          <span class=\"contact-card-icon\">✉️</span>\n          <span class=\"contact-card-label\">E-mail</span>\n          <span class=\"contact-card-value\">boleto@finza.com.br</span>\n        </a>\n      </div>\n\n      <a href=\"https://app.blips.com.br/auth/login\" class=\"cta-btn\">\n        → Acessar Portal e Emitir Boleto\n      </a>\n\n      <p style=\"font-size:13px; color:#888; text-align:center; margin-top:8px;\">\n        Atenc  style=\"font-size:11px; color:#888; margin-bottom:2px;\">FINZA INTERMEDIACAO E SERVICOS FINANCEIROS LTDA</div><div class=\"footer-cnpj\">CNPJ: 60.941.543/0001-35</div>\n      </div>\n      <div class=\"footer-legal\">\n        Esta é uma comunicação oficial.<br/>\n        Notificação Extrajudicial\n      </div","i":false},{"a":"Sistema/Negócio","e":null,"dt":"2026-09-10T14:43:16.079742+00:00","x":"Está apresentando erro:\n\n![image.png](attachment://f562e50d-8642-4b64-948e-89d4a470de58/1789051335177_85379983-ee95-4b20-a1e4-e2313e044a53_image.png)\n\n\nPorém o HTML está OK de acordo com outro site de HTML interpretador:\n\n![image.png](attachment://f562e50d-8642-4b64-948e-89d4a470de58/1789051390816_19ddbd9c-c1cc-455f-8300-4a37855e3cd2_image.png)\n","i":false},{"a":"Sistema/Negócio","e":null,"dt":"2026-09-10T14:42:08.110684+00:00","x":"[Solicitação de ajustes] .","i":false}]},"6858":{"t":"Filtros aninhados (union all)","s":"finalizado","d":"**Descrição Refinada**\nA filtragem da Torre hoje aplica todas as condições como AND ou todas como OR. Não é possível combinar grupos de condições — por exemplo, um grupo com uma regra e outro grupo com regra diferente, unindo os dois resultados.\n\nEscopo:\n- Permitir agrupar condições de filtro em blocos (filtro dentro de filtro).\n- Suportar a união dos blocos (union all), além do AND/OR atual.\n- Preservar o comportamento dos filtros já salvos.\n\n**Observação**\nAntes de implementar, entender com o negócio o caso de uso concreto que motivou o pedido — qual recorte hoje é impossível de montar. Filtro aninhado muda a montagem da query e tem impacto direto em performance: validar o plano de execução antes de liberar, sob risco de repetir os timeouts já vistos na Torre.\n\n**Objetivo**\nO negócio monta recortes hoje impossíveis, combinando grupos de condições em um único filtro, sem perder os filtros já salvos.","c":[{"a":"Sistema/Negócio","e":null,"dt":"2026-09-08T19:10:29.654029+00:00","x":"J","i":false}]},"6859":{"t":"Colunas personalizáveis na exportação de filtros","s":"finalizado","d":"**Descrição Refinada**\nAo visualizar ou exportar os contratos de um filtro, o conjunto de colunas é fixo. Falta poder adicionar colunas (ex.: telefone, número do contrato), personalizar por perfil de usuário e salvar a preferência — como já acontece na Gestão de Carteira — além de ordenar e pesquisar.\n\nEscopo:\n- Permitir adicionar/remover colunas na visualização e na exportação de um filtro.\n- Salvar a preferência de colunas por perfil de usuário.\n- Habilitar ordenação e pesquisa sobre as colunas escolhidas.\n\n**Observação**\nEntender melhor com o negócio quais colunas são realmente necessárias e qual a expectativa de persistência: por usuário, por filtro ou por organização. Referências de trabalho anterior no mesmo domínio, ambas finalizadas e de escopo distinto deste: ref. #3340 (atualização automática de colunas para filtro na Gestão de Carteira) e ref. #3332 (inclusão de colunas de segmento, modalidade e empresa).\n\n**Objetivo**\nCada usuário monta a própria visão de colunas ao consultar e exportar um filtro, e a Torre lembra dessa preferência na consulta seguinte.","c":[{"a":"Sistema/Negócio","e":null,"dt":"2026-09-08T19:09:17.2045+00:00","x":"J","i":false}]},"6860":{"t":"Datas bloqueadas com criação automática","s":"finalizado","d":"**Descrição Refinada**\nA organização Finza não tem datas bloqueadas configuradas na Torre. Hoje o controle é manual e depende de alguém lembrar de suspender o disparo. Adicionar datas bloqueadas a nível de organização — dias em que as ações não disparam — com fluxo de criação automática e monitoramento para evitar acionamento indevido.\n\nEscopo:\n- Configurar datas bloqueadas a nível de organização (ação não dispara na data).\n- Criar fluxo de alimentação automática do calendário.\n- Monitorar e alertar quando houver disparo previsto em data bloqueada.\n\n**Observação**\nGate antes de qualquer dev: a Torre possivelmente já tem esse recurso e o que falta é configuração para a Finza, não código. Confirmar isso primeiro — se já existir, o item vira tarefa de configuração e não de desenvolvimento. É preciso também definir a fonte do calendário (feriados nacionais, estaduais, datas especiais da operação) antes de automatizar a criação.\n\n**Objetivo**\nNenhuma ação da Torre dispara em data bloqueada da Finza, com o calendário alimentado automaticamente e o desvio sinalizado antes do disparo.","c":[]},"6861":{"t":"Exportar histórico de ações do cliente","s":"finalizado","d":"**Descrição Refinada**\nNo histórico de ações do cliente, em Gestão de Carteira, é possível consultar mas não exportar. Permitir exportação em dois níveis: micro (linha a linha, cada ação) e macro (resumo consolidado).\n\nEscopo:\n- Adicionar exportação do histórico de ações do cliente.\n- Oferecer o nível micro (detalhe linha a linha) e o macro (resumo).\n- Respeitar o recorte de cliente/contrato aberto na tela.\n\n**Observação**\nEntender melhor com o negócio o que precisa sair em cada nível — \"macro\" sem definição vira relatório que ninguém usa. Definir também se a exportação é por cliente ou aceita seleção múltipla. Referência: ref. #3337 criou a visualização do histórico de ações na Gestão de Carteira (finalizado); este item estende aquela tela com exportação.\n\n**Objetivo**\nO time exporta o histórico de ações de um cliente em detalhe ou em resumo, direto da Gestão de Carteira.","c":[]},"6862":{"t":"Variáveis aninhadas em templates","s":"finalizado","d":"**Descrição Refinada**\nAs variáveis de template da Torre são simples — um campo, um valor. Não é possível montar variável dentro de variável, como uma lista de contratos do cliente, nem controlar quebra de texto dentro do conteúdo gerado. Isso limita o conjunto atual de 86+ variáveis.\n\nEscopo:\n- Permitir variáveis compostas/aninhadas (ex.: lista de contratos do cliente).\n- Permitir quebra de texto no conteúdo montado pela variável.\n- Manter compatibilidade com as variáveis simples já em uso nos templates.\n\n**Observação**\nNão é tão simples quanto parece: montar valor aninhado exige definir de onde vêm os itens, como são ordenados, qual o limite de itens e como o texto se comporta quando a lista é longa. O item está genérico — antes de estimar, o negócio precisa dizer exatamente quais variáveis aninhadas entram no primeiro corte. Mudança em variável de template afeta réguas em produção: prever validação antes de liberar.\n\n**Objetivo**\nOs templates suportam variáveis compostas, como a lista de contratos do cliente, com quebra de texto controlada, sem quebrar as variáveis simples já em uso.","c":[{"a":"Sistema/Negócio","e":null,"dt":"2026-09-10T19:16:06.875352+00:00","x":"Não está sendo possível pesquisar o cliente pra testar a pré visualização de um caso real\n\n![image.png](attachment://94e5f4d8-b159-4c99-b58a-4161140fee1e/1789067749401_cfe6ff44-d2a0-4c07-80e4-0b903532f9b9_image.png)\n","i":false},{"a":"Sistema/Negócio","e":null,"dt":"2026-09-10T19:15:44.120458+00:00","x":"[Solicitação de ajustes] .","i":false}]},"6871":{"t":"KIT PREVENTIVO - IA LÍVIA","s":"bloqueado","d":"<p>Solicito que a Lívia faça o KIT PREVENTIVO, o que este KIT CONTEMPLA:<br><br><em>1- Contrato</em><br><em>2- Nota Fiscal</em><br><em>3- Demonstrativo de Débito</em><br><em>4- Boletim de ocorrência (será inserido de forma manual, não pela Lívia)</em><br><em>5- CCB - CÉDULA DE CRÉDITO BANCÁRIA (EMITIDA PELA CELCOIN)</em></p>","c":[{"a":"Marcos","e":null,"dt":"2026-11-11T17:24:27.7532+00:00","x":"Atualização (11/11/2026): deixamos na #10717 um resumo consolidado dos dois kits FINZA/CCB (Preventivo e Ajuizamento), com o que já está pronto, o que falta e as confirmações que precisamos de você:\nhttps://quimera.blips.com.br/tickets/10717\n\nExemplos de Kit Preventivo gerados pela Lívia com clientes reais (ainda sem o demonstrativo da CCB, que depende das regras pedidas na #10717):\n- Contrato 12602418: https://drive.google.com/drive/folders/1F4uRDw4PM4LaEQBGhMlg4YuCwqN11GJl\n- Contrato 12603553: https://drive.google.com/drive/folders/1aRac6IPAyWeggC34XZMWn7iqu8nWAL8A","i":false},{"a":"Marcos","e":null,"dt":"2026-11-11T16:53:13.722586+00:00","x":"Atualização (11/11/2026): a CCB assinada não depende mais da Celcoin. Ela vem da API da própria Finza, e a etapa da Lívia que baixa a CCB e salva na pasta do kit já está pronta e testada (contrato 12602418). O PDF já traz o termo de endosso para o FINZA FIDC nas últimas páginas.\n\nA mesma etapa serve para o Kit Preventivo e para o Kit Ajuizamento. Falta ligar no kit junto com o demonstrativo de débito da CCB, que depende das confirmações de regras pedidas na #10717.","i":false},{"a":"Marcos","e":null,"dt":"2026-11-06T13:43:47.572517+00:00","x":"Atualização (06/11/2026): correção sobre os e-mails de cobrança da CCB\n\nNo comentário de 03/11 listamos como pendência \"a caixa de e-mail de cobrança da Finza\". Esse item não é necessário: os e-mails dos contratos com CCB são os mesmos da régua que o Kit Ajuizamento já usa.\n\nTestamos com as 12 CCBs com maior atraso:\n- 12 de 12 têm e-mails de cobrança na caixa da Ideal (lembretes, bloqueio, notificação extrajudicial, cancelamento);\n- 9 de 12 também têm e-mails mais antigos na caixa da Blips (alguns com o assunto \"FINZA |\");\n- a Lívia encontra todos pelo número do contrato, como já faz hoje.\n\nJá ajustamos o kit para que, nos contratos com CCB, a Lívia busque os e-mails nas caixas da Ideal e da Blips.\n\nOutras atualizações:\n- O acesso aos dados das CCBs foi liberado pelo time de dados (service account nova da Lívia). Com isso, o demonstrativo de débito da CCB fica com a gente e já pode ser desenvolvido.\n\nO que ainda depende de outra área: só a CCB assinada e endossada para a FINZA, que está na plataforma da Celcoin. Precisamos de quem administra a conta da Celcoin para liberar o acesso à API (documentação e credenciais). Um PDF de exemplo de uma CCB também ajudaria.\n\nO mesmo comentário foi feito na #10717.","i":false},{"a":"Marcos","e":null,"dt":"2026-11-03T19:22:29.718288+00:00","x":"Atualização: Kit Preventivo e Kit Ajuizamento pela Lívia (03/11/2026)\n\nOlá, pessoal! Segue onde estamos com os 6 comandos combinados em 31/10: Kit Preventivo e Kit Ajuizamento para cada modalidade (BLIPS, IDEAL sem financiamento e FINZA/IDEAL com financiamento). Testamos tudo com contratos reais.\n\nO QUE JÁ FUNCIONA\n\nPara contratos BLIPS e IDEAL, a Lívia já monta os dois kits:\n- Kit Preventivo: contrato assinado, nota fiscal, demonstrativo de débito e e-mails de cobrança, sem a carta AR.\n- Kit Ajuizamento: as mesmas peças e também a carta AR da MRS.\n\nMelhorias feitas nesta etapa:\n- A Lívia agora identifica corretamente se o contrato é Blips, Ideal ou financiado pela Finza. Antes, todo contrato era tratado como Blips.\n- Os contratos da Ideal passaram a trazer os e-mails da caixa de cobrança da própria Ideal. Em um contrato de teste eram 8 e-mails e agora são 84, incluindo notificação extrajudicial, constituição em mora e cancelamento.\n- O demonstrativo de débito parou de duplicar parcelas em cerca de 170 contratos, onde o valor saía em dobro.\n- A multa ficou correta em todos os códigos de empresa (10% Blips, 2% Ideal). Em alguns contratos ela saía zerada.\n- Clientes com muitos e-mails não ficam mais com a pasta marcada como \"incompleta\" por causa de um único e-mail que falhou. A Lívia tenta de novo e, se ainda faltar algum, avisa quantos foram salvos.\n- Quando o contrato não tem e-mail de cobrança ou não tem débito em aberto, a Lívia informa \"não há\" em vez de apontar falha.\n- Nas vendas, a nota fiscal agora aparece como \"Nota Fiscal de Venda\". Antes aparecia como \"Nota Fiscal de Remessa\".\n\nContratos financiados pela Finza (CCB): por enquanto, a Lívia avisa que esse kit ainda está em desenvolvimento e não monta nada, para não gerar um kit errado.\n\nO QUE JÁ TEMOS PARA OS CONTRATOS COM CCB\n- O contrato de compra e venda assinado, que cita a CCB.\n- A nota fiscal de venda, da aba Frete da Plataforma.\n- A carta AR da MRS. Verificamos que metade das CCBs em atraso já recebeu carta, então a Lívia consegue buscá-la como faz hoje.\n\nQUAIS ACESSOS A LÍVIA USA HOJE\n- Base de dados da Blips (BigQuery): dados do contrato, do cliente e das parcelas.\n- Caixas de e-mail de cobrança da Blips e da Ideal: os e-mails do kit.\n- Plataforma Blips (usuário de serviço da IA): a nota fiscal.\n- Portal da MRS (usuário BLIPS): a carta AR.\n- Google Drive: a pasta do kit.\nAinda não tem acesso à Celcoin, à caixa de e-mail de cobrança da Finza nem à base de dados da Finza. São justamente as três pendências abaixo.\n\nO QUE FALTA E PRECISAMOS DE AJUDA PARA CONSEGUIR\n1. A CCB assinada e endossada. Ela só existe no sistema da Celcoin. Precisamos de quem tenha acesso à conta da Celcoin para liberar o acesso à API (documentação e credenciais). Um PDF de exemplo de uma CCB também ajudaria.\n2. Os e-mails de cobrança da Finza. Os contratos com CCB não aparecem nas caixas de e-mail da Blips nem da Ideal. Precisamos saber qual é o e-mail de cobrança da Finza e de alguém com acesso a essa caixa para conectá-la à Lívia.\n3. Acesso aos dados das CCBs. Os dados existem no ambiente de dados da Finza, mas a Lívia ainda não tem permissão para lê-los. Precisamos que o responsável pelo ambiente de dados da Finza libere esse acesso. O pedido técnico já está descrito para o time de dados.\n4. O demonstrativo de débito da CCB (com vencimento antecipado e parcelas a vencer trazidas a valor presente, tendo a Finza como credora). Fica com a gente, assim que tivermos o acesso do item 3.\n\nRESUMO\nOs kits Blips e Ideal (preventivo e ajuizamento) estão prontos. Para os contratos com CCB, dependemos de três liberações: o acesso à Celcoin, a caixa de e-mail da Finza e a permissão de dados da Finza. Quem pode nos ajudar com cada uma delas?\n\nEnquanto aguardamos essas três liberações, a demanda fica como \"Bloqueado\". O mesmo comentário foi feito nas demandas #6871 (Kit Preventivo) e #10717 (Kit Ajuizamento Finza/CCB), que estão sendo tocadas em paralelo.","i":false},{"a":"Sara (Jurídico)","e":null,"dt":"2026-10-16T20:29:35.250571+00:00","x":"Boa tarde, gostaria de um posicionamento, visto que a Lívia já produz o Kit e precisamos colocar apenas  CCB da qual podemos extrair do site da CELCOIN que possui API para tal. Aguardo retorno.","i":false},{"a":"Sara (Jurídico)","e":null,"dt":"2026-09-03T20:42:12.679479+00:00","x":"Olá, qual status?","i":false}]},"7237":{"t":"Contexto mesmo número 24hrs | IA's","s":"finalizado","d":"<p>Boa tarde Senhores(as),</p><p></p><p>Dessimoni conforme falado no email</p><p>Peço que nossas IA's tenham o contexto de 24hrs para que em situações no qual o cliente tem uma conversa com algum de nossos humanos tendo o protocolo finalizado mas por algum motivo ele retorna caindo na IA a IA possa ter esse contexto olhando pelo número do cliente mesmo que protocolo diferente.</p><p></p><p>Grato J</p>","c":[{"a":"Sistema/Negócio","e":null,"dt":"2026-10-09T16:47:25.494211+00:00","x":"Filipe estará atuando nesse acompanhamento nos próximos dias","i":false},{"a":"João Pedro","e":null,"dt":"2026-10-09T04:58:08.874855+00:00","x":"A Valentina e a Esperanza passam a enxergar o atendimento humano das últimas 24 h do mesmo número, mesmo que tenha sido em outro protocolo. É o cenário do chamado: o humano finaliza, o cliente volta, cai na IA e ela já sabe o que aconteceu.\n\nO que a IA vê\nPara cada atendimento humano encerrado nas últimas 24 h naquele número, a IA recebe:\n- data/hora, departamento e protocolo;\n- a classificação usada pelo atendente no encerramento (ex.: 4.1 - Promessa de Pagamento);\n- a conversa daquele atendimento, com no máximo ~1.400 caracteres e sempre as falas mais recentes.\n\nJunto vai um conjunto de regras de uso:\n- a classificação é o registro oficial e deve ser respeitada;\n- se a conversa contradisser a classificação, vale a conversa: o cliente diz que não é o titular, pede para não ser mais contatado ou fala em ação judicial. Nesses casos a IA deve parar de cobrar e encaminhar para um humano;\n- valor, prazo, desconto ou acordo combinado com o humano não pode ser repetido, confirmado nem usado em cálculo pela IA;\n- a IA não cita o nome do atendente. Se o cliente cobrar o que foi combinado, ela encaminha para um humano;\n- a IA não inventa nada que não esteja escrito.\n\nLimite por agente: recebem até 3 atendimentos (esse valor pode ser alterado de acordo com o desempenho).\n\nO que a IA NÃO vê\n- Atendimentos feitos só por robô/IA (a não ser que ela mesma tenha feito o atendimento anterior)\n- Classificações que não dizem nada sobre o caso. Exemplos: inatividade, duplicidade, \"Finalizado com sucesso bot\", \"Cliente não possui WhatsApp\", testes.\n- Atendimentos com mais de 24 h.\n- Atendimentos de outra empresa: a Valentina vê só a Finza; a Esperanza vê só o canal que o cliente está falando.\n\nLimites conhecidos\n- Conversa incompleta.\n- Na Blips/Ideal a conversa completa só fica disponível ~30 min após o encerramento. Antes disso entra só uma parte.\n- Mensagens automáticas (abertura, template) aparecem como fala de \"Atendente\". Às vezes trazem o nome da pessoa no texto, por exemplo \"Sou a Raquel…\".\n\nPedido ao time: acompanhar de perto nos próximos dias\n\nEstamos dando mais informação para a IA, e isso aumenta o risco de alucinação. ","i":false}]},"7286":{"t":"Whatsapp Flows","s":"finalizado","d":"<p>Demanda se trata de implementar whatsapp flows nos canais da finza (4). <br><br>O Flows deve contemplar todos os casos de uso que o cliente finza necessitar, como consulta e material de apoio segue o levantamento das informações.<br><br>OBS: validar com o dessimoni e J antes sobre todo o funil </p>","c":[{"a":"João Pedro","e":null,"dt":"2026-09-25T19:23:57.483775+00:00","x":"\n![simulador-apresentacao.html](attachment://311fbd64-c660-46e7-b5ef-9c0fa7380cb7/1790364233327_f4202da5-a9d8-40c2-b5f8-51ac77011735_simulador-apresentacao.html)\n","i":true},{"a":"João Pedro","e":null,"dt":"2026-09-25T19:23:34.471527+00:00","x":"Reunião de apresentação do MVP · Novo Atendimento Finza · 25/09/2026\n\nApresentamos a proposta de atendimento em 3 níveis para os canais oficiais da Finza:\n- Nível 1: WhatsApp Flows, com telas guiadas dentro do WhatsApp.\n- Nível 2: atendimento pela IA (Valentina).\n- Nível 3: atendimento humano, com a distribuição por departamento e faixa de atraso mantida como está hoje.\n\nA proposta vale para 100% dos canais oficiais da Finza. Também vale para os canais da Blips e da Ideal quando a jornada de cobrança começar por eles.\n\nDecisões alinhadas\n- A renegociação sai do menu do Flow por enquanto. As APIs de renegociação chegam com o projeto No Comando. Até lá, a alternativa de pagamento é o cartão de crédito.\n- Os casos de \"cobrança não é minha\" serão tabulados, sem bloqueio automático do telefone, porque o mesmo número pode estar ligado a outros contratos.\n- A virada será gradual, por lotes de clientes ou por departamento.\n- As telas serão cocriadas e homologadas pela área de negócio no Claude Design, que substitui o envio manual de ajustes.\n- O chatbot tradicional continua ativo para clientes com celulares que não suportam WhatsApp Flows.\n\nAinda em aberto\n- Data de go-live: a virada no início de outubro foi descartada por causa do fechamento de mês e da fase 1 do No Comando. A nova data depende do planejamento e da homologação.\n- Clientes com vários contratos ou equipamentos: falta definir a prioridade de exibição.\n- Contratos com flag de jurídico: falta a regra de direcionamento do atendimento.\n- Clientes adimplentes: a regra proposta é que, dentro da janela preventiva, por exemplo com vencimento em até 10 dias, o cliente veja as opções de pagamento. Um cliente totalmente em dia não recebe opção de quitação. Falta confirmar o tamanho da janela.\n- Desbloqueio em confiança: falta definir a régua de dias de atraso.\n- Suporte técnico da carteira Blips: a regularização financeira é pré-requisito antes da transferência para o suporte.","i":false}]},"7317":{"t":"Scorização de telefones","s":"finalizado","d":"**Descrição Refinada**\nCriar modelo estatístico de scorização de telefones a partir dos status retornados pela Meta e pelo Hyper. O modelo precisa indicar se o número nos bloqueou, qual número bloqueou, e quais números não são WhatsApp. A base resultante fica disponível no front da Torre e no banco.\n\nEscopo:\n- Definir os sinais de entrada vindos da Meta e do Hyper.\n- Definir os pesos e o modelo estatístico do score.\n- Persistir a base de score no banco.\n- Expor a visualização do score no front da Torre.\n\n**Observação**\nDemanda grande — precisa ser fatiada antes de entrar em execução. Quatro definições faltam e nenhuma é técnica: quais sinais entram, quais pesos, qual modelo estatístico e como o score aparece dentro da Torre. Scorização de telefone não é hoje uma feature documentada da Torre, então é desenho do zero, não ajuste. Não confundir com a configuração de número por compliance (ref. #4052, finalizado).\n\n**Objetivo**\nA Torre passa a indicar a qualidade de cada telefone da base, permitindo priorizar o acionamento por número com maior chance de entrega.","c":[]},"7318":{"t":"Bloqueio e desbloqueio em massa","s":"finalizado","d":"**Descrição Refinada**\nHoje o blocklist atua por documento (CPF/CNPJ) e impede o acionamento enquanto ativo, mas a operação é individual. Criar a integração que permite desbloquear em massa (casos de confiança/exceção) e bloquear em massa, seja por um período determinado com desbloqueio automático depois, seja por tempo indeterminado até a quitação.\n\nEscopo:\n- Permitir desbloqueio em massa por lista de documentos.\n- Permitir bloqueio em massa com prazo definido e desbloqueio automático ao fim.\n- Permitir bloqueio em massa por tempo indeterminado, liberando na quitação.\n- Integrar com o serviço responsável pelo blocklist.\n\n**Observação**\nEm teoria é simples, mas duas coisas precisam ser definidas antes: onde a ação acontece
