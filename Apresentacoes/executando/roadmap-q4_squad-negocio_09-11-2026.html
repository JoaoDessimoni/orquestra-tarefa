de Controle > Campanhas > Monitoramento > abra uma campanha de suprimento. No bloco de exclusões aparece o motivo novo **\"Sem destinatário\"** com a contagem — a ação não nasce mais.\n2) Em Ações, o volume de \"Falha Permanente\" de WhatsApp/RCS de suprimento cai.\n3) E o mais importante: **acaba o RCS gravado como \"Enviado\" sem destinatário.** Medimos 731 desses em 30 dias — a Torre dizia \"Enviado\" para uma mensagem que nunca teve para quem ir, porque aquele endpoint devolve sucesso mesmo com o destinatário vazio.\n\nJá valendo **agora**, sem esperar a execução: se você disparar uma ação manual para um cliente sem telefone, ela é recusada na hora com o motivo escrito, em vez de ser entregue ao provedor. E as falhas que apareciam como \"Unknown error from send-message\" agora dizem o motivo real.\n\n**PARTE 2 — o telefone existe e não está na Torre: você está certo, e NÃO está nesta entrega.**\n\nMedimos em produção: dos **2.544** clientes com dívida de suprimento na Blips, **1.057 (41,5%)** não têm nenhum telefone na Torre. No mundo de equipamento esse número é **zero**. É exatamente a assimetria que você descreveu.\n\nA causa: a carga de suprimento lê o telefone no **cadastro de parceiro do ERP**, que tem 9,4% de cobertura de celular, em vez da **base de negociação da plataforma** — a mesma que a carga de equipamento já usa todo dia, com 93,7%. Trocar a origem devolve celular a cerca de 800 dos 865 clientes da janela de cobrança.\n\nIsso é mudança na consulta do ETL de suprimento e **precisa de card próprio**. Abro se você confirmar.\n\nUm número que ajuda enquanto isso: desses 1.057 sem telefone, apenas **22** também não têm e-mail. Os outros **1.035 continuam sendo cobrados por e-mail normalmente**. A correção da Parte 1 não apaga público — ela para de gastar disparo em canal impossível.\n\nE um alerta honesto sobre o indicador: o \"% de falha das ações de suprimento\" vai **cair** com esta entrega, porque as ações que falhavam deixam de ser criadas. Isso é a correção funcionando, mas não significa que a Parte 2 foi resolvida — o cliente sem telefone só saiu da conta. Vale olhar o indicador junto com a contagem de \"Sem destinatário\".","i":false},{"a":"Sistema/Negócio","e":null,"dt":"2026-09-10T11:48:14.36673+00:00","x":"Só pra deixar registrado que sim confirmo a necessidade de ajuste no ETL de Suprimentos na Torre de Controle organização Blips pra que seja aplicado um coalesce em caso de não tem o telefone do ERP pegar o telefone que estiver na Negotiation ou em outro lugar que for encontrado. Caso o cliente de suprimentos tenha telefone tanto no ERP e na plataforma peço que puxe os dois ou mais telefones pois não podemos acabar perdendo a oportunidade de recuperar o cliente por definir um número principal de cobrança.","i":false}],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-09-03T20:32:03.397694+00:00","por":"João Vinícius"},{"de":"fila_exec","para":"em_andamento","dt":"2026-09-04T14:16:46.700487+00:00","por":"Marcos"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-08T21:38:23.849853+00:00","por":"Automático (Quimera)"},{"de":"em_validacao","para":"finalizado","dt":"2026-09-10T11:48:21.499858+00:00","por":"Sistema/Negócio"}]},"7389":{"t":"Caso Sabrina HyperFlow","s":"finalizado","d":"<p>Primeiramente bom dia a todos,<br><br>Saulo, conforme combinamos, estou abrindo esta demanda referente ao caso da Sabrina, aqui do nosso setor.<\/p><p>Ela possuía dois e-mails (Blips e Finza), mas o da Blips foi excluído devido a alguns problemas. Hoje ela utiliza exclusivamente o e-mail da Finza. No Hyperflow, ela atua apenas na org Finza — inclusive, já removemos o acesso dela de todos os departamentos da Blips e a vinculamos ao meu departamento para evitar o direcionamento de novas conversas.<\/p><p>Mesmo assim, continuam caindo clientes da org Blips para ela.<br><\/p><p>Precisamos que seja ajustado isso para parar de continuar caindo clientes na org Blips para ela.<\/p><p>Segue abaixo uma evidência de que ela recebeu notificação dos clientes blips, pois na Finza não possuía nenhum ativo.<\/p><img class=\"kb-img\" src=\"attachment://73500953-b982-4859-9074-56c621a5ca5f/1788447479542_image.png\" alt=\"image.png\"><p><\/p>","edd":null,"c":[{"a":"João Pedro","e":null,"dt":"2026-09-08T21:41:31.184884+00:00","x":"# PROCESSO\n\n**(Reforço do que já havia sido explicado ao time de Negócio)**\n\nO direcionamento não nasce no Hyperflow. A cadeia é a seguinte:\n\n1. Uma regra de automação do Bitrix (robô no card do Deal) chama o webhook `ativar-jornada-onboarding`;\n2. O fluxo n8n **\"[ONBOARDING] Ativar Jornada do Cliente\"** (`U9e1mrEDRJIAvhtf`, ambiente Automação) lê o **RESPONSÁVEL DO CARD** no Bitrix e monta o payload;\n3. Esse responsável é enviado para a jornada Hyperflow **\"Jornada do Cliente - Onboarding\"**, nos campos `gerente` e `email_atendente`.\n\nOu seja: enquanto o card estiver com a Sabrina como responsável no Bitrix, o cliente Blips continuará sendo direcionado a ela, independentemente de já termos removido o acesso dela aos departamentos Blips no Hyperflow.\n\nO ajuste feito no Hyperflow está correto, mas não alcança essa porta de entrada.\n\n## CORREÇÃO IMPORTANTE: NÃO É MATERIAL ANTIGO, É FLUXO CORRENTE\n\nFoi realizado um levantamento nas execuções reais do fluxo, considerando a janela de **25/08 a 08/09/2026**, com **918 disparos vindos do Bitrix**:\n\n* Disparos com `sabrina.ferreira@finza.com.br` como atendente: **96**\n* Cards (Deals) distintos envolvidos: **92**\n* Marca dos cards: **100% \"Blips\"**\n* Tipo de mensagem: **100% index 1**, ou seja, boas-vindas da **FORMALIZAÇÃO (C5:NEW)**\n* Participação: **31% de todas as boas-vindas do período** (96 de 306)\n* Ocorrência: **todos os dias úteis da janela**, inclusive hoje. Em **08/09**, foram 14 disparos; o último ocorreu no card **D_257085, às 16:56 BRT**.\n\nComo os cards são novos (numeração **D_254xxx a D_257xxx**, criados dentro da janela), a conclusão é que as regras de automação do Bitrix continuam atribuindo **cards NOVOS** a ela.\n\nNão se trata, portanto, de uma fila antiga parada. Realocar apenas os cards existentes resolve o passado, mas o problema voltará a ocorrer no dia seguinte.\n\n## ONDE ESTÁ A ORIGEM NO BITRIX\n\n**(Conforme mapeamento dos pipes; confirmar com Processos antes de alterar)**\n\n### Pipe FORMALIZAÇÃO — etapa \"Endereço do Responsável\" (C5:NEW)\n\nRegras nominais:\n\n* **\"Alocação Finza - Sabrina\"** — condição: `FINZA? (NEW) = FINZA`\n* **\"Alocação Escavadeiras - Sabrina\"** — condição: `Segmento = Construção Civil`\n\n### Pipe COMERCIAL/ONBOARDING — etapa \"Assinatura CCB\"\n\n* Regra **\"Alterar Pessoa Responsável\"**, que aloca Sabrina Ferreira nominalmente.\n\n**Observação de escopo:** os 96 casos identificados são todos da **FORMALIZAÇÃO**; nenhum ocorreu nas etapas de Onboarding (índices 7, 8 e 9).\n\nPortanto, a realocação precisa mirar o **pipe de Formalização primeiro**.\n\n## ENCAMINHAMENTO SUGERIDO\n\nAbrir uma demanda para o time de **PROCESSOS**, alinhada com **COMERCIAL / ONBOARDING / FORMALIZAÇÃO**, contemplando as duas frentes — uma sem a outra não resolve:\n\n1. **Trocar o destinatário nas regras de automação dos pipes acima**, substituindo a atribuição nominal à Sabrina pelo responsável correto ou pela equipe/fila de **Analistas de Documentação**;\n2. **Realocar os cards abertos que hoje estão com ela como responsável**, considerando que ela atua em **SAC** e não mais em **Documentação**.\n","i":true},{"a":"João Pedro","e":null,"dt":"2026-09-08T21:43:39.232162+00:00","x":"DIRECIONAMENTO INDEVIDO DE CLIENTES PARA SABRINA\nAção necessária — Bitrix / Processos / Comercial / Onboarding\n\nResumo executivo\nIdentificamos que novos clientes Blips continuam sendo direcionados para Sabrina Ferreira, mesmo após a remoção de seu acesso aos departamentos Blips no Hyperflow.\nO problema não está no Hyperflow. A origem está nas regras de automação do Bitrix, que continuam atribuindo Sabrina como responsável pelos cards antes que o fluxo de onboarding seja acionado.\nEnquanto essa configuração permanecer, novos cards continuarão sendo direcionados para ela, mesmo que os cards atuais sejam realocados.\n\nEvidências\nNo período de 25/08 a 08/09/2026, foram analisadas 918 execuções reais do fluxo.\nForam identificados 96 disparos com Sabrina como atendente, envolvendo 92 cards distintos. Em 100% dos casos, os cards eram de Blips e estavam relacionados à Formalização (C5:NEW). Esses casos representam 31% das boas-vindas do período, sendo 96 de um total de 306.\nTambém foi identificada ocorrência em todos os dias úteis da janela analisada, inclusive em 08/09, quando ocorreram 14 disparos.\n\nCausa identificada\nForam identificadas regras no Bitrix que fazem atribuição nominal para Sabrina.\nNo Pipe FORMALIZAÇÃO, na etapa “Endereço do Responsável” (C5:NEW), estão as regras “Alocação Finza - Sabrina” e “Alocação Escavadeiras - Sabrina”.\nNo Pipe COMERCIAL/ONBOARDING, na etapa “Assinatura CCB”, existe a regra “Alterar Pessoa Responsável”, que também realiza a atribuição nominal para Sabrina.\nOs 96 casos identificados estão concentrados na Formalização. Portanto, essa deve ser a prioridade de atuação.\n\nAção necessária\nSolicitamos atuação do time de PROCESSOS, em conjunto com COMERCIAL / ONBOARDING / FORMALIZAÇÃO, em duas frentes.\nPrimeiro, corrigir as regras de automação do Bitrix, substituindo a atribuição nominal à Sabrina pelo responsável correto ou pela fila/equipe de Analistas de Documentação.\nSegundo, realocar os cards atualmente abertos que ainda estão sob responsabilidade da Sabrina, considerando que ela atua em SAC e não mais em Documentação.\n\nPonto de atenção\nAs duas ações são necessárias. Realocar apenas os cards atuais resolve somente o passivo. Se as regras do Bitrix não forem corrigidas, novos cards continuarão sendo atribuídos à Sabrina e o problema voltará a ocorrer.\n","i":false}],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-09-08T18:55:27.641673+00:00","por":"João Vinícius"},{"de":"fila_exec","para":"em_andamento","dt":"2026-09-08T21:06:30.090659+00:00","por":"João Pedro"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-08T21:43:48.903573+00:00","por":"João Pedro"},{"de":"em_validacao","para":"finalizado","dt":"2026-09-09T20:57:14.081493+00:00","por":"Solicitante (Quimera)"}]},"7403":{"t":"Gatilho HyperFlow","s":"finalizado","d":"<p>Primeiramente boa tarde a todos,<\/p><p>João Neto, conforme combinamos agora há pouco, precisamos de uma ajuda com um ajuste que precisa ser realizado no gatilho.<\/p><p>A Maria Eduarda utilizou o gatilho em um atendimento no qual o cliente possuía débitos em aberto na Finza. Porém, mesmo com os débitos identificados, o cliente não recebeu a mensagem com as parcelas que precisavam ser pagas.<\/p><p>Precisamos entender o que ocorreu e realizar o ajuste necessário para que, nesses casos, o gatilho identifique corretamente os débitos em aberto e envie ao cliente as informações das parcelas pendentes.<br><br>Segue exemplo abaixo do contato <span style=\"color: rgb(158, 158, 158);\">+55 82 98225 8621:<\/span><br><\/p><img class=\"kb-img\" src=\"attachment://fc70b9a3-d6d8-44b0-ae0f-bf81b81d5875/1788461921581_image.png\" alt=\"image.png\"><p><\/p>","edd":null,"c":[],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-09-03T19:49:18.926556+00:00","por":"João Pedro"},{"de":"fila_exec","para":"em_andamento","dt":"2026-09-03T19:49:59.585256+00:00","por":"João Pedro"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-04T13:28:32.010718+00:00","por":"João Pedro"},{"de":"em_validacao","para":"finalizado","dt":"2026-09-04T14:21:30.363191+00:00","por":"Solicitante (Quimera)"}]},"7419":{"t":"Ajustes Valentina","s":"finalizado","d":"<p>Quando o cliente solicitar auxílio referente instalação do neurônio ele não deve ser direcionado para o originador e sim ao portal responsável pelas orientações: <a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://ativacao.finza.com.br/\">https://ativacao.finza.com.br/<\/a><\/p>","edd":null,"c":[{"a":"João Pedro","e":null,"dt":"2026-09-03T22:17:24.68352+00:00","x":"Realizados ajustes em prompt e RAG para que Valentina possa orientar da melhor forma segregando corretamente entre instalação de máquina, neurônio ou suporte técnico.\n\nFoi testado, validado e está em produção.","i":false}],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-09-03T22:17:35.089619+00:00","por":"João Pedro"},{"de":"fila_exec","para":"em_andamento","dt":"2026-09-03T22:17:44.883162+00:00","por":"João Pedro"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-03T22:17:48.615726+00:00","por":"João Pedro"},{"de":"em_validacao","para":"finalizado","dt":"2026-09-04T12:39:18.537251+00:00","por":"João Vinícius"}]},"7420":{"t":"Correções | Bitrix","s":"finalizado","d":"<p>Boa tarde Senhores(as),<\/p><p><\/p><p>Analisando o nosso Bitrix que são os dentro de Logística Reversa ( Cobrança 4.0 &amp; Logística Reversa ) identifiquei uma série de inconsistências vou apresentar evidências abaixo para melhor auxilia-los na correção. Deixo claro que preciso da correção não só dos casos que estão errados agora (passado) mas sim do processo que irá impactar no (presente e futuro) por que se não o problema será sempre reencidente.<\/p><p><\/p><p>Contrato sem dívida porém ainda nas raias como se estivesse elegível para tratativa:<br><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://blips.bitrix24.com.br/crm/type/1070/details/14115/\">https://blips.bitrix24.com.br/crm/type/1070/details/14115/<\/a><br><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://blips.bitrix24.com.br/crm/type/1070/details/80051/\">https://blips.bitrix24.com.br/crm/type/1070/details/80051/<\/a><br><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://blips.bitrix24.com.br/crm/type/1070/details/140241/\">https://blips.bitrix24.com.br/crm/type/1070/details/140241/<\/a><br><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://blips.bitrix24.com.br/crm/type/1070/details/120457/\">https://blips.bitrix24.com.br/crm/type/1070/details/120457/<\/a><\/p><p><\/p><p>Contrato vencido porém sem card:<br>12502549<br>12509079<br>12407133<br>12509327<\/p><p><\/p><p>Contrato com rótulo jurídico da plataforma com card no bitrix:<br><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://blips.bitrix24.com.br/crm/type/1070/details/139335/\">https://blips.bitrix24.com.br/crm/type/1070/details/139335/<\/a><br><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://blips.bitrix24.com.br/crm/type/1070/details/85771/\">https://blips.bitrix24.com.br/crm/type/1070/details/85771/<\/a><br><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://blips.bitrix24.com.br/crm/type/1070/details/84951/\">https://blips.bitrix24.com.br/crm/type/1070/details/84951/<\/a><\/p><p><\/p><p>Card sem contrato amarrado:<br><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://blips.bitrix24.com.br/crm/type/1070/details/98929/\">https://blips.bitrix24.com.br/crm/type/1070/details/98929/<\/a><\/p><p><br>Card no fuil errado:<br><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://blips.bitrix24.com.br/page/logistica_reversa/todas_as_opcoes_selecionadas/type/1070/details/93981/\">https://blips.bitrix24.com.br/page/logistica_reversa/todas_as_opcoes_selecionadas/type/1070/details/93981/<\/a><br><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://blips.bitrix24.com.br/page/logistica_reversa/todas_as_opcoes_selecionadas/type/1070/kanban/category/203/\">https://blips.bitrix24.com.br/page/logistica_reversa/todas_as_opcoes_selecionadas/type/1070/kanban/category/203/<\/a><\/p><p><\/p><p>Contrato que só ta na plataforma e desatualizado no bitrix:<br><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://blips.bitrix24.com.br/page/logistica_reversa/todas_as_opcoes_selecionadas/type/1070/details/118185/\">https://blips.bitrix24.com.br/page/logistica_reversa/todas_as_opcoes_selecionadas/type/1070/detai ra que possa melhor direcionar na correção. De qualquer forma peço que também façam a varredura do lado de vocês podendo identificar outras possíveis inconsistências no qual não identifiquei a priori e pode estar ocorrendo.<\/p><p><\/p><p>Grato J<\/p>","edd":null,"c":[{"a":"Sistema/Negócio","e":null,"dt":"2026-09-08T13:06:56.368861+00:00","x":"* Novos originadores = Maria Eduarda.\n* Suprimentos = Eduarda Zuchetti.\n* Adimplente equipamentos = Larissa.\n* Atraso máximo contrato 01 a 30 = Distribuir igualitário entre Giovanna & Raquel Medeiros.\n* Atraso máximo contrato 31 a 60 = Maria Eduarda.\n* Atraso máximo contrato 61 a 90 = Raquel Galvão.\n* Atraso máximo contrato 91+ porém Suprimentos ficará no SPA Cobrança mantendo a Eduarda Zuchetti.\n* Atraso máximo contrato 91+ FIDC, Blips ou Alpe. Deverá ir pra SPA de Logística Reversa na raia nova solicitação de distrato no qual será distribuído igualitariamente entre Luciano e Juliane que são de distrato.\n* Atraso máximo contrato 91+ Finza ou Novos originadores. Deverá ir pra SPA de Logística Reversa na raia nova solicitação de retirada qual será distribuído igualitariamente entre Luciano e Juliane que são de distrato.","i":false},{"a":"João Pedro","e":null,"dt":"2026-09-11T23:33:19.98723+00:00","x":"O que está sendo entregue conforme nossa agenda:\n\n1) Atualização de dias em atraso: Cobrança e Logística Reversa agora são atualizados utilizando a mesma base de informações para andarem lado a lado;\n2) Elegibilidade por Fase e Situação da plataforma: Atualizado de acordo com as informações repassadas no google chat;\n3) Atribuição de responsáveis na Cobrança 4.0: De acordo com o comentário abaixo;\n4) Logística Reversa - dias em atraso e lista de NUFINs: o processo referente esse preenchimento estava desabilitado, refeito processo que injeta informações para melhorias no futuro conforme esperado do novo documento para atualização;\n5) Status jurídico na plataforma: passou a ser observado também além de olhar para os ca ro. <br><br><\/p><img class=\"kb-img\" src=\"attachment://e85afc56-11cf-4c4c-9504-987dbb526104/1788899590105_image.png\" alt=\"image.png\"><p><\/p>","edd":"2026-09-14","c":[{"a":"Sistema/Negócio","e":null,"dt":"2026-09-10T21:01:05.776017+00:00","x":"[Solicitação de ajustes] O que foi entregue?","i":false},{"a":"Leandro","e":null,"dt":"2026-09-14T12:19:25.900115+00:00","x":"\n![image.png](attachment://e85afc56-11cf-4c4c-9504-987dbb526104/1789387340846_2fd5bad2-dadc-4c22-9407-c50b6bea87b2_image.png)\n\nforam separados os filtros de datas nas Métricas dos Agentes de IA e no Dashboard de Performance da IA:\n- Criação do protocolo: seleciona os atendimentos abertos no período.\n- Última interação: seleciona os protocolos pela data da mensagem mais recente.\n- Período dos eventos: define o intervalo das mensagens, transferências e demais eventos contabilizados nos indicadores.\nOs filtros podem ser usados individualmente ou combinados, com datas personalizadas e limpeza independente. Também foi incluída a opção “Sem restrição” para consultar todo o histórico disponível.\n","i":true}],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-09-08T20:33:36.939092+00:00","por":"João Vinícius"},{"de":"fila_exec","para":"em_andamento","dt":"2026-09-09T02:11:14.541944+00:00","por":"Leandro"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-10T12:43:32.752601+00:00","por":"Leandro"},{"de":"em_validacao","para":"em_andamento","dt":"2026-09-10T21:01:09.156319+00:00","por":"Sistema/Negócio"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-14T11:41:06.133307+00:00","por":"Leandro"},{"de":"em_validacao","para":"finalizado","dt":"2026-09-15T11:35:44.805382+00:00","por":"Sistema/Negócio"}]},"7591":{"t":"Vincular Número Hyperflow","s":"finalizado","d":"Solicitação de reconexão de linha WhatsApp (coexistence) no Hyperflow.\n\n• Número: 34997135129\n• Nome (Hyperflow): JULIANE OLIVEIRA\n• E-mail do responsável: juliane.oliveira@blips.com.br\n• Departamento: Liquidação Financeira\n• Empresa: Blips\n\nSolicitado por: lara.araujo@blips.com.br\n\nLinha de Cobrança / Liquidação Financeira / Finza — aberta no time da Finza.\n\nAberta automaticamente pelo Monitor de Conexões (Hyperflow).\n\n---\n_Created via MCP (source: monitor-hyperflow)_","edd":null,"c":[{"a":"João Pedro","e":null,"dt":"2026-09-09T13:33:59.032209+00:00","x":"Realizado conexão","i":true}],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-09-09T12:48:50.966563+00:00","por":"João Vinícius"},{"de":"fila_exec","para":"em_andamento","dt":"2026-09-09T13:33:40.469512+00:00","por":"João Pedro"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-09T13:34:15.23757+00:00","por":"João Pedro"},{"de":"em_validacao","para":"finalizado","dt":"2026-09-14T09:00:02.324961+00:00","por":"Automático (Quimera)"}]},"7607":{"t":"Preso no Bot - Clara","s":"finalizado","d":"<p>Foi identificado pelo Carlos um caso de preso no bot pela Clara. Segue relatório em anexo.<br><br><\/p><img class=\"kb-img\" src=\"attachment://b9cad6d1-73d0-420d-8d53-4753386cb4c5/1788961133519_image.png\" alt=\"image.png\"><p><\/p>","edd":null,"c":[{"a":"João Pedro","e":null,"dt":"2026-09-09T15:53:05.039495+00:00","x":"Agora o fluxo possui inatividade e também será direcionado para o departamento da Clara V2, considerando que IA - Onboarding foi desativado para casos que mensagem chegar a cair no agente ela consegue lidar e transferir se necessário.","i":true},{"a":"João Pedro","e":null,"dt":"2026-09-09T16:49:36.17201+00:00","x":"Clientes travados em fluxos legados que já foram desabilitados\n","i":true}],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-09-09T13:37:50.034657+00:00","por":"João Vinícius"},{"de":"fila_exec","para":"em_andamento","dt":"2026-09-09T14:48:09.330284+00:00","por":"João Pedro"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-09T15:53:10.164769+00:00","por":"João Pedro"},{"de":"em_validacao","para":"em_andamento","dt":"2026-09-09T16:27:07.606727+00:00","por":"João Pedro"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-09T16:49:18.730447+00:00","por":"João Pedro"},{"de":"em_validacao","para":"finalizado","dt":"2026-09-14T09:00:02.560078+00:00","por":"Automático (Quimera)"}]},"7640":{"t":"Correção Gatilho 2.2 Busca Pix/Boleto pelo NUFIN ou NOSSO NÚMERO","s":"finalizado","d":"<p>Primeiramente boa tarde a todos,<\/p><p><\/p><p>A abertura dessa demanda ocorre devido a uma falha que ocorreu no dia 01/09, em que nossa agente Giovanna utilizou o gatilho e mandou o boleto para o cliente pagar, no entanto, ao enviar o boleto PDF, a data de vencimento saiu incorreta, e foi enviado um boleto que vence dia 15/03/2029, cliente pagou e surgiu certo atrito.<\/p><p><\/p><p>Protocolo da conversa: 0909267787805<br>CNPJ: 41001656000106<\/p><img class=\"kb-img\" src=\"attachment://52813761-c73b-46ec-a0ac-9a3549f3c5fc/1788986937444_image.png\" alt=\"image.png\"><p><\/p>","edd":null,"c":[{"a":"João Pedro","e":null,"dt":"2026-09-11T12:36:10.960954+00:00","x":"A questão relatada já havia sido resolvida no chamado 7509, cuja correção foi aplicada dia 08/09, ou seja, o gatilho já não repete esse comportamento. Aproveitei para corrgir uma oportunidade que apareceu na análise, a forma como o gatilho localizava a parcela a partir do NUFIN dependia da numeração da parcela, que nem sempre é igual nos dois sistemas (MF e Sankhya).","i":false}],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-09-10T13:05:21.546345+00:00","por":"João Pedro"},{"de":"fila_exec","para":"em_andamento","dt":"2026-09-11T11:56:52.058776+00:00","por":"João Pedro"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-11T12:36:25.078107+00:00","por":"João Pedro"},{"de":"em_validacao","para":"finalizado","dt":"2026-09-11T12:46:08.832539+00:00","por":"Solicitante (Quimera)"}]},"7667":{"t":"%Falha Whatsapp | Torre de Controle","s":"finalizado","d":"<p>Bom dia Senhores(as),<\/p><p>Conforme falamos dessimoni segue formalização da demanda, a torre está apresentando comportamento de %falha elevado e informa este erro da print.<\/p><img class=\"kb-img\" src=\"attachment://1da6aa5b-a32b-409e-82d9-37b7d6386ffc/1789041678343_image.png\" alt=\"image.png\"><p>Peço apoio para correção e reprocessamento das ações que falharam por erro \"aparentemente do MF\".<\/p><p><br>Grato J<\/p><p><\/p>","edd":null,"c":[{"a":"Leandro","e":null,"dt":"2026-09-14T12:31:22.580434+00:00","x":"As falhas têm causas diferentes. No levantamento de 14/09, encontramos:\n- RCS — 1.912 falhas: a integração aceita a solicitação de envio e, cerca de 6 segundos depois, informa que falhou. Porém, o retorno chega à Torre sem código ou descrição do erro.\n- Principal suspeita no RCS: destinos sem RCS disponível, seja pelo aparelho, ativação do serviço ou cobertura do agente/operadora. Cerca de 685 números falharam repetidamente em passos diferentes, enquanto os mesmos passos funcionaram para outros destinos. É uma hipótese forte, ainda não confirmada pelo provedor.","i":true},{"a":"Leandro","e":null,"dt":"2026-09-14T12:35:43.941211+00:00","x":"A falha que bloqueava os envios por exigir indevidamente um link de pagamento foi corrigida em produção.","i":true},{"a":"Sistema/Negócio","e":null,"dt":"2026-09-15T11:33:57.65947+00:00","x":"[Solicitação de ajustes] O que foi entregue? corrigiram e reprocessaram no dia?","i":false},{"a":"Leandro","e":null,"dt":"2026-09-15T12:43:20.003825+00:00","x":"a nota havia ficado interna. \nA falha que bloqueava os envios por exigir indevidamente um link de pagamento foi corrigida em produção.\nAs falhas têm causas diferentes. No levantamento de 14/09, encontramos:\n- RCS — 1.912 falhas: a integração aceita a solicitação de envio e, cerca de 6 segundos depois, informa que falhou. Porém, o retorno chega à Torre sem código ou descrição do erro.\n- Principal suspeita no RCS: destinos sem RCS disponível, seja pelo aparelho, ativação do serviço ou cobertura do agente/operadora. Cerca de 685 números falharam repetidamente em passos diferentes, enquanto os mesmos passos funcionaram para outros destinos. É uma hipótese forte, ainda não confirmada pelo provedor.","i":false}],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-09-10T16:50:40.247528+00:00","por":"João Vinícius"},{"de":"fila_exec","para":"em_andamento","dt":"2026-09-14T11:52:26.364527+00:00","por":"Leandro"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-14T12:35:48.173885+00:00","por":"Leandro"},{"de":"em_validacao","para":"em_andamento","dt":"2026-09-15T11:34:00.904886+00:00","por":"Sistema/Negócio"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-15T12:43:30.596559+00:00","por":"Leandro"},{"de":"em_validacao","para":"finalizado","dt":"2026-09-15T13:09:03.819095+00:00","por":"Sistema/Negócio"}]},"7704":{"t":"RCS | Torre & Hyper","s":"finalizado","d":"<p>Boa tarde Senhores(as),<\/p><p><\/p><p>Nos últimos dias fiz campanhas Broadcast de RCS e observei pouco %resposta comparado ao Whatsapp não sejam comparáveis porém a discrepância foi gigante.<\/p><p>RCS<\/p><img class=\"kb-img\" src=\"attachment://43bea33e-b1b3-4d60-b5f6-feda2e6eab2f/1789053202520_image.png\" alt=\"image.png\"><p>Whatsapp<\/p><img class=\"kb-img\" src=\"attachment://43bea33e-b1b3-4d60-b5f6-feda2e6eab2f/1789053202520_image.png\" alt=\"image.png\"><p><\/p><p>Com isto eu fui fazer testes para analisar e entender o comportamento do RCS, fiz 3 disparos no primeiro não interagi com nenhum dos botões porém enviei mensagem no qual ficou como apenas enviado. As outras duas interagi em um dos botões e marcou (solicitou atendimento).<\/p><p>Sei que tanto no Whatsapp e RCS nisso estão com o mesmo comportamento e peço correção pra que se o cliente responder que marque como respondido. Quando o cliente ler que marque como lido.<\/p><p><\/p><p>Outro ponto é sobre o comportamento de transferência e agente no canal RCS. Quando clico no botão a IA demora a entrar e falar em comparação ao Whatsapp está bem mais lento.<\/p><p>Quando solicitei atendimento ela parou de me responder e não me transferiu pra lugar nenhum e nem continuou meu atendimento ficando preso.<\/p><p><\/p><p>Outro ponto assim como no Whatsapp tem o [IA] e [HUMANO] peço que seja feito para o RCS para caso queira transbordar direto pro Humano<\/p><img class=\"kb-img\" src=\"attachment://43bea33e-b1b3-4d60-b5f6-feda2e6eab2f/1789053202520_image.png\" alt=\"image.png\"><img class=\"kb-img\" src=\"attachment://43bea33e-b1b3-4d60-b5f6-feda2e6eab2f/1789053202520_image.png\" alt=\"image.png\"><img class=\"kb-img\" src=\"attachment://43bea33e-b1b3-4d60-b5f6-feda2e6eab2f/1789053202520_image.png\" alt=\"image.png\"><p><\/p><p>Peço apoio nas frentes informadas acima.<\/p><p><\/p><p>Grato J<\/p>","edd":null,"c":[{"a":"Sistema/Negócio","e":null,"dt":"2026-09-11T18:21:50.909635+00:00","x":"1109266950555 IA RCS Blips: Cliquei em consultar condições a Esperanza me atendeu questionando como podia me ajudar, informei sobre os débitos ela disse me informou corretamente questionei como faço pra regularizar ela me informou as opções e questionou o método de pagamento eu informei pix e ela deixou de me retornar, acredito que é porque não conseguiu identificar boleto para pagamento, porém deveria ter tido alguma ação e simplesmente fiquei sem resposta.\n1109264942634 IA RCS Ideal: Respondi a mensagem e não fui atendido nem recebi botão\nHumano RCS Ideal: Ao receber a mensagem da torre cliquei no botão de \"Consultar condições\" e até o momento não fui transferido\nHumano RCS Blips: ao receber a mensagem da torre respondi perguntando \"como assim?\" e não recebi direcionamento e até o momento não fui transferido e não recebi os botões","i":false},{"a":"Solicitante (Quimera)","e":null,"dt":"2026-09-11T18:36:48.238625+00:00","x":"IA RCS FINZA Protocolo 1109262760094 - Esperanza me respondeu informando sobre os débitos e pedindo o comprovante pois eu informei que já tinha pagado, quando informei que achava que tinha pagado errado e perguntei se podia pagar agora ela transferiu para o atendimento do SAC pois não conseguiu identificar a origem da cobrança nem classificar de acordo com o tempo de cobrança.\nHumano RCS FINZA Protocolo: 1109268802559 Respondi a mensagem da torre a Valentina me atendeu e não transferiu para o humano, pediu meu CNPJ ou CPF me passou os débitos informei que queria pagar ela me questionou se seria pix ou boleto \n\n","i":false},{"a":"João Pedro","e":null,"dt":"2026-09-14T15:29:13.645764+00:00","x":"Revisado todos os status disponíveis e situações mencionadas no chamado e também comentário, limitação quanto a status ENTREGUE e LIDO devido a plataforma não me trazer essa informação.","i":false},{"a":"Solicitante (Quimera)","e":null,"dt":"2026-09-15T12:17:08.094773+00:00","x":"Realizado testes referente a aplicação, na Blips e FINZA o atendimento para o humano ta perfeito, porém o da IA não responde, na IDEAL já é ao contrario, a IA atende perfeitamente e o do humano não responde, segue evidencias: \n\nProtocolo: 1109266950555 IA RCS Blips: Atendimento da IA não responde\nProtocolo: 1509265016971 HUMANO RCS BLIPS: Transfere perfeitamente para o humano \n\nProtocolo: 1109264942634 IA RCS IDEAL: Atende e passa informações sobre os débitos rapidamente e realiza a transferência pro humano por não encontrar os débitos.\nProtocolo: 1509267656802 Humano RCS IDEAL: Não responde\n\nProtocolo: 1509263318866 IA RCS FINZA: Responde a primeira mensagem questionando como pode ajudar, porém depois não responde mais \nProtocolo: 1509263844773 HUMANO RCS FINZA: Assim que eu respondo, transfere perfeitamente para o humano imediatamente para o setor correto de cobrança.","i":false},{"a":"Sistema/Negócio","e":null,"dt":"2026-09-15T14:35:44.968751+00:00","x":"[Solicitação de ajustes] Solicitando ajustes considerando o apontado pelo Renato","i":false},{"a":"João Pedro","e":null,"dt":"2026-09-15T14:41:38.270172+00:00","x":"Já conversei com ele aguardando retorno.","i":false}],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-09-10T16:52:47.800959+00:00","por":"João Vinícius"},{"de":"fila_exec","para":"em_andamento","dt":"2026-09-11T11:57:03.845205+00:00","por":"João Pedro"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-14T15:29:19.405774+00:00","por":"João Pedro"},{"de":"em_validacao","para":"em_andamento","dt":"2026-09-15T14:35:48.476817+00:00","por":"Sistema/Negócio"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-15T14:41:42.333941+00:00","por":"João Pedro"},{"de":"em_validacao","para":"finalizado","dt":"2026-09-16T14:56:25.717849+00:00","por":"Sistema/Negócio"}]},"7713":{"t":"href e outras funções Google no HTML | Torre de Controle","s":"finalizado","d":"<p>Boa tarde Senhores(as),<\/p><p><\/p><p>Leandro peço que a torre consiga ter funções de HTML google para melhor compor. Além disso permitir expandir a pré visualização do HTML pra ver melhor.<\/p><p><\/p><p>Grato J<\/p>","edd":null,"c":[{"a":"Sistema/Negócio","e":null,"dt":"2026-09-17T14:31:37.667359+00:00","x":"[Solicitação de ajustes] Não está funcionando o atalho \"{{\"","i":false},{"a":"Leandro","e":null,"dt":"2026-09-17T14:42:24.646566+00:00","x":"Esta funcionalidade se caracteriza mais como uma feature que foi removida há algum tempo e não está diretamente relacionada ao escopo desta demanda, visto que esse comportamento já ocorre em versões anteriores.\n\nPoderia, por favor, confirmar se o solicitado inicialmente — a integração com o Google — já está concluído? Caso esteja, podemos considerar esta demanda como finalizada.\n\nEm relação ao ajuste mencionado neste comentário, vou analisá-lo e, se aplicável, realizarei a entrega junto à demanda https://quimera.blips.com.br/tickets/7950.","i":false}],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-09-10T19:36:52.039416+00:00","por":"João Vinícius"},{"de":"fila_exec","para":"em_andamento","dt":"2026-09-11T13:46:22.815501+00:00","por":"Leandro"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-16T01:32:51.047651+00:00","por":"Leandro"},{"de":"em_validacao","para":"em_andamento","dt":"2026-09-17T14:31:43.518561+00:00","por":"Sistema/Negócio"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-17T14:42:54.09112+00:00","por":"Leandro"},{"de":"em_validacao","para":"finalizado","dt":"2026-09-21T11:37:12.710165+00:00","por":"Sistema/Negócio"}]},"7722":{"t":"Ajustes Formalização","s":"finalizado","d":"<p>Pôs reunião com Marco, algumas coisas foram definidas para melhorias/ajustes quanto a org de formalização, segue elas:<br><br>Possibilidade de configuração de range (de dias) para cada step de etapa onde diariamente vai acontecer a determina integração <\/p><p>Melhoria UI UX (Pegar na mão para criar as réguas) da criação de réguas e steps de réguas.  E melhorar a parte de configuração de steps para conseguir aninhar por etapa configurado (assim como é aninhado nas orgs de cobrança por dias de atraso, ser aninhado por step...) E com isso, deve melhorar cada modal de criaçao para ser faseado configurando... <\/p><p>Colocar o template whatsapp que será usado para o piloto (new_proposta_producao) <\/p>","edd":"2026-09-18","c":[{"a":"Marcos","e":null,"dt":"2026-09-11T03:24:35.501343+00:00","x":"Entregue e já em produção. Os três pontos da reunião estão no ar.\n\nOnde validar: Torre de Controle > Réguas de Cobrança > abra \"Régua Formalização - V1\".\n\n1) A timeline agora agrupa por ETAPA, não por dia de atraso. Você vai ver os grupos \"Aguardando assinatura\" e \"Aguardando simulacao\", cada um com o valor exato do dado ao lado do nome.\n\n2) Clique em \"Adicionar\" no cabeçalho de um desses grupos. O assistente abre com a etapa daquele grupo já preenchida, em modo leitura — ele não pergunta de novo, porque o grupo já respondeu.\n\n3) Avance até a etapa \"Quando\" e preencha \"do dia 1 ao dia 7\". Dentro desse intervalo a ação sai TODOS OS DIAS, e o dia 0 é o dia em que o contato entra na etapa. Deixar o segundo campo vazio significa \"desse dia em diante\", que é exatamente o que a configuração antiga fazia — por isso nada do que já estava montado mudou de comportamento.\n\n4) Tente inverter (do dia 7 ao dia 3). O assistente bloqueia o salvamento: esse intervalo deixaria o passo mudo para sempre, sem erro nenhum na execução.\n\n5) O campo de etapa virou lista, com as etapas que existem hoje nos seus contatos e a contagem de cada uma. Você ainda pode digitar uma etapa que ainda não apareceu nos dados.\n\n6) O template do piloto já está disponível em Torre de Controle > Templates, aprovado e ativo.\n\nO que estava errado: o gatilho do passo era perguntado dentro do formulário do canal. Quem não passava por lá — Webhook, Condição, Espera e Agente IA — não tinha onde configurar a etapa, e nascia disparando \"no vencimento\" sem ninguém ter escolhido isso.\n\nO que NÃO muda:\n- A criação da RÉGUA em si (nome, carteiras, filtros) continua na tela de antes. O passo a passo faseado foi feito no PASSO, que era onde estava o problema.\n- Reordenar passos arrastando continua sem efeito ao salvar.\n- Dois passos na mesma etapa com dias em comum disparam OS DOIS. O assistente avisa na revisão, mas não impede — é alerta, não trava.","i":false}],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-09-10T19:35:47.482139+00:00","por":"João Vinícius"},{"de":"fila_exec","para":"em_andamento","dt":"2026-09-10T19:36:01.720834+00:00","por":"Marcos"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-11T03:24:43.692819+00:00","por":"Automático (Quimera)"},{"de":"em_validacao","para":"finalizado","dt":"2026-09-11T15:11:57.175159+00:00","por":"João Vinícius"}]},"7794":{"t":"Trackeamento E-mail | Torre ","s":"finalizado","d":"<p>Boa tarde Senhores(as),<\/p><p><\/p><p>Peço que seja feito o trackeamento da ação do email tendo os seguintes status.<\/p><p>Falha (motivo da falha)<br>Enviado<br>Entregue<br>Lido<br>Clicou<br>Respondido<\/p><p><\/p><p>Grato J<\/p>","edd":null,"c":[{"a":"Sistema/Negócio","e":null,"dt":"2026-09-15T13:11:35.001949+00:00","x":"[Solicitação de ajustes] O que foi entregue?","i":false},{"a":"João Pedro","e":null,"dt":"2026-09-15T13:51:01.20936 e pra fazer ações até para clientes/contatos que não estão na torre.<\/p><p><\/p><img class=\"kb-img\" src=\"attachment://4e8498fb-a8b3-4887-a112-76e1117c5306/1789393816270_image.png\" alt=\"image.png\"><p><\/p><p>Grato J<\/p><p><\/p>","edd":null,"c":[],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-09-15T12:35:50.138934+00:00","por":"João Vinícius"},{"de":"fila_exec","para":"em_andamento","dt":"2026-09-30T16:45:53.736595+00:00","por":"Marcos"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-30T22:20:51.122502+00:00","por":"Marcos"},{"de":"em_validacao","para":"finalizado","dt":"2026-10-05T09:00:02.74633+00:00","por":"Automático (Quimera)"}]},"7897":{"t":"Nova Era | Bitrix","s":"finalizado","d":"<p>Bom dia Senhores(as),<\/p><p><\/p><p>João Neto, segue documentos que falamos sobre o Bitrix. Nele focamos mais em como queremos que esteja. E o que quero dizer com isto? Se tem Card Jurídico criado o foco foi em orientar que queremos que seja retirado contratos jurídico e como tirar.<\/p><p>Muitos pontos que já estão OK/funcionando exemplo acionamento pelo Bitrix não é mencionado porque está OK, não quer dizer que queremos que retire ou mexido.<\/p><p>Caso ao ler o documento veja que algum ajuste que propomos irá quebrar algo ou não faz sentido peço que entre em contato pra gente nos alinhar pois de fato tem muitas coisas aplicadas no Bitrix antes de eu assumir esse processo aqui do time de negócio Finza e que posso não ter conhecimento e acabar quebrando o que já funciona por falta de conhecimento mesmo, por isso nossa parceria será primordial pra chegarmos no outro lado.<\/p><p><\/p><p>É um tema muito importante que não conseguimos de fato resolver até hoje, tivemos grandes avanços sim porém ainda não sentimos confortáveis e temos vários GAPS por isso pedindo apoio ao time pra juntos resolvermos esse problema.<\/p><p><\/p><p>São 3 Bitrix que será tratado nessa demanda que pra nós é prioridade alta:<br>Formalização: <a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://blips.bitrix24.com.br/crm/deal/category/5/\">https://blips.bitrix24.com.br/crm/deal/category/5/<\/a><br>Cobrança: <a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://blips.bitrix24.com.br/page/logistica_reversa/todas_as_opcoes_selecionadas/type/1070/kanban/category/203/\">https://blips.bitrix24.com.br/page/logistica_reversa/todas_as_opcoes_selecionadas/type/1070/kanban/category/203/<\/a><br>Distrato/Retirada: <a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://blips.bitrix24.com.br/page/logistica_reversa/todas_as_opcoes_selecionadas/type/1070/kanban/category/69/\">https://blips.bitrix24.com.br/page/logistica_reversa/todas_as_opcoes_selecionadas/type/1070/kanban/category/69/<\/a><\/p><p><\/p><p>Documentação de Cobrança, Distrato/Retirada: <a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://claude.ai/code/artifact/6ab1126b-ee84-4be8-979e-7abd86cda7a0?sk=LK2FQvjLe17xGr1J0_hX0g\">https://claude.ai/code/artifact/6ab1126b-ee84-4be8-979e-7abd86cda7a0?sk=LK2FQvjLe17xGr1J0_hX0g<\/a><\/p><p>Formalização está em anexo.<\/p><p>Grato J<\/p>","edd":null,"c":[{"a":"Sistema/Negócio","e":null,"dt":"2026-09-14T14:35:03.970967+00:00","x":"\n![MODELO IDEAL CONTRATOS À VISTA.png](attachment://42a221e6-187e-4012-a981-30d9ea9e8af9/1789396493511_3e3836b3-d74a-4772-b963-013b940d4612_modelo-ideal-contratos-a-vista.png)\n\n![MODELO IDEAL BITRIX FORMALIZAÇÃO (1).png](attachment://42a221e6-187e-4012-a981-30d9ea9e8af9/1789396498845_21eb646a-74cd-4e59-8d4a-a5a70104dc33_modelo-ideal-bitrix-formalizacao-1.png)\n","i":false},{"a":"Sistema/Negócio","e":null,"dt":"2026-09-15T12:59:40.437659+00:00","x":"Peço que se toda essa mudança for impactar a operação enquanto correções/ajustes são aplicados seja criado outra régua. ","i":false},{"a":"João Pedro","e":null,"dt":"2026-10-22T02:54:53.273519+00:00","x":"Atualização: funis de Cobrança (203) e Logística Reversa (69)\n\n1. Nova esteira de Cobrança: em produção desde 06/10/2026.\n- O que mudou: a esteira que cria e atualiza os cards da Cobrança foi refeita e substituiu as duas antigas.\n- Mais rápida:\n  - a rodada das 05:30, que é a mais pesada, leva cerca de 1 h;\n  - as rodadas das 07:00, 12:00 e 16:00 levam de 3 a 11 min;\n  - antes, só a criação levava de 52 a 176 min.\n- Horários: 05:30 (cria e atualiza), 07:00, 12:00 e 16:00 (atualizam), de segunda a sexta. Os dias de atraso continuam sendo gravados todos os dias.\n- Regras incluídas: cards preventivos (D-10 a D0), novos originadores em raia própria, blocklist da Torre por nível, Finza com prioridade sobre FIDC e responsável por raia e faixa de atraso.\n\n2. Movimentação entre raias da 203: concluída por Processos em 19/10.\n- O workflow de Processos passou a mover os cards entre raias pela regra que definimos.\n- Conferimos 2.718 cards abertos: nenhum estava na raia errada. O aceite foi dado em 21/10.\n- A entrada na raia Suprimentos parou depois da mudança de 19/10. Processos corrigiu em 21/10: 45 cards entraram e não sobrou suprimento em Nova Solicitação.\n\n3. Jurídico: regra corrigida (detalhes na IAF-10714).\n- O que aconteceu: em 06/10 a esteira passou a levar ao Jurídico cards da Logística Reversa e da Cobrança com critério largo demais. A cada movimentação, um robô do Bitrix abria um card no Jurídico Ativo.\n- Correção de 19/10:\n  - os 254 cards movidos desde 06/10 voltaram para a etapa de origem;\n  - os cards duplicados no Jurídico Ativo foram excluídos;\n  - a esteira não tira mais card das 8 etapas físicas da 69 (Logística, Manutenção Interna, Termo/Laudo, Abertura de OS, Agendamento, Retirada com Técnico, Aguardando Emissão NF e Retirada Odeen).\n- Regra definitiva, desde 21/10:\n  - cliente com sinal jurídico não ganha card de cobrança. Sinal jurídico é a marcação na plataforma, o bloqueio judicial na Torre ou um card aberto no Jurídico;\n  - se o card já existe na 203, ele vai para a perda \"Jurídico\" da própria 203, olhando só o contrato do card;\n  - a 69 não é tocada.\n\n4. Logística Reversa (69)\n- Dias em atrasos passam a atualizar\n- Os 64 cards de etapa física que tinham ido para a perda voltaram para a origem (opção B de Processos) e continuam lá nas rodadas de 20 e 21/10.\n- Os responsáveis do funil 69 foram confirmados por Processos.","i":false},{"a":"João Pedro","e":null,"dt":"2026-10-22T02:56:25.617759+00:00","x":"Atualização: Formalização (funil 5 do Bitrix)\n\nA parte da Formalização que é do time de IA está em produção. A partir de agora, a automação move o card em três momentos:\n\n1. Link de biometria enviado ao cliente: o card vai para Biometria.\n2. Sinal pago no financiado ou na locação: cerca de 35 min depois, o card sai de Pagamento de Sinal e vai para a raia da etapa atual na plataforma, normalmente Endereço do Responsável.\n3. Sinal pago na compra à vista: cerca de 35 min depois, o card vai para Checklist Vistoria.\n\nTambém paramos de criar card duplicado quando o Bitrix falha na consulta.\n\nO que encontramos: quem move a maior parte do funil é um robô do painel do Bitrix. \n\nO que não é do time de IA e foi encaminhado:\n- Time de Processos: 10 ajustes no painel, em documento anexo. Entre eles: regras de Endereço, Formalização e cancelado, responsável por raia, ordem das raias com Pagamento de Sinal primeiro, a raia Reprovado Compliance e a limpeza de 249 cards inconsistentes.\n- Time de negócio: decidir se e como mover os 14 cards que já estavam parados em Pagamento de Sinal antes da automação. A planilha está em anexo:\n\n\n![03-estoque-sinal-mover-a-mao.csv](attachment://42a221e6-187e-4012-a981-30d9ea9e8af9/1792637782836_673be463-7254-4c90-8166-c15ee6828058_03-estoque-sinal-mover-a-mao.csv)\n","i":false}],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-09-15T12:49:27.369362+00:00","por":"João Vinícius"},{"de":"fila_exec","para":"em_andamento","dt":"2026-09-28T14:57:21.975007+00:00","por":"João Pedro"},{"de":"em_andamento","para":"bloqueado","dt":"2026-10-08T05:07:43.891903+00:00","por":"João Pedro"},{"de":"bloqueado","para":"em_andamento","dt":"2026-10-20T01:40:03.171769+00:00","por":"João Pedro"},{"de":"em_andamento","para":"em_validacao","dt":"2026-10-22T00:11:01.78539+00:00","por":"João Pedro"},{"de":"em_validacao","para":"finalizado","dt":"2026-10-26T17:04:54.838703+00:00","por":"João Vinícius"}]},"7905":{"t":"IA Clara na TC","s":"finalizado","d":"<p>Primeiramente bom dia a todos,<\/p><p><\/p><p>João Neto, como combinamos mais cedo, a abertura deste chamado é referente à dúvida que tive sobre a configuração da Clara na Torre de Controle na ORG Blips.<\/p><p>Ao analisar os prompts de cenário, identifiquei que eles estão direcionando a Clara como uma assistente de cobrança. Um exemplo disso é o prompt de negociação, no qual indica que ela deve negociar as melhores condições de pagamento, respeitando as regras estabelecidas.<\/p><img class=\"kb-img\" src=\"attachment://69e8be3d-76a9-4fd7-a41d-f6f294e7b6f2/1789406507955_image.png\" alt=\"image.png\"><p><\/p>","edd":null,"c":[{"a":"João Pedro","e":null,"dt":"2026-09-15T13:51:49.301956+00:00","x":"A Clara utiliza exclusivamente o prompt Geral, afim de evitar confusão foram removidos os demais.","i":false}],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-09-14T17:32:43.459315+00:00","por":"João Pedro"},{"de":"fila_exec","para":"em_andamento","dt":"2026-09-14T17:46:30.506529+00:00","por":"João Pedro"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-15T13:52:55.233512+00:00","por":"João Pedro"},{"de":"em_validacao","para":"finalizado","dt":"2026-09-15T14:36:07.29649+00:00","por":"Solicitante (Quimera)"}]},"7950":{"t":"Velocidade de disparo | Torre de Controle","s":"finalizado","d":"<p>Bom dia Senhores(as),<\/p><p><\/p><p>Peço que verifiquem a velocidade de disparo pois considerando o que está configurado nas campanhas deveria disparar 20 por minuto porém não é o que vejo acontecendo acredito estar com alguma limitação em \"hardcode\".<\/p><p>Precisamos que dispare no mínimo 20 por canal por minuto (rcs,email,wpp.. etc )<\/p><p><\/p><img class=\"kb-img\" src=\"attachment://ca023fda-5566-46f7-af54-3f0f2ac99f11/1789474369840_image.png\" alt=\"image.png\"><p>Exemplo na print acima ações terminando às 17h é muito tarde.<\/p><p><\/p><p>Grato J<\/p>","edd":null,"c":[{"a":"Sistema/Negócio","e":null,"dt":"2026-09-22T18:11:27.072091+00:00","x":"[Solicitação de ajustes] Ainda possui algum limitador","i":false},{"a":"Sistema/Negócio","e":null,"dt":"2026-09-24T13:08:03.747174+00:00","x":"Hoje os disparos já foram aguardarei os de amanhã pra validar","i":false},{"a":"Sistema/Negócio","e":null,"dt":"2026-09-25T13:40:39.100308+00:00","x":"Vou finalizar porque não consegui ver a tempo mas ta disparando rapido, se eu ver qualquer incosistencia eu abro novamente","i":false}],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-09-15T12:34:45.552296+00:00","por":"João Vinícius"},{"de":"fila_exec","para":"em_andamento","dt":"2026-09-16T01:32:56.538958+00:00","por":"Leandro"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-22T02:28:15.527087+00:00","por":"Leandro"},{"de":"em_validacao","para":"em_andamento","dt":"2026-09-22T18:03:21.850846+00:00","por":"Leandro"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-22T18:04:01.853068+00:00","por":"Leandro"},{"de":"em_validacao","para":"em_andamento","dt":"2026-09-22T18:11:30.329764+00:00","por":"Sistema/Negócio"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-23T04:20:32.921138+00:00","por":"Leandro"},{"de":"em_validacao","para":"finalizado","dt":"2026-09-25T13:40:45.681718+00:00","por":"Sistema/Negócio"}]},"7970":{"t":"Falha das ações Org Blips | Torre de Controle","s":"finalizado","d":"<p>Bom dia Senhores(as),<\/p><img class=\"kb-img\" src=\"attachment://104b86fe-4753-4aaa-b811-4b31fb17078d/1789481702144_image.png\" alt=\"image.png\"><p><\/p><p>Grato J<\/p><p><\/p>","edd":null,"c":[],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-09-15T14:19:36.035864+00:00","por":"João Vinícius"},{"de":"fila_exec","para":"em_andamento","dt":"2026-09-15T14:22:00.446902+00:00","por":"Marcos"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-15T19:33:06.652936+00:00","por":"João Vinícius"},{"de":"em_validacao","para":"finalizado","dt":"2026-09-15T20:23:15.296542+00:00","por":"Sistema/Negócio"}]},"7972":{"t":"Configuração de canal WPP, RCS & Email| Torre de Controle","s":"finalizado","d":"<p>Bom dia Senhores(as),<\/p><p>Peço que retorne ao modelo anterior era melhor pra configuração e que corrija esses problemas informados na print<\/p><img class=\"kb-img\" src=\"attachment://3d2fc1e0-170e-4870-8847-6235528231e1/1789482026973_image.png\" alt=\"image.png\"><p><\/p><p>Grato J<\/p><p><\/p>","edd":null,"c":[{"a":"Marcos","e":null,"dt":"2026-09-15T19:35:50.870479+00:00","x":"Entregue e já em produção.\n\nOs dois impactos que você apontou no print estão corrigidos.\n\nOnde validar: Torre de Controle > Réguas de Cobrança > abra a régua > edite um passo de RCS > etapa \"Integração\" > aba \"Templates Locais\".\n\n1) Abra a lista de templates. Os 26 templates de RCS da Blips aparecem e a lista rola até o último. Antes ela parava por volta do sétimo e não havia como rolar — repare no seu print que a aba já dizia \"26\", mas a lista mostrava um punhado.\n2) Digite \"DIA C\" na busca. Ele aparece no topo. É justamente o template que foi criado no dia em que você abriu o chamado, e ele é o último dos 26 em ordem alfabética — por isso \"sumia\".\n3) Digite \"Serasa\". Os dois templates que falam de Serasa vêm nas primeiras posições.\n4) A mesma correção vale no Disparo: Disparos > canal RCS > card \"3. Conteúdo\" > bloco \"Template RCS (opcional)\".\n\nAchamos e corrigimos um terceiro ponto que você não relatou: a lista de variáveis do mapeamento de template Meta, na etapa \"Conteúdo\", tinha exatamente o mesmo corte e escondia as últimas categorias.\n\nO que não muda: o modelo de montagem em etapas continua como está. Você pediu para voltar ao formato anterior, e isso não está nesta entrega — o que fizemos foi corrigir os dois impactos dentro do formato novo. Se ainda quiser a volta do formato antigo, ou ajustes nele, abra como pedido separado que a gente avalia.\n\nUm ponto que pode parecer o mesmo problema e não é: template desativado não aparece nessa lista, mesmo aprovado pela Meta. Hoje há 6 templates de WhatsApp nessa situação. Isso se resolve em Torre de Controle > Templates, na ação \"Ativar\".\n\nPode repetir o teste com os mesmos templates.","i":false},{"a":"Sistema/Negócio","e":null,"dt":"2026-09-17T14:38:45.655754+00:00","x":"[Solicitação de ajustes] Ficou faltando retornar ao modelo de configuração anterior que era uma única tela e não em 4 passos/etapas.","i":false},{"a":"João Vinícius","e":null,"dt":"2026-09-17T14:54:43.812999+00:00","x":"Bom dia! Vamos seguir com esse modelo de etapas para torre, não apenas essa tela mudou como de configuração de campanhas e réguas também. Todos ajustes são priorizando o ui/ux da torre;","i":false}],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-09-15T14:24:20.610153+00:00","por":"João Vinícius"},{"de":"fila_exec","para":"em_andamento","dt":"2026-09-15T18:05:15.769933+00:00","por":"Marcos"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-15T19:35:56.139614+00:00","por":"Automático (Quimera)"},{"de":"em_validacao","para":"em_andamento","dt":"2026-09-17T14:38:49.08981+00:00","por":"Sistema/Negócio"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-17T14:54:56.307737+00:00","por":"João Vinícius"},{"de":"em_validacao","para":"finalizado","dt":"2026-09-17T16:24:57.138364+00:00","por":"Sistema/Negócio"}]},"7992":{"t":"Vincular Número Hyperflow","s":"finalizado","d":"Solicitação de reconexão de linha WhatsApp (coexistence) no Hyperflow.\n\n• Número: (34) 99944-3635\n• Nome (Hyperflow): Fernanda Pinheiro\n• E-mail do responsável: luiza.cotonhoto@blips.com.br\n• Departamento: Cobrança\n• Empresa: Blips\n\nSolicitado por: filipe.borges@blips.com.br\n\nLinha de Cobrança / Liquidação Financeira / Finza — aberta no time da Finza.\n\nAberta automaticamente pelo Monitor de Conexões (Hyperflow).\n\n---\n_Created via MCP (source: monitor-hyperflow)_","edd":null,"c":[],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-09-15T19:32:22.543478+00:00","por":"João Vinícius"},{"de":"fila_exec","para":"em_andamento","dt":"2026-09-15T20:42:53.625908+00:00","por":"João Pedro"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-16T18:36:37.070297+00:00","por":"João Pedro"},{"de":"em_validacao","para":"finalizado","dt":"2026-09-17T12:40:53.290382+00:00","por":"João Vinícius"}]},"8006":{"t":"Variável do botão de URL dinâmica do template Meta não tinha onde ser preenchida","s":"finalizado","d":"## O que foi feito\n\nUm template Meta aprovado pode ter um **botão de URL dinâmica** — o componente `BUTTONS` traz `url: \"https://app.finza.com.br/{{1}}\"` e só o final da URL é preenchido no envio. **A Torre não conseguia preencher esse valor em tela nenhuma.**\n\nAchado nosso ao olhar o template da org de Formalização; não havia ticket cobrindo. Implementado na branch `fix/IAF-7972-seletor-template-regua` (a mesma do #7972, que é outro defeito da mesma tela). **Ainda não está em produção**: o script de commit/PR está pronto e a release-alvo ainda não foi cortada — a `release/1.3.6` já subiu.\n\n## Causa\n\nToda derivação de variável de template Meta varria apenas o texto dos componentes:\n\n```\nfor (const comp of components) {\n  if (comp.text) { comp.text.matchAll(/\\{\\{(\\d+)\\}\\}/g) ... }\n}\n```\n\nA Meta guarda a variável do botão em `comp.buttons[i].url`, e o `text` do componente `BUTTONS` é `null`. A cadeia inteira caía junto:\n\n1. sem linha no mapeador, o operador não tinha onde preencher;\n2. a validação do passo não exigia, então o passo **salvava parecendo completo**;\n3. o mapa ia para o envio sem o parâmetro do botão;\n4. a prévia desenhava só o rótulo do botão — nada na tela dizia que ele era dinâmico.\n\nEsse laço estava copiado em **12 lugares** (variáveis, exemplos e semente do mapa, em 5 arquivos), incluindo o do próprio seletor de template, que semeia o mapa e por isso já nascia discordando do mapeador que ia lê-lo em seguida. Sobrou **um**: o canônico. O comentário dessa função já dizia, desde antes, que ela existia justamente para a tela e a validação não derivarem a lista duas vezes — a intenção estava certa e quatro telas a contornaram.\n\n## Evidência (prod, 15/09/2026)\n\n- Existe exatamente **um** template com botão dinâmico nas três orgs: `new_proposta_producao`, de `org_portal_formalizacao` (corpo com 5 variáveis + 1 botão `URL`). `org_blips` e `org_finza` não têm nenhum.\n- Os **dois** passos que usam esse template estão gravados com as cinco chaves do corpo e **nenhuma** de botão.\n- Essa org nunca disparou o template (1 ação, `Pendente`, `is_test: true`, de 10/09). Ou seja: é configuração impossível, não envio quebrado — não há histórico a reparar.\n\n## Mudanças\n\nContinua **um mapa gravado**. A variável do botão entra no mapa que já existe, com chave prefixada `button:<índice>` (0-based, o mesmo `index` da Cloud API, para quem monta o payload no orquestrador não subtrair 1). O `{{1}}` do botão é independente do `{{1}}` do corpo; usar o próximo número livre (`\"6\"`) faria o valor virar um sexto parâmetro de corpo e a Meta recusaria a mensagem inteira (erro 132000).\n\nComo o mapa continua sendo um só, **não há migration**: a chave de config, a coluna da ação e os quatro pontos de cópia em Edge Function ficam intactos. A separação acontece num **ponto único**, a montagem do payload no `send-message`: `template_vars` continua sendo só o corpo e `template_button_vars` só existe quando há variável de botão — então o payload de todo template **sem** botão dinâmico fica byte-idêntico, o que protege os fluxos de `org_blips` e `org_finza`. Os testes afirmam isso pela **ausência da chave**, não só do valor.\n\nA convenção da chave vive em módulo compartilhado com shim no frontend, pelo mesmo desenho das variáveis compostas do #6862: a tela **grava** a chave e o envio **lê** a chave; com duas implementações, divergir faria a variável sumir do payload sem erro em lugar nenhum.\n\n**Na tela:** a linha do botão é rotulada pelo nome do botão aprovado, com o início fixo da URL à esquerda do campo (a Meta só aceita o sufixo) e a prévia passou a mostrar a URL resolvida embaixo do botão. As **quatro** telas que usam o mapeador ganham isso de uma vez: passo de régua, Disparos, teste de integração e ação manual da carteira.\n\n31 arquivos, incluindo a Central de Docs (post de changelog, átomo novo, tópico e 5 guias de Negócio) e o guia humano de variáveis e templates.\n\n## Verificação\n\n- `npx tsc -b`: sem erros\n- `npx vitest run`: **3213 passed / 0 failed** (eram 3197)\n- `deno test` nos módulos novos: 11 passed / 0 failed\n- `npx eslint` nos arquivos tocados: limpo\n- `npm run build`: exit 0\n- `docs:validate` verde e `docs:drift` sem drift\n\nProva de que os testes pegam o defeito: desligando **só** a varredura dos botões, 5 testes ficam vermelhos — incluindo o que reproduz o mapa real do passo em produção e afirma que ele não é mais válido.\n\n## Fora de escopo\n\n**O elo final está fora do repo, e sem ele o botão não funciona.** A Torre passa a emitir `template_button_vars`, mas quem monta o payload da Cloud API é o fluxo do Hyperflow. O fluxo da org de Formalização (que é só dela — blips e finza usam outro) precisa mapeá-lo para o componente `button`/`sub_type: url`. Até isso acontecer o operador preenche e o parâmetro não viaja; e como a Meta recusa template com variável de botão sem o componente, o sintoma provável é **falha de envio**, não botão sem link.\n\n**Mudança de comportamento em passo já salvo.** A validação não mudou de código, mas mudou de efeito: os dois passos de Formalização deixam de ser salváveis até o botão ser mapeado — inclusive o que hoje está com as cinco do corpo corretas. É o conserto funcionando, mas alguém vai esbarrar nisso.\n\n**Nenhum guard novo no envio.** O `send-message` não recusa envio quando a variável de botão falta; quem barra é a tela. Validar a estrutura do template no envio é outro assunto.\n\n---\n_Created via MCP (source: mcp)_","edd":null,"c":[],"h":[{"de":"em_andamento","para":"em_validacao","dt":"2026-09-16T12:35:40.213+00:00","por":"João Vinícius"},{"de":"em_validacao","para":"finalizado","dt":"2026-09-16T12:35:44.241536+00:00","por":"João Vinícius"}]},"8043":{"t":"Correção de ortografia","s":"finalizado","d":"<p>Bom dia Senhores(as)<\/p><p><\/p><p>A palavra contrato está escrito incorreto:<\/p><p><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://conversas.hyperflow.global/all-chats/0409266665841\">https://conversas.hyperflow.global/all-chats/0409266665841<\/a><\/p><p><\/p><p>Grato J<\/p>","edd":null,"c":[],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-09-16T15:05:51.224873+00:00","por":"João Pedro"},{"de":"fila_exec","para":"em_andamento","dt":"2026-09-16T21:00:23.718239+00:00","por":"João Pedro"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-16T21:00:25.360813+00:00","por":"João Pedro"},{"de":"em_validacao","para":"finalizado","dt":"2026-09-17T13:10:20.948638+00:00","por":"João Vinícius"},{"de":"finalizado","para":"em_validacao","dt":"2026-09-17T14:24:37.660039+00:00","por":"João Vinícius"},{"de":"em_validacao","para":"finalizado","dt":"2026-09-17T20:33:53.363248+00:00","por":"Sistema/Negócio"}]},"8047":{"t":"Vincular Número Hyperflow","s":"finalizado","d":"Solicitação de reconexão de linha WhatsApp (coexistence) no Hyperflow.\n\n• Número: (34) 99732-2382\n• Nome (Hyperflow): Sabrina Ferreira | Finza\n• E-mail do responsável: sabrina.ferreira@finza.com.br\n• Departamento: Teste Filipe\n• Empresa: Finza\n\nSolicitado por: filipe.borges@blips.com.br\n\nLinha de Cobrança / Liquidação Financeira / Finza — aberta no time da Finza.\n\nAberta automaticamente pelo Monitor de Conexões (Hyperflow).\n\n---\n_Created via MCP (source: monitor-hyperflow)_","edd":null,"c":[],"h":[{"  ação <\/p><p><\/p><p>Grato J<\/p>","edd":null,"c":[{"a":"João Pedro","e":null,"dt":"2026-09-30T22:58:05.691822+00:00","x":"Agora toda ação envia a partir da torre para cliente EXTERNOS, vai gravar na torre se tiverem retorno e também vão anexar no rodapé do e-mail o ID da ação para que seja possível trazer o rastro desse disparo.","i":false}],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-09-18T12:36:47.753841+00:00","por":"João Vinícius"},{"de":"fila_exec","para":"em_andamento","dt":"2026-09-30T12:32:28.135369+00:00","por":"João Pedro"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-30T22:58:17.762858+00:00","por":"João Pedro"},{"de":"em_validacao","para":"finalizado","dt":"2026-10-05T09:00:02.955492+00:00","por":"Automático (Quimera)"}]},"8211":{"t":"Fallback Torre de Controle","s":"finalizado","d":"<p>Boa tarde Senhores(as),<\/p><p><\/p><p>Atualmente na torre de controle como exemplo a ação de whatsapp tem a mensagem de abertura, tem a mensagem pós resposta/interação do cliente. Porém caso o template da alguma falha ele aplica fallback e é um fallback fixo.<\/p><p>Com isto o envio que era pra dar falha não da mas ele não entrega com a mensagem configurada inicialmente e sim a do fallback. <\/p><p>Partindo desse contexto peço que seja criado uma coluna em ações que é Fallback no qual será Sim ou Não e também que seja criado um filtro nesse campo e uma analise % do que é fallback ou não do disparo.<\/p><p>Com isto saberei o que foi enviado de fato com a mensagem original ou com mensagem fallback independente do canal.<\/p><p><\/p><p>Grato J<\/p>","edd":null,"c":[],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-10-01T12:45:15.823545+00:00","por":"João Vinícius"},{"de":"fila_exec","para":"em_andamento","dt":"2026-10-05T14:52:21.085736+00:00","por":"Marcos"},{"de":"em_andamento","para":"em_validacao","dt":"2026-10-05T21:52:43.896028+00:00","por":"Marcos"},{"de":"em_validacao","para":"finalizado","dt":"2026-10-06T19:45:37.877588+00:00","por":"Sistema/Negócio"}]},"8215":{"t":"Novos tipos de mensagem | Torre de Controle & Hyper","s":"finalizado","d":"<p>Boa tarde Senhores(as),<\/p><p><\/p><p>Peço que avaliem e que possamos fazer uma call para inclusão de templates ou tipos de mensagem sendo elas:<br>Audio e imagem nas ferramentas que forem possíveis exemplo (wpp,rcs,email)<br>Intuito melhorar engajamento com o cliente.<\/p><p><\/p><p>Caso tenha outro tipo de mensagem possível a ser enviada peço que traga pra nossa pauta e que nos diga as possibilidades de audio e imagem pra melhor escoparmos a demanda.<\/p><p><\/p><p>Grato J<\/p>","edd":null,"c":[{"a":"Marcos","e":null,"dt":"2026-10-06T14:09:10.631496+00:00","x":"Marca a reunião no google, coloca o Dessimoni também","i":false},{"a":"Marcos","e":null,"dt":"2026-10-19T18:51:45.026021+00:00","x":"Entregue e já em produção.\n\nA Torre passou a mandar imagem e áudio junto com as mensagens. A equipe sobe os arquivos na própria Torre e escolhe qual vai em cada passo da régua, em cada Disparo ou em cada ação manual. O mesmo template pode sair com imagens e áudios diferentes conforme o passo (por exemplo, um áudio no D-3 e outro no D+5).\n\nPor enquanto está funcionando só na Blips. Assim que vocês validarem, levamos para a Finza.\n\nOnde validar (org Blips):\n- Torre de Controle > Disparos\n- Torre de Controle > Réguas > passo de WhatsApp ou RCS > fase \"Conteúdo\"\n- No cliente > \"Nova Ação\"\n- E-mail: editor do template > \"Editar visualmente\" > \"Links, imagens, áudio...\"\n\nEm cada campo há \"Enviar novo\" (sobe do computador) e \"Escolher da biblioteca\" (reaproveita o que a equipe já subiu).\n\nPara testar, criamos dois templates de WhatsApp no número da Blips, já aprovados pela Meta e disponíveis na Torre:\n- teste_8215_imagem: aviso de contrato com imagem no cabeçalho\n- teste_8215_audio: \"Temos uma mensagem em áudio sobre o seu contrato... Toque em 'Ouvir mensagem' para receber.\", com o botão \"Ouvir mensagem\"\n\nComo testar pela tela de Disparos (use um cliente de teste ou o seu próprio número):\n1) Torre de Controle > Disparos > escolha o cliente e uma integração de WhatsApp da Blips\n2) Imagem: escolha o template teste_8215_imagem. Vai aparecer o campo \"Imagem do cabeçalho\": clique em \"Enviar novo\" e suba um JPG ou PNG. A prévia mostra a imagem no topo da mensagem. Dispare: a mensagem chega com a imagem escolhida\n3) Áudio: escolha o template teste_8215_audio. Vai aparecer o campo \"Áudio após o clique\": suba um arquivo OGG. Dispare: chega a mensagem com o botão \"Ouvir mensagem\". Ao tocar no botão, o áudio chega na hora\n4) Sem escolher a imagem no template de imagem, o botão de disparar fica bloqueado, porque a Meta recusaria o envio\n5) RCS: escolha uma integração de RCS e um template RCS, e suba uma imagem: ela entra no lugar da imagem do card\n\nO que foi testado em 19/10, em produção, com um cliente de teste:\n1) teste_8215_imagem: o template chegou com a imagem escolhida no Disparo\n2) teste_8215_audio: chegou o template com o botão; ao tocar, chegou só o áudio. O atendimento normal só continuou depois que o cliente respondeu\n3) RCS com template: a imagem escolhida substitui a do card\n\nFormatos aceitos:\n- Imagem: JPG ou PNG, até 5 MB (até 2 MB no RCS)\n- Áudio no WhatsApp: OGG com codec Opus. No RCS e no e-mail: MP3. Até 16 MB\n\nO que não muda ou ainda não funciona:\n- Só a Blips por enquanto. Finza (e Ideal, se quiserem) depois da validação de vocês\n- Vídeo e documento ficaram fora desta entrega\n- E-mail não toca áudio dentro da mensagem. O áudio vai como um botão \"Ouvir mensagem\", que abre no navegador\n- RCS com áudio: a Torre já envia, mas o provedor de RCS está recusando o arquivo. Estamos tratando com o Hyperflow. Enquanto isso, a imagem no RCS funciona normalmente\n- No carrossel do RCS, cada card mantém a própria imagem\n\nADENDO - O QUE PRECISAMOS DE VOCÊS\n\n1) Os templates de WhatsApp que vão usar imagem ou áudio. Os dois de teste servem para validar, mas não são para uso com cliente. Cada template definitivo precisa ser criado e aprovado na Meta e configurado no fluxo, então nos passem os textos que querem e para quais números (Blips, Ideal, Finza).\n- Para imagem: o template precisa ser criado com cabeçalho de imagem\n- Para áudio: o template precisa ter um botão de resposta rápida\n\n2) O áudio no WhatsApp precisa de uma mensagem de ativação. A Meta não permite áudio dentro do template. O áudio só pode ser enviado depois que o cliente interage com a mensagem. Então o envio funciona assim:\n- A Torre manda um template de ativação, por exemplo: \"Olá, Maria! Temos uma mensagem em áudio sobre o seu contrato 12345. Toque em 'Ouvir mensagem' para receber.\" com o botão \"Ouvir mensagem\"\n- Quando o cliente toca no botão, o áudio chega na hora\n- Quem não tocar no botão não recebe o áudio\n- Um mesmo template pode ter imagem no cabeçalho e o botão de áudio, para mandar os dois","i":false}],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-10-06T13:09:16.66854+00:00","por":"João Vinícius"},{"de":"fila_exec","para":"em_andamento","dt":"2026-10-14T14:19:04.193868+00:00","por":"Marcos"},{"de":"em_andamento","para":"bloqueado","dt":"2026-10-16T12:39:58.96798+00:00","por":"Marcos"},{"de":"bloqueado","para":"em_andamento","dt":"2026-10-19T17:57:26.731859+00:00","por":"Marcos"},{"de":"em_andamento","para":"em_validacao","dt":"2026-10-19T18:46:14.366551+00:00","por":"Marcos"},{"de":"em_validacao","para":"finalizado","dt":"2026-10-22T09:00:02.894573+00:00","por":"Automático (Quimera)"}]},"8235":{"t":"Permitir copiar o contrato & n° nota | Torre de Controle","s":"finalizado","d":"<p>Bom dia Senhores(as),<\/p><p><\/p><p>Em gestão de carteira não conseguimos copiar a informação de contrato ou n° nota queremos conseguir clicar e copiar/selecionar.<\/p><img class=\"kb-img\" src=\"attachment://228f2415-ef95-41d9-af01-1ebf02935e16/1789738644912_image.png\" alt=\"image.png\"><p>Grato J<\/p>","edd":null,"c":[],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-09-21T12:38:01.221212+00:00","por":"João Vinícius"},{"de":"fila_exec","para":"em_andamento","dt":"2026-09-21T12:39:26.786646+00:00","por":"Leandro"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-22T02:28:21.870418+00:00","por":"Leandro"},{"de":"em_validacao","para":"finalizado","dt":"2026-09-22T16:31:03.460607+00:00","por":"Sistema/Negócio"}]},"8253":{"t":"Caso Reclame AQUI 43.105.268/0001-09 - 12611086","s":"finalizado","d":"<p>Boa tarde a todos,<\/p><p>A abertura desta demanda tem como objetivo formalizar a reclamação abaixo e solicitar uma análise e ajustes no atendimento da <strong>Valentina<\/strong>. <\/p><p><strong>Reclamação do cliente no Reclame Aqui:<\/strong><\/p><blockquote><p>\"Recentemente fiz uma compra com a Blips uma impressora de DTF financiado e solicitei a antecipação de duas parcelas. A parcela 48 é 47.<br>Paguei elas<br>Parcela 48 pago dia 11/08<br>Parcela 47 pago dia 12/08<br>Hoje dia 18/08/2026 ainda não foi dado baixa. Segundo a IA do whats app Valentina me disse que o prazo era de 2 dias.<br>Depois ontem dia 17 me disse que era de 1 dia útil.<br>O prazo já passou e nada de confirmar o pagamento.<br>Eu estou querendo antecipar mais parcelas para amortizar o juros mas queria confirmar esses pagamentos antes se deu tudo certo!<br>Aí antes o que era fácil contato pelo whats passava meu CNPJ para obter informações e antecipar as parcelas era tudo simples.<br>Depois que paguei essas antecipações e venho pedir informações dizem que não estão achando meu contrato pelo CNPJ. Como assim gente? Tem até histórico de conversa aqui como é que não acha?<br>Aí fica a palhaçada de pedir número de contrato número de sei lá mais o que. Pelo meu CNPJ sempre foi possível achar meu financiamento, qual o problema agora?<br>Quero que der baixa no meu pagamento, eu já mandei os comprovantes pelo whats app e nada!<br>Ninguém responde só uma IA<br>Quero antecipar outras parcelar e tô nessa luta!\"<\/p><\/blockquote><p><strong>Protocolo:<\/strong><br><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://conversas.hyperflow.global/all-chats/1808267030851\">https://conversas.hyperflow.global/all-chats/1808267030851<\/a><\/p><p><strong>Principais pontos identificados no atendimento:<\/strong><\/p><ul><li><p><strong>Repetição de mensagens da Valentina com questionamentos que não levavam a nenhuma conclusão<\/strong>, observada a partir de <strong>10/08/2026 às 11:27<\/strong>.<\/p><\/li><li><p><strong>Falha na localização do cliente pelo CNPJ<\/strong>, ocorrida em <strong>17/08/2026 às 12:14<\/strong>.<\/p><\/li><li><p><strong>Falta de clareza na condução do atendimento<\/strong>, deixando o cliente confuso sobre a situação dos pagamentos e os próximos passos.<\/p><\/li><\/ul><p>Solicito, por favor, a análise do atendimento e dos pontos acima, verificando a causa dos comportamentos e quais ajustes são necessários na Valentina para evitar a recorrência desses problemas.<\/p><p><\/p><p>Qualquer dúvida estou a disposição para o esclarecimento.<\/p>","edd":null,"c":[{"a":"João Pedro","e":null,"dt":"2026-10-02T15:13:01.458296+00:00","x":"Melhoria identificada durante a análise: localização de clientes pelo telefone (Valentina)\n\nHoje a Valentina busca o cliente na Torre pelo telefone com o 55 na frente (ex.: 5594996658097), mas os telefones estão gravados na Torre sem o 55 (ex.: 94996658097). Por isso a busca volta vazia mesmo para quem está cadastrado, e a Valentina começa a conversa sem saber quem é o cliente, pedindo CNPJ ou número de contrato.\n\nAjuste mínimo: no nó encontra contrato do workflow Valentina v2, trocar o parâmetro q pelo phone e enviar o telefone sem o 55, igual ao que a Esperanza já faz. É a troca de um único campo, sem mudança de lógica.\n\nImpacto esperado (clientes atendidos de 16/09 a 30/09):\n- hoje a Valentina encontra pelo telefone no máximo 3 de 215 clientes (1,4%);\n- com o ajuste, passa a encontrar até ~45 (~21%), que são todos os que estão na Torre.\n\nPara esses clientes, a conversa já começa com o CNPJ e a situação financeira em mãos, sem pedir dados que o cliente já forneceu.\n\nO que o ajuste não resolve: quem não está na Torre (161 de 215 no período, por exemplo contratos com a primeira parcela vencendo daqui a mais de 20 dias, como o caso desta demanda). Esses continuam dependendo do CPF/CNPJ informado pelo cliente.","i":true},{"a":"João Vinícius","e":null,"dt":"2026-10-02T15:41:42.99916+00:00","x":"Demanda cancelada após alinhamento com o time.\n\nAnalisamos o atendimento da Valentina com esse cliente. Na época do contato, o contrato ainda não estava desdobrado, então as parcelas ainda não existiam nas bases que a Valentina consulta. Mesmo assim, o cliente já pedia valores para antecipar parcelas. Sem acesso ao contrato, a Valentina não tinha como localizar o cliente nem confirmar se os pagamentos tinham sido baixados. Por isso pediu dados repetidamente e passou informações desencontradas. A baixa das parcelas pagas foi feita manualmente pelo Financeiro.\n\nDurante a análise, encontramos um ajuste simples que melhora a localização de clientes pelo telefone.","i":false}],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-09-18T17:06:29.985993+00:00","por":"João Vinícius"},{"de":"fila_exec","para":"em_andamento","dt":"2026-09-30T12:32:26.432349+00:00","por":"João Pedro"},{"de":"em_andamento","para":"finalizado","dt":"2026-10-02T15:41:56.353106+00:00","por":"João Vinícius"}]},"8312":{"t":"Vincular Número Hyperflow","s":"finalizado","d":"Solicitação de reconexão de linha WhatsApp (coexistence) no Hyperflow.\n\n• Número: (34) 9 9715-2078\n• Nome (Hyperflow): Luciano Borba\n• E-mail do responsável: luciano.goncalves@blips.com.br\n• Departamento: Liquidação Financeira\n• Empresa: Blips\n\nSolicitado por: lara.araujo@blips.com.br\n\nLinha de Cobrança / Liquidação Financeira / Finza — aberta no time da Finza.\n\nAberta automaticamente pelo Monitor de Conexões (Hyperflow).\n\n---\n_Created via MCP (source: monitor-hyperflow)_","edd":null,"c":[],"h" dt":"2026-09-21T12:56:37.226815+00:00","por":"João Vinícius"}]},"8351":{"t":"Valentina V2","s":"finalizado","d":"<p>Conforme planejado ao longo da semana passada, esta demanda tem o foco de transcrever a valentina e esperanza atualmente em código em um unico agente valentina; Segue o artefato objetivo:<br><br><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://claude.ai/artifact/G86h7rYqbW3WBquiUcvVHR?sk=RgEjNn3eLf0ad1dURwxaVA\">https://claude.ai/artifact/G86h7rYqbW3WBquiUcvVHR?sk=RgEjNn3eLf0ad1dURwxaVA<\/a><br><br>tecnologias auxiliares:<br><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://obs.blips-labs.com\">https://obs.blips-labs.com<\/a><br><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://litellm.blips-labs.com/ui/?login=success\">https://litellm.blips-labs.com/ui/?login=success<\/a><\/p>","edd":null,"c":[],"h":[{"de":"backlog","para":"fila_exec","dt":"2026-09-21T12:56:10.556458+00:00","por":"João Vinícius"},{"de":"fila_exec","para":"em_andamento","dt":"2026-10-05T02:19:10.631419+00:00","por":"Leandro"},{"de":"em_andamento","para":"bloqueado","dt":"2026-10-26T11:55:33.076011+00:00","por":"Leandro"},{"de":"bloqueado","para":"em_validacao","dt":"2026-10-27T11:13:06.614718+00:00","por":"Leandro"},{"de":"em_validacao","para":"finalizado","dt":"2026-10-28T12:34:31.427227+00:00","por":"João Vinícius"}]},"8416":{"t":"Canal não identificado no uso do gatilho nos números novos (Financeiro lll)","s":"finalizado","d":"<p>Primeiramente bom dia, <\/p><p>Como foi combinado anteriormente João Neto, segue abaixo evidência dos casos que aconteceram nos números novos do Financeiro:<br><br><\/p><img class=\"kb-img\" src=\"attachment://a7f9c35d-6d1f-4db6-a240-d2a74b0ffbb6/1790001091397_image.png\" alt=\"image.png\"><img class=\"kb-img\" src=\"attachment://a7f9c35d-6d1f-4db6-a240-d2a74b0ffbb6/1790001091397_image.png\" alt=\"image.png\"><p><\/p>","edd":null,"c":[{"a":"João Pedro","e":null,"dt":"2026-09-23T04:56:58.26134+00:00","x":"O que aconteceu:\nO gatilho de consulta de débitos identifica a marca do atendimento pelo número do canal do Hyperflow, através de um mapa fixo. Os 3 números novos do Financeiro III (Blips, Ideal e Finza) foram ligados sem entrar nesse mapa. Por isso, todo acionamento neles caía no aviso \"CANAL NÃO IDENTIFICADO\" e nada era enviado ao cliente.\n\n\nComo validar:\n1. Abrir um atendimento em cada um dos 3 números novos (Blips, Ideal e Finza Financeiro III) com um cliente que tenha parcela vencida na marca daquele número.\n2. Acionar o gatilho 2.1 - Busca de débitos em aberto até D+15.\n3. Esperado: o cliente recebe os blocos de parcelas vencidas da marca do número, e a nota do operador traz o detalhe completo. Não deve aparecer mais o aviso de canal não identificado.\n4. Contraprova: acionar o gatilho no número Finza III com um cliente que só tem dívida Blips ou Ideal. Esperado: o cliente não recebe nada e a nota do operador diz \"Cliente não possui parcelas VENCIDAS no canal FINZA\". O mesmo vale no sentido inverso.","i":false}],"h":[{"de":"backlog","para":"em_andamento","dt":"2026-09-21T16:57:58.836943+00:00","por":"João Pedro"},{"de":"em_andamento","para":"bloqueado","dt":"2026-09-21T20:56:09.785079+00:00","por":"João Pedro"},{"de":"bloqueado","para":"em_andamento","dt":"2026-09-21T20:56:12.054152+00:00","por":"João Pedro"},{"de":"em_andamento","para":"em_validacao","dt":"2026-09-23T04:57:01.795961+00:00","por":"João Pedro"},{"de":"em_validacao","para":"finalizado","dt":"2026-09-23T12:54:22.032407+00:00","por":"Solicitante (Quimera)"}]},"8431":{"t":"Vincular Número Hyperflow","s":"finalizado","d":"Solicitação de reconexão de linha WhatsApp (coexistence) no Hyperflow.\n\n• Número: +55 34 9944-3635\n• Nome (Hyperflow): Luiza Pacheco\n• E-mail do responsável: luiza.cotonhoto@blips.com.br\n• Departamento: Retirada de Equipamentos\n• Empresa: Blips\n\nSolicitado por: filipe.borges@blips.com.br\n\nAberta automaticamente pelo Monitor de Conexões (Hyperflow).\n\n---\n_Created via M
