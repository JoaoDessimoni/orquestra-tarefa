renato.costa@blips.com.br (org `blips`)\n\nAdicionar ao DESK: não\n\n**Cabeçalho:** ⚠️ Regularize Agora\n\n**Corpo:**\n> Olá. Identificamos que o seu contrato possui pendências em aberto que precisam de atenção imediata.\n> \n> Para evitar a continuidade de juros diários, bloqueios no equipamento ou o envio de restrições ao seu CNPJ, disponibilizamos a regularização expressa no Portal. O pagamento via PIX garante a baixa imediata no sistema.\n> \n> Acesse o link do botão abaixo agora mesmo e garanta a regularidade da sua operação de forma simples.\n\n**Botões:**\n- Link: \"Regularizar Débito 💳\" -> https://cobranca.finza.com.br/c/{{1}}\n  - link dinâmico: o final ({{1}}) é preenchido no envio; exemplo: https://cobranca.finza.com.br/c/AAAAAAAAAAAAAAAAAAAAAAexemploexemploexemplo\n\n---\n_Created via MCP (source: mcp)_","c":[{"a":"João Pedro","e":null,"dt":"2026-11-11T16:51:12.465809+00:00","x":"Reprovado na Torre por leandro.gontijo@blips.com.br.\n\nMotivo: **Decisão: NÃO APROVADO COMO UTILIDADE.**\n\nO template apresenta finalidade de cobrança relacionada a contrato existente, porém utiliza linguagem persuasiva e de urgência, além de mencionar possíveis consequências financeiras e operacionais sem identificar a pendência específica.\n\nConforme as diretrizes de categorização da Meta, mensagens de UTILIDADE devem ser não promocionais e claramente relacionadas a uma conta, serviço ou transação existente.\n\nSolicita-se reformulação do texto, priorizando informações contratuais objetivas e removendo expressões de incentivo à ação imediata e promessas de regularização expressa.","i":false}]},"12602":{"t":"Template WhatsApp: torre_tp_recuperacao_bloqueio","s":"finalizado","d":"Solicitação de template WhatsApp (HSM) aberta pela Torre de Controle.\n\n**Aprovar ou reprovar na Torre:** https://cobranca.finza.com.br/templates?tab=solicitacoes&request=5334003a-0952-4113-a5f4-80b62844b9e8\n\n- **Nome:** `torre_tp_recuperacao_bloqueio`\n- **Categoria:** Utilidade (`UTILITY`)\n- * role\" do Hyperflow antes do uso em régua/disparo._\n\n---\n_Created via MCP (source: mcp)_","c":[]},"12647":{"t":"Template WhatsApp: torre_tp_gen07_combinar_semlink","s":"finalizado","d":"Solicitação de template WhatsApp (HSM) aberta pela Torre de Controle.\n\n**Aprovar ou reprovar na Torre:** https://cobranca.finza.com.br/templates?tab=solicitacoes&request=61392944-83b0-42c1-80ab-0fe09d825127\n\n- **Nome:** `torre_tp_gen07_combinar_semlink`\n- **Categoria:** Utilidade (`UTILITY`)\n- **Idioma:** pt_BR\n- **WABAs-alvo:** Blips, Finza, Ideal\n- **Solicitante:** renato.costa@blips.com.br (org `blips`)\n\nAdicionar ao DESK: não\n\n**Corpo:**\n> Preciso combinar uma coisa com você. {{1}} Me responde por aqui ou escolha uma opção abaixo.\n\n**Exemplos das variáveis:**\n- {{1}} = Precisamos alinhar a devolução do equipamento do seu contrato.\n\n**Rodapé:** Time de Relacionamento\n\n**Botões:**\n- Resposta rápida: \"Quero resolver\"\n- Resposta rápida: \"Falar com atendente\"\n- Resposta rápida: \"Já resolvi\"\n\n_Botões de resposta rápida exigem os handles no fluxo \"Mensagem Cobrança - Torre de Controle\" do Hyperflow antes do uso em régua/disparo._\n\n---\n_Created via MCP (source: mcp)_","c":[]},"12649":{"t":"Telefone & Email inativo | Torre de Controle","s":"em_validacao","d":"<p>Boa tarde Senhores(as),</p><p></p><p>Peço apoio no seguinte, será necessário ajustar em todas fontes de dados da torre de controle pra evitar que isso ocorra:</p><p></p><p>Onde está a informação: na tabela de contratos do Módulo Financeiro (bronze_mongodb_<a target=\"_blank\" rel=\"noopener noreferrer\" href=\"http://moduloFinanceiro.deals\">moduloFinanceiro.deals</a>), na lista de contatos do cliente, customer.contacts. Cada contato traz:</p><p>- type: \"Telefone\", \"Celular\" ou \"E-mail\"</p><p>- value: o número ou o e-mail</p><p>- status: \"Ativo\" ou \"Inativo\" (é esta a coluna que diz se o contato vale)</p><p>- deactivated_at: data em que foi desativado</p><p>O problema:</p><p>- Telefone: a consulta pega o telefone de <a target=\"_blank\" rel=\"noopener noreferrer\" href=\"http://negotiation.contractor.business\">negotiation.contractor.business</a>_data.cellphone, da Plataforma. A Plataforma não sabe que o número foi desativado no Módulo.</p><p>- E-mail: a consulta pega o primeiro e-mail de customer.contacts sem olhar o status. Pode sair um e-mail inativo.</p><p>Como filtrar:</p><p>1. Telefone: comparar o celular da Plataforma com os telefones de customer.contacts, só pelos dígitos e pelos 8 finais. O Módulo grava o mesmo número com ou sem +55, com ou sem espaço.</p><p>   - Se o número aparece só com status = 'Inativo', não usar. No lugar, usar o telefone com status = 'Ativo' mais recente (maior created_at).</p><p>   - Se o mesmo número também aparece como \"Ativo\" num registro em outro formato, mantém. O Módulo inativa o registro antigo e recadastra o número quando alguém edita o contato.</p><p>2. E-mail: considerar só type = 'E-mail' com status = 'Ativo', pegando o mais recente por created_at.</p><p>3. status vazio deve contar como \"Ativo\". Hoje não há nenhum caso, mas protege registros antigos.</p><p>Tamanho hoje: 8 contratos (49 títulos) com celular inativo, todos com outro telefone ativo no Módulo, e 2 contratos com e-mail inativo.</p><p></p><p></p><p>Grato J</p>","c":[]},"12747":{"t":"Vincular Número Hyperflow","s":"finalizado","d":"Solicitação de reconexão de linha WhatsApp (coexistence) no Hyperflow.\n\n• Número: (34) 9 9936-4829\n• Nome (Hyperflow): Juliane Oliveira\n• E-mail do responsável: juliane.oliveira@blips.com.br\n• Departamento: Cobrança - 61 a 90 dias\n• Empresa: Blips\n\nSolicitado por: filipe.borges@blips.com.br\n\nCobrança / Liquidação Financeira / Retirada de Equipamentos / Finza — aberta no time da Finza.\n\nAberta automaticamente pelo Monitor de Conexões (Hyperflow).\n\n---\n_Created via MCP (source: monitor-hyperflow)_","c":[]},"12840":{"t":"Transferência Hyper -Jurídico Finza e Blips ","s":"cancelado","d":"<p>Bom dia!</p><p>Solicito a habilitação da funcionalidade de transferência de casos no HYPER entre os setores <strong>Jurídico Finza e Jurídico Blips</strong>, permitindo a movimentação em ambos os sentidos.</p><p>A necessidade é possibilitar a transferência dos casos entre as duas áreas, conforme a demanda operacional.</p>","c":[{"a":"João Vinícius","e":null,"dt":"2026-11-11T19:54:12.08219+00:00","i":false,"x":"Boa tarde @Sara Clara Teixeira ! Tudo bem? Sobre a demanda a cima não é possível fazer transferência entre organizações do hyperflow, como são contas diferentes o juridico blips e juridico finza infelizmente não há forma por enquanto; Havíamos solicitado essa funcionalidade a um tempo atrás mas segundo o hyper nãos será possível;"}]},"12844":{"t":"Agendamento Disparos","s":"fila_exec","d":"<p>Bom dia Senhores(as),</p><p></p><p>Na aba disparos não tem a ação de agendar o disparo:</p><img class=\"kb-img\" src=\"attachment://1eb0e4ef-d066-4905-8d6f-434937015d1b/1794397792427_image.png\" alt=\"image.png\"><p></p><p>Grato J</p>","c":[]},"12984":{"t":"Testes e validação Valentina em Stg","s":"em_andamento","d":"<p>Testes de validação do agente Valentina que esta em stg, testes de ferramentas, respostas, prompt, etc.</p>","c":[]},"13003":{"t":"Hyperflow Finza: replicar imagem, áudio e disparo por parcela que já funcionam na Blips","s":"em_andamento","d":"<p>Na Torre, imagem/áudio (8215) e disparo por parcela com botão de pagamento (8609/12188) já valem para todas as orgs. O que ficou só na Blips foi a parte de fora da Torre: flows do Hyperflow, templates na Meta e corpo das integrações.</p><p><strong>Situação da Finza em prod (12/11):</strong> 0 ações com imagem/áudio e 0 WhatsApp por parcela nos últimos 40 dias; nenhuma das 16 integrações WhatsApp tem <code>title_current_value_decimal</code> no corpo (Blips: 16 de 16); <code>torre_tp_parcela_pagamento_1</code> já aprovado e sincronizado.</p><p><strong>Escopo:</strong></p><ul><li>Flow WhatsApp da Finza: repassar <code>media_url</code>/<code>audio_url</code>, nó de template com imagem no cabeçalho, ramo do áudio após o botão, ramo do <code>torre_tp_parcela_pagamento_1</code> (cartão de pagamento).</li><li>Integrações WhatsApp da Finza: acrescentar <code>title_current_value_decimal</code>.</li><li>Templates de imagem e áudio na WABA da Finza.</li><li>Teste ponta a ponta em telefone de teste.</li></ul><p>Fora: áudio no RCS (provedor recusa também na Blips).</p>\n\n---\n_Created via MCP (source: mcp)_","c":[]}}</script>
<script type="application/json" id="qmig">
{"dates":{"10717":"2026-11-13","10894":"2026-11-18","10908":"2026-11-18","12009":"2026-11-13","12239":"2026-11-18","12266":"2026-11-18","12357":"2026-11-20","12372":"2026-11-20","12530":"2026-11-13","12549":"2026-11-13","12588":"2026-11-13","12600":"2026-11-13","12601":"2026-11-13","12602":"2026-11-13","12638":"2026-11-13","12641":"2026-11-13","12642":"2026-11-13","12643":"2026-11-13","12644":"2026-11-13","12645":"2026-11-13","12646":"2026-11-13","12647":"2026-11-13","12649":"2026-11-18","12984":"2026-11-13"},"add":[{"id":"Q8442","key":8442,"frente":"torre","titulo":"Torre de Controle — negativar CPF de avalista, além do CNPJ do contrato","desc":"<p><strong>O que preciso</strong></p><p>Hoje a Torre negativa apenas o documento do contato vinculado ao contrato — na prática, o CNPJ da empresa. Quando a CCB (FINZA) tem avalista qualificado, esse CPF também é parte obrigada e deveria entrar na negativação.</p><p>Pedido: incluir o CPF do avalista como parte negativável nos contratos em que existir essa qualificação.</p><p><strong>Regra de negócio</strong></p><p>Negativar o avalista quando:</p><ol><li><p>a CCB do contrato tiver signatário com qualificação de <strong>avalista</strong>, e</p></li><li><p>esse avalista tiver <strong>assinatura registrada</strong> (não basta estar cadastrado no pedido), e</p></li><li><p>o contrato atingir o mesmo gatilho que hoje dispara a negativação do CNPJ.</p></li></ol><p>A negativação do avalista acompanha a do contrato: mesma régua, mesmo gatilho, e a reversão de uma reverte a outra.</p><p><strong>Fonte do dado</strong></p><p>Projeto <code>finza-prod-481500</code>, dataset <code>silver</code>:</p><ul><li><p><code>silver_signature_request</code> — pedido de assinatura da CCB (<code>origin_ref</code> = <code>silver_proposal.public_id</code>)</p></li><li><p><code>silver_signature_request_signer</code> — signatários; <code>title = 'Avalista'</code>, <code>document_number</code> = CPF, <code>signed_at</code> = data da assinatura</p></li></ul><p>Ponto de atenção: <code>title</code> só é preenchido a partir de ago/2026.<br><br><strong>O que provavelmente muda na Torre</strong></p><p><code>org_finza_contacts</code> tem um único <code>document</code> por contato e não existe entidade de coobrigado. Então o trabalho deve envolver três frentes:</p><ol><li><p>ingestão do avalista a partir das tabelas de assinatura</p></li><li><p>vínculo contrato → avalista (novo relacionamento ou contato secundário)</p></li><li><p>ajuste da regra de negativação para acionar os dois documentos</p></li></ol><p>A modelagem fica a critério de vocês — só sinalizo para dimensionar o esforço.</p><p><strong>Critério de aceite</strong></p><p>Um contrato com avalista assinado, ao atingir o gatilho, gera registro de negativação para o CNPJ <strong>e</strong> para o CPF do avalista, com reversão espelhada.</p>","qs":"backlog_futuro","tipo":"melhoria","dev":null,"sp":null,"fp":null,"df":"quimera","ord":9000},{"id":"Q10717","key":10717,"frente":"juridico","titulo":"Demonstrativo de Débito CCB | NOTIFICAÇÕES","desc":"<p>Prezados,</p><p>Preciso concluir a estruturação do Kit de Ajuizamento para ações de Busca e Apreensão e Execução de Cédula de Crédito Bancário – CCB.</p><p>Esse kit consiste em um conjunto de documentos que serão reunidos pela Lívia – IA Jurídico, de modo que o material seja entregue de forma completa e pronta para o ajuizamento. Quero implementar essa mesma possibilidade também nos casos da FINZA.</p><p>Hoje, já temos:</p><p>Cédula de Crédito Bancário – CCB: aqui, preciso verificar se o sistema da Celcoin possui API que permita à Lívia – IA Jurídico acessar e buscar a CCB diretamente no sistema. Isso é necessário para que ela consiga montar o kit de forma automatizada;</p><p>Notificação extrajudicial via AR: automação pronta;</p><p>Notificação por e-mail: automação pronta.</p><p>Permanecem pendentes:</p><p>Demonstrativo atualizado do débito: precisamos desenvolver um documento específico, de acordo com as condições previstas na CCB e no respectivo CET. Esse demonstrativo também é importante para o próprio usuário, que, ao acessar a plataforma, deverá conseguir visualizar a evolução da dívida.</p><p>O demonstrativo deverá apresentar de forma clara a evolução do débito, incluindo o vencimento antecipado, além dos juros remuneratórios, juros de mora, multa e demais encargos contratuais aplicáveis.</p><p>Já temos modelos semelhantes utilizados na BLIPS e na IDEAL e, se necessário, posso disponibilizá-los como referência. No entanto, neste caso, precisaremos desenvolver um modelo específico, pois se trata de uma Cédula de Crédito Bancário.</p><p>Também precisamos padronizar os disparos dessas notificações e o arquivamento dos respectivos comprovantes, para que o jurídico receba o kit completo no momento do ajuizamento.</p><p>A ideia é garantir um fluxo mais seguro, ágil e padronizado para a recuperação judicial do crédito.</p>","qs":"bloqueado","tipo":"melhoria","dev":"Marcos","sp":5,"fp":"2026-11-13","df":"quimera","ord":9001},{"id":"Q10894","key":10894,"frente":"agentes","titulo":"Valentina V2 — Métricas exclusivas do painel (base comum, SAC e cobrança)","desc":"**Descrição Refinada**\n\nAcompanha o #8351 (Valentina V2). Com a fusão da Valentina e da Esperanza num agente único, o painel da Valentina na Torre de Controle (Agente IA › Métricas) precisa ser refeito. O painel atual mede tráfego (mensagens e protocolos), não resultado. Esta demanda implementa as métricas exclusivas da Valentina unificada: 23 indicadores, sendo 11 comuns, 6 de SAC e 6 de cobrança (herdadas da Esperanza).\n\nGuia completo de implementação (fórmulas, gráficos, casos de borda, pré-requisitos e critério de pronto de cada passo):\nhttps://claude.ai/artifact/7JauWgdG7mpE1TCzTLyWbz?sk=MRaZ6qPmoar3yELR-XuzJg\n\nMétricas — Base comum (passo 1B, parametrizadas por agente_id e reaproveitadas pela Clara depois):\n- C-00 — Tentativas e taxa de retorno\n- C-01 — Volume atendido\n- C-02 — Taxa de contenção\n- C-03 — Desfecho do atendimento (indicador-mestre da base)\n- C-04 — Transbordo × Transferência\n- C-05 — Motivos de transferência\n- C-06 — Cobertura de classificação\n- C-07 — Alcance → resposta\n- C-08 — Status das tentativas (saúde da base)\n- C-09 — Chamadas entre agentes (A2A)\n- C-10 — Custo do agente (por tentativa, por atendimento e por real recuperado)\n\nMétricas — SAC (passo 1C):\n- VAL-01 — Resolução no primeiro contato (indicador-mestre do SAC)\n- VAL-02 — Assuntos atendidos\n- VAL-03 — Contenção por assunto\n- VAL-04 — Tempo de primeira resposta (mediana e P90)\n- VAL-05 — Índice de atrito (com cobertura)\n- VAL-06 — Reincidência em 7 dias\n\nMétricas — Cobrança, ex-Esperanza (passo 1D):\n- ESP-01 — Valor recuperado pela IA (indicador-mestre da cobrança)\n- ESP-02 — Atribuição da recuperação (IA, assistido, humano, espontâneo)\n- ESP-03 — Taxa de recuperação da base contatada\n- ESP-04 — Curva de recência do pagamento\n- ESP-05 — Conversão do funil de cobrança\n- ESP-06 — Recuperação por faixa de atraso\n\nRegra de atribuição da cobrança: janela de recência de 15 dias com atribuição ao último toque. Cada pagamento recebe uma única classificação, e as quatro classes somam 100% do valor recuperado.\n\nEscopo:\n- Passo 0 — Fundação de dados: PR-01 (log de tentativas com status do canal), PR-04 (tag única de pedido de humano), PR-05 (estado \"Sem retorno do cliente\"), PR-09 (carimbos de entrega e de primeira resposta), PR-12 (nome do solicitante A2A normalizado), PR-13 (grão automático do eixo: diário até 60 dias, mensal acima).\n- Passo 1A — Fusão no modelo de métricas: tipo único para transferencia_por_solicitacao com de-para datado (PR-03), catálogo de motivos unificado, corte por domínio SAC × Cobrança, recorte de organizações e mês da fusão registrado como quebra de série.\n- Passo 1B — Base comum C-00 a C-10, com custo consolidado do agente (PR-11).\n- Passo 1C — Bloco SAC VAL-01 a VAL-06, com uma intenção principal por protocolo (PR-10).\n- Passo 1D — Bloco Cobrança ESP-01 a ESP-06, com contrato/CPF e canal registrados no protocolo (PR-06) e base de pagamentos exposta (PR-07).\n- Sair do painel: Acurácia do atendimento (substituída por C-02 e C-03). Sentimento em três fatias vira VAL-05, ranking de tags vira C-05 e a conversão da corte observada vira ESP-05.\n\n**Observação**\n\n- Depende do #8351. A fusão precisa estar definida antes do passo 1A: catálogo de tags, recorte de organizações e regra de histórico.\n- É o recorte da Valentina dentro do #7562 (Escopo Métricas IA | Torre de Controle). O painel da Clara (Onda 2) fica fora desta demanda.\n- O bloco de cobrança é o de maior risco. Sem PR-06 e PR-07 não existe nenhuma métrica de recuperação: a conversa não se liga ao dinheiro.\n- Decisões da fusão ainda a confirmar: corte obrigatório por domínio na base comum; histórico da Esperanza visível com marca de quebra em C-04, C-05 e C-09; chamadas Valentina ↔ Esperanza saindo do C-09; recorte de organizações (a Esperanza operava em Blips e Finza, a Valentina só em Finza), que deve ser decidido antes do passo 1B; rateio de custo por domínio para o custo por real recuperado.\n- Os gráficos do guia são maquetes com dados ilustrativos. Eles definem forma e grão, não valor.\n- Um passo só começa quando o critério de pronto do anterior estiver cumprido.\n\n**Objetivo**\n\nPainel da Valentina unificada no ar com os 23 indicadores. Todo card tem eixo de tempo e fórmula de contrato, a Acurácia sai do painel e o valor recuperado pela IA (ESP-01) é publicado como indicador-mestre da cobrança.","qs":"bloqueado","tipo":"melhoria","dev":"Leandro","sp":13,"fp":"2026-11-18","df":"quimera","ord":9002},{"id":"Q10908","key":10908,"frente":"juridico","titulo":"Lívia V2 — Refatorar o agente Lívia na nova stack (Agno + Langfuse)","desc":"**Descrição Refinada**\n\nMesma refatoração do #8351 (Valentina V2), agora para a Lívia, a IA do Jurídico Finza. A Lívia apoia os analistas da operação em temas jurídicos e de distrato: liminares deferidas, contato com técnicos, abertura de OS e kits de documentos jurídicos. Esta demanda reescreve a Lívia em código na nova stack do time: Python + FastAPI + Agno no agente, Langfuse na observabilidade e LiteLLM como gateway de modelos. É o mesmo padrão validado na POC (#8494) e aplicado na Valentina V2.\n\nTecnologias auxiliares:\nhttps://obs.blips-labs.com\nhttps://litellm.blips-labs.com\n\nGuia de métricas (base comum):\nhttps://claude.ai/artifact/7JauWgdG7mpE1TCzTLyWbz?sk=MRaZ6qPmoar3yELR-XuzJg\n\nEscopo:\n- Discovery da implementação atual: onde a Lívia roda, prompts, tools, canal e integrações (Bitrix, Hyperflow, sistema do tribunal). Registrar o resultado no card.\n- Transcrever para Agno sem mudar regra de negócio na migração. O modelo conversa; o backend controla permissões, regras, repetição de operação e registro.\n- Preservar a regra central: a Lívia é facilitadora, e a decisão jurídica é sempre humana.\n- Incorporar os fluxos em andamento no mesmo agente: Kit Preventivo (#6871) e Kit de Ajuizamento / Demonstrativo de Débito CCB (#10717).\n- Telemetria no Langfuse (traces e custo por conversa) e modelos via LiteLLM.\n- Golden set e testes de regressão com casos reais do Jurídico, antes da virada.\n- Virada controlada: piloto antes de desligar a versão atual.\n- Métricas: ligar a base comum C-00 a C-10 do #10894 no agente_id da Lívia e definir com o Jurídico as métricas próprias da Lívia, que não estão no guia.\n\n**Observação**\n\n- A Lívia é o agente menos documentado do squad: não há registro consolidado de onde ela roda nem métricas. O discovery é o primeiro entregável e pode mudar o tamanho desta demanda.\n- #6871 e #10717 estão bloqueados aguardando o Jurídico e mexem no mesmo agente. Decidir se entram direto na V2 ou no fluxo atual, para não desenvolver duas vezes.\n- O público da Lívia é interno (analistas), não o cliente final. Parte da base comum (C-00 tentativas, C-07 alcance, C-08 saúde da base) pode não se aplicar. Validar quais indicadores comuns fazem sentido.\n- No roadmap de 22/04, Distrato e Retirada de Equipamentos viraram fluxos na Torre com prompts por régua, não agentes separados. Confirmar a fronteira entre a Lívia e esses fluxos antes de fechar o escopo.\n- Depende do padrão consolidado na Valentina V2 (#8351) e da base comum de métricas do #10894.\n\n**Objetivo**\n\nLívia em produção na stack Agno + Langfuse, com comportamento equivalente ao atual, implementação documentada e painel com a base comum aplicável mais as métricas próprias acordadas com o Jurídico.","qs":"bloqueado","tipo":"melhoria","dev":"Marcos","sp":8,"fp":"2026-11-18","df":"quimera","ord":9003},{"id":"Q12009","key":12009,"frente":"hyperflow","titulo":"Flow Cobrança","desc":"<p>Olá, pessoal! Boa tarde!</p><p><br>Espero que estejam bem!<br><br>Venho formalizar o modelo de autoatendimento de cobrança no WhatsApp Flows, desenhado pela Operação e já validado com a gerência. A ideia foi construir um fluxo pensado em duas frentes ao mesmo tempo: a experiência do cliente e as necessidades da Operação. Abaixo deixo o contexto, o que está sendo entregue e os próximos passos.<br><br></p><p> OBJETIVO<br>Hoje boa parte do contato de cobrança depende do time para tarefas que o cliente consegue resolver sozinho. Com o Flow, o cliente resolve o financeiro sem sair do WhatsApp:<br><br></p><p> Pagar uma parcela por vez, com Pix (QR Code e copia e cola), boleto ou cartão (link do QUITA+)<br></p><p> Informar um pagamento que ainda não apareceu, com comprovante obrigatório<br></p><p> Pedir ajuda, com assunto e relato, já direcionado à fila certa<br></p><p> Solicitar condições especiais (reparcelamento ou renegociação), só para as carteiras elegíveis: FIDC Kanastra-Votorantim, FIDC Alpe, carteira própria Blips e carteira própria Ideal, sem renegociação ativa e sem reparcelamento<br><br></p><p> GANHOS PARA A OPERAÇÃO<br>- Todo atendimento chega tabulado: fila, assunto, relato, contrato, parcela, motivo do atraso e tela de origem<br>- Dúvida sobre a cobrança vai para o N2 (IA); os demais assuntos vão para o N3 (analistas de cobrança)<br>- O motivo do atraso passa a ser coletado em toda parcela vencida, gerando dados para a régua e para a gestão da carteira<br>- Pix e boleto separados, para medirmos a preferência dos clientes<br><br>O desenho segue as regras da Meta para WhatsApp Flows: 6 telas e 10 ligações entre elas, que é o máximo permitido. O fluxograma abaixo mostra todos os caminhos:<br><br></p><p><br><br></p><p> MATERIAL ENTREGUE<br>1. Fluxograma com todos os caminhos (acima)<br>2. Simulador navegável:&nbsp;<a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://claude.ai/artifact/1aKQmFaWgwwGHBep5b4BkY?sk=bsOVGvkwMS1DLmkcceqsTQ#play-15dd8cd198dd\">https://claude.ai/artifact/1aKQmFaWgwwGHBep5b4BkY?sk=bsOVGvkwMS1DLmkcceqsTQ#play-15dd8cd198dd</a>&nbsp; — mostra as telas como o cliente verá, com dados fictícios, nas visões Playground, Tree e Diagram<br>3. Arquivo do Flow pronto para o Flow Builder: flow_cobranca.json (dentro do simulador)<br>4. Documento técnico (ARQUITETURA_<a target=\"_blank\" rel=\"noopener noreferrer\" href=\"http://FLOWS.md\">FLOWS.md</a>): rotas, dados que o endpoint precisa enviar, integrações e pontos a validar<br>5. Histórico de todas as decisões (<a target=\"_blank\" rel=\"noopener noreferrer\" href=\"http://CHANGELOG.md\">CHANGELOG.md</a>), para facilitar a rastreabilidade<br><br></p><p> O QUE PRECISAMOS DE VALIDAÇÃO<br>1. Validar o flow_cobranca.json no Flow Builder da Meta, principalmente os 3 pontos do documento técnico (o principal: confirmar se avisos que voltam para a mesma tela contam como ligação)<br>2. Endpoint: gerar Pix, boleto e link de cartão do QUITA+ em tempo real; consultar a baixa do pagamento; informar a carteira do contrato e os indicadores de renegociação e reparcelamento; enviar os itens das notas de suprimentos<br>3. Pix no chat: começar enviando o código como mensagem de texto e, numa segunda etapa, migrar para a mensagem de cobrança da Meta com o botão \"Copiar código Pix\" e atualização de status<br>4. Tabulação e direcionamento N2/N3 no Blip<br><br></p><p> PRAZO<br>Peço, por gentileza, que nos retornem com o prazo estimado para a implantação, considerando a validação no Flow Builder e as integrações acima. Se algum ponto não for viável, me sinalizem para ajustarmos juntos antes do desenvolvimento.<br><br></p><p> PRÓXIMOS PASSOS<br>Com o Flow de cobrança encaminhado, a Operação segue para o desenho dos Flows de formalização e de SAC, no mesmo modelo: desenho, validação com a gerência e entrega do material para vocês.<br><br>Fico à disposição para apresentar o simulador e tirar qualquer dúvida. Contem comigo!</p>","qs":"em_andamento","tipo":"melhoria","dev":"João Pedro","sp":5,"fp":"2026-11-13","df":"quimera","ord":9004},{"id":"Q12239","key":12239,"frente":"hyperflow","titulo":"Ligações Hyperflow V2 - Finza 2#10013","desc":"<p>Boa tarde Senhores(as),</p><p></p><ul><li><p>Quando não atendemos a ligação não está gerando protocolo no departamento de origem.</p></li><li><p>Entre a consulta dos dados do cliente, verificação jurídica e afins não está com som de fundo ficando mudo.</p></li><li><p>Ligação não está tocando para todos agentes disponíveis do departamento antes de transbordar para o próximo departamento.</p></li><li><p>Erro: \"A telefonia não conseguiu alcançar o softphone do agente (500)\".</p></li><li><p>Acesso completo ao banco de dados que informaram disponibilizar.</p></li><li><p>Atendente disponível e não toca pra ele, fica \"travado\".</p></li><li><p>Cliente com protocolo em aberto está com delay pra tocar no Hyper do atendente de 8seg. Além de primeiro aparecer um pop simples e depois aparecer o novo feito pelo Hyper junto com a música de ring pro atendente.</p></li><li><p>Ligação ativa manual pela central de ligações não está dando certo apresentando o erro \" Nenhuma rota de saída atende este número\".</p></li><li><p>Telefone com protocolo aberto passou pela URA de dígitos não tocando pro agente no qual estava com protocolo aberto e disponível.</p></li><li><p>Algumas vezes ao ligar pro número da Finza no whatsapp ele não toca ou toca só 1x e da não atendida como se não estivesse configurado a URA.</p></li></ul><p></p><p>Acabou os créditos pra continuar os testes ficou pendente testar se:</p><ul><li><p>Cliente com protocolo aberto no telefone X ligar no telefone Y se toca, e onde toca.</p></li><li><p>Cliente com protocolo em aberto caso não atendido pelo atendente qual comportamento? Aplica o rodizio normalmente?</p></li><li><p>Cliente com protocolo em aberto e o atendente offline qual comportamento?</p></li></ul><p></p><p>Grato J</p>","qs":"fila_exec","tipo":"melhoria","dev":"João Pedro","sp":5,"fp":"2026-11-18","df":"quimera","ord":9005},{"id":"Q12266","key":12266,"frente":"estrategica","titulo":"Mapa de Áreas Finza","desc":"<p><strong>Descrição Refinada</strong></p><p>O squad de IA &amp; Automação vai mapear todas as áreas da Finza para saber onde está o trabalho manual e quais áreas são clientes potenciais do squad. Esta demanda cobre a primeira etapa: a base de áreas e a estrutura do mapa pronta para receber as entrevistas.</p><p>O artefato atual (Mapa de áreas Finza) já tem áreas, pessoas, situação do levantamento e cadastro de automações. Falta completar a base, a carência, o sentimento e o roteiro de entrevista.</p><p>Escopo:</p><ul><li><p>Completar a base de áreas além do cadastro do Hyperflow, incluindo as áreas sem departamento no Hyperflow. Para cada área: gestor ou ponto focal e número de pessoas.</p></li><li><p>Limpar a base: tirar ou separar registros de teste, filas de bot (\"IA - …\"), \"Erro\" e \"Todos\".</p></li><li><p>Registrar as automações e IAs que já atendem cada área. Levar a contagem por área para a visão geral.</p></li><li><p>Criar a ficha de entrevista por área, para preencher na conversa: objetivo da área, responsabilidades, principais processos (frequência, volume, tempo gasto, se é manual), sistemas usados, dores, data da entrevista e entrevistador.</p></li><li><p>Criar o campo de sentimento da área, com duas notas de 1 a 5 e uma frase em destaque:</p><ul><li><p>quanto o trabalho manual pesa hoje;</p></li><li><p>como a área vê o squad de IA (não conhece, conhece ou já foi atendida, com a satisfação).</p></li></ul></li><li><p>Criar o índice de carência de automação a partir de volume manual, repetição, número de pessoas, automação existente e sentimento.</p></li><li><p>Classificar cada área como cliente prioritário, cliente potencial ou não-cliente no momento.</p></li></ul><p><strong>Observação</strong></p><ul><li><p>O cadastro do Hyperflow não é organograma. A lista final de áreas precisa ser validada com o gestor ou o RH, a confirmar.</p></li><li><p>O sentimento e a carência são registrados por área, nunca por pessoa. Uma nota sobre um colaborador nomeado vira avaliação individual e trava as entrevistas.</p></li><li><p>Os pesos do índice de carência são uma proposta inicial. Recalibrar depois das 3 primeiras entrevistas.</p></li><li><p>Hoje os dados ficam só no navegador de quem edita. Sem armazenamento compartilhado, cada entrevistador gera uma versão diferente do mapa.</p></li><li><p>Fora do escopo: realizar as entrevistas e propor automações por área. Os dois entram como demandas seguintes.</p></li></ul><p><strong>Objetivo</strong></p><p>Ter um mapa único e compartilhado de todas as áreas da Finza, com as automações existentes e a ficha de entrevista pronta. Isso permite começar as conversas com as áreas na semana seguinte e priorizar o squad pela carência real de cada área.</p>","qs":"bloqueado","tipo":"melhoria","dev":"Leandro","sp":5,"fp":"2026-11-18","df":"quimera","ord":9006},{"id":"Q12357","key":12357,"frente":"torre","titulo":"Nova Torre de Controle — especificação técnica do frontend, API Torre e Motor de Disparos","desc":"<p><strong>Descrição Refinada</strong></p><p>A Torre de Controle vai ser reescrita. O protótipo do frontend está cerca de 90% pronto, com 13 telas: Dashboards, Ações, Agentes, Auditoria, Biblioteca, Campanhas, Clientes, Configurações, Custos, Disparos, Filtros, Link do cliente e Qualidade. Esta demanda cobre a especificação técnica completa antes do desenvolvimento, seguindo os agentes do harness anexados.</p><p>Arquitetura definida:</p><ul><li><strong>Frontend:</strong> Next.js (App Router) + React + TypeScript + Tailwind + shadcn/ui.</li><li><strong>API Torre:</strong> FastAPI/Python. Faz o CRUD e concentra as regras da Torre.</li><li><strong>Motor de Disparos:</strong> FastAPI/Python + Temporal. Serviço independente para fila, retry, resiliência e entrega. A Torre é o primeiro cliente, mas o motor vai atender qualquer sistema da empresa que precise disparar mensagem (WhatsApp/Meta, SMS, e-mail e canais futuros).</li></ul><p>Escopo:</p><ul><li>Specs numeradas e com nome claro (01-…, 02-…), executadas em ordem, cobrindo a API Torre, o Motor de Disparos e o frontend.</li><li>Os 10% que faltam no frontend, já especificados em código.</li><li>O Motor de Disparos especificado como plataforma:<ul><li>contrato de envio que não depende do canal;</li><li>canais e provedores plugáveis;</li><li>tudo parametrizável por configuração;</li><li>idempotência, retry e reprocessamento de falhas;</li><li>retorno de status de entrega;</li><li>identificação do sistema que pediu o envio.</li></ul></li></ul><p><strong>Observação</strong></p><ul><li>A Torre atual segue em produção durante a reescrita. A spec precisa trazer o plano de convivência e de migração de dados.</li><li>O Motor vai atender outros sistemas além da cobrança. Então nada de regra de cobrança dentro dele: régua, carteira e campanha ficam na API Torre.</li><li>Decisão pendente sobre o Temporal: Temporal Cloud ou hospedado por nós. Isso afeta custo e operação e precisa ser fechado na spec de stack antes do desenvolvimento.</li><li>Limites e regras da Meta precisam estar na spec do Motor: limite de envio por tier, janela de 24h, aprovação e custo de template. Opt-out e LGPD também.</li><li>O protótipo é referência visual. O código do frontend segue o padrão do harness, não é copiado do protótipo.</li></ul><p><strong>Objetivo</strong></p><p>Ter a especificação completa da nova Torre (frontend, API Torre e Motor de Disparos) aprovada e no padrão do harness. Assim o desenvolvimento começa sem decisão estrutural em aberto, e o Motor nasce pronto para ser usado por toda a empresa.</p>","qs":"em_andamento","tipo":"melhoria","dev":"Marcos","sp":13,"fp":"2026-11-20","df":"quimera","ord":9007},{"id":"Q12372","key":12372,"frente":"compliance","titulo":"Veritas 2.0 — especificação técnica do MVP e formalização do mapa de documentação","desc":"<p><strong>Descrição Refinada</strong></p><p>O Veritas 2.0 é a nova ferramenta do Compliance para monitorar a carteira, revisar o efeito das regras atuais e avaliar validações novas (bureau, variável, regra) sem depender do time de tecnologia, guiado por 5 agentes de IA. A discovery e o protótipo navegável já existem. Esta demanda é o primeiro passo do desenvolvimento e tem duas entregas:</p><ol><li>as especificações técnicas do MVP;</li><li>o mapa de documentação do Veritas finalizado e refinado, como documento vivo e formalização do sistema.</li></ol><p>Referências:</p><ul><li>Discovery do Veritas 2.0 (visão, regras, protótipo e roadmap): <a href=\"https://claude.ai/artifact/T5htEJMzz6viTwntizo5iP?sk=4vt-Y2EtiwV43eDcJ4ANOQ#visao\">https://claude.ai/artifact/T5htEJMzz6viTwntizo5iP?sk=4vt-Y2EtiwV43eDcJ4ANOQ#visao</a></li><li>Mapa de documentação do Veritas (documento vivo, entrega desta demanda): <a href=\"https://claude.ai/artifact/4D3tN2qWeYRRiDG6ojRHZv?sk=o9olVTVKWQ61Fy8iamJa9g\">https://claude.ai/artifact/4D3tN2qWeYRRiDG6ojRHZv?sk=o9olVTVKWQ61Fy8iamJa9g</a></li></ul><p>Arquitetura definida na discovery: backend em FastAPI e frontend em React, com o design system da Finza.</p><p>Escopo, a Fase 0 (Fundação) e a Fase 1 (MVP) da discovery:</p><ul><li><strong>Fundação:</strong><ul><li>esqueleto do backend e do frontend;</li><li>login com Google e perfis de acesso;</li><li>cofre de segredos e trilha de auditoria;</li><li>conector HTTP genérico com catálogo de custo.</li></ul></li><li><strong>MVP:</strong><ul><li>Agente Integrador com os 6 pilotos de bureau;</li><li>fontes de dados (BigQuery e planilha);</li><li>catálogo de variáveis com o Mapeador;</li><li>Playground v1 com relatório;</li><li>transações e eventos da jornada via API;</li><li>perfil consolidado por CPF/CNPJ.</li></ul></li><li><strong>Specs</strong> numeradas e com nome claro (01-…, 02-…), executadas em ordem, seguindo os agentes do harness anexados.</li><li><strong>Mapa de documentação</strong> com todas as telas e funcionalidades do MVP preenchidas: objetivo, regras, fluxo, estados e prévia. Ele precisa ficar coerente com as specs e com as regras invioláveis da discovery.</li></ul><p><strong>Observação</strong></p><ul><li>Fases 2 e 3 ficam fora do escopo: monitoramentos e alertas, dossiê, link avulso, Agente Gestor e painel de efetividade. O mapa pode citá-las como previstas, sem detalhar.</li><li>As regras invioláveis R1 a R16 da discovery precisam aparecer nas specs, em especial:<ul><li>o Veritas não decide proposta;</li><li>nada executa ou cobra sem confirmação com custo estimado;</li><li>segredo nunca sai do cofre;</li><li>dado pessoal sempre mascarado;</li><li>isolamento por organização;</li><li>quem cria não aprova;</li><li>toda escrita fica na trilha de auditoria.</li></ul></li><li>A Fundação inclui telas que ainda não têm protótipo: login e acesso, organizações, usuários e chaves, e trilha de auditoria. Elas precisam ser propostas e documentadas no mapa antes da spec.</li><li>O Veritas 1 continua em operação. KYC, termos, retiradas, cartão de terceiro e pendências não migram.</li><li>Alguns custos de bureau dos pilotos são estimativas a confirmar (ex.: Sherlocker). A spec de custo não pode tratá-los como valor fechado.</li></ul><p><strong>Objetivo</strong></p><p>Ter as specs do MVP aprovadas e o mapa de documentação do Veritas pronto como documento vivo e formalização do sistema. Assim o desenvolvimento das Fases 0 e 1 começa com escopo, regras e telas fechados.</p>","qs":"fila_exec","tipo":"melhoria","dev":"João Pedro","sp":13,"fp":"2026-11-20","df":"quimera","ord":9008},{"id":"Q12530","key":12530,"frente":"bitrix","titulo":"Alteração na regra de atribuição Bitrix 2#12026","desc":"<p>Bom dia Senhores(as)</p><p></p><p>Verifiquei que eu descrevi mal uma regra que seria a do novos originadores. Caso no cobrança 4.0 o cliente seja novo originador todos devem ser atribuidos pra maria eduarda mesmo os do adimplente.</p><p></p><p>Grato J</p>","qs":"em_validacao","tipo":"melhoria","dev":"João Pedro","sp":2,"fp":"2026-11-13","df":"quimera","ord":9009},{"id":"Q12549","key":12549,"frente":"bitrix","titulo":"Acionamento Bitrix","desc":"<p>Bom dia Senhores(as),</p><p></p><p>Atualmente o acionamento do bitrix vai pro departamento Cobrança - Bitrix e quando o cliente responde é redirecionado. Porém avaliei junto com a gestão e será melhor pro nosso acompanhamento da produtividade operacional já gerar o protocolo vinculado no agente e departamento do agente logo no acionamento não sendo mais após a resposta do cliente. Sendo igual a opção do coexistence de gerar protocolo ao enviar mensagem.</p><p></p><p>Outro ponto é que o acionamento Bitrix está ficando preso conforme imagem abaixo:</p><img class=\"kb-img\" src=\"attachment://4343f5c1-078f-4a06-8428-24c47df301a6/1794229831208_image.png\" alt=\"image.png\"><p></p><p>Grato J</p>","qs":"em_andamento","tipo":"melhoria","dev":"João Pedro","sp":2,"fp":"2026-11-13","df":"quimera","ord":9010},{"id":"Q12649","key":12649,"frente":"torre","titulo":"Telefone & Email inativo | Torre de Controle","desc":"<p>Boa tarde Senhores(as),</p><p></p><p>Peço apoio no seguinte, será necessário ajustar em todas fontes de dados da torre de controle pra evitar que isso ocorra:</p><p></p><p>Onde está a informação: na tabela de contratos do Módulo Financeiro (bronze_mongodb_<a target=\"_blank\" rel=\"noopener noreferrer\" href=\"http://moduloFinanceiro.deals\">moduloFinanceiro.deals</a>), na lista de contatos do cliente, customer.contacts. Cada contato traz:</p><p>- type: \"Telefone\", \"Celular\" ou \"E-mail\"</p><p>- value: o número ou o e-mail</p><p>- status: \"Ativo\" ou \"Inativo\" (é esta a coluna que diz se o contato vale)</p><p>- deactivated_at: data em que foi desativado</p><p>O problema:</p><p>- Telefone: a consulta pega o telefone de <a target=\"_blank\" rel=\"noopener noreferrer\" href=\"http://negotiation.contractor.business\">negotiation.contractor.business</a>_data.cellphone, da Plataforma. A Plataforma não sabe que o número foi desativado no Módulo.</p><p>- E-mail: a consulta pega o primeiro e-mail de customer.contacts sem olhar o status. Pode sair um e-mail inativo.</p><p>Como filtrar:</p><p>1. Telefone: comparar o celular da Plataforma com os telefones de customer.contacts, só pelos dígitos e pelos 8 finais. O Módulo grava o mesmo número com ou sem +55, com ou sem espaço.</p><p>   - Se o número aparece só com status = 'Inativo', não usar. No lugar, usar o telefone com status = 'Ativo' mais recente (maior created_at).</p><p>   - Se o mesmo número também aparece como \"Ativo\" num registro em outro formato, mantém. O Módulo inativa o registro antigo e recadastra o número quando alguém edita o contato.</p><p>2. E-mail: considerar só type = 'E-mail' com status = 'Ativo', pegando o mais recente por created_at.</p><p>3. status vazio deve contar como \"Ativo\". Hoje não há nenhum caso, mas protege registros antigos.</p><p>Tamanho hoje: 8 contratos (49 títulos) com celular inativo, todos com outro telefone ativo no Módulo, e 2 contratos com e-mail inativo.</p><p></p><p></p><p>Grato J</p>","qs":"fila_exec","tipo":"melhoria","dev":"Marcos","sp":2,"fp":"2026-11-18","df":"quimera","ord":9011},{"id":"Q12747","key":12747,"frente":"hyperflow","titulo":"Vincular Número Hyperflow","desc":"Solicitação de reconexão de linha WhatsApp (coexistence) no Hyperflow.\n\n• Número: (34) 9 9936-4829\n• Nome (Hyperflow): Juliane Oliveira\n• E-mail do responsável: juliane.oliveira@blips.com.br\n• Departamento: Cobrança - 61 a 90 dias\n• Empresa: Blips\n\nSolicitado por: filipe.borges@blips.com.br\n\nCobrança / Liquidação Financeira / Retirada de Equipamentos / Finza — aberta no time da Finza.\n\nAberta automaticamente pelo Monitor de Conexões (Hyperflow).\n\n---\n_Created via MCP (source: monitor-hyperflow)_","qs":"finalizado","tipo":"melhoria","dev":"João Pedro","sp":1,"fp":null,"df":"quimera","ord":9012},{"id":"Q12840","key":12840,"frente":"juridico","titulo":"Transferência Hyper -Jurídico Finza e Blips","desc":"<p>Bom dia!</p><p>Solicito a habilitação da funcionalidade de transferência de casos no HYPER entre os setores <strong>Jurídico Finza e Jurídico Blips</strong>, permitindo a movimentação em ambos os sentidos.</p><p>A necessidade é possibilitar a transferência dos casos entre as duas áreas, conforme a demanda operacional.</p>","qs":"backlog","tipo":"melhoria","dev":null,"sp":null,"fp":null,"df":"quimera","ord":9013},{"id":"Q12844","key":12844,"frente":"torre","titulo":"Agendamento Disparos","desc":"<p>Bom dia Senhores(as),</p><p></p><p>Na aba disparos não tem a ação de agendar o disparo:</p><img class=\"kb-img\" src=\"attachment://1eb0e4ef-d066-4905-8d6f-434937015d1b/1794397792427_image.png\" alt=\"image.png\"><p></p><p>Grato J</p>","qs":"backlog","tipo":"melhoria","dev":null,"sp":null,"fp":null,"df":"quimera","ord":9014},{"id":"QTPL","key":null,"frente":"hyperflow","titulo":"Templates WhatsApp da Torre","desc":"Conjunto de 12 templates de WhatsApp da Torre (torre_tp_*), produzidos para a régua de cobrança:\n- #12647 — torre_tp_gen07_combinar_semlink (fila_exec)\n- #12646 — torre_tp_gen06_pergunta_link (fila_exec)\n- #12645 — torre_tp_gen05_novidade_link (em_andamento)\n- #12644 — torre_tp_gen04_importante_link (em_andamento)\n- #12643 — torre_tp_gen03_informacao_link (em_andamento)\n- #12642 — torre_tp_gen02_minutinho_link (fila_exec)\n- #12641 — torre_tp_gen01_direto_link (fila_exec)\n- #12638 — torre_tp_link_atendimento (fila_exec)\n- #12602 — torre_tp_recuperacao_bloqueio (bloqueado)\n- #12601 — torre_tp_regularizacao_urgente (bloqueado)\n- #12600 — torre_tp_facilidade_pagamento (em_andamento)\n- #12588 — torre_tp_novidade_portal (bloqueado)","qs":"em_andamento","tipo":"melhoria","dev":"Leandro","sp":null,"fp":"2026-11-13","df":"quimera","ord":9015,"rel":["#12647","#12646","#12645","#12644","#12643","#12642","#12641","#12638","#12602","#12601","#12600","#12588"]},{"id":"pl-lh-refino","key":null,"frente":"juridico","titulo":"Legal Hub — refinamento das specs e do mapa de documentação","desc":"<p><strong>Descrição Refinada</strong></p><p>Refinar e polir, num único esforço, as specs e o mapa de documentação do Legal Hub — a central jurídica multiempresa da Finza — consolidando o escopo das fases (estrutura multiempresa/SSO F1.1, gestão processual F1.2, decisão de ajuizamento/JusCore F1.4 e motor de renegociação/LexCalc F1.5) em dois artefatos de referência prontos para desenvolvimento. Unifica e substitui as antigas demandas de planejamento por fase. Conduzido com a Sara (Jurídico). Vinculado ao #11819.</p><p><strong>Observação</strong></p><p>Dois artefatos a polir e validar:</p><ul><li>Legal Hub — documentação / mapa: <a href=\"https://claude.ai/artifact/4DD1MdYs9tRPT1ZkZAYFCd?sk=mHCtLAO0lhoPetH97UUWxw\">https://claude.ai/artifact/4DD1MdYs9tRPT1ZkZAYFCd?sk=mHCtLAO0lhoPetH97UUWxw</a></li><li>Legal Hub — demandas: <a href=\"https://claude.ai/artifact/CYNfdZ19eZu56sjjFrANtL?sk=FRIUiUblpobUTl2rtTjuGw#demandas\">https://claude.ai/artifact/CYNfdZ19eZu56sjjFrANtL?sk=FRIUiUblpobUTl2rtTjuGw#demandas</a></li></ul><p>Prazo: 19/11/2026 a 20/12/2026.</p><p><strong>Critério de aceite</strong></p><p>Ambos os artefatos acima polidos e validados pelo negócio — aprovação formal da Sara Clara Teixeira (aprovadora).</p><p><strong>Objetivo</strong></p><p>Ter o escopo do Legal Hub (specs + mapa de documentação) refinado, consolidado e aprovado pelo negócio, pronto para iniciar o desenvolvimento.</p>","qs":"sem_ticket","tipo":"melhoria","dev":null,"sp":null,"ip":"2026-11-19","fp":"2026-12-20","df":"confirmada","ord":9016,"rel":["#11819"]}],"del":[{"match":["link de cobrança","abrir"]}],"edit":[{"match":["nova torre","marco"],"set":{"titulo":"Nova Torre de Controle — execução das specs (#12357)","desc":"**Descrição Refinada**\nPrimeiro marco de execução da nova Torre (BTR07): a partir das specs numeradas produzidas na #12357, construir o pilar do Motor de Disparos — fila com reprocessamento, disparos em paralelo, erro padronizado e observabilidade. Não é o cutover.\n\n**Observação**\nDepende da especificação #12357 (frontend em Next.js, API Torre em FastAPI e Motor de Disparos com Temporal). A Torre atual segue em produção durante a construção; a spec traz o plano de convivência e migração. Prazo: 25/12/2026.\n\n**Objetivo**\nEntregar o primeiro bloco executável da nova Torre no padrão das specs, deixando o Motor de Disparos pronto para uso.","tipo":"melhoria","frente":"torre","ip":"2026-11-20","fp":"2026-12-25","df":"confirmada","rel":["#12357"]}},{"match":["veritas","fase 0"],"set":{"titulo":"Veritas 2.0 — Execução","tipo":"melhoria","frente":"compliance","ip":"2026-11-20","fp":"2026-12-20","df":"confirmada","rel":["#12372"],"desc":"<p><strong>Descrição Refinada</strong></p><p>Execução do desenvolvimento do Veritas 2.0 a partir das specs numeradas e do mapa de documentação produzidos na #12372. Construir o sistema em FastAPI (backend) + React (frontend) com o design system da Finza, executando as specs em ordem (01-…, 02-…) e seguindo os agentes do harness. Cobre o desenvolvimento estipulado na #12372 — Fundação e MVP da discovery:</p><ul><li><strong>Fundação:</strong> esqueleto de backend e frontend; login Google + perfis de acesso (RBAC); cofre de segredos; trilha de auditoria; conector HTTP genérico com catálogo de custo.</li><li><strong>MVP:</strong> Agente Integrador com os 6 pilotos de bureau; fontes de dados (BigQuery e planilha); catálogo de variáveis com o Mapeador; Playground v1 com relatório; transações e eventos da jornada via API; perfil consolidado por CPF/CNPJ.</li></ul><p>Referências:</p><ul><li>Specs / mapa de documentação (a seguir): <a href=\"https://claude.ai/artifact/4D3tN2qWeYRRiDG6ojRHZv?sk=o9olVTVKWQ61Fy8iamJa9g\">https://claude.ai/artifact/4D3tN2qWeYRRiDG6ojRHZv?sk=o9olVTVKWQ61Fy8iamJa9g</a></li><li>Discovery / visão (suporte): <a href=\"https://claude.ai/artifact/T5htEJMzz6viTwntizo5iP?sk=4vt-Y2EtiwV43eDcJ4ANOQ#visao\">https://claude.ai/artifact/T5htEJMzz6viTwntizo5iP?sk=4vt-Y2EtiwV43eDcJ4ANOQ#visao</a></li><li>Protótipo navegável — a ser gerado na execução da #12372; usar como referência de telas e fluxos.</li></ul><p><strong>Observação</strong></p><ul><li>Depende da entrega da #12372 (specs do MVP aprovadas + mapa de documentação refinado). Início em 20/11/2026, logo após a #12372.</li><li>Seguir as regras invioláveis R1–R16 da discovery, em especial: o Veritas não decide proposta; nada executa ou cobra sem confirmação com custo estimado; segredo nunca sai do cofre; dado pessoal sempre mascarado; isolamento por organização; quem cria não aprova; toda escrita fica na trilha de auditoria.</li><li>Fases 2 e 3 (monitoramentos/alertas, dossiê, link avulso, Agente Gestor, painel de efetividade) ficam fora do escopo.</li><li>Prazo: 20/11/2026 a 20/12/2026.</li></ul><p><strong>Objetivo</strong></p><p>Entregar o Veritas 2.0 (Fundação + MVP) implementado conforme as specs e o mapa de documentação da #12372, pronto para uso pelo Compliance.</p>"}}],"refine":{"pl-saude-meta":"**Descrição Refinada**\nColetar da Meta a saúde de template e de BM (impactado, banido, reprovado, step ofensor) para saber o que está sendo afetado nos disparos.\n\n**Observação**\nAdiado para depois da refatoração da Torre (origem: R31 do roadmap anterior / balanço do ciclo). Provável origem upstr function paintTL(){const el=$('#tl');if(!el)return;const H=S.hist;const c=$('#h-ct');if(c)c.textContent=H.length?H.length+' registros':'';
  if(!H.length){el.innerHTML='<span class="muted">Sem registros ainda. Homologações, observações e decisões aparecem aqui, com autor e horário.</span>';return}
  el.innerHTML=H.map(h=>{const t=TIPO[h.tipo]||TIPO.demanda;let body='';
    if(h.tipo==='homolog')body=`<div class="body">${esc(HM[h.de]?.l||'—')} → <b>${esc(HM[h.para]?.l||'—')}</b>${h.resp?' · responsável: '+esc(h.resp):''}</div>${h.texto?`<div class="quote">${esc(h.texto)}</div>`:''}`;
    else if(h.tipo==='registro')body=`<div class="body"><b>${esc(h.categoria||'Registro')}</b></div><div class="quote">${esc(h.texto)}</div>`;
    else if(h.tipo==='obs')body=`<details><summary>Ver versão ${h.rev||''} do texto</summary><div class="quote">${esc(h.texto)||'<i>texto apagado</i>'}</div></details>`;
    else body=`<div class="quote mono" style="font-size:12px">${esc(h.texto)}</div>`;
    return`<div class="tli"><span class="ic" style="--s:${t[2]};--t:${t[3]}">${ic(t[1])}</span><div style="min-width:0"><div class="who"><b>${esc(nm(h.por))}</b> · ${esc(t[0])} · ${when(h.em)}</div>${body}</div></div>`}).join('')}

/* ---------- escrita ---------- */
const chain={};
function q(path,fn){const p=(chain[path]||Promise.resolve()).catch(()=>{}).then(fn);chain[path]=p;return p}
async function retry(fn){try{return await fn()}catch(e){if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,400+Math.random()*600));return fn()}throw e}}
function failMsg(e){if(e&&e.code==='invalid_argument'){S.canWrite=false;return'Sem permissão para registrar. Peça acesso de colaborador ao dono do roadmap.'}if(e&&e.code==='quota_exceeded')return'O banco do roadmap está cheio. Avise o squad IAF.';return'Não salvou. Tente de novo em instantes.'}
const hist=o=>retry(()=>S.db.collection('historico').add(Object.assign({por:S.me&&S.me.id,em:new Date().toISOString()},o)));
function setSt(id,t,cls){const e=$(id);if(e){e.className='svst'+(cls?' '+cls:'');e.textContent=t}}
async function saveHom(para){const d=S.items[S.demand];if(!d)return;const h=homOf(d);
  const par=($('#h-par')?.value||'').trim(),resp=($('#h-resp')?.value||'').trim();
  if(para==='ajustes'&&!par){setSt('#h-st','Descreva os ajustes no parecer antes de enviar.','err');$('#h-par').focus();return}
  setSt('#h-st','Salvando…');
  const doc={status:para,parecer:par||(para===h.status?h.parecer||'':''),resp,por:S.me&&S.me.id,em:new Date().toISOString()};
  try{await q('homolog/'+d.id,()=>retry(()=>S.db.doc('homolog/'+d.id).set(doc)));await hist({demanda:d.id,tipo:'homolog',de:h.status,para,texto:par,resp})}catch(e){setSt('#h-st',failMsg(e),'err')}}
let obsT=null,obsPend=null;
function obsMark(t,ed){const e=$('#o-st');if(e)e.innerHTML=`<span class="live${ed?' ed':''}"></span>${esc(t)}`}
function obsInput(){obsPend={id:S.demand,v:$('#o-txt').value};obsMark('Editando…',true);clearTimeout(obsT);obsT=setTimeout(flushObs,1200)}
function flushObs(){clearTimeout(obsT);if(!obsPend||!S.db)return;const{id,v}=obsPend;obsPend=null;const cur=S.obs[id];if(cur&&cur.texto===v){obsMark('Salvo');return}
  const rev=(cur&&cur.rev||0)+1;const doc={texto:v,rev,por:S.me&&S.me.id,em:new Date().toISOString()};S.obs[id]=doc;
  q('obs/'+id,()=>retry(()=>S.db.doc('obs/'+id).set(doc))).then(()=>hist({demanda:id,tipo:'obs',texto:v,rev})).then(()=>{if(S.demand===id)obsMark(`Salvo · versão ${rev} · ${when(doc.em)}`)})
   .catch(e=>{if(S.demand===id){const el=$('#o-st');if(el){el.innerHTML='';const s=document.createElement('span');s.className='svst err';s.textContent=failMsg(e);el.appendChild(s)}}})}
async function saveReg(){const t=($('#r-txt').value||'').trim();if(!t){setSt('#r-st','Escreva o registro antes de enviar.','err');return}
  setSt('#r-st','Registrando…');try{await hist({demanda:S.demand,tipo:'registro',categoria:$('#r-cat').value,texto:t});$('#r-txt').value='';setSt('#r-st','Registrado no histórico.','okk')}catch(e){setSt('#r-st',failMsg(e),'err')}}
async function saveDem(){const d=S.items[S.demand];const v=id=>($(id).value||'').trim()||null;
  const patch={qs:$('#e-qs').value,key:v('#e-key')?Number(v('#e-key')):null,dev:v('#e-dev'),sp:v('#e-sp')?Number(v('#e-sp')):null,ip:v('#e-ip'),fp:v('#e-fp'),ir:v('#e-ir'),fr:v('#e-fr')};
  const ch=Object.keys(patch).filter(k=>(patch[k]??null)!==(d[k]??null));if(!ch.length){setSt('#e-st','Nada mudou.');return}
  if(ch.some(k=>['ip','fp','ir','fr'].includes(k)))patch.df='confirmada';
  setSt('#e-st','Salvando…');
  try{await q('roadmap/demandas',()=>retry(()=>S.db.doc('roadmap/demandas').update({items:{[d.id]:patch}})));
    await hist({demanda:d.id,tipo:'demanda',texto:ch.map(k=>`${k}: ${d[k]??'—'} → ${patch[k]??'—'}`).join('\n')})}catch(e){setSt('#e-st',e&&e.code==='invalid_argument'?'Só editores do roadmap mudam o planejamento.':failMsg(e),'err')}}
async function delDem(){const d=S.items[S.demand];if(!d)return;setSt('#e-st','Excluindo…');try{await q('roadmap/demandas',()=>retry(()=>S.db.doc('roadmap/demandas').update({items:{[d.id]:{deleted:true}}})));await hist({demanda:d.id,tipo:'demanda',texto:'Demanda excluída do roadmap'});flushObs();location.hash=(S.prev&&S.prev!=='demanda')?S.prev:'quadro'}catch(e){setSt('#e-st',e&&e.code==='invalid_argument'?'Só editores do roadmap excluem demandas.':failMsg(e),'err')}}
let qShown=false,qReset=null;
const norm=s=>(s==null?'':String(s)).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
function qcompute(){
  const items=S.items,patch={},rep={del:[],edit:[],desc:0,dates:0,add:[],skipAdd:0,refine:0,status:0};
  const byKey={};Object.entries(items).forEach(([id,d])=>{if(d.key!=null&&!d.deleted)byKey[String(d.key)]=id});
  const pset=(id,o)=>{patch[id]=Object.assign(patch[id]||{},o)};
  (QMIG.del||[]).forEach(dl=>Object.entries(items).forEach(([id,d])=>{if(d.deleted)return;if(dl.match.every(t=>norm(d.titulo).includes(norm(t)))){pset(id,{deleted:true});rep.del.push(d.titulo)}}));
  (QMIG.delIds||[]).forEach(id=>{const d=items[id];if(d&&!d.deleted){pset(id,{deleted:true});rep.del.push(d.titulo)}});
  (QMIG.edit||[]).forEach(e=>{const hit=Object.entries(items).find(([id,d])=>!d.deleted&&!(patch[id]&&patch[id].deleted)&&e.match.every(t=>norm(d.titulo).includes(norm(t))));if(hit){pset(hit[0],e.set);rep.edit.push(items[hit[0]].titulo)}else rep.edit.push('(nao encontrada: '+e.match.join('+')+')')});
  (QMIG.editIds?Object.entries(QMIG.editIds):[]).forEach(([id,set])=>{const d=items[id];if(d&&!d.deleted&&!(patch[id]&&patch[id].deleted)){pset(id,set);rep.edit.push(d.titulo)}});
  Object.entries(items).forEach(([id,d])=>{if(d.deleted||(patch[id]&&patch[id].deleted)||(patch[id]&&'desc'in patch[id]))return;const m=d.key!=null&&QMIRROR[String(d.key)];if(m&&!m.missing){const md=(m.d||'').trim();if(md&&(d.desc||'')!==md){pset(id,{desc:md});rep.desc++}}});
  Object.entries(items).forEach(([id,d])=>{if(d.deleted||(patch[id]&&patch[id].deleted)||(patch[id]&&'fp'in patch[id]))return;const fp=d.key!=null&&QMIG.dates[String(d.key)];if(fp&&(d.fp||'')!==fp){pset(id,{fp:fp,df:(d.df||'quimera')});rep.dates++}});
  Object.entries(items).forEach(([id,d])=>{if(d.deleted||(patch[id]&&patch[id].deleted)||d.key==null)return;const r=QMIG.recon[String(d.key)];if(!r||!r.s)return;const cur=(patch[id]&&patch[id].qs)||d.qs;const o={};if(r.s!==cur){o.qs=r.s;rep.status++}if(o.qs==='finalizado'){if(r.fr&&(d.fr||'')!==r.fr)o.fr=r.fr;o.h0={s:'aprovada',n:'Finalizado no Quimera'+(r.fr?' em '+brf(r.fr):'')+'.',resp:(d.h0&&d.h0.resp)||''}}else if(o.qs==='cancelado'){o.h0={s:'nao_aplica',n:'Cancelado no Quimera.'}}if(Object.keys(o).length)pset(id,o)});
  (QMIG.add||[]).forEach(na=>{if(items[na.id]||(na.key!=null&&byKey[String(na.key)])){rep.skipAdd++;return}patch[na.id]=na;rep.add.push(na.titulo)});
  Object.entries(QMIG.refine||{}).forEach(([id,desc])=>{const d=items[id];if(!d||d.deleted||(patch[id]&&patch[id].deleted)||(patch[id]&&'desc'in patch[id]))return;if((d.desc||'')!==desc){pset(id,{desc:desc});rep.refine++}});
  return{patch,rep};
}
async function qsync(){
  if(!S.db){setSt('#qsync-st','Banco indisponível.','err');return}
  const{patch,rep}=qcompute();const nk=Object.keys(patch).length;
  try{console.log('[sync Quimera] plano',rep)}catch(e){}
  if(!qShown){
    if(!nk){setSt('#qsync-st','Nada a sincronizar — tudo já está igual ao Quimera.');return}
    qShown=true;clearTimeout(qReset);qReset=setTimeout(()=>{qShown=false},12000);
    setSt('#qsync-st',`Plano: +${rep.add.length} add · ${rep.status} status · ${rep.dates} datas · ${rep.desc+rep.refine} descr · ${rep.edit.length} edit · ${rep.del.length} excluir. Clique de novo para APLICAR.`);
    return}
  qShown=false;clearTimeout(qReset);
  if(!nk){setSt('#qsync-st','Nada a aplicar.');return}
  setSt('#qsync-st','Aplicando…');
  try{await q('roadmap/demandas',()=>retry(()=>S.db.doc('roadmap/demandas').update({items:patch})));
    await hist({tipo:'demanda',texto:`Sync Quimera: +${rep.add.length} add, ${rep.dates} datas, ${rep.desc} descr, ${rep.edit.length} edit, ${rep.del.length} excluir`});
    setSt('#qsync-st',`Pronto: ${rep.add.length} adicionada(s), ${rep.status} status, ${rep.dates} data(s), ${rep.desc+rep.refine} descrição(ões), ${rep.edit.length} editada(s), ${rep.del.length} excluída(s).`);
  }catch(e){setSt('#qsync-st',failMsg(e),'err')}}

document.addEventListener('click',e=>{
  document.querySelectorAll('details.dd[open]').forEach(dt=>{if(!dt.contains(e.target))dt.open=false});
  const t=e.target.closest('button');if(!t)return;const ds=t.dataset;
  if(ds.v){location.hash=ds.v;return}
  if(ds.open){flushObs();location.hash='demanda-'+ds.open;return}
  if(t.hasAttribute('data-back')){flushObs();location.hash=S.prev;return}
  if(ds.fr){S.f.fr.has(ds.fr)?S.f.fr.delete(ds.fr):S.f.fr.add(ds.fr);ls.set('fr',[...S.f.fr]);paintFr();render();return}
  if(ds.fst){S.f.st.has(ds.fst)?S.f.st.delete(ds.fst):S.f.st.add(ds.fst);ls.set('fst',[...S.f.st]);paintFr();render();return}
  if(ds.fquim!==undefined){S.f.quim=ds.fquim;ls.set('quim',S.f.quim);$('#f-quimd').open=false;paintFr();render();return}
  if(ds.fdev!==undefined){S.f.dev=ds.fdev;$('#f-devd').open=false;paintFr();render();return}
  if(ds.fhom!==undefined){S.f.hom=ds.fhom;$('#f-homd').open=false;paintFr();render();return}
  if(t.id==='f-late'){S.f.late=!S.f.late;paintFr();render();return}
  if(t.hasAttribute('data-cancel-dem')){const dt=t.closest('details');if(dt)dt.open=false;render();return}
  if(ds.hom){S.f.hom=S.f.hom===ds.hom?'':ds.hom;syncFilters();location.hash='quadro';render();return}
  if(ds.late){S.f.late=true;syncFilters();location.hash='quadro';render();return}
  if(ds.go){location.hash=ds.go;return}
  if(ds.per){S.per=ds.per;ls.set('per',S.per);render();return}
  if(ds.cron){S.cron=ds.cron;ls.set('cron',S.cron);render();return}
  if(ds.cal!==undefined){const n=+ds.cal;if(!n)S.cal={y:tm.getFullYear(),m:tm.getMonth()};else{let m=S.cal.m+n,y=S.cal.y;if(m<0){m=11;y--}if(m>11){m=0;y++}S.cal={y,m}}S.calExp='';render();return}
  if(ds.exp!==undefined){S.calExp=ds.exp;render();return}
  if(ds.gm){S.g.mode=ds.gm;ls.set('gmode',ds.gm);render();return}
  if(ds.gn!==undefined){const n=+ds.gn;if(!n){S.g.y=tm.getFullYear();S.g.m=tm.getMonth()}else{let m=S.g.m+n,y=S.g.y;if(m<0){m=11;y--}if(m>11){m=0;y++}S.g.y=y;S.g.m=m}render();return}
  if(ds.gcol){const k=ds.gcol;S.g.col.has(k)?S.g.col.delete(k):S.g.col.add(k);ls.set('gcol',[...S.g.col]);render();return}
  if(ds.gall){S.g.col=ds.gall==='close'?new Set(Object.keys(FR)):new Set();ls.set('gcol',[...S.g.col]);render();return}
  if(ds.dtab){flushObs();S.dtab=ds.dtab;render();return}
  if(ds.hq){saveHom(ds.hq);return}
  if(t.hasAttribute('data-reg')){saveReg();return}
  if(t.hasAttribute('data-save-dem')){saveDem();return}
  if(t.hasAttribute('data-del-dem')){if(t.dataset.armed){delDem()}else{t.dataset.armed='1';t.textContent='Confirmar exclusão';t.style.background='#B91C1C';t.style.color='#fff';t.style.borderColor='#B91C1C';setTimeout(()=>{if(t&&t.isConnected){t.dataset.armed='';t.textContent='Excluir demanda';t.style.background='';t.style.color='#B91C1C';t.style.borderColor='#F3C2C2'}},4000)}return}
  if(t.id==='qsync'){qsync();return}
  if(t.id==='qexport'){location.hash='export';return}
  if(t.id==='f-clear'){S.f={q:'',dev:'',hom:'',late:false,fr:new Set(),st:new Set(),quim:''};ls.set('fr',[]);ls.set('fst',[]);ls.set('quim','');syncFilters();render();return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('details.dd[open]').forEach(dt=>dt.open=false)});
document.addEventListener('input',e=>{if(e.target.id==='o-txt')obsInput();if(e.target.id==='f-q'){S.f.q=e.target.value.trim();paintFr();render()}});
document.addEventListener('focusout',e=>{if(e.target.id==='o-txt')flushObs()});
document.addEventListener('change',e=>{if(e.target.id==='cal-st'){ls.set('calstart',e.target.checked);render()}});
window.addEventListener('hashchange',()=>setView(location.hash.slice(1)));
window.addEventListener('pagehide',flushObs);
let rz,lastW=innerWidth;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{applyFit();if(S.view==='cronograma'||S.view==='quadro'||Math.abs(innerWidth-lastW)>150)safeRender();lastW=innerWidth},150)});
function safeRender(){const a=document.activeElement;if(S.view==='demanda'&&a&&$('#view').contains(a)&&/TEXTAREA|INPUT|SELECT/.test(a.tagName))return;if(S.view==='demanda'&&obsPend)return;render()}

/* ---------- boot ---------- */
chrome();setView(location.hash.slice(1)||'painel');
const slow=setTimeout(()=>{if(!S.loaded){S.dbState='slow';render()}},10000);
(async()=>{
  const cl=window.claude;if(!cl||!cl.use){S.dbState='none';clearTimeout(slow);render();return}
  const[db,user]=await Promise.all([cl.use('db'),cl.use('user')]);S.user=user;
  if(user){try{S.me=await user.me();S.canAdmin=await user.canEdit();const w=await user.can('data.write');S.canWrite=w!==false;
    const me=$('#me');me.innerHTML='<img alt=""><div><b></b><span></span></div>';me.querySelector('img').src=S.me.avatarUrl;me.querySelector('b').textContent=S.me.name||'Você';me.querySelector('span').textContent=S.canAdmin?'Editor':S.canWrite?'Colaborador':'Leitura';const qsb=$('#qsync');if(qsb)qsb.hidden=!S.canAdmin;const qeb=$('#qexport');if(qeb)qeb.hidden=!S.canAdmin}catch(e){}}
  if(!db){S.dbState='none';clearTimeout(slow);render();return}
  S.db=db;
  db.doc('roadmap/demandas').onSnapshot(s=>{S.items=(s.exists&&s.data().items)||{};if(!s.metadata.fromCache||Object.keys(S.items).length){S.loaded=true;clearTimeout(slow)}safeRender()},()=>{S.dbState='none';render()});
  db.doc('roadmap/config').onSnapshot(s=>{S.cfg=s.exists?s.data():null;if(S.loaded&&S.view==='painel')render()},()=>{});
  db.collection('homolog').onSnapshot(s=>{const m={};s.docs.forEach(x=>m[x.id]=x.data());S.hom=m;if(S.loaded)safeRender()},()=>{});
  db.collection('obs').onSnapshot(s=>{const m={};s.docs.forEach(x=>m[x.id]=x.data());S.obs=m;
    const ta=$('#o-txt');if(S.view==='demanda'&&ta&&document.activeElement!==ta&&!obsPend){const o=m[S.demand];if(o&&ta.value!==o.texto){ta.value=o.texto;obsMark(`Salvo · versão ${o.rev||1} · ${nm(o.por)} · ${when(o.em)}`)}}},()=>{});
  db.collection('historico').orderBy('em','desc').limit(30).onSnapshot(s=>{S.recent=s.docs.map(x=>x.data());paintAct()},()=>{});
})();
})();
</script>
