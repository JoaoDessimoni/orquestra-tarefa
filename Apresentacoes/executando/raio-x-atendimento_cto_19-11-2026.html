<title>Raio-X do Atendimento</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
<style>
/* Layout: padrão dos decks Finza (finza-deck-animado) traduzido para app web — fundo claro com pontos,
   faixa navy de destaque, cards brancos raio 20, título ghost+accent, tooltip navy. Tema único (claro) por decisão. */
:root{
  --blue:#1A1AFF; --deep:#0F0F8C; --mid:#4D4DFF; --lilac:#7A7AFF; --soft:#E8E8FF;
  --dark:#0A0A2E; --navy2:#16163F; --navy3:#23235A; --navy4:#3A3A8C;
  --ghost:#9C9CB4; --ghost2:#C8C8D4; --muted:#5C5C7A; --line:#D8D8E5; --bg:#F2F2F2; --white:#FFFFFF; --track:#F2F2F8;
  --ok:#10B981; --warn:#F59E0B; --bad:#EF4444;
  --ok-bg:#D1FAE5; --ok-tx:#047857; --bl-bg:#E8E8FF; --bl-tx:#1A1AFF; --wa-bg:#FEF3C7; --wa-tx:#92400E; --bad-bg:#FEE2E2; --bad-tx:#B91C1C;
  --f10:#10B981; --f20:#6FCF9F; --f30:#FBBF24; --f60:#F59E0B; --f60p:#EF4444; --fsem:#991B1B;
  --rec-a:#1A1AFF; --rec-b:#7A7AFF;
  --f:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:20px; --r-sm:12px;
  --lift:0 18px 40px rgba(26,26,255,.14);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--dark);font-family:var(--f);font-size:15px;line-height:1.5;
  background-image:radial-gradient(var(--line) 1.2px,transparent 1.3px);background-size:28px 28px;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--white)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.n{font-variant-numeric:tabular-nums}
.wrap{width:100%;max-width:none;margin:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--white);border-bottom:1px solid var(--line)}
.top-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0;flex-wrap:wrap}
.brand .mk{font-weight:700;color:var(--blue);white-space:nowrap}
.brand .nm{font-weight:300;color:var(--ghost);font-size:17px;white-space:nowrap}
.brand .nm b{font-weight:800;color:var(--dark)}
.sim{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--wa-bg);color:var(--wa-tx);border-radius:999px;padding:3px 10px;white-space:nowrap;cursor:help}
.seg{display:inline-flex;background:var(--track);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:9px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--white);color:var(--blue);box-shadow:0 1px 3px rgba(10,10,46,.12)}
.seg button[data-rec="B"][aria-pressed="true"]{color:var(--rec-b)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{padding:10px 14px;font-weight:700;font-size:14px;color:var(--muted);text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--blue);border-bottom-color:var(--blue)}

main{padding-block:22px 56px}
.view{display:flex;flex-direction:column;gap:26px}

.kick{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.h2{font-size:clamp(22px,2.4vw,30px);line-height:1.1;letter-spacing:-.03em;margin:4px 0 0;text-wrap:balance}
.h2 .g{font-weight:300;color:var(--ghost)} .h2 .k{font-weight:800;color:var(--blue)}
.lead{color:var(--muted);font-size:14px;margin:6px 0 0;max-width:70ch}
/* telas largas: seções lado a lado para aproveitar o espaço horizontal */
.dash-row{display:flex;flex-direction:column;gap:26px;min-width:0}
.dash-row > section{min-width:0}
@media (min-width:1400px){.dash-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}}
@media (min-width:1400px){.dash-row .rules{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1600px){.defs{grid-template-columns:repeat(3,minmax(0,1fr))}}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}

.cw{background:var(--white);border-radius:var(--r);padding:20px 22px;min-width:0}
.cd{background:var(--white);border-radius:var(--r);padding:16px 20px;border:2px dotted var(--blue);color:var(--muted);font-size:14px;margin:0}
.cd b{color:var(--blue)}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:900px){.g2{grid-template-columns:1fr}}
.lab{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.c-ok{background:var(--ok-bg);color:var(--ok-tx)} .c-bl{background:var(--bl-bg);color:var(--bl-tx)} .c-wa{background:var(--wa-bg);color:var(--wa-tx)} .c-bad{background:var(--bad-bg);color:var(--bad-tx)} .c-nv{background:var(--track);color:var(--muted)}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}
.rec{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.rec::before{content:"";width:8px;height:8px;border-radius:2px;background:currentColor}
.rec-A{color:var(--rec-a)} .rec-B{color:var(--rec-b)}
.sc{display:inline-flex;align-items:center;justify-content:center;min-width:38px;font-weight:800;border-radius:8px;padding:2px 7px;font-variant-numeric:tabular-nums}
.s-hi{background:var(--ok-bg);color:var(--ok-tx)} .s-mid{background:var(--wa-bg);color:var(--wa-tx)} .s-lo{background:var(--bad-bg);color:var(--bad-tx)}

.hero{background:var(--dark);border-radius:24px;padding:26px 26px 22px;color:var(--white);position:relative;overflow:hidden;
  background-image:radial-gradient(var(--navy3) 1.4px,transparent 1.5px);background-size:30px 30px}
.hero .kick{color:var(--ghost2)}
.hero .h2{font-size:clamp(26px,3.2vw,40px)} .hero .h2 .g{color:var(--ghost2)} .hero .h2 .k{color:var(--white)} .hero .h2 .k i{font-style:normal;color:var(--lilac)}
.pill{display:inline-flex;background:var(--blue);color:var(--white);font-weight:600;font-size:13px;border-radius:999px;padding:5px 14px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:22px}
@media (max-width:1050px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.kpis{grid-template-columns:1fr}}
.kpi{background:var(--white);color:var(--dark);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:8px;min-width:0;cursor:pointer;transition:transform .2s,box-shadow .2s}
.kpi:hover{transform:translateY(-4px);box-shadow:var(--lift)}
.kpi.inv{background:var(--blue);color:var(--white)} .kpi.inv .lab{color:var(--soft)} .kpi.inv .cap{color:var(--soft)}
.kpi .big{font-size:clamp(40px,4.6vw,60px);font-weight:800;letter-spacing:-.04em;line-height:.95;color:var(--blue)}
.kpi.inv .big{color:var(--white)}
.kpi .big small{font-size:.42em;font-weight:800;margin-left:3px;letter-spacing:-.02em}
.kpi .cap{font-size:13px;color:var(--muted);line-height:1.35}
.kpi .duo{display:flex;flex-direction:column;gap:6px}
.kpi .duo div{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.kpi .duo .big{font-size:clamp(30px,3.2vw,42px)}
.strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));margin-top:20px;border-top:1px solid var(--navy3);padding-top:16px}
@media (max-width:1050px){.strip{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:14px}}
@media (max-width:520px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}}
.strip > div{padding-right:12px;cursor:help;min-width:0}
.strip .v{font-size:clamp(22px,2.2vw,28px);font-weight:800;color:var(--lilac);letter-spacing:-.03em;line-height:1.1}
.strip .v small{font-size:.55em;margin-left:2px}
.strip .l{font-size:12px;color:var(--ghost2);line-height:1.3}
.strip .v .ab{display:block;font-size:.62em}

.stk{display:flex;height:46px;border-radius:12px;overflow:hidden;gap:2px}
.stk button{border:0;padding:0 6px;cursor:pointer;min-width:0;color:var(--white);font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden}
.stk button:hover{filter:brightness(1.08)}
.fx-f10{background:var(--f10)}.fx-f20{background:var(--f20)}.fx-f30{background:var(--f30)}.fx-f60{background:var(--f60)}.fx-f60p{background:var(--f60p)}.fx-sem{background:var(--fsem)}
.stk .fx-f20,.stk .fx-f30{color:var(--dark)}
.bands{display:flex;flex-direction:column;margin-top:14px}
.band{display:grid;grid-template-columns:118px 86px minmax(0,1fr);gap:12px;align-items:center;padding:9px 6px;border-top:1px solid var(--track);cursor:pointer;border-radius:10px}
.band:hover{background:var(--track)}
.band .p{font-size:22px;font-weight:800;letter-spacing:-.03em}
.band .p small{font-size:12px;color:var(--muted);font-weight:600;display:block;letter-spacing:0}
.band .r{font-size:13px;color:var(--muted)}
.band .r b{color:var(--blue)}
.fxchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;border-radius:999px;padding:4px 10px;color:var(--white);white-space:nowrap;justify-self:start}
.fxchip.fx-f20,.fxchip.fx-f30{color:var(--dark)}
@media (max-width:520px){.band{grid-template-columns:110px minmax(0,1fr)}.band .r{grid-column:1/-1}}

.hb{display:flex;flex-direction:column;gap:4px}
.hbr{display:grid;grid-template-columns:22px minmax(0,190px) minmax(0,1fr) 46px;gap:10px;align-items:center;padding:7px 6px;border-radius:10px;cursor:pointer}
.hbr:hover{background:var(--track)}
.hbr .i{font-size:12px;font-weight:700;color:var(--ghost);text-align:right}
.hbr .nm{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbr .nm small{display:block;font-size:11.5px;color:var(--muted);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.hbr .tr{height:14px;background:var(--track);border-radius:7px;overflow:hidden}
.hbr .fl{display:block;height:100%;border-radius:7px;background:var(--blue)}
.hbr.ref .fl{background:repeating-linear-gradient(135deg,var(--lilac) 0 6px,var(--soft) 6px 12px)}
.hbr.ref .nm{color:var(--lilac)}
.hbr .v{font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.more{margin-top:8px;background:none;border:0;color:var(--blue);font-weight:700;font-size:13px;cursor:pointer;padding:6px}
@media (max-width:520px){.hbr{grid-template-columns:18px minmax(0,1fr) 42px}.hbr .tr{grid-column:2/4;grid-row:2}}

.rf{display:flex;flex-direction:column;gap:8px}
.rfi{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--track);cursor:pointer;border:1px solid transparent}
.rfi:hover{border-color:var(--blue);background:var(--white)}
.rfi .t{font-size:22px;font-weight:800;letter-spacing:-.03em;color:var(--bad);min-width:84px;font-variant-numeric:tabular-nums;line-height:1.1}
.rfi .t.sem{color:var(--fsem);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.rfi .w{font-size:13px;min-width:0}
.rfi .w b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rfi .w span{color:var(--muted)}

.heat{display:grid;grid-template-columns:34px repeat(24,minmax(14px,1fr));gap:3px;min-width:430px}
.heat .hl{font-size:10.5px;color:var(--ghost);text-align:center;font-weight:600}
.heat .dl{font-size:11px;color:var(--muted);font-weight:600;align-self:center}
.heat .c{aspect-ratio:1;border-radius:4px;background:var(--track);cursor:help}
.scroll-x{overflow-x:auto}
.hleg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12px;color:var(--muted);align-items:center}
.hleg span{display:inline-flex;gap:6px;align-items:center}

.mix{display:flex;height:30px;border-radius:10px;overflow:hidden;gap:2px}
.mix span{display:flex;align-items:center;justify-content:center;color:var(--white);font-size:12px;font-weight:800;min-width:0;cursor:help}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.trio div{background:var(--track);border-radius:14px;padding:12px;cursor:help;min-width:0}
.trio .v{font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.trio .l{font-size:12px;color:var(--muted)}

/* ---------- clientes e conversas: tela de altura fixa ---------- */
html.fixed,html.fixed body{height:100%;overflow:hidden}
html.fixed body{display:flex;flex-direction:column}
html.fixed header.top{flex:none;position:relative;top:auto}
html.fixed main{flex:1;min-height:0;display:flex;flex-direction:column;padding-block:12px;max-width:none;width:100%;margin:0;align-self:stretch}
html.fixed header.top .wrap{max-width:none}
html.fixed main > .view{flex:1;min-height:0}
.pv{display:flex;flex-direction:column;gap:12px;height:100%;min-height:0}
.fbar{flex:none;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--white);border-radius:16px;padding:10px 12px}
.search{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--track);border-radius:12px;padding:0 12px;border:2px solid transparent}
.search:focus-within{border-color:var(--blue);background:var(--white)}
.search input{border:0;background:transparent;padding:8px 0;width:100%;min-width:0;outline:none;font-size:13px}
.dd{position:relative;min-width:0}
.ddb{display:inline-flex;align-items:center;gap:8px;background:var(--track);border:2px solid transparent;border-radius:12px;padding:7px 12px;font-size:13px;font-weight:700;color:var(--dark);cursor:pointer;white-space:nowrap;max-width:260px}
.ddb small{color:var(--muted);font-weight:600;font-size:12px}
.ddb .val{overflow:hidden;text-overflow:ellipsis}
.ddb.on{background:var(--soft);color:var(--blue)}
.ddb.on small{color:var(--blue);opacity:.75}
.ddb[aria-expanded="true"]{border-color:var(--blue);background:var(--white)}
.ddb::after{content:"";width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-2px) rotate(45deg);opacity:.55;flex:none}
.ddb[aria-expanded="true"]::after{transform:translateY(1px) rotate(-135deg)}
.ddp{position:absolute;top:calc(100% + 6px);left:0;z-index:20;background:var(--white);border-radius:16px;box-shadow:0 18px 40px rgba(10,10,46,.2);border:1px solid var(--line);padding:6px;min-width:230px;width:max-content;max-width:min(340px,calc(100vw - 32px));max-height:min(420px,60vh);overflow:auto;display:flex;flex-direction:column;gap:2px;animation:ddin .16s ease-out}
@keyframes ddin{from{opacity:0;transform:translateY(-4px)}}
.ddp.right{left:auto;right:0}
.ddo{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:8px 10px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;color:var(--dark)}
.ddo:hover{background:var(--track)}
.ddo[aria-checked="true"]{color:var(--blue);background:var(--soft)}
.ddo::before{content:"";width:14px;height:14px;border-radius:50%;border:2px solid var(--line);flex:none;box-sizing:border-box}
.ddo[aria-checked="true"]::before{border:4px solid var(--blue)}
.ddo.chk::before{border-radius:4px}
.ddo.chk[aria-checked="true"]::before{background:var(--blue);border:2px solid var(--blue);box-shadow:inset 0 0 0 2px var(--white)}
.ddsearch{border:0;background:var(--track);border-radius:10px;padding:8px 10px;margin:2px 2px 6px;font-size:13px;outline:none}
.ddsec{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ghost);padding:10px 10px 2px}
.badge{background:var(--blue);color:var(--white);border-radius:999px;font-size:11px;padding:1px 7px;font-weight:800}
.fcount{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap;display:flex;gap:10px;align-items:center}
.fcount b{color:var(--dark)}
.clear{border:0;background:none;color:var(--blue);font-weight:700;font-size:13px;cursor:pointer;padding:0}
.btn{border:0;background:var(--blue);color:var(--white);border-radius:12px;padding:9px 16px;font-weight:700;font-size:13px;cursor:pointer}
.btn.ghost{background:var(--track);color:var(--dark)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:10px}
.btn:hover{filter:brightness(1.05)}
.ex{flex:1;min-height:0;display:grid;grid-template-columns:320px minmax(0,1fr) 340px;grid-template-rows:minmax(0,1fr);gap:12px}
.pane{min-height:0;min-width:0;width:100%;display:flex;flex-direction:column;background:var(--white);border-radius:var(--r);overflow:hidden}
.pane-h{flex:none;padding:12px 14px;border-bottom:1px solid var(--track);display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.pane-b{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:10px;scrollbar-gutter:stable;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.pane-b::-webkit-scrollbar,.ddp::-webkit-scrollbar{width:8px}
.pane-b::-webkit-scrollbar-track,.ddp::-webkit-scrollbar-track{background:transparent}
.pane-b::-webkit-scrollbar-thumb,.ddp::-webkit-scrollbar-thumb{background:var(--line);border-radius:999px;border:2px solid transparent;background-clip:content-box}
.pane-b:hover::-webkit-scrollbar-thumb,.ddp:hover::-webkit-scrollbar-thumb{background:var(--ghost);background-clip:content-box}
.ddp{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.convp .pane-b{scrollbar-color:var(--ghost2) transparent}
.msg{overflow-wrap:anywhere}
/* cabeçalho da conversa: estrutura fixa — botões nunca mudam de lugar */
.convp .pane-h{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;flex-wrap:nowrap}
.convh{gap:5px}
.convh .t1,.convh .t2{flex-wrap:nowrap;overflow:hidden;white-space:nowrap;min-width:0;height:26px;align-items:center}
.convh .t1 > *,.convh .t2 > *{flex:none}
.convh .fit{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;display:inline-flex;gap:6px}
.convh .nm2{display:block;color:var(--muted);font-size:13px}
.convp .acts{flex-wrap:nowrap;justify-content:flex-end}
.pnav span{min-width:56px;text-align:center}
.evbtn{min-width:112px;justify-content:center}
@media (max-width:760px){.convp .pane-h{grid-template-columns:minmax(0,1fr)}.convp .acts{justify-content:flex-start}}
.clist{display:flex;flex-direction:column;gap:6px}
.cc{border-radius:14px;background:var(--track);border:2px solid transparent}
.cc.on{border-color:var(--blue);background:var(--white)}
.ci{width:100%;border:0;background:none;padding:10px 12px;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;text-align:left;border-radius:12px}
.ci:hover{background:rgba(26,26,255,.04)}
.ci .ph{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.ci .nm{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci .fl{display:flex;gap:5px;align-items:center;justify-content:flex-end}
.plist{display:flex;flex-direction:column;gap:3px;padding:0 8px 8px}
.plist .lab{padding:4px 6px 2px}
.pi{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;border:0;background:var(--track);text-align:left;padding:8px 10px;border-radius:10px;cursor:pointer;font-size:12.5px;color:var(--dark)}
.pi:hover{background:var(--soft)}
.pi[aria-selected="true"]{background:var(--blue);color:var(--white)}
.pi[aria-selected="true"] .sc{background:var(--white)}

<script>
"use strict";
/* Raio-X do Atendimento — dados reais. Regras de cálculo: specs 03 (tempo) e 05 (score).
   DATA vem de arquivos publicados ao lado da página (data/meta.json, data/idx_<rec>.json, data/m/<rec>_<nnn>.json — spec 06).
   O banco do artefato guarda só config/geral, prompts/<v> e pesos/<v>. */

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=(n,d=0)=>(n==null||isNaN(n))?"—":n.toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=(a,b)=>b?100*a/b:0;
const median=a=>{if(!a.length)return null;const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
const quant=(a,q)=>{if(!a.length)return null;const s=[...a].sort((x,y)=>x-y);return s[Math.min(s.length-1,Math.floor(q*s.length))]};
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const MIN=60000, DAY=86400000;
const dt=ms=>{const d=new Date(ms);return `${String(d.getUTCDate()).padStart(2,"0")}/${String(d.getUTCMonth()+1).padStart(2,"0")} ${String(d.getUTCHours()).padStart(2,"0")}:${String(d.getUTCMinutes()).padStart(2,"0")}`};
const fmin=m=>m==null?"sem resposta":m<1?`${fmt(m*60)} s`:m<60?`${fmt(m,m<10?1:0)} min`:`${fmt(m/60,1)} h`;
const mv=m=>m==null?["—",""]:m<1?[fmt(m*60),"s"]:m<60?[fmt(m,1),"min"]:[fmt(m/60,1),"h"];
const tip=(t,b)=>`data-tip="${esc(t)}::${esc(b)}"`;

const CFG={
  exp:{dias:[1,2,3,4,5],ini:8,fim:18},
  faixas:[{k:"f10",lbl:"até 10 min",leit:"Dentro do esperado."},{k:"f20",lbl:"10 a 20 min",leit:"Aceitável."},{k:"f30",lbl:"20 a 30 min",leit:"Cliente já percebe a demora."},{k:"f60",lbl:"30 a 60 min",leit:"Atraso. Vale olhar a escala."},{k:"f60p",lbl:"mais de 1 h",leit:"<b>Red flag.</b> Cliente esperou mais de uma hora."},{k:"sem",lbl:"sem resposta",leit:"<b>Não atendimento.</b> A última mensagem do cliente ficou sem resposta."}],
  notasAgil:{f10:100,f20:85,f30:70,f60:45,f60p:15,sem:0},
  tetos:{sem:30,f60p:60},
  penal:{informacao_incorreta_grave:15,promessa_indevida:10,exposicao_dados:15,ameaca:20,transferencia_sem_contexto:5},penalMax:30,
  penalDesc:{informacao_incorreta_grave:"Informação errada que prejudica o cliente (valor, prazo, condição).",promessa_indevida:"Promete algo fora da política, como desconto não autorizado.",exposicao_dados:"Expõe dado pessoal de forma indevida.",ameaca:"Ameaça ou constrange o cliente na cobrança.",transferencia_sem_contexto:"Cliente precisou repetir tudo depois da transferência."},
  crit:[{k:"agilidade",lbl:"Agilidade",desc:"Tempo medido nas mensagens. Não passa pelo LLM."},{k:"resolucao",lbl:"Resolução",desc:"Resolveu, ou o cliente sai sabendo o próximo passo e quando."},{k:"clareza",lbl:"Clareza e correção",desc:"Informação certa e completa: valores, datas, links."},{k:"conducao",lbl:"Condução",desc:"Oferece a saída (2ª via, acordo, prazo) sem o cliente pedir."},{k:"empatia",lbl:"Empatia e tom",desc:"Cordial, reconhece o problema, sem tom seco."},{k:"conformidade",lbl:"Conformidade",desc:"Sem promessa indevida, sem expor dado, sem ameaça."},{k:"desfecho",lbl:"Desfecho",desc:"Cliente termina mais calmo do que começou."}],
  pesos:{agilidade:25,resolucao:20,clareza:15,conducao:10,empatia:10,conformidade:10,desfecho:10},
  assuntos:{"cobranca.segunda_via":"2ª via de boleto","cobranca.acordo_renegociacao":"Acordo e renegociação","cobranca.atraso_juros_multa":"Juros e multa","cobranca.contestacao":"Contestação de débito","taxa.condicoes":"Taxa e condições","formalizacao.contrato_assinatura":"Contrato e assinatura","formalizacao.documentos":"Documentos","pagamento.confirmacao_baixa":"Confirmação de pagamento","cancelamento_distrato":"Cancelamento e distrato","equipamento_suporte":"Equipamento e suporte","cadastro_dados":"Cadastro","outros":"Outros"}
};
const FX=Object.fromEntries(CFG.faixas.map(f=>[f.k,f]));
const REC={A:{nome:"FINZA"},B:{nome:"BLIPS · Cobrança"}};
const assN=k=>CFG.assuntos[k]||"Assunto não avaliado";
const TIPO_L={so_ia:"só IA",ia_humano:"IA → humano",so_humano:"só humano"};

function bizMin(a,b){if(b<=a)return 0;let t=a,tot=0;while(t<b){const d=new Date(t),d0=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate());
  if(CFG.exp.dias.includes(d.getUTCDay())){const s=Math.max(t,d0+CFG.exp.ini*3600e3),e=Math.min(b,d0+CFG.exp.fim*3600e3);if(e>s)tot+=e-s}t=d0+DAY}return tot/MIN}
const faixaDe=m=>m==null?"sem":m<=10?"f10":m<=20?"f20":m<=30?"f30":m<=60?"f60":"f60p";
const IA_MIN_MS=3000; // resposta da IA em menos de 3 s não é plausível: o turno ganha rap:true e fica fora da medição da IA (respIA, mediana da IA, mapa de calor)
/* Encerramento do cliente: o último bloco do cliente, sem réplica, só com cortesia curta (ok, obrigado, tchau, emoji…)
   depois de pelo menos um turno respondido. Não é "sem resposta" e fica fora da pior espera e da mediana. */
const CORT_RE=/\b(?:muito obrigad[oa]|obrigad[oa]|obrigadao|obgd?[oa]?|brigad[oa]|agradeco|grat[oa]|valeu|vlw|flw|falou|blz|beleza|ta (?:bom|bem|certo|otimo|ok|joia)|tudo (?:bem|certo|ok|bom|joia)|ok|okay|oks|certo|certinho|perfeito|combinado|entendi|entendido|show|top|joia|bom dia|boa tarde|boa noite|amem|de nada|por nada|tchau|ate (?:mais|logo|breve|amanha))\b/g;
const CORT_OK=new Set("muito mesmo viu entao pela pelo por atencao ajuda retorno e a o moca moco amigo amiga querida querido senhor senhora sr sra dr dra pra para voce vc tambem tb tbm deus abencoe te lhe fica fique com um uma otimo otima bom boa dia tarde noite semana fim final de trabalho descanso abraco abs k rs ai ja ta tudo bem igualmente tmj legal".split(" "));
function ehCortesia(texto){
  const t=String(texto??"").trim();
  if(!t||t.length>40||/[?\[\]\d]/.test(t))return false;
  const semEmoji=t.replace(/[\p{Extended_Pictographic}\p{Emoji_Modifier}‍️]/gu,""),temEmoji=semEmoji.length<t.length;
  const n=semEmoji.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z]+/g," ").replace(/([a-z])\1+/g,"$1").trim();
  if(!n)return temEmoji;
  let nucleo=0;const resto=n.replace(CORT_RE,()=>{nucleo++;return " "}).trim();
  if(!nucleo)return false;
  return !resto||resto.split(/\s+/).every(w=>CORT_OK.has(w));
}
function fechaMet(turnos,assumir,transf){
  const val=turnos.filter(x=>!x.enc),nt=val.length;
  const pior=k=>val.some(x=>x[k]==null)?null:Math.max(0,...val.map(x=>x[k]));
  const med=k=>median(val.filter(x=>x[k]!=null).map(x=>x[k]));
  const resp=(w,k)=>mean(val.filter(x=>x.por===w&&!x.rap&&x[k]!=null).map(x=>x[k]));
  return {turnos,pior:{cor:pior("cor"),com:pior("com")},mediana:{cor:med("cor"),com:med("com")},faixaCor:nt?faixaDe(pior("cor")):null,faixaCom:nt?faixaDe(pior("com")):null,
    primeira:{cor:turnos[0]?.cor??null,com:turnos[0]?.com??null},semResposta:val.some(x=>x.cor==null),encerramento:turnos.some(x=>x.enc),
    respIA:{cor:resp("ia","cor"),com:resp("ia","com")},respHum:{cor:resp("humano","cor"),com:resp("humano","com")},
    assumir:assumir==null?null:{cor:assumir,com:bizMin(transf,transf+assumir*MIN)}};
}
function metricas(p){
  const turnos=[];let bloco=null,btx=[],assumir=null;
  for(const m of p.msgs){
    if(m.autor==="cliente"){if(m.tipo==="sem_horario")continue; // mensagem do cliente vinda da Torre: horário real desconhecido, não abre bloco nem gera espera
      if(bloco==null){bloco=m.ts;btx=[]}btx.push(m.texto)}
    else if(m.autor!=="sistema"){if(bloco!=null){const t={ini:bloco,cor:(m.ts-bloco)/MIN,com:bizMin(bloco,m.ts),por:m.autor};if(m.autor==="ia"&&m.ts-bloco<IA_MIN_MS)t.rap=true;turnos.push(t);bloco=null}
      if(m.autor==="humano"&&p.transf!=null&&assumir==null)assumir=(m.ts-p.transf)/MIN}}
  if(bloco!=null){const enc=turnos.length>0&&btx.every(ehCortesia);turnos.push(enc?{ini:bloco,cor:null,com:null,por:"enc",enc:true}:{ini:bloco,cor:null,com:null,por:null})}
  return fechaMet(turnos,assumir,p.transf);
}
function notaAgil(p,clk){const np=CFG.notasAgil[p.met[clk==="com"?"faixaCom":"faixaCor"]];return p.met.turnos.length-(p.met.encerramento?1:0)>=3&&p.met.mediana[clk]!=null?.7*np+.3*CFG.notasAgil[faixaDe(p.met.mediana[clk])]:np}
function score(p,clk){
  if(!p.met.turnos.length)return{score:null,parcial:true,semTurno:true,ag:null,base:null,teto:null,pen:0}; // disparo sem mensagem do cliente: sem espera, sem score
  const ag=notaAgil(p,clk),P=CFG.pesos;
  if(!p.aval)return{score:Math.round(ag),parcial:true,ag,base:ag,teto:null,pen:0};
  const L=p.aval.lados.humano||p.aval.lados.ia;let base=P.agilidade*ag;
  for(const c of CFG.crit)if(c.k!=="agilidade")base+=P[c.k]*L[c.k].nota;base/=100;
  const fx=p.met[clk==="com"?"faixaCom":"faixaCor"],teto=fx==="sem"?CFG.tetos.sem:fx==="f60p"?CFG.tetos.f60p:null;
  const pen=Math.min(CFG.penalMax,p.aval.flags.reduce((s,f)=>s+(CFG.penal[f]||0),0));
  return{score:Math.max(0,Math.min(100,Math.round(Math.min(base,teto??100)-pen))),parcial:false,ag,base,teto,pen};
}

async function getJSON(u){const r=await fetch(u);if(!r.ok)throw new Error(`${u} respondeu HTTP ${r.status}`);return r.json()}
function turnosDe(flat,inicio){const out=[];
  for(let i=0;i<flat.length;i+=3){const ini=inicio+flat[i],d=flat[i+1];
    out.push(d===-2?{ini,cor:null,com:null,por:"enc",enc:true}:d===-1?{ini,cor:null,com:null,por:null}:flat[i+2]===2?{ini,cor:d/MIN,com:bizMin(ini,ini+d),por:"ia",rap:true}:{ini,cor:d/MIN,com:bizMin(ini,ini+d),por:flat[i+2]===0?"ia":"humano"})}
  return out}
function decMsgs(arr,nomes){const out=[];let ts=arr[0];
  for(let i=1;i<arr.length;i++){const r=arr[i];ts+=r[0];out.push({ts,autor:AUT[r[1]],texto:r[2],atendente:r[3]!=null&&r[3]>=0?nomes[r[3]]:null,tipo:TIPOS_MSG[r[4]??(r[1]===3?6:0)]})}
  return out}
function montarRec(r,parts){
  const M=LOAD.meta.rec[r],d=parts[0].dic,ats=M.ats;
  const clientes=parts[0].cli.map(c=>({id:c[0],rec:r,telefone:c[1],cnpjs:c[2],ambiguo:!!c[3],nome:c[4],lote:c[5],protocolos:[]})),protocolos=[];
  for(const part of parts)for(const a of part.prot){const c=clientes[a[2]],inicio=a[7],transf=a[8]==null?null:inicio+a[8];
    const p={id:a[0],protocol:a[1],rec:r,cliente:c.id,assunto:null,tipo:d.tipo[a[3]],depto:d.depto[a[4]],atendentes:a[5].map(i=>d.nome[i]),atId:a[6]<0?null:ats[a[6]].id,inicio,msgs:null,transf,fonte:d.fonte[a[9]],
      aberto:!!(a[10]&1),broadcast:!!(a[10]&2),receptivo:!!(a[10]&4),outlier:!!(a[10]&8),audio:!!(a[10]&16),semHora:!!(a[10]&32),aval:null};
    p.met=fechaMet(turnosDe(a[12],inicio),a[11]==null?null:a[11]/MIN,transf);p.sc=score(p,S.clk);
    c.protocolos.push(p.id);protocolos.push(p);PMAP.set(p.id,p)}
  for(const c of clientes)CMAP.set(c.id,c);
  DATA[r]={clientes,protocolos,ats,deptos:[...new Set(protocolos.map(p=>p.depto))].sort(),nomes:[...new Set(protocolos.flatMap(p=>p.atendentes))].sort(),iaRot:M.ia_rotulo||"IA"};

function loadRec(r){
  const g=++LOAD.gen[r];LOAD.st[r]="loading";LOAD.err[r]=null;
  clearTimeout(LOAD.timer[r]);LOAD.timer[r]=setTimeout(()=>{if(LOAD.gen[r]===g&&LOAD.st[r]==="loading"){LOAD.st[r]="slow";rerender()}},10000);
  (async()=>{if(!LOAD.meta)LOAD.meta=await getJSON("data/meta.json");return Promise.all(LOAD.meta.rec[r].idx.map(getJSON))})()
    .then(parts=>{if(LOAD.gen[r]!==g)return;montarRec(r,parts);AGG={};LOAD.st[r]="ok"})
    .catch(e=>{if(LOAD.gen[r]!==g)return;LOAD.st[r]="err";LOAD.err[r]=String(e&&e.message||e)})
    .finally(()=>{if(LOAD.gen[r]!==g)return;clearTimeout(LOAD.timer[r]);rerender()});
}
function loadLote(r,n){const k=r+n;let pr=LOAD.lotes.get(k);
  if(!pr){pr=getJSON(`${LOAD.meta.rec[r].lote_prefixo}${String(n).padStart(3,"0")}.json`);LOAD.lotes.set(k,pr);pr.catch(()=>LOAD.lotes.delete(k));
    if(LOAD.lotes.size>6)LOAD.lotes.delete(LOAD.lotes.keys().next().value)}
  return pr}
async function loadMsgs(c){if(c.msgsOk)return;const L=await loadLote(c.rec,c.lote),chats=L.c[c.id]||{};
  for(const id of c.protocolos){const p=PMAP.get(id);if(!p.msgs)p.msgs=decMsgs(chats[id]||[0],L.n)}c.msgsOk=true}
function pedirMsgs(c){if(c.msgsOk||c.msgsLoading)return;c.msgsLoading=true;c.msgsErr=null;

function agg(r){
  const key=r+S.clk;if(AGG[key])return AGG[key];
  const P=DATA[r].protocolos,clk=S.clk,ev=P.filter(p=>p.aval),PT=P.filter(p=>p.met.turnos.length); // PT: só protocolos com mensagem do cliente
  const prim=P.filter(p=>p.tipo!=="so_ia").map(p=>p.met.primeira[clk]).filter(x=>x!=null);
  const fx=Object.fromEntries(CFG.faixas.map(f=>[f.k,0]));PT.forEach(p=>fx[fxk(p)]++);
  const cliAval=new Set(ev.map(p=>p.cliente)),cliFr=new Set(ev.filter(p=>p.aval.frustracao_atendimento.presente).map(p=>p.cliente));
  const tipos={so_ia:0,ia_humano:0,so_humano:0},porAt=new Map();
  for(const p of P){tipos[p.tipo]++;if(p.atId){let a=porAt.get(p.atId);if(!a)porAt.set(p.atId,a=[]);a.push(p)}}
  return AGG[key]={P,PT,ev,n:P.length,nT:PT.length,nCli:DATA[r].clientes.length,fx,primMed:median(prim),primP90:quant(prim,.9),
    iaMed:median(P.map(p=>p.met.respIA[clk]).filter(x=>x!=null)),humMed:median(P.map(p=>p.met.respHum[clk]).filter(x=>x!=null)),assumMed:median(P.map(p=>p.met.assumir?.[clk]).filter(x=>x!=null)),
    redPct:pct(fx.f60p,PT.length),semPct:pct(fx.sem,PT.length),scoreMed:mean(ev.map(p=>p.sc.score)),
    frustPct:cliAval.size?pct(cliFr.size,cliAval.size):null,resolvPct:ev.length?pct(ev.filter(p=>p.aval.resolvido==="sim").length,ev.length):null,tipos,porAt,rank:null,heat:null};
}

function filtrar(){
  const f=S.filt,out=[];
  for(const r of recs()){const D=DATA[r];
    for(const c of D.clientes){
      if(f.q){const q=f.q.toLowerCase(),qd=q.replace(/\D/g,""),hay=(c.telefone+" "+c.cnpjs.join(" ")+" "+(c.nome||"")).toLowerCase();if(!hay.includes(q)&&!(qd.length>=3&&hay.replace(/\D/g,"").includes(qd)))continue}
      if(f.cnpj==="com"&&!c.cnpjs.length)continue;if(f.cnpj==="sem"&&c.cnpjs.length)continue;if(f.cnpj==="amb"&&!c.ambiguo)continue;
      if(f.recorrente&&c.protocolos.length<2)continue;
      const ps=c.protocolos.map(id=>PMAP.get(id)).filter(p=>{
        if(f.depto&&p.depto!==f.depto)return false;if(f.at&&!p.atendentes.includes(f.at))return false;if(f.tipo&&p.tipo!==f.tipo)return false;
        if(f.faixa&&fxk(p)!==f.faixa)return false;if(f.red&&!isRed(p))return false;if(f.assunto&&p.assunto!==f.assunto)return false;
        if(f.frust&&!p.aval?.frustracao_atendimento.presente)return false;if(f.resolvido&&p.aval?.resolvido!==f.resolvido)return false;
        if(f.aval&&!p.aval)return false;if(f.fonte&&p.fonte!==f.fonte)return false;if(f.audio&&!p.audio)return false;return true});
      if(ps.length)out.push({c,ps:ps.sort((a,b)=>b.inicio-a.inicio),r});
    }}
  out.forEach(x=>{x.sc=mean(x.ps.map(p=>p.sc.score).filter(v=>v!=null));x.red=x.ps.some(isRed);x.fr=x.ps.some(p=>p.aval?.frustracao_atendimento.presente)}); // score do cliente ignora protocolos sem score
  return out.sort((a,b)=>(a.sc??1e9)-(b.sc??1e9));
}

function ring(s){const r=36,c=2*Math.PI*r,col=s>=75?"var(--ok)":s>=50?"var(--warn)":"var(--bad)";return `<svg class="ring" viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="${r}" fill="none" stroke="var(--track)" stroke-width="8"/><circle cx="42" cy="42" r="${r}" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${(c*s/100).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 42 42)"/><text x="42" y="50" text-anchor="middle" font-family="Inter,sans-serif" font-size="24" font-weight="800" fill="#0A0A2E">${s}</text></svg>`}
function evalHTML(p){

  if(!a)return `<div class="ev"><div class="bs" ${tip("Score parcial","A avaliação por IA ainda não rodou. O score usa só a agilidade.")}>${ring(sc.score)}<div><b>Score só de agilidade</b><div class="lead" style="margin:2px 0 0">A avaliação por IA ainda não rodou.</div></div></div>${met}</div>`;
  const L=a.lados.humano||a.lados.ia,fr=a.frustracao_atendimento;
  const facts=`<span class="chip c-bl" ${tip("Assunto","Assunto principal identificado pela IA.")}>${esc(assN(a.assunto_principal))}</span><span class="chip ${a.resolvido==="sim"?"c-ok":a.resolvido==="parcial"?"c-wa":"c-bad"}" ${tip("Resolução","Se o problema do cliente foi resolvido na conversa.")}>${a.resolvido==="sim"?"resolvido":a.resolvido==="parcial"?"resolvido em parte":a.resolvido==="nao"?"não resolvido":"indeterminado"}</span>${fr.presente?`<span class="chip c-bad" ${tip("Frustração com o atendimento",`Intensidade ${fr.intensidade} de 3. Motivo: ${fr.motivos.join(", ")}.`)}>frustrado · ${esc(fr.motivos.join(", "))}</span>`:`<span class="chip c-ok" ${tip("Sem frustração","O cliente não mostrou irritação com o atendimento.")}>sem frustração</span>`}`;
  const dec=CFG.crit.map(c=>{const v=c.k==="agilidade"?sc.ag:L[c.k].nota;return `<div class="dc" ${tip(c.lbl,`${c.desc} Nota ${fmt(v)} × peso ${CFG.pesos[c.k]} = ${fmt(CFG.pesos[c.k]*v/100,1)} pontos.`)}><span>${c.lbl}</span><span class="tr"><span class="fl" style="width:${v}%"></span></span><b>${fmt(v)}</b></div>`}).join("");
  const adj=`${sc.teto!=null?`<p class="lead" style="margin:8px 0 0">Limitado a <b>${sc.teto}</b> por ${fxk(p)==="sem"?"falta de resposta":"espera acima de 1 h"}.</p>`:""}${sc.pen?`<p class="lead" style="margin:4px 0 0">Penalidade de <b>−${sc.pen}</b>: ${a.flags.filter(f=>CFG.penal[f]).map(f=>f.replace(/_/g," ")).join(", ")}.</p>`:""}`;
  const just=["resolucao","clareza","conducao","empatia","conformidade","desfecho"].map(k=>`<div class="just"><b>${CFG.crit.find(c=>c.k===k).lbl} · ${L[k].nota}.</b> ${esc(L[k].justificativa)}<q data-ev="${esc(L[k].evidencia)}" ${tip("Evidência","Trecho da conversa usado pela IA. Clique para achar a mensagem.")}>${esc(L[k].evidencia)}</q></div>`).join("");
  const tv=v=>v>0?"+"+v:String(v);
  return `<div class="ev"><div class="bs">${ring(sc.score)}<div><b>Score do atendimento</b><div class="lead" style="margin:2px 0 0" ${tip("Temperatura do cliente","De −2 (irritado) a +2 (satisfeito), no começo e no fim da conversa.")}>Temperatura ${tv(a.temperatura.inicio)} → ${tv(a.temperatura.fim)}</div></div></div>
    <div class="facts">${facts}</div><p style="margin:0;font-size:14px">${esc(a.resumo)}</p>${met}
    <details class="dx"><summary>Como chegou em ${sc.score}</summary>${dec}${adj}</details>
    <details class="dx"><summary>Justificativas da IA</summary>${just}</details></div>`;
}

const PROMPT_V1=`Você é auditor de qualidade de atendimento ao cliente de uma financeira de equipamentos, com foco em cobrança. Avalie o ATENDIMENTO, nunca o cliente.

CRITÉRIOS (nota 0–100, por lado presente: humano e IA)
• resolução — resolveu, ou o cliente sai sabendo o próximo passo e quando
• clareza — informação correta e completa (valores, datas, links, procedimento)
• condução — oferece a saída sem o cliente pedir (2ª via, acordo, prazo, canal)
• empatia — cordial, personalizado, reconhece o problema
• conformidade — sem promessa indevida, sem expor dados, sem ameaça
• desfecho — cliente termina mais calmo do que começou
Âncoras: 90–100 exemplar · 70–89 bom · 50–69 aceitável · 30–49 ruim · 0–29 inaceitável.
Não avalie velocidade: o tempo já é medido nas métricas.

TEMPERATURA E FRUSTRAÇÃO
• temperatura no início e no fim: −2 irritado … +2 satisfeito
• frustração com o atendimento: só o que o atendimento causou (demora, repetição, não resolução, transferências, informação errada, tom)
• frustração com a dívida ou o produto: registra, não penaliza

ASSUNTOS
2ª via · acordo/renegociação · juros e multa · contestação · taxa e condições · contrato e assinatura · documentos · confirmação de pagamento · cancelamento/distrato · equipamento · cadastro · outros

SAÍDA
JSON estrito. Evidência = trecho literal de até 200 caracteres. Sem evidência, nota máxima 60.
Sem dado pessoal no resumo: telefone, CPF/CNPJ, e-mail e links viram [dado].`;

/* banco do artefato: só configuração (config/geral, pesos/<v>, prompts/<v>). Sem acesso ou vazio, valem os padrões embutidos. */
function aplicarCfg(g,pe,pr){
  const obj=o=>o&&typeof o==="object"&&!Array.isArray(o),num=v=>typeof v==="number"&&isFinite(v);
  if(obj(g)){
    if(obj(g.notas_agilidade)&&CFG.faixas.every(f=>num(g.notas_agilidade[f.k])))CFG.notasAgil=g.notas_agilidade;
    if(obj(g.tetos)&&num(g.tetos.sem)&&num(g.tetos.f60p))CFG.tetos=g.tetos;
    if(obj(g.penalidades)&&Object.values(g.penalidades).every(num))CFG.penal=g.penalidades;
    if(num(g.penal_max))CFG.penalMax=g.penal_max;
    if(obj(g.assuntos))CFG.assuntos=g.assuntos;
    const e=g.expediente;
    if(obj(e)&&Array.isArray(e.dias)&&num(e.ini)&&num(e.fim)&&JSON.stringify([e.dias,e.ini,e.fim])!==JSON.stringify([CFG.exp.dias,CFG.exp.ini,CFG.exp.fim])){
      CFG.exp={dias:[...e.dias],ini:e.ini,fim:e.fim}; // expediente mudou: refaz o relógio comercial de todos os turnos já carregados
      for(const r of["A","B"])if(DATA[r])for(const p of DATA[r].protocolos){for(const t of p.met.turnos)if(t.cor!=null)t.com=bizMin(t.ini,t.ini+Math.round(t.cor*MIN));p.met=fechaMet(p.met.turnos,p.met.assumir?p.met.assumir.cor:null,p.transf)}}
  }
  if(obj(pe)&&obj(pe.pesos)&&CFG.crit.every(c=>num(pe.pesos[c.k]))&&CFG.crit.reduce((s,c)=>s+pe.pesos[c.k],0)===100)CFG.pesos=pe.pesos;
  if(obj(pr)&&typeof pr.texto==="string"&&pr.texto.trim())PROMPT_TXT=pr.texto;
  rescore();rerender();
}
CAP("db").then(async db=>{if(!db)return;
  try{const g=(await db.doc("config/geral").get()).data();if(!g)return;
    const ver=v=>typeof v==="string"&&/^[\w.-]+$/.test(v)?v:"v1",vp=ver(g.pesos_ativos),vr=ver(g.prompt_ativo);
    const[pe,pr]=await Promise.all([db.doc("pesos/"+vp).get(),db.doc("prompts/"+vr).get()]);
    if(pr.exists)PROMPT_VER=vr;aplicarCfg(g,pe.data(),pr.data())}
  catch(e){/* quem não é dono/editor não lê o banco: seguem os padrões */}});
route();
</script>
